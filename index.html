<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stockfish Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   CORE
========================================================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:#eef2ff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 12% 8%,
            rgba(112,76,255,.27),
            transparent 30%
        ),
        radial-gradient(
            circle at 88% 12%,
            rgba(42,144,255,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 55% 100%,
            rgba(132,49,255,.14),
            transparent 35%
        ),
        #05070d;
}

/* animated atmosphere */

body::before,
body::after{
    content:"";
    position:fixed;
    inset:-25%;
    pointer-events:none;
    z-index:-1;
}

body::before{
    background:
        radial-gradient(
            circle at 30% 35%,
            rgba(107,72,255,.12),
            transparent 23%
        ),
        radial-gradient(
            circle at 72% 68%,
            rgba(42,133,255,.08),
            transparent 25%
        );

    animation:
        atmosphere 18s ease-in-out infinite alternate;
}

body::after{
    background:
        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.018) 50%,
            transparent 65%
        );

    transform:translateX(-100%);
    animation:
        lightSweep 12s linear infinite;
}

@keyframes atmosphere{
    from{
        transform:
            translate(-2%,-1%)
            scale(1);
    }

    to{
        transform:
            translate(4%,3%)
            scale(1.09);
    }
}

@keyframes lightSweep{
    to{
        transform:translateX(100%);
    }
}


/* =========================================================
   APP
========================================================= */

.app{
    width:min(1500px,calc(100% - 32px));
    margin:auto;
    padding:16px 0 30px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 13px 0 16px;

    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            rgba(19,23,37,.93),
            rgba(7,10,18,.87)
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.07);

    backdrop-filter:blur(22px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;

    display:grid;
    place-items:center;

    border-radius:14px;

    font-family:Georgia,serif;
    font-size:28px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #876aff,
            #48baff
        );

    box-shadow:
        0 0 30px rgba(105,80,255,.4),
        inset 0 1px rgba(255,255,255,.45);
}

.brand-title{
    font-size:16px;
    font-weight:900;
}

.brand-subtitle{
    margin-top:2px;
    color:#707b90;
    font-size:10px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-button{
    height:38px;

    padding:0 12px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.035);

    color:#aeb7c9;

    font-weight:800;
    font-size:10px;

    cursor:pointer;

    transition:.15s ease;
}

.header-button:hover{
    color:white;
    background:rgba(255,255,255,.08);
    transform:translateY(-1px);
}

.engine-pill{
    height:38px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:0 12px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.035);

    color:#aeb7c9;

    font-size:9px;
    font-weight:850;
}

.engine-dot{
    width:7px;
    height:7px;
    border-radius:50%;

    background:#4ff0a3;

    box-shadow:
        0 0 12px rgba(79,240,163,.9);
}

.engine-pill.thinking .engine-dot{
    animation:
        enginePulse .5s infinite alternate;
}

@keyframes enginePulse{
    to{
        transform:scale(1.7);
        opacity:.4;
    }
}

.primary-button{
    height:38px;

    padding:0 15px;

    border:0;
    border-radius:11px;

    color:white;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #735cf5,
            #4d9aff
        );

    box-shadow:
        0 8px 25px rgba(87,79,255,.25);

    transition:.15s ease;
}

.primary-button:hover{
    transform:translateY(-1px);
    box-shadow:
        0 12px 35px rgba(87,79,255,.36);
}


/* =========================================================
   MAIN
========================================================= */

.main{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        350px;

    gap:22px;

    margin-top:20px;

    align-items:start;
}


/* =========================================================
   BOARD AREA
========================================================= */

.board-area{
    min-width:0;

    display:flex;
    justify-content:center;
}

.board-container{
    width:min(78vh,72vw,820px);
    aspect-ratio:1;

    position:relative;

    padding:11px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 35px 110px rgba(0,0,0,.62),
        0 0 100px rgba(96,73,255,.11),
        inset 0 1px rgba(255,255,255,.17);
}

.board-container::before{
    content:"";

    position:absolute;
    inset:2px;

    border-radius:25px;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            transparent 25%,
            transparent 75%,
            rgba(87,133,255,.05)
        );
}

.board{
    position:relative;

    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    overflow:hidden;

    border-radius:18px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.48);
}


/* =========================================================
   SQUARES
========================================================= */

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    cursor:pointer;
    user-select:none;

    transition:
        filter .12s ease,
        box-shadow .12s ease;
}

.square.light{
    background:
        linear-gradient(
            135deg,
            #e8edf5,
            #d3dbe7
        );
}

.square.dark{
    background:
        linear-gradient(
            135deg,
            #61738d,
            #4f6179
        );
}

.square::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.17),
            transparent 42%
        );

    opacity:.55;
}

.square:hover{
    filter:brightness(1.07);
}


/* =========================================================
   LAST MOVE
========================================================= */

.square.last{
    box-shadow:
        inset 0 0 0 999px rgba(126,96,255,.19);
}


/* =========================================================
   SELECTED
========================================================= */

.square.selected{
    box-shadow:
        inset 0 0 0 999px rgba(115,83,255,.31),
        inset 0 0 30px rgba(124,91,255,.55);
}


/* =========================================================
   CHECK
========================================================= */

.square.check{
    box-shadow:
        inset 0 0 0 999px rgba(255,38,62,.3),
        inset 0 0 40px rgba(255,35,62,.75);
    animation:
        checkFlash .55s ease-in-out infinite alternate;
}

@keyframes checkFlash{
    from{filter:brightness(1)}
    to{filter:brightness(1.2)}
}


/* =========================================================
   PIECES
========================================================= */

.piece{
    position:relative;
    z-index:5;

    pointer-events:none;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    font-size:72%;

    line-height:1;

    transition:
        transform .12s ease,
        filter .12s ease;
}

.square:hover .piece{
    transform:
        translateY(-2px)
        scale(1.025);
}

.white-piece{
    color:#fff;

    text-shadow:
        0 1px 0 #c8d0dd,
        0 3px 4px rgba(0,0,0,.42),
        0 8px 14px rgba(0,0,0,.28);
}

.black-piece{
    color:#1c222c;

    text-shadow:
        0 1px 0 #788291,
        0 3px 5px rgba(0,0,0,.48),
        0 8px 14px rgba(0,0,0,.32);
}


/* =========================================================
   COORDINATES
========================================================= */

.coordinate{
    position:absolute;
    z-index:8;

    pointer-events:none;

    font-size:8px;
    font-weight:900;

    opacity:.55;
}

.rank{
    top:4px;
    left:5px;
}

.file{
    right:5px;
    bottom:4px;
}

.square.light .coordinate{
    color:#526179;
}

.square.dark .coordinate{
    color:#e6edf7;
}


/* =========================================================
   LEGAL MOVES
========================================================= */

.move-dot{
    position:absolute;
    z-index:3;

    width:18%;
    aspect-ratio:1;

    border-radius:50%;

    background:
        rgba(91,62,215,.58);

    box-shadow:
        0 0 13px rgba(100,73,255,.35);

    animation:
        dotIn .14s ease-out;
}

@keyframes dotIn{
    from{
        transform:scale(.2);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.capture-ring{
    position:absolute;
    z-index:3;

    width:79%;
    height:79%;

    border-radius:50%;

    border:
        5px solid
        rgba(100,68,220,.42);

    box-shadow:
        0 0 14px rgba(102,70,255,.2);
}


/* =========================================================
   MOVE ANIMATION
========================================================= */

.animation-piece{
    position:fixed;

    z-index:100;

    pointer-events:none;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    line-height:1;

    font-size:58px;

    transition:
        transform .24s cubic-bezier(.2,.8,.25,1);
}

.animation-piece.white-piece{
    text-shadow:
        0 2px 0 #c8d0dd,
        0 5px 8px rgba(0,0,0,.45),
        0 12px 20px rgba(0,0,0,.3);
}

.animation-piece.black-piece{
    text-shadow:
        0 2px 0 #727c8b,
        0 5px 8px rgba(0,0,0,.5),
        0 12px 20px rgba(0,0,0,.35);
}


/* =========================================================
   CAPTURE BURST
========================================================= */

.burst{
    position:fixed;
    z-index:90;

    width:10px;
    height:10px;

    pointer-events:none;

    border-radius:50%;

    background:#9b7cff;

    box-shadow:
        0 0 20px #8364ff;

    animation:
        burst .4s ease-out forwards;
}

@keyframes burst{
    from{
        opacity:1;
        transform:scale(.5);
    }

    to{
        opacity:0;
        transform:scale(8);
    }
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.card{
    border:1px solid rgba(255,255,255,.085);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(17,21,33,.94),
            rgba(8,11,19,.9)
        );

    box-shadow:
        0 18px 55px rgba(0,0,0,.27),
        inset 0 1px rgba(255,255,255,.045);

    backdrop-filter:blur(18px);
}


/* =========================================================
   STATUS
========================================================= */

.status-card{
    padding:16px;
}

.label{
    color:#737e91;

    font-size:8px;
    font-weight:900;

    letter-spacing:1.6px;
    text-transform:uppercase;
}

.status{
    margin-top:6px;

    font-size:20px;
    font-weight:900;

    letter-spacing:-.5px;
}

.status.thinking{
    color:#a08aff;
}

.status.checking{
    color:#ff6677;
}

.eval-bar{
    height:8px;

    margin-top:15px;

    overflow:hidden;

    border-radius:99px;

    background:#070a11;

    border:1px solid rgba(255,255,255,.06);
}

.eval-fill{
    height:100%;
    width:50%;

    background:
        linear-gradient(
            90deg,
            #cfd6e1,
            #fff
        );

    transition:
        width .35s ease;
}

.eval-number{
    margin-top:5px;

    text-align:right;

    color:#707a8d;

    font-size:9px;

    font-variant-numeric:tabular-nums;
}


/* =========================================================
   CLOCKS
========================================================= */

.clock-card{
    padding:10px;
}

.clocks{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;
}

.clock{
    padding:13px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.055);

    background:
        rgba(255,255,255,.035);

    transition:.18s ease;
}

.clock.active{
    border-color:rgba(124,101,255,.6);

    background:
        linear-gradient(
            145deg,
            rgba(105,82,240,.15),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 0 25px rgba(103,80,255,.09);
}

.clock.low .clock-time{
    color:#ff6375;
}

.clock-name{
    color:#737e91;

    font-size:8px;
    font-weight:900;

    text-transform:uppercase;
    letter-spacing:1.2px;
}

.clock-time{
    margin-top:4px;

    font-size:25px;
    font-weight:950;

    letter-spacing:-.8px;

    font-variant-numeric:tabular-nums;
}


/* =========================================================
   MODE
========================================================= */

.mode-card{
    padding:13px;
}

.mode-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:9px;
}

.mode-heading strong{
    font-size:11px;
}

.mode-heading span{
    color:#707a8d;
    font-size:8px;
}

.modes{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;
}

.mode{
    min-height:45px;

    padding:7px;

    text-align:left;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.055);

    background:
        rgba(255,255,255,.025);

    color:#cbd2df;

    cursor:pointer;

    transition:.13s ease;
}

.mode:hover{
    background:rgba(255,255,255,.065);
    transform:translateY(-1px);
}

.mode.active{
    border-color:rgba(126,103,255,.72);

    background:
        linear-gradient(
            135deg,
            rgba(111,87,255,.19),
            rgba(66,132,255,.08)
        );

    box-shadow:
        0 0 20px rgba(105,82,255,.09);
}

.mode-name{
    display:block;

    color:#e8ebf3;

    font-size:8px;
    font-weight:900;
}

.mode-time{
    display:block;

    margin-top:3px;

    color:#737d90;

    font-size:7px;
}


/* =========================================================
   MOVE HISTORY
========================================================= */

.moves-card{
    overflow:hidden;
}

.moves{
    height:205px;

    padding:7px;

    overflow-y:auto;
}

.moves::-webkit-scrollbar{
    width:4px;
}

.moves::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:20px;
}

.empty-moves{
    height:100%;

    display:grid;
    place-items:center;

    color:#606b7e;

    font-size:9px;
}

.move-row{
    display:grid;

    grid-template-columns:
        28px 1fr 1fr;

    gap:4px;

    padding:7px;

    border-radius:8px;

    font-size:10px;

    animation:
        moveAppear .16s ease-out;
}

.move-row.latest{
    background:
        rgba(113,91,255,.12);

    box-shadow:
        inset 2px 0 rgba(128,106,255,.8);
}

.move-num{
    color:#687286;
}

.move-san{
    color:#e1e5ed;
    font-weight:800;
}

@keyframes moveAppear{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:none;
    }
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
    padding:12px;
}

select{
    width:100%;
    height:40px;

    padding:0 10px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.07);

    background:#111621;

    color:#dce1eb;

    outline:none;
}

.control-row{
    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:6px;

    margin-top:7px;
}

.control{
    height:38px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.035);

    color:#d3d9e5;

    font-size:9px;
    font-weight:850;

    cursor:pointer;

    transition:.14s ease;
}

.control:hover{
    background:rgba(255,255,255,.08);
    transform:translateY(-1px);
}

.control.active{
    border-color:rgba(123,100,255,.55);
    color:#b6a9ff;
}

.control.primary{
    border:0;

    color:white;

    background:
        linear-gradient(
            135deg,
            #725bf4,
            #4c91ff
        );
}

.details{
    display:flex;
    justify-content:space-between;

    margin-top:8px;

    color:#5e687a;

    font-size:8px;
}


/* =========================================================
   PROMOTION / RESULT MODALS
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(2,4,9,.76);

    backdrop-filter:blur(12px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(390px,90vw);

    padding:25px;

    text-align:center;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.11);

    background:
        linear-gradient(
            145deg,
            #161b2b,
            #090d16
        );

    box-shadow:
        0 40px 120px rgba(0,0,0,.7);

    animation:
        modalIn .18s ease-out;
}

.modal-title{
    margin-bottom:16px;

    font-size:17px;
    font-weight:900;
}

.promotion{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.promotion button{
    height:75px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.04);

    color:white;

    font-family:Georgia,serif;

    font-size:43px;

    cursor:pointer;

    transition:.14s ease;
}

.promotion button:hover{
    transform:
        translateY(-3px)
        scale(1.03);

    background:
        rgba(113,90,255,.18);
}

.result-title{
    font-size:29px;
    font-weight:950;
}

.result-description{
    margin:
        7px 0
        18px;

    color:#7d879a;

    font-size:10px;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(8px);
    }

    to{
        opacity:1;
        transform:none;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .main{
        grid-template-columns:1fr;
    }

    .board-container{
        width:min(90vw,760px);
    }

    .sidebar{
        width:min(90vw,760px);
        margin:auto;
    }
}

@media(max-width:650px){

    .app{
        width:97vw;
        padding-top:7px;
    }

    .header{
        height:60px;
        border-radius:16px;
    }

    .brand-subtitle,
    .header-button{
        display:none;
    }

    .engine-pill{
        height:34px;
    }

    .primary-button{
        height:34px;
        padding:0 10px;
    }

    .board-container{
        width:96vw;
        padding:7px;
        border-radius:20px;
    }

    .board{
        border-radius:14px;
    }

    .piece{
        font-size:68%;
    }

    .modes{
        grid-template-columns:
            repeat(3,1fr);
    }
}

</style>
</head>


<body>

<div class="app">

<header class="header">

    <div class="brand">

        <div class="logo">♞</div>

        <div>
            <div class="brand-title">
                Stockfish Chess
            </div>

            <div class="brand-subtitle">
                Next-generation browser chess
            </div>
        </div>

    </div>


    <div class="header-right">

        <button
            class="header-button"
            id="flipButton"
            title="Flip board"
        >
            ↻ Board
        </button>

        <button
            class="header-button"
            id="soundButton"
        >
            🔊 Sound
        </button>

        <div
            class="engine-pill"
            id="enginePill"
        >
            <span class="engine-dot"></span>
            <span id="engineText">
                Loading engine
            </span>
        </div>

        <button
            class="primary-button"
            id="newGameTop"
        >
            + New Game
        </button>

    </div>

</header>


<main class="main">


<section class="board-area">

    <div class="board-container">

        <div
            class="board"
            id="board"
        ></div>

    </div>

</section>


<aside class="sidebar">


<!-- STATUS -->

<section class="card status-card">

    <div class="label">
        Game Status
    </div>

    <div

<script>

/* =========================================================
   GAME
========================================================= */

const game = new Chess();


const PIECES = {

    wp:"♙",
    wn:"♘",
    wb:"♗",
    wr:"♖",
    wq:"♕",
    wk:"♔",

    bp:"♟",
    bn:"♞",
    bb:"♝",
    br:"♜",
    bq:"♛",
    bk:"♚"

};


const board =
    document.getElementById("board");

const status =
    document.getElementById("status");

const moves =
    document.getElementById("moves");

const enginePill =
    document.getElementById("enginePill");

const engineText =
    document.getElementById("engineText");

const evalFill =
    document.getElementById("evalFill");

const evalNumber =
    document.getElementById("evalNumber");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const whiteClockBox =
    document.getElementById("whiteClockBox");

const blackClockBox =
    document.getElementById("blackClockBox");

const promotionOverlay =
    document.getElementById("promotionOverlay");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultDescription =
    document.getElementById("resultDescription");

const difficulty =
    document.getElementById("difficulty");

const depthText =
    document.getElementById("depth");

const turnText =
    document.getElementById("turn");


/* =========================================================
   STATE
========================================================= */

let engine = null;

let engineReady = false;

let thinking = false;

let gameFinished = false;

let selected = null;

let lastMove = null;

let pendingPromotion = null;

let boardFlipped = false;

let soundEnabled = true;

let gameVersion = 0;

let engineVersion = 0;


/* =========================================================
   CLOCK STATE
========================================================= */

let baseSeconds = 600;

let increment = 0;

let clock = {

    w:600,

    b:600

};

let lastClockTime =
    performance.now();


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


function playSound(
    type
){

    if(!soundEnabled){

        return;
    }


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );


        const now =
            audioContext.currentTime;


        if(type==="move"){

            oscillator.frequency.value =
                430;

        }
        else if(type==="capture"){

            oscillator.frequency.value =
                250;

        }
        else if(type==="check"){

            oscillator.frequency.value =
                720;

        }
        else{

            oscillator.frequency.value =
                350;

        }


        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .045,
            now+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+.12
        );


        oscillator.start(now);

        oscillator.stop(
            now+.13
        );

    }
    catch(e){}

}


/* =========================================================
   BOARD
========================================================= */

function squareName(
    row,
    col
){

    return (
        String.fromCharCode(
            97 + col
        )
        +
        (8-row)
    );

}


function drawBoard(){

    board.innerHTML = "";


    const position =
        game.board();


    for(
        let row=0;
        row<8;
        row++
    ){

        for(
            let col=0;
            col<8;
            col++
        ){

            let actualRow =
                boardFlipped
                ? 7-row
                : row;


            let actualCol =
                boardFlipped
                ? 7-col
                : col;


            const name =
                squareName(
                    actualRow,
                    actualCol
                );


            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square "
                +
                (
                    (actualRow+actualCol)%2===0
                    ? "light"
                    : "dark"
                );


            square.dataset.square =
                name;


            if(
                lastMove &&
                (
                    lastMove.from===name ||
                    lastMove.to===name
                )
            ){

                square.classList.add(
                    "last"
                );

            }


            if(
                selected===name
            ){

                square.classList.add(
                    "selected"
                );

            }


            const piece =
                position[actualRow][actualCol];


            if(piece){

                const pieceElement =
                    document.createElement(
                        "div"
                    );


                pieceElement.className =
                    "piece "
                    +
                    (
                        piece.color==="w"
                        ? "white-piece"
                        : "black-piece"
                    );


                pieceElement.textContent =
                    PIECES[
                        piece.color +
                        piece.type
                    ];


                square.appendChild(
                    pieceElement
                );

            }


            if(actualCol===0){

                const rank =
                    document.createElement(
                        "span"
                    );

                rank.className =
                    "coordinate rank";

                rank.textContent =
                    8-actualRow;

                square.appendChild(
                    rank
                );

            }


            if(actualRow===7){

                const file =
                    document.createElement(
                        "span"
                    );

                file.className =
                    "coordinate file";

                file.textContent =
                    String.fromCharCode(
                        97+actualCol
                    );

                square.appendChild(
                    file
                );

            }


            square.onclick =
                () => handleSquareClick(
                    name
                );


            board.appendChild(
                square
            );

        }

    }


    if(selected){

        showLegalMoves(
            selected
        );

    }


    highlightKingCheck();

}


/* =========================================================
   LEGAL MOVES
========================================================= */

function showLegalMoves(
    from
){

    const legal =
        game.moves({
            square:from,
            verbose:true
        });


    legal.forEach(
        move => {

            const target =
                board.querySelector(
                    `[data-square="${move.to}"]`
                );


            if(!target){

                return;
            }


            if(move.captured){

                const ring =
                    document.createElement(
                        "div"
                    );

                ring.className =
                    "capture-ring";

                target.appendChild(
                    ring
                );

            }
            else{

                const dot =
                    document.createElement(
                        "div"
                    );

                dot.className =
                    "move-dot";

                target.appendChild(
                    dot
                );

            }

        }
    );

}


/* =========================================================
   CHECK
========================================================= */

function highlightKingCheck(){

    status.classList.remove(
        "checking"
    );


    if(!game.in_check()){

        return;
    }


    status.classList.add(
        "checking"
    );


    const side =
        game.turn();


    const position =
        game.board();


    for(
        let row=0;
        row<8;
        row++
    ){

        for(
            let col=0;
            col<8;
            col++
        ){

            const piece =
                position[row][col];


            if(
                piece &&
                piece.type==="k" &&
                piece.color===side
            ){

                const name =
                    squareName(
                        row,
                        col
                    );


                const square =
                    board.querySelector(
                        `[data-square="${name}"]`
                    );


                if(square){

                    square.classList.add(
                        "check"
                    );

                }

            }

        }

    }

}


/* =========================================================
   CLICK HANDLING
========================================================= */

function handleSquareClick(
    name
){

    if(
        gameFinished ||
        thinking ||
        !engineReady ||
        game.turn()!=="w"
    ){

        return;
    }


    const piece =
        game.get(name);


    if(!selected){

        if(
            piece &&
            piece.color==="w"
        ){

            selected =
                name;

            drawBoard();

        }

        return;
    }


    if(
        piece &&
        piece.color==="w"
    ){

        selected =
            name;

        drawBoard();

        return;
    }


    const legal =
        game.moves({
            square:selected,
            verbose:true
        });


    const move =
        legal.find(
            item =>
                item.to===name
        );


    if(!move){

        selected = null;

        drawBoard();

        return;
    }


    if(move.promotion){

        pendingPromotion = {

            from:selected,

            to:name

        };


        promotionOverlay.classList.add(
            "show"
        );

        return;
    }


    makePlayerMove({

        from:selected,

        to:name

    });

}


/* =========================================================
   PLAYER MOVE
========================================================= */

function makePlayerMove(
    move
){

    const from =
        move.from;

    const to =
        move.to;


    const movingPiece =
        game.get(from);


    const targetPiece =
        game.get(to);


    const result =
        game.move(move);


    if(!result){

        return;
    }


    clock.w += increment;


    lastMove = {

        from:result.from,

        to:result.to

    };


    selected = null;

    gameVersion++;


    if(targetPiece){

        playSound("capture");

    }
    else{

        playSound("move");

    }


    drawBoard();

    drawMoves();

    updateInterface();


    if(
        game.in_check()
    ){

        playSound("check");

    }


    if(
        checkGameOver()
    ){

        return;
    }


    askEngine();

}


/* =========================================================
   ENGINE
========================================================= */

function startEngine(){

    try{

        engine =
            new Worker(
                "./stockfish-18-lite-single.js"
            );


        engine.onmessage =
            handleEngineMessage;


        engine.onerror =
            function(){

                engineReady = false;

                engineText.textContent =
                    "Engine error";

                status.textContent =
                    "Engine unavailable";

            };


        engine.postMessage(
            "uci"
        );

    }
    catch(error){

        engineText.textContent =
            "Engine unavailable";

    }

}


function handleEngineMessage(
    event
){

    const line =
        String(event.data);


    if(line==="uciok"){

        engine.postMessage(
            "isready"
        );

        return;
    }


    if(line==="readyok"){

        engineReady = true;

        engineText.textContent =
            "Stockfish 18 · Ready";

        updateInterface();

        return;
    }


    if(line.startsWith("info")){

        parseEvaluation(
            line
        );


        const depthMatch =
            line.match(
                /\bdepth\s+(\d+)/
            );


        if(depthMatch){

            depthText.textContent =
                "Depth " +
                depthMatch[1];

        }


        return;
    }


    if(
        line.startsWith("bestmove")
    ){

        if(!thinking){

            return;
        }


        thinking = false;

        enginePill.classList.remove(
            "thinking"
        );

        engineText.textContent =
            "Stockfish 18 · Ready";


        if(
            engineVersion!==gameVersion ||
            gameFinished ||
            game.turn()!=="b"
        ){

            updateInterface();

            return;
        }


        const match =
            line.match(
                /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/
            );


        if(!match){

            updateInterface();

            return;
        }


        const notation =
            match[1];


        const move = {

            from:
                notation.substring(0,2),

            to:
                notation.substring(2,4)

        };


        if(notation.length===5){

            move.promotion =
                notation.substring(4);

        }


        makeEngineMove(
            move
        );

    }

}


/* =========================================================
   ENGINE MOVE
========================================================= */

function makeEngineMove(
    move
){

    const target =
        game.get(
            move.to
        );


    const result =
        game.move(move);


    if(!result){

        updateInterface();

        return;
    }


    clock.b += increment;


    lastMove = {

        from:result.from,

        to:result.to

    };


    gameVersion++;


    if(target){

        playSound("capture");

    }
    else{

        playSound("move");

    }


    drawBoard();

    drawMoves();

    updateInterface();


    if(
        game.in_check()
    ){

        playSound("check");

    }


    checkGameOver();

}


/* =========================================================
   ASK STOCKFISH
========================================================= */

function askEngine(){

    if(
        !engineReady ||
        gameFinished ||
        game.turn()!=="b"
    ){

        return;
    }


    thinking = true;

    engineVersion =
        gameVersion;


    enginePill.classList.add(
        "thinking"
    );


    engineText.textContent =
        "Stockfish thinking…";


    updateInterface();


    const selectedDepth =
        parseInt(
            difficulty.value,
            10
        );


    try{

        engine.postMessage(
            "stop"
        );

        engine.postMessage(
            "position fen " +
            game.fen()
        );

        engine.postMessage(
            "go depth " +
            selectedDepth
        );

    }
    catch(error){

        thinking = false;

        updateInterface();

    }

}


/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(
    line
){

    const mateMatch =
        line.match(
            /score mate (-?\d+)/
        );


    if(mateMatch){

        const engineMate =
            parseInt(
                mateMatch[1],
                10
            );


        /*
           Stockfish is currently evaluating
           from Black's perspective.

           Convert to White's perspective.
        */

        const whiteMate =
            -engineMate;


        if(whiteMate>0){

            evalNumber.textContent =
                "M" +
                whiteMate;

            evalFill.style.width =
                "97%";

        }
        else{

            evalNumber.textContent =
                "-M" +
                Math.abs(
                    whiteMate
                );

            evalFill.style.width =
                "3%";

        }


        return;
    }


    const cpMatch =
        line.match(
            /score cp (-?\d+)/
        );


    if(!cpMatch){

        return;
    }


    const blackScore =
        parseInt(
            cpMatch[1],
            10
        );


    const whiteScore =
        -blackScore / 100;


    const limited =
        Math.max(
            -10,
            Math.min(
                10,
                whiteScore
            )
        );


    evalNumber.textContent =
        (
            limited>=0
            ? "+"
            : ""
        )
        +
        limited.toFixed(2);


    /*
       Smooth nonlinear evaluation bar.
    */

    const normalized =
        Math.tanh(
            limited / 3
        );


    const percentage =
        50 +
        normalized * 47;


    evalFill.style.width =
        Math.max(
            3,
            Math.min(
                97,
                percentage
            )
        )
        +
        "%";

}


/* =========================================================
   MOVE HISTORY
========================================================= */

function drawMoves(){

    moves.innerHTML = "";


    const history =
        game.history();


    if(!history.length){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-moves";


        empty.textContent =
            "Your first move starts the game";


        moves.appendChild(
            empty
        );


        return;
    }


    for(
        let i=0;
        i<history.length;
        i+=2
    ){

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "move-row";


        if(
            i>=history.length-2
        ){

            row.classList.add(
                "latest"
            );

        }


        row.innerHTML = `

            <div class="move-num">
                ${Math.floor(i/2)+1}
            </div>

            <div class="move-san">
                ${history[i] || ""}
            </div>

            <div class="move-san">
                ${history[i+1] || ""}
            </div>

        `;


        moves.appendChild(
            row
        );

    }


    moves.scrollTop =
        moves.scrollHeight;

}


/* =========================================================
   INTERFACE
========================================================= */

function updateInterface(){

    turnText.textContent =
        game.turn()==="w"
        ? "White"
        : "Black";


    whiteClockBox.classList.toggle(
        "active",
        game.turn()==="w" &&
        !gameFinished
    );


    blackClockBox.classList.toggle(
        "active",
        game.turn()==="b" &&
        !gameFinished
    );


    status.classList.remove(
        "thinking"
    );


    if(gameFinished){

        return;
    }


    if(thinking){

        status.textContent =
            "Stockfish is thinking…";

        status.classList.add(
            "thinking"
        );

    }
    else if(game.in_check()){

        status.textContent =
            "Check!";

    }
    else if(game.turn()==="w"){

        status.textContent =
            "Your move";

    }
    else{

        status.textContent =
            "Stockfish's move";

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver(){

    if(game.is_checkmate()){

        gameFinished = true;


        if(game.turn()==="w"){

            showResult(
                "Checkmate",
                "Stockfish wins the game."
            );

        }
        else{

            showResult(
                "Checkmate",
                "You defeated Stockfish!"
            );

        }


        return true;
    }


    if(game.is_stalemate()){

        gameFinished = true;

        showResult(
            "Stalemate",
            "The game ends in a draw."
        );

        return true;
    }


    if(game.is_threefold_repetition()){

        gameFinished = true;

        showResult(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }


    if(game.is_insufficient_material()){

        gameFinished = true;

        showResult(
            "Draw",
            "There is insufficient material."
        );

        return true;
    }


    if(game.is_draw()){

        gameFinished = true;

        showResult(
            "Draw",
            "The game ends in a draw."
        );

        return true;
    }


    return false;

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    title,
    description
){

    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

        }
        catch(e){}

    }


    thinking = false;

    enginePill.classList.remove(
        "thinking"
    );


    engineText.textContent =
        "Game finished";


    resultTitle.textContent =
        title;

    resultDescription.textContent =
        description;


    resultOverlay.classList.add(
        "show"
    );


    updateInterface();

}


/* =========================================================
   CLOCK
========================================================= */

function formatTime(
    seconds
){

    const total =
        Math.max(
            0,
            Math.ceil(
                seconds
            )
        );


    const minutes =
        Math.floor(
            total/60
        );


    const secondsPart =
        total%60;


    return (
        String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(secondsPart)
        .padStart(2,"0")
    );

}


function updateClockDisplay(){

    whiteClock.textContent =
        formatTime(
            clock.w
        );


    blackClock.textContent =
        formatTime(
            clock.b
        );


    whiteClockBox.classList.toggle(
        "low",
        clock.w<=10
    );


    blackClockBox.classList.toggle(
        "low",
        clock.b<=10
    );

}


/* =========================================================
   CLOCK LOOP
========================================================= */

function clockLoop(
    now
){

    const elapsed =
        (
            now -
            lastClockTime
        ) / 1000;


    lastClockTime =
        now;


    if(
        engineReady &&
        !gameFinished
    ){

        const side =
            game.turn();


        clock[side] =
            Math.max(
                0,
                clock[side]-elapsed
            );


        updateClockDisplay();


        if(
            clock[side]<=0
        ){

            clock[side]=0;

            gameFinished=true;


            if(engine){

                try{

                    engine.postMessage(
                        "stop"
                    );

                }
                catch(e){}

            }


            thinking=false;


            if(side==="w"){

                showResult(
                    "Time Out",
                    "Stockfish wins on time."
                );

            }
            else{

                showResult(
                    "Time Out",
                    "You win on time!"
                );

            }

        }

    }


    requestAnimationFrame(
        clockLoop
    );

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    gameVersion++;


    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        }
        catch(e){}

    }


    game.reset();


    selected=null;

    lastMove=null;

    pendingPromotion=null;

    thinking=false;

    gameFinished=false;


    clock.w =
        baseSeconds;

    clock.b =
        baseSeconds;


    lastClockTime =
        performance.now();


    promotionOverlay.classList.remove(
        "show"
    );

    resultOverlay.classList.remove(
        "show"
    );


    evalFill.style.width =
        "50%";

    evalNumber.textContent =
        "+0.00";

    depthText.textContent =
        "Depth 0";


    enginePill.classList.remove(
        "thinking"
    );


    engineText.textContent =
        engineReady
        ? "Stockfish 18 · Ready"
        : "Loading engine";


    drawBoard();

    drawMoves();

    updateClockDisplay();

    updateInterface();

}


/* =========================================================
   UNDO
========================================================= */

function undo(){

    if(
        !game.history().length ||
        gameFinished
    ){

        return;
    }


    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

        }
        catch(e){}

    }


    thinking=false;

    gameVersion++;


    /*
       If it is White's turn,
       Stockfish has just moved.

       Undo Stockfish + player's move.

       If it is Black's turn,
       player just moved.

       Undo player's move only.
    */

    if(game.turn()==="w"){

        game.undo();

        if(game.history().length){

            game.undo();

        }

    }
    else{

        game.undo();

    }


    selected=null;


    const history =
        game.history({
            verbose:true
        });


    if(history.length){

        const last =
            history[
                history.length-1
            ];


        lastMove={

            from:last.from,

            to:last.to

        };

    }
    else{

        lastMove=null;

    }


    /*
       Resetting the clocks makes Undo
       predictable instead of allowing
       strange time exploits.
    */

    clock.w =
        baseSeconds;

    clock.b =
        baseSeconds;


    lastClockTime =
        performance.now();


    resultOverlay.classList.remove(
        "show"
    );


    drawBoard();

    drawMoves();

    updateClockDisplay();

    updateInterface();

}


/* =========================================================
   RESIGN
========================================================= */

function resign(){

    if(
        gameFinished ||
        game.history().length===0
    ){

        return;
    }


    gameFinished=true;


    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

        }
        catch(e){}

    }


    thinking=false;


    showResult(
        "Resigned",
        "Stockfish wins the game."
    );

}

                });


                pendingPromotion=null;

            };

    }
);

document

/* =========================================================
   DIFFICULTY
========================================================= */

difficulty.onchange =
    function(){

        if(
            thinking &&
            engine
        ){

            try{

                engine.postMessage(
                    "stop"
                );

            }
            catch(e){}


            thinking=false;

            enginePill.classList.remove(
                "thinking"
            );


            engineText.textContent =
                "Stockfish 18 · Ready";


            updateInterface();

        }

    };


/* =========================================================
   INITIALIZE
========================================================= */

drawBoard();

drawMoves();

updateClockDisplay();

updateInterface();

startEngine();

requestAnimationFrame(
    clockLoop
);

</script>
