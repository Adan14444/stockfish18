<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stockfish Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(91, 76, 220, 0.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(35, 140, 210, 0.13),
            transparent 32%
        ),
        #070910;

    color: #f4f6fb;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
select {
    font: inherit;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: min(1500px, 96vw);

    margin: auto;

    padding:
        18px
        0
        30px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 17px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 20px;

    background:
        rgba(13,16,26,0.84);

    box-shadow:
        0 18px 50px rgba(0,0,0,0.28),
        inset 0 1px rgba(255,255,255,0.06);

    backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;

    gap: 12px;
}

.logo {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    font-family: Georgia, serif;

    font-size: 27px;

    background:
        linear-gradient(
            135deg,
            #8d7dff,
            #4fcfff
        );

    box-shadow:
        0 10px 28px
        rgba(90,110,255,0.32);
}

.brand-title {
    font-size: 16px;
    font-weight: 800;
}

.brand-subtitle {
    margin-top: 3px;

    color: #81899a;

    font-size: 11px;
}

.engine-pill {
    display: flex;
    align-items: center;

    gap: 8px;

    padding:
        9px
        13px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.08);

    color: #cbd1db;

    font-size: 11px;
    font-weight: 700;
}

.engine-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #4df2a0;

    box-shadow:
        0 0 13px
        rgba(77,242,160,0.9);
}

.engine-pill.thinking .engine-dot {
    animation:
        pulse
        0.65s
        infinite
        alternate;
}

@keyframes pulse {

    from {
        transform: scale(.65);
        opacity: .45;
    }

    to {
        transform: scale(1.2);
        opacity: 1;
    }

}


/* =========================================================
   MAIN
========================================================= */

.main {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        350px;

    gap: 24px;

    margin-top: 22px;

    align-items: start;
}


/* =========================================================
   BOARD AREA
========================================================= */

.board-area {
    display: flex;
    justify-content: center;

    min-width: 0;
}

.board-frame {

    /*
       BIGGER BOARD

       On a normal Chromebook/desktop this will use
       most of the available vertical space.
    */

    width:
        min(
            86vh,
            68vw,
            780px
        );

    aspect-ratio: 1 / 1;

    padding: 9px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.15),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,0.48),

        0 0 70px
        rgba(98,84,255,0.08),

        inset 0 1px
        rgba(255,255,255,0.12);
}

.board {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(8, minmax(0,1fr));

    grid-template-rows:
        repeat(8, minmax(0,1fr));

    overflow: hidden;

    border-radius: 17px;
}


/* =========================================================
   SQUARES
========================================================= */

.square {

    position: relative;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;

    overflow: hidden;

    /*
       This controls piece sizing.
       The piece itself is below 75% of this.
    */

    font-size:
        min(
            8vw,
            11vh,
            86px
        );

    transition:
        filter .12s ease,
        box-shadow .16s ease;
}

.square.light {
    background: #e4eaf2;
}

.square.dark {
    background: #65758c;
}

.square:hover {
    filter: brightness(1.07);
}


/* =========================================================
   SELECTED / LAST MOVE / CHECK
========================================================= */

.square.selected {

    box-shadow:
        inset 0 0 0 999px
        rgba(105,91,255,0.29),

        inset 0 0 30px
        rgba(105,91,255,0.40);
}

.square.last {

    box-shadow:
        inset 0 0 0 999px
        rgba(255,205,65,0.17);
}

.square.check {

    box-shadow:
        inset 0 0 0 999px
        rgba(255,45,65,0.28),

        inset 0 0 35px
        rgba(255,45,65,0.65);

    animation:
        checkGlow
        .65s
        infinite
        alternate;
}

@keyframes checkGlow {

    from {
        filter: brightness(1);
    }

    to {
        filter: brightness(1.14);
    }

}


/* =========================================================
   PIECES
========================================================= */

.piece {

    /*
       IMPORTANT:
       Pieces are now smaller than their squares.
    */

    font-size: 68%;

    line-height: 1;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    position: relative;

    z-index: 5;

    pointer-events: none;

    transition:
        transform .12s ease,
        filter .12s ease;

    will-change: transform;
}

.square:hover .piece {
    transform:
        translateY(-2px)
        scale(1.025);
}


/* WHITE */

.white-piece {

    color: #ffffff;

    text-shadow:
        0 2px 0 #c7cfdb,
        0 4px 5px rgba(0,0,0,0.34),
        0 8px 12px rgba(0,0,0,0.18);
}


/* BLACK */

.black-piece {

    color: #20252c;

    text-shadow:
        0 1px 0 #69727f,
        0 4px 5px rgba(0,0,0,0.40),
        0 8px 12px rgba(0,0,0,0.20);
}


/* piece entering */

.piece.new-piece {

    animation:
        pieceIn
        .18s
        ease-out;
}

@keyframes pieceIn {

    from {
        opacity: 0;
        transform:
            scale(.78)
            translateY(-4px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }

}


/* =========================================================
   COORDINATES
========================================================= */

.coordinate {

    position: absolute;

    z-index: 8;

    pointer-events: none;

    font-size: 9px;

    font-weight: 800;

    opacity: .52;
}

.rank {
    top: 4px;
    left: 5px;
}

.file {
    bottom: 4px;
    right: 5px;
}

.square.light .coordinate {
    color: #536074;
}

.square.dark .coordinate {
    color: #f1f4f8;
}


/* =========================================================
   LEGAL MOVES
========================================================= */

.move-dot {

    position: absolute;

    z-index: 3;

    width: 17%;

    aspect-ratio: 1;

    border-radius: 50%;

    background:
        rgba(30,35,45,0.34);

    pointer-events: none;

    animation:
        dotIn
        .13s
        ease-out;
}

@keyframes dotIn {

    from {
        transform: scale(.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}

.capture-ring {

    position: absolute;

    z-index: 3;

    width: 78%;
    height: 78%;

    border-radius: 50%;

    border:
        5px solid
        rgba(35,40,50,0.28);

    pointer-events: none;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    display: flex;

    flex-direction: column;

    gap: 13px;

    min-width: 0;
}

.card {

    border:
        1px solid
        rgba(255,255,255,0.085);

    border-radius: 19px;

    background:
        rgba(14,18,28,0.84);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.23),

        inset 0 1px
        rgba(255,255,255,0.045);

    backdrop-filter: blur(18px);

    overflow: hidden;
}


/* =========================================================
   STATUS
========================================================= */

.status-card {

    padding: 17px;
}

.label {

    color: #858ea0;

    font-size: 9px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.status {

    margin-top: 6px;

    font-size: 19px;

    font-weight: 850;
}

.status.thinking {
    color: #988cff;
}

.evaluation {

    margin-top: 16px;

    height: 11px;

    border-radius: 999px;

    overflow: hidden;

    background: #10141c;

    border:
        1px solid
        rgba(255,255,255,0.06);
}

.evaluation-fill {

    width: 50%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #c8d0dc,
            #ffffff
        );

    transition:
        width .4s ease;
}

.eval-number {

    margin-top: 6px;

    text-align: right;

    color: #858ea0;

    font-size: 10px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   GAME MODE
========================================================= */

.mode-card {

    padding: 14px;
}

.mode-title-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;
}

.mode-title {

    font-size: 12px;

    font-weight: 800;
}

.mode-time {

    color: #858ea0;

    font-size: 10px;
}

.mode-grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 7px;
}

.mode-button {

    min-height: 47px;

    padding: 7px;

    text-align: left;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    background:
        rgba(255,255,255,0.035);

    color: #dfe3eb;

    cursor: pointer;

    transition:
        background .13s ease,
        border .13s ease,
        transform .13s ease;
}

.mode-button:hover {

    transform:
        translateY(-1px);

    background:
        rgba(255,255,255,0.065);
}

.mode-button.active {

    border-color:
        rgba(126,113,255,0.65);

    background:
        rgba(112,98,255,0.15);

    box-shadow:
        0 0 18px
        rgba(112,98,255,0.08);
}

.mode-name {

    display: block;

    font-size: 10px;

    font-weight: 800;
}

.mode-clock {

    display: block;

    margin-top: 3px;

    color: #8e97a9;

    font-size: 9px;
}


/* =========================================================
   CLOCKS
========================================================= */

.clocks {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;

    padding: 13px;
}

.clock {

    padding: 13px;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.06);

    transition:
        border .18s ease,
        box-shadow .18s ease;
}

.clock.active {

    border-color:
        rgba(126,113,255,0.58);

    box-shadow:
        0 0 25px
        rgba(126,113,255,0.08);
}

.clock-label {

    color: #858ea0;

    font-size: 9px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.clock-time {

    margin-top: 4px;

    font-size: 24px;

    font-weight: 850;

    font-variant-numeric:
        tabular-nums;
}

.clock.low .clock-time {
    color: #ff7777;
}


/* =========================================================
   MOVE HISTORY
========================================================= */

.moves {

    height: 245px;

    padding: 9px;

    overflow-y: auto;
}

.moves::-webkit-scrollbar {
    width: 5px;
}

.moves::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,0.12);

    border-radius: 10px;
}

.empty {

    height: 100%;

    display: grid;

    place-items: center;

    color: #747e90;

    font-size: 11px;
}

.move-row {

    display: grid;

    grid-template-columns:
        30px
        1fr
        1fr;

    gap: 5px;

    padding:
        8px 7px;

    border-radius: 9px;

    font-size: 12px;

    animation:
        moveAppear
        .16s
        ease-out;
}

.move-row.latest {

    background:
        rgba(115,101,255,0.13);
}

.move-number {

    color: #717b8d;
}

.move-san {

    font-weight: 800;
}

@keyframes moveAppear {

    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: none;
    }

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    padding: 13px;
}

.control-row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}

.button {

    padding: 11px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.045);

    color: white;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}

.button:hover {

    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,0.08);
}

.button:active {

    transform:
        scale(.98);
}

.button.primary {

    border: 0;

    background:
        linear-gradient(
            135deg,
            #7869ef,
            #5e92ff
        );

    box-shadow:
        0 8px 25px
        rgba(90,105,255,0.22);
}

.engine-info {

    display: flex;

    justify-content: space-between;

    margin-top: 10px;

    color: #70798b;

    font-size: 9px;
}


/* =========================================================
   PROMOTION
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(2,4,9,0.73);

    backdrop-filter:
        blur(9px);
}

.overlay.show {

    display: flex;
}

.modal {

    width:
        min(
            390px,
            92vw
        );

    padding: 25px;

    border-radius: 22px;

    border:
        1px solid
        rgba(255,255,255,0.11);

    background:
        #111520;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,0.58);

    text-align: center;

    animation:
        modalIn
        .18s
        ease-out;
}

.modal-title {

    margin-bottom: 16px;

    font-size: 19px;

    font-weight: 900;
}

.promotion-grid {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 9px;
}

.promotion-button {

    padding: 10px 3px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.045);

    color: white;

    font-family: Georgia, serif;

    font-size: 42px;

    cursor: pointer;

    transition:
        transform .13s ease,
        background .13s ease;
}

.promotion-button:hover {

    transform:
        translateY(-3px);

    background:
        rgba(118,103,255,0.15);
}

.result-title {

    font-size: 30px;

    font-weight: 900;
}

.result-sub {

    margin:
        7px
        0
        20px;

    color: #858ea0;

    font-size: 13px;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform:
            scale(.95)
            translateY(8px);
    }

    to {
        opacity: 1;
        transform: none;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1050px) {

    .main {

        grid-template-columns:
            1fr;
    }

    .board-frame {

        width:
            min(
                88vw,
                760px
            );
    }

    .sidebar {

        width:
            min(
                88vw,
                760px
            );

        margin:
            0 auto;
    }
}


@media(max-width:600px) {

    .app {

        width: 97vw;

        padding-top: 9px;
    }

    .header {

        height: 58px;

        border-radius: 16px;
    }

    .logo {

        width: 37px;
        height: 37px;

        font-size: 23px;
    }

    .brand-subtitle {

        display: none;
    }

    .engine-pill {

        padding:
            8px
            10px;
    }

    .board-frame {

        width: 95vw;

        padding: 7px;

        border-radius: 19px;
    }

    .board {

        border-radius: 13px;
    }

    .square {

        font-size:
            min(
                11vw,
                55px
            );
    }

    .piece {

        font-size: 66%;
    }

    .moves {

        height: 220px;
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="brand">

        <div class="logo">
            ♞
        </div>

        <div>

            <div class="brand-title">
                Stockfish Chess
            </div>

            <div class="brand-subtitle">
                Premium browser chess
            </div>

        </div>

    </div>


    <div
        class="engine-pill"
        id="enginePill"
    >

        <span class="engine-dot"></span>

        <span id="engineText">
            Loading Stockfish
        </span>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


<!-- =======================================================
     BOARD
======================================================= -->

<section class="board-area">

    <div class="board-frame">

        <div
            class="board"
            id="board"
        ></div>

    </div>

</section>



<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar">


<!-- STATUS -->

<section class="card status-card">

    <div class="label">
        Game Status
    </div>

    <div
        class="status"
        id="status"
    >
        Loading…
    </div>


    <div class="evaluation">

        <div
            class="evaluation-fill"
            id="evaluationFill"
        ></div>

    </div>

    <div
        class="eval-number"
        id="evalNumber"
    >
        0.00
    </div>

</section>



<!-- GAME MODES -->

<section class="card mode-card">

    <div class="mode-title-row">

        <div class="mode-title">
            Game Mode
        </div>

        <div
            class="mode-time"
            id="modeTime"
        >
            10 + 0
        </div>

    </div>


    <div class="mode-grid">

        <button
            class="mode-button"
            data-time="60"
            data-increment="0"
        >

            <span class="mode-name">
                Bullet
            </span>

            <span class="mode-clock">
                1 + 0
            </span>

        </button>


        <button
            class="mode-button"
            data-time="120"
            data-increment="1"
        >

            <span class="mode-name">
                Bullet
            </span>

            <span class="mode-clock">
                2 + 1
            </span>

        </button>


        <button
            class="mode-button"
            data-time="180"
            data-increment="0"
        >

            <span class="mode-name">
                Blitz
            </span>

            <span class="mode-clock">
                3 + 0
            </span>

        </button>


        <button
            class="mode-button"
            data-time="300"
            data-increment="0"
        >

            <span class="mode-name">
                Blitz
            </span>

            <span class="mode-clock">
                5 + 0
            </span>

        </button>


        <button
            class="mode-button"
            data-time="300"
            data-increment="3"
        >

            <span class="mode-name">
                Blitz
            </span>

            <span class="mode-clock">
                5 + 3
            </span>

        </button>


        <button
            class="mode-button active"
            data-time="600"
            data-increment="0"
        >

            <span class="mode-name">
                Rapid
            </span>

            <span class="mode-clock">
                10 + 0
            </span>

        </button>


        <button
            class="mode-button"
            data-time="600"
            data-increment="5"
        >

            <span class="mode-name">
                Rapid
            </span>

            <span class="mode-clock">
                10 + 5
            </span>

        </button>


        <button
            class="mode-button"
            data-time="900"
            data-increment="10"
        >

            <span class="mode-name">
                Rapid
            </span>

            <span class="mode-clock">
                15 + 10
            </span>

        </button>


        <button
            class="mode-button"
            data-time="1800"
            data-increment="0"
        >

            <span class="mode-name">
                Classical
            </span>

            <span class="mode-clock">
                30 + 0
            </span>

        </button>

    </div>

</section>



<!-- CLOCKS -->

<section class="card">

    <div class="clocks">

        <div
            class="clock active"
            id="whiteClockBox"
        >

            <div class="clock-label">
                White
            </div>

            <div
                class="clock-time"
                id="whiteClock"
            >
                10:00
            </div>

        </div>


        <div
            class="clock"
            id="blackClockBox"
        >

            <div class="clock-label">
                Black
            </div>

        </div>

<script>

/* =========================================================
   CHESS
========================================================= */

const game = new Chess();


/* =========================================================
   PIECES
========================================================= */

const pieces = {

    wp: "♙",
    wn: "♘",
    wb: "♗",
    wr: "♖",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    bn: "♞",
    bb: "♝",
    br: "♜",
    bq: "♛",
    bk: "♚"

};


/* =========================================================
   ELEMENTS
========================================================= */

const board =
    document.getElementById("board");

const status =
    document.getElementById("status");

const moves =
    document.getElementById("moves");

const enginePill =
    document.getElementById("enginePill");

const engineText =
    document.getElementById("engineText");

const evaluationFill =
    document.getElementById("evaluationFill");

const evalNumber =
    document.getElementById("evalNumber");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const whiteClockBox =
    document.getElementById("whiteClockBox");

const blackClockBox =
    document.getElementById("blackClockBox");

const modeTime =
    document.getElementById("modeTime");

const depth =
    document.getElementById("depth");

const turn =
    document.getElementById("turn");

const difficulty =
    document.getElementById("difficulty");

const promotionOverlay =
    document.getElementById("promotionOverlay");

const gameOverOverlay =
    document.getElementById("gameOverOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultSub =
    document.getElementById("resultSub");


/* =========================================================
   STATE
========================================================= */

let engine = null;

let engineReady = false;

let thinking = false;

let selected = null;

let lastMove = null;

let pendingPromotion = null;

let gameFinished = false;

let positionVersion = 0;


/* =========================================================
   TIME CONTROL
========================================================= */

let baseTime = 600;

let increment = 0;

let clock = {

    w: 600,
    b: 600

};

let lastClockUpdate = performance.now();


/* =========================================================
   DRAW BOARD
========================================================= */

function drawBoard() {

    board.innerHTML = "";

    const position =
        game.board();


    for(
        let row = 0;
        row < 8;
        row++
    ) {

        for(
            let col = 0;
            col < 8;
            col++
        ) {

            const squareName =
                String.fromCharCode(
                    97 + col
                )
                +
                (8 - row);


            const square =
                document.createElement("div");

            square.className =
                "square "
                +
                (
                    (row + col) % 2 === 0
                    ? "light"
                    : "dark"
                );


            square.dataset.square =
                squareName;


            /* Last move */

            if(
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ) {

                square.classList.add(
                    "last"
                );

            }


            /* Selected */

            if(
                selected === squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /* Piece */

            const piece =
                position[row][col];


            if(piece) {

                const element =
                    document.createElement("div");

                element.className =
                    "piece "
                    +
                    (
                        piece.color === "w"
                        ? "white-piece"
                        : "black-piece"
                    );

                element.textContent =
                    pieces[
                        piece.color + piece.type
                    ];

                square.appendChild(
                    element
                );

            }


            /* Rank */

            const rank =
                document.createElement("span");

            rank.className =
                "coordinate rank";

            rank.textContent =
                col === 0
                ? 8 - row
                : "";

            square.appendChild(rank);


            /* File */

            const file =
                document.createElement("span");

            file.className =
                "coordinate file";

            file.textContent =
                row === 7
                ? String.fromCharCode(
                    97 + col
                )
                : "";

            square.appendChild(file);


            square.addEventListener(
                "click",
                function() {

                    handleSquareClick(
                        squareName
                    );

                }
            );


            board.appendChild(
                square
            );

        }

    }


    if(selected) {

        showLegalMoves(
            selected
        );

    }


    showCheck();

}


/* =========================================================
   LEGAL MOVES
========================================================= */

function showLegalMoves(squareName) {

    const legal =
        game.moves({
            square: squareName,
            verbose: true
        });


    legal.forEach(
        function(move) {

            const target =
                board.querySelector(
                    '[data-square="' +
                    move.to +
                    '"]'
                );


            if(!target) return;


            if(move.captured) {

                const ring =
                    document.createElement("div");

                ring.className =
                    "capture-ring";

                target.appendChild(
                    ring
                );

            } else {

                const dot =
                    document.createElement("div");

                dot.className =
                    "move-dot";

                target.appendChild(
                    dot
                );

            }

        }
    );
}


/* =========================================================
   CHECK KING
========================================================= */

function showCheck() {

    if(!game.in_check()) {
        return;
    }


    const side =
        game.turn();

    const position =
        game.board();


    for(
        let row = 0;
        row < 8;
        row++
    ) {

        for(
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                position[row][col];


            if(
                piece &&
                piece.type === "k" &&
                piece.color === side
            ) {

                const squareName =
                    String.fromCharCode(
                        97 + col
                    )
                    +
                    (8 - row);


                const square =
                    board.querySelector(
                        '[data-square="' +
                        squareName +
                        '"]'
                    );


                if(square) {

                    square.classList.add(
                        "check"
                    );

                }

            }

        }

    }

}


/* =========================================================
   CLICK SQUARE
========================================================= */

function handleSquareClick(squareName) {

    if(gameFinished) {
        return;
    }

    if(!engineReady) {
        return;
    }

    if(thinking) {
        return;
    }

    /* You play White */

    if(game.turn() !== "w") {
        return;
    }


    const piece =
        game.get(squareName);


    /* Nothing selected */

    if(!selected) {

        if(
            piece &&
            piece.color === "w"
        ) {

            selected =
                squareName;

            drawBoard();

        }

        return;
    }


    /* Selecting another piece */

    if(
        piece &&
        piece.color === "w"
    ) {

        selected =
            squareName;

        drawBoard();

        return;
    }


    /* Find legal move */

    const legal =
        game.moves({
            square: selected,
            verbose: true
        });


    const move =
        legal.find(
            function(item) {

                return item.to === squareName;

            }
        );


    /* Not legal */

    if(!move) {

        selected = null;

        drawBoard();

        return;
    }


    /* Promotion */

    if(move.promotion) {

        pendingPromotion = {

            from: selected,
            to: squareName

        };

        promotionOverlay.classList.add(
            "show"
        );

        return;
    }


    playMove({

        from: selected,
        to: squareName

    });

}


/* =========================================================
   PLAY MOVE
========================================================= */

function playMove(move) {

    const result =
        game.move(move);


    if(!result) {
        return;
    }


    /* Increment */

    clock.w += increment;


    selected = null;


    lastMove = {

        from: result.from,

        to: result.to

    };


    positionVersion++;


    drawBoard();

    drawMoves();

    updateStatus();


    if(checkGameOver()) {
        return;
    }


    askEngine();

}


/* =========================================================
   PROMOTION BUTTONS
========================================================= */

document
.querySelectorAll(
    ".promotion-button"
)
.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                if(!pendingPromotion) {
                    return;
                }


                const piece =
                    button.dataset.piece;


                promotionOverlay.classList.remove(
                    "show"
                );


                playMove({

                    from:
                        pendingPromotion.from,

                    to:
                        pendingPromotion.to,

                    promotion:
                        piece

                });


                pendingPromotion = null;

            }
        );

    }
);


/* =========================================================
   MOVE HISTORY
========================================================= */

function drawMoves() {

    moves.innerHTML = "";


    const history =
        game.history();


    if(history.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty";

        empty.textContent =
            "Make the first move";

        moves.appendChild(
            empty
        );

        return;
    }


    for(
        let i = 0;
        i < history.length;
        i += 2
    ) {

        const row =
            document.createElement("div");

        row.className =
            "move-row";


        if(
            i >= history.length - 2
        ) {

            row.classList.add(
                "latest"
            );

        }


        const number =
            document.createElement("div");

        number.className =
            "move-number";

        number.textContent =
            (i / 2) + 1;


        const white =
            document.createElement("div");

        white.className =
            "move-san";

        white.textContent =
            history[i] || "";


        const black =
            document.createElement("div");

        black.className =
            "move-san";

        black.textContent =
            history[i + 1] || "";


        row.appendChild(number);

        row.appendChild(white);

        row.appendChild(black);


        moves.appendChild(row);

    }


    moves.scrollTop =
        moves.scrollHeight;

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    turn.textContent =
        game.turn() === "w"
        ? "White"
        : "Black";


    whiteClockBox.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameFinished
    );


    blackClockBox.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameFinished
    );


    if(gameFinished) {
        return;
    }


    if(thinking) {

        status.textContent =
            "Stockfish is thinking…";

        status.classList.add(
            "thinking"
        );

    }

    else if(game.in_check()) {

        status.textContent =
            "Check!";

        status.classList.remove(
            "thinking"
        );

    }

    else if(game.turn() === "w") {

        status.textContent =
            "Your move";

        status.classList.remove(
            "thinking"
        );

    }

    else {

        status.textContent =
            "Stockfish's move";

        status.classList.remove(
            "thinking"
        );

    }

}


/* =========================================================
   STOCKFISH
========================================================= */

function startEngine() {

    try {

        engine =
            new Worker(
                "./stockfish-18-lite-single.js"
            );


        engine.onmessage =
            handleEngineMessage;


        engine.onerror =
            function() {

                engineReady = false;

                thinking = false;

                enginePill.classList.remove(
                    "thinking"
                );

                engineText.textContent =
                    "Engine error";

                status.textContent =
                    "Stockfish failed to load";

            };


        engine.postMessage(
            "uci"
        );

    }

    catch(error) {

        engineText.textContent =
            "Engine unavailable";

    }

}


/* =========================================================
   ENGINE MESSAGE
========================================================= */

function handleEngineMessage(event) {

    const line =
        String(event.data);


    if(line === "uciok") {

        engine.postMessage(
            "isready"
        );

        return;
    }


    if(line === "readyok") {

        engineReady = true;

        engineText.textContent =
            "Stockfish ready";

        updateStatus();

        return;
    }


    /* Evaluation */

    if(
        line.indexOf("info") === 0
    ) {

        parseEvaluation(
            line
        );


        const d =
            line.match(
                /\bdepth\s+(\d+)/
            );


        if(d) {

            depth.textContent =
                "Depth " +
                d[1];

        }


        return;
    }


    /* Best move */

    if(
        line.indexOf("bestmove") === 0
    ) {

        if(!thinking) {
            return;
        }


        thinking = false;


        enginePill.classList.remove(
            "thinking"
        );

        engineText.textContent =
            "Stockfish ready";


        /*
           Ignore a result from an
           old game position.
        */

        if(
            enginePosition !== positionVersion
        ) {

            updateStatus();

            return;
        }


        const match =
            line.match(
                /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/
            );


        if(!match) {

            updateStatus();

            return;
        }


        const notation =
            match[1];


        const move = {

            from:
                notation.substring(
                    0,
                    2
                ),

            to:
                notation.substring(
                    2,
                    4
                )

        };


        if(notation.length === 5) {

            move.promotion =
                notation.substring(
                    4,
                    5
                );

        }


        makeEngineMove(
            move
        );

    }

}


/* =========================================================
   ENGINE POSITION TRACKING
========================================================= */

let enginePosition = 0;


/* =========================================================
   ASK ENGINE
========================================================= */

function askEngine() {

    if(!engineReady) {
        return;
    }

    if(gameFinished) {
        return;
    }

    if(game.turn() !== "b") {
        return;
    }


    thinking = true;

    enginePosition =
        positionVersion;


    enginePill.classList.add(
        "thinking"
    );

    engineText.textContent =
        "Thinking…";


    updateStatus();


    const selectedDepth =
        parseInt(
            difficulty.value,
            10
        );


    try {

        engine.postMessage(
            "stop"
        );

        engine.postMessage(
            "position fen " +
            game.fen()
        );

        engine.postMessage(
            "go depth " +
            selectedDepth
        );

    }

    catch(error) {

        thinking = false;

        updateStatus();

    }

}


/* =========================================================
   ENGINE MOVE
========================================================= */

function makeEngineMove(move) {

    if(gameFinished) {
        return;
    }


    if(game.turn() !== "b") {
        return;
    }


    const result =
        game.move(move);


    if(!result) {

        updateStatus();

        return;
    }


    clock.b += increment;


    lastMove = {

        from: result.from,

        to: result.to

    };


    positionVersion++;


    drawBoard();

    drawMoves();

    updateStatus();


    checkGameOver();

}


/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(line) {

    /*
       Engine is thinking when Black is to move.

       Stockfish's score is from Black's
       perspective.

       We invert it to show White's perspective.
    */


    const mate =
        line.match(
            /score mate (-?\d+)/
        );


    if(mate) {

        const blackMate =
            parseInt(
                mate[1],
                10
            );


        const whiteMate =
            -blackMate;


        if(whiteMate > 0) {

            evalNumber.textContent =
                "M+" +
                whiteMate;

            evaluationFill.style.width =
                "96%";

        } else {

            evalNumber.textContent =
                "M" +
                whiteMate;

            evaluationFill.style.width =
                "4%";

        }


        return;
    }


    const cp =
        line.match(
            /score cp (-?\d+)/
        );


    if(!cp) {
        return;
    }


    const blackScore =
        parseInt(
            cp[1],
            10
        ) / 100;


    const whiteScore =
        -blackScore;


    const limited =
        Math.max(
            -10,
            Math.min(
                10,
                whiteScore
            )
        );


    evalNumber.textContent =
        (
            limited >= 0
            ? "+"
            : ""
        )
        +
        limited.toFixed(2);


    /*
       Smoothly map evaluation to bar.
    */

    const percentage =
        50 +
        limited * 5;


    evaluationFill.style.width =
        Math.max(
            4,
            Math.min(
                96,
                percentage
            )
        )
        +
        "%";

}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver() {


    /* CHECKMATE */

    if(game.is_checkmate()) {

        gameFinished = true;


        if(game.turn() === "w") {

            showGameOver(
                "Checkmate",
                "Stockfish wins."
            );

        } else {

            showGameOver(
                "Checkmate",
                "You defeated Stockfish!"
            );

        }


        return true;
    }


    /* STALEMATE */

    if(game.is_stalemate()) {

        gameFinished = true;


        showGameOver(
            "Stalemate",
            "The game ends in a draw."
        );


        return true;
    }


    /* THREEFOLD */

    if(
        game.is_threefold_repetition()
    ) {

        gameFinished = true;


        showGameOver(
            "Draw",
            "Threefold repetition."
        );


        return true;
    }


    /* INSUFFICIENT */

    if(
        game.is_insufficient_material()
    ) {

        gameFinished = true;


        showGameOver(
            "Draw",
            "Insufficient material."
        );


        return true;
    }


    /* OTHER DRAW */

    if(game.is_draw()) {

        gameFinished = true;


        showGameOver(
            "Draw",
            "The game ends in a draw."
        );


        return true;
    }


    return false;

}


/* =========================================================
   GAME OVER SCREEN
========================================================= */

function showGameOver(
    title,
    subtitle
) {

    if(engine) {

        try {

            engine.postMessage(
                "stop"
            );

        } catch(error) {}

    }


    thinking = false;


    enginePill.classList.remove(
        "thinking"
    );


    engineText.textContent =
        "Game finished";


    resultTitle.textContent =
        title;


    resultSub.textContent =
        subtitle;


    gameOverOverlay.classList.add(
        "show"
    );


    updateStatus();

}


/* =========================================================
   CLOCK DISPLAY
========================================================= */

function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            seconds
        );


    const whole =
        Math.ceil(
            seconds
        );


    const minutes =
        Math.floor(
            whole / 60
        );


    const remaining =
        whole % 60;


    return (
        String(minutes).padStart(
            2,
            "0"
        )
        +
        ":"
        +
        String(remaining).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   UPDATE CLOCK UI
========================================================= */

function updateClockDisplay() {

    whiteClock.textContent =
        formatTime(
            clock.w
        );


    blackClock.textContent =
        formatTime(
            clock.b
        );


    whiteClockBox.classList.toggle(
        "low",
        clock.w <= 10
    );


    blackClockBox.classList.toggle(
        "low",
        clock.b <= 10
    );

}


/* =========================================================
   CLOCK LOOP
========================================================= */

function clockLoop(now) {

    const elapsed =
        (
            now -
            lastClockUpdate
        ) / 1000;


    lastClockUpdate =
        now;


    if(
        engineReady &&
        !gameFinished
    ) {

        const side =
            game.turn();


        clock[side] =
            Math.max(
                0,
                clock[side] - elapsed
            );


        updateClockDisplay();


        if(clock[side] <= 0) {

            clock[side] = 0;

            gameFinished = true;


            if(engine) {

                try {

                    engine.postMessage(
                        "stop"
                    );

                } catch(error) {}

            }


            thinking = false;


            enginePill.classList.remove(
                "thinking"
            );


            if(side === "w") {

                showGameOver(
                    "Time Out",
                    "Stockfish wins on time."
                );

            } else {

                showGameOver(
                    "Time Out",
                    "You win on time!"
                );

            }

        }

    }


    requestAnimationFrame(
        clockLoop
    );

}


/* =========================================================
   GAME MODE
========================================================= */

document
.querySelectorAll(
    ".mode-button"
)
.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                baseTime =
                    parseInt(
                        button.dataset.time,
                        10
                    );


                increment =
                    parseInt(
                        button.dataset.increment,
                        10
                    );


                document
                .querySelectorAll(
                    ".mode-button"
                )
                .forEach(
                    function(other) {

                        other.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                modeTime.textContent =
                    Math.floor(
                        baseTime / 60
                    )
                    +
                    " + "
                    +
                    increment;


                newGame();

            }
        );

    }
);


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    positionVersion++;


    if(engine) {

        try {

            engine.postMessage(
                "stop"
            );

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        } catch(error) {}

    }


    game.reset();


    selected = null;

    lastMove = null;

    pendingPromotion = null;

    thinking = false;

    gameFinished = false;


    clock.w =
        baseTime;

    clock.b =
        baseTime;


    lastClockUpdate =
        performance.now();


    promotionOverlay.classList.remove(
        "show"
    );


    gameOverOverlay.classList.remove(
        "show"
    );


    evaluationFill.style.width =
        "50%";


    evalNumber.textContent =
        "0.00";


    depth.textContent =
        "Depth 0";


    enginePill.classList.remove(
        "thinking"
    );


    engineText.textContent =
        engineReady
        ? "Stockfish ready"
        : "Loading Stockfish";


    drawBoard();

    drawMoves();

    updateClockDisplay();

    updateStatus();

}


/* =========================================================
   UNDO
========================================================= */

document
.getElementById("undo")
.addEventListener(
    "click",
    function() {

        if(
            game.history().length === 0
        ) {
            return;
        }


        if(engine) {

            try {

                engine.postMessage(
                    "stop"
                );

            } catch(error) {}

        }


        thinking = false;

        gameFinished = false;

        positionVersion++;


        /*
           If it is White's turn,
           Black has already responded.

           Undo Black + White.

           If it is Black's turn,
           White just moved.

           Undo White.
        */

        if(game.turn() === "w") {

            game.undo();


            if(
                game.history().length > 0
            ) {

                game.undo();

            }

        } else {

            game.undo();

        }


        selected = null;


        const history =
            game.history({
                verbose: true
            });


        if(history.length > 0) {

            const last =
                history[
                    history.length - 1
                ];


            lastMove = {

                from:
                    last.from,

                to:
                    last.to

            };

        } else {

            lastMove = null;

        }


        /*
           Reset clocks to selected
           time control after undo.

           This keeps the clock predictable.
        */

        clock.w =
            baseTime;

        clock.b =
            baseTime;


        lastClockUpdate =
            performance.now();


        gameOverOverlay.classList.remove(
            "show"
        );


        drawBoard();

        drawMoves();

        updateClockDisplay();

        updateStatus();

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("newGame")
.addEventListener(
    "click",
    newGame
);


document
.getElementById("playAgain")
.addEventListener(
    "click",
    newGame
);


/* =========================================================
   DIFFICULTY
========================================================= */

difficulty.addEventListener(
    "change",
    function() {

        /*
           If Stockfish is currently thinking,
           stop that search. The next move will
           use the new difficulty.
        */

        if(thinking) {

            try {

                engine.postMessage(
                    "stop"
                );

            } catch(error) {}


            thinking = false;


            enginePill.classList.remove(
                "thinking"
            );


            engineText.textContent =
                "Stockfish ready";


            updateStatus();

        }

    }
);


/* =========================================================
   START
========================================================= */

drawBoard();

drawMoves();

updateClockDisplay();

updateStatus();

startEngine();

requestAnimationFrame(
    clockLoop
);

</script>
