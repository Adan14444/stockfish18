<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfish Chess</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    #board {
      width: min(90vw, 600px);
      height: min(90vw, 600px);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #333;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(30px, 8vw, 65px);
      cursor: pointer;
      user-select: none;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .selected {
      box-shadow: inset 0 0 0 5px #ffd700;
    }

    #status {
      margin-top: 18px;
      font-size: 18px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>♟ Stockfish Chess</h1>

  <div id="board"></div>

  <div id="status">Starting Stockfish...</div>

  <button onclick="resetGame()">New Game</button>

</div>

<script>

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");

const pieces = {
  r: "♜",
  n: "♞",
  b: "♝",
  q: "♛",
  k: "♚",
  p: "♟",

  R: "♖",
  N: "♘",
  B: "♗",
  Q: "♕",
  K: "♔",
  P: "♙"
};

let board = [
  "rnbqkbnr",
  "pppppppp",
  "........",
  "........",
  "........",
  "........",
  "PPPPPPPP",
  "RNBQKBNR"
];

let selected = null;
let engine = null;

function drawBoard() {

  boardElement.innerHTML = "";

  for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

      const square = document.createElement("div");

      square.className =
        "square " +
        ((row + col) % 2 === 0 ? "light" : "dark");

      if (
        selected &&
        selected.row === row &&
        selected.col === col
      ) {
        square.classList.add("selected");
      }

      const piece = board[row][col];

      square.textContent = pieces[piece] || "";

      square.onclick = () => selectSquare(row, col);

      boardElement.appendChild(square);
    }
  }
}

function selectSquare(row, col) {

  if (!selected) {

    if (board[row][col] !== ".") {

      selected = {
        row: row,
        col: col
      };

      drawBoard();
    }

    return;
  }

  const fromRow = selected.row;
  const fromCol = selected.col;

  const piece = board[fromRow][fromCol];

  const newBoard = board.map(row => row.split(""));

  newBoard[row][col] = piece;
  newBoard[fromRow][fromCol] = ".";

  board = newBoard.map(row => row.join(""));

  selected = null;

  drawBoard();

  statusElement.textContent =
    "Piece moved — Stockfish is analyzing...";

  if (engine) {

    engine.postMessage("stop");

    engine.postMessage(
      "position fen " + createFEN()
    );

    engine.postMessage(
      "go depth 12"
    );
  }
}

function createFEN() {

  const rows = board.map(row => {

    let result = "";
    let empty = 0;

    for (const piece of row) {

      if (piece === ".") {

        empty++;

      } else {

        if (empty > 0) {
          result += empty;
          empty = 0;
        }

        result += piece;
      }
    }

    if (empty > 0) {
      result += empty;
    }

    return result;
  });

  return rows.join("/") + " w - - 0 1";
}

function resetGame() {

  board = [
    "rnbqkbnr",
    "pppppppp",
    "........",
    "........",
    "........",
    "........",
    "PPPPPPPP",
    "RNBQKBNR"
  ];

  selected = null;

  drawBoard();

  statusElement.textContent =
    "Starting position...";
}

drawBoard();

/*
  Stockfish is in the same GitHub Pages folder.
*/

try {

  engine = new Worker(
    "./stockfish-18-lite-single.js"
  );

  engine.onmessage = function(event) {

    const message = String(event.data);

    if (message === "uciok") {

      statusElement.textContent =
        "♟ Stockfish 18 is ready!";

    }

    if (message.startsWith("bestmove")) {

      statusElement.textContent =
        "🤖 " + message;
    }
  };

  engine.onerror = function(event) {

    statusElement.textContent =
      "Engine error: " +
      (event.message || "Stockfish could not start.");
  };

  engine.postMessage("uci");

} catch (error) {

  statusElement.textContent =
    "Could not start Stockfish.";
}

</script>

</body>
</html>
