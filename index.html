<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Nova Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root{
    --bg:#070a12;
    --panel:#101522;
    --panel2:#151b2b;
    --border:rgba(255,255,255,.09);
    --text:#f4f7ff;
    --muted:#8993aa;
    --accent:#7c5cff;
    --accent2:#00d4ff;
    --good:#42e695;
    --danger:#ff5577;

    --light:#e7edf5;
    --dark:#61708c;

    --sq:min(9.1vw,9.1vh);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(circle at 15% 15%,rgba(124,92,255,.15),transparent 30%),
        radial-gradient(circle at 85% 85%,rgba(0,212,255,.10),transparent 30%),
        var(--bg);
}

button,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:12px;
}

.shell{
    width:min(1320px,100%);
    height:min(850px,100%);

    display:grid;
    grid-template-columns:minmax(0,1fr) 330px;
    gap:14px;
}

/* =========================
   BOARD AREA
========================= */

.board-panel{
    min-width:0;
    min-height:0;

    border:1px solid var(--border);
    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(18px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:18px;
}

.topbar{
    width:min(100%,760px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-icon{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(135deg,var(--accent),var(--accent2));

    box-shadow:0 8px 25px rgba(124,92,255,.3);
}

.turn-label{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
}

.board-wrap{
    position:relative;

    width:min(
        100%,
        calc(100vh - 170px),
        760px
    );

    aspect-ratio:1/1;

    border-radius:12px;

    padding:5px;

    background:#0b0f19;

    box-shadow:
        0 25px 60px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,255,255,.06);
}

.board{
    width:100%;
    height:100%;

    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    overflow:hidden;
    border-radius:8px;
}

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    user-select:none;

    transition:
        filter .12s ease,
        box-shadow .12s ease;
}

.square.light{
    background:var(--light);
}

.square.dark{
    background:var(--dark);
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px rgba(124,92,255,.9),
        inset 0 0 25px rgba(124,92,255,.35);

    z-index:2;
}

.square.last{
    filter:brightness(1.08);
    box-shadow:inset 0 0 0 999px rgba(255,220,80,.12);
}

.square.check{
    box-shadow:
        inset 0 0 0 999px rgba(255,50,80,.35),
        inset 0 0 30px rgba(255,50,80,.55);
}

.square.legal::after{
    content:"";

    width:23%;
    height:23%;

    border-radius:50%;

    background:rgba(20,30,45,.32);

    position:absolute;
}

.square.capture::after{
    content:"";

    width:72%;
    height:72%;

    border-radius:50%;

    border:5px solid rgba(255,255,255,.35);

    position:absolute;
}

.piece{
    position:relative;
    z-index:3;

    font-family:
        "Noto Sans Symbols 2",
        "Segoe UI Symbol",
        "DejaVu Sans",
        serif;

    font-size:clamp(29px,7vw,76px);

    line-height:1;

    user-select:none;

    transform:translateY(-1px);

    text-shadow:
        0 2px 3px rgba(0,0,0,.28),
        0 5px 15px rgba(0,0,0,.16);

    transition:
        transform .12s ease,
        filter .12s ease;
}

.square:hover .piece{
    transform:translateY(-2px) scale(1.025);
}

.white-piece{
    color:#fff;
}

.black-piece{
    color:#161b25;
}

/* Board coordinates */

.coord{
    position:absolute;

    font-size:9px;
    font-weight:800;

    opacity:.7;

    z-index:4;

    pointer-events:none;
}

.coord.file{
    right:4px;
    bottom:2px;
}

.coord.rank{
    left:4px;
    top:2px;
}

.light .coord{
    color:#61708c;
}

.dark .coord{
    color:#e7edf5;
}

.board-controls{
    width:min(100%,760px);

    display:flex;
    gap:8px;

    margin-top:10px;
}

.control-btn{
    flex:1;

    border:1px solid var(--border);

    background:rgba(255,255,255,.04);

    color:var(--text);

    border-radius:11px;

    padding:9px 10px;

    font-size:12px;
    font-weight:700;

    transition:.15s ease;
}

.control-btn:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(124,92,255,.4);
}

.control-btn:active{
    transform:scale(.97);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    min-height:0;

    display:flex;
    flex-direction:column;

    gap:10px;

    overflow:auto;

    scrollbar-width:none;
}

.sidebar::-webkit-scrollbar{
    display:none;
}

.card{
    border:1px solid var(--border);
    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.03);

    padding:13px;
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;

    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;

    color:var(--muted);
    font-weight:800;
}

/* Engine */

.engine-status{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:13px;
    font-weight:700;
}

.status-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#777;

    box-shadow:0 0 0 4px rgba(255,255,255,.04);
}

.status-dot.loading{
    background:#ffbd4a;
    box-shadow:
        0 0 0 4px rgba(255,189,74,.1),
        0 0 14px rgba(255,189,74,.5);
}

.status-dot.ready{
    background:var(--good);
    box-shadow:
        0 0 0 4px rgba(66,230,149,.1),
        0 0 14px rgba(66,230,149,.5);
}

.status-dot.error{
    background:var(--danger);
    box-shadow:
        0 0 0 4px rgba(255,85,119,.1),
        0 0 14px rgba(255,85,119,.5);
}

.diagnostic{
    display:none;

    margin-top:9px;

    padding:9px;

    border-radius:10px;

    background:rgba(255,85,119,.08);

    border:1px solid rgba(255,85,119,.18);

    color:#ff9aae;

    font-size:10px;
    line-height:1.45;
}

.diagnostic.show{
    display:block;
}

/* Clock */

.clocks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.clock{
    padding:10px;

    border-radius:12px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.055);
}

.clock-label{
    color:var(--muted);

    font-size:10px;
    font-weight:700;

    margin-bottom:3px;
}

.clock-time{
    font-variant-numeric:tabular-nums;

    font-size:23px;
    font-weight:850;

    letter-spacing:-1px;
}

.clock.active{
    border-color:rgba(124,92,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.12),
            rgba(255,255,255,.03)
        );

    box-shadow:
        0 0 25px rgba(124,92,255,.08);
}

.clock.low .clock-time{
    color:#ff6f87;
}

/* Eval */

.eval{
    height:8px;

    background:rgba(255,255,255,.07);

    border-radius:99px;

    overflow:hidden;

    margin:10px 0 7px;
}

.eval-fill{
    height:100%;
    width:50%;

    background:
        linear-gradient(
            90deg,
            #5f6b80,
            #f4f7ff
        );

    border-radius:99px;

    transition:width .35s ease;
}

.eval-number{
    text-align:center;

    font-size:12px;
    font-weight:800;

    font-variant-numeric:tabular-nums;

    color:var(--muted);
}

/* Moves */

.moves{
    max-height:190px;

    overflow:auto;

    scrollbar-width:thin;
}

.move-row{
    display:grid;
    grid-template-columns:30px 1fr 1fr;

    padding:4px 5px;

    border-radius:7px;

    font-size:12px;
}

.move-row:nth-child(odd){
    background:rgba(255,255,255,.025);
}

.move-number{
    color:var(--muted);
}

.move{
    font-weight:700;
}

.empty{
    color:var(--muted);
    font-size:11px;
    text-align:center;
    padding:10px;
}

/* Settings */

.setting{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:7px 0;
}

.setting label{
    font-size:12px;
    color:#d9dfed;
    font-weight:600;
}

select{
    min-width:125px;

    border:1px solid var(--border);

    background:#171d2c;

    color:var(--text);

    border-radius:8px;

    padding:6px 8px;

    outline:none;

    font-size:11px;
}

/* Buttons */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.action{
    border:1px solid var(--border);

    background:rgba(255,255,255,.045);

    color:var(--text);

    border-radius:10px;

    padding:9px;

    font-size:11px;
    font-weight:750;
}

.action:hover{
    background:rgba(255,255,255,.08);
}

.action.primary{
    border:none;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #5b8cff
        );

    box-shadow:0 8px 25px rgba(124,92,255,.2);
}

.action.danger{
    color:#ff8298;
}

/* Thinking */

.thinking{
    display:none;

    align-items:center;
    justify-content:center;

    gap:8px;

    margin-top:8px;

    font-size:10px;
    color:var(--muted);
}

.thinking.show{
    display:flex;
}

.spinner{
    width:11px;
    height:11px;

    border:2px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);

    border-radius:50%;

    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================
   MODALS
========================= */

.overlay{
    position:fixed;

    inset:0;

    display:none;
    place-items:center;

    background:rgba(0,0,0,.65);

    backdrop-filter:blur(10px);

    z-index:100;
}

.overlay.show{
    display:grid;
}

.modal{
    width:min(350px,calc(100% - 30px));

    padding:20px;

    border-radius:20px;

    background:#111725;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:0 30px 90px rgba(0,0,0,.6);

    text-align:center;
}

.modal h2{
    margin:0 0 7px;

    font-size:20px;
}

.modal p{
    margin:0 0 15px;

    color:var(--muted);

    font-size:12px;
}

.promotion-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.promo{
    border:1px solid var(--border);

    background:rgba(255,255,255,.05);

    border-radius:12px;

    padding:8px;

    color:var(--text);

    font-size:35px;
}

.promo:hover{
    background:rgba(124,92,255,.15);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    html,body{
        overflow:auto;
    }

    .app{
        min-height:100dvh;
        height:auto;

        align-items:flex-start;

        padding:8px;
    }

    .shell{
        height:auto;

        grid-template-columns:1fr;
    }

    .board-panel{
        padding:9px;

        border-radius:16px;
    }

    .board-wrap{
        width:min(
            100%,
            calc(100vw - 30px),
            calc(100vh - 130px)
        );
    }

    .sidebar{
        overflow:visible;
    }
}

@media(max-height:700px) and (min-width:901px){

    .board-panel{
        padding:10px;
    }

    .board-wrap{
        width:min(
            calc(100vh - 120px),
            calc(100vw - 390px)
        );
    }

    .card{
        padding:9px;
    }

    .sidebar{
        gap:7px;
    }

    .moves{
        max-height:130px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="shell">

<!-- ================= BOARD ================= -->

<section class="board-panel">

    <div class="topbar">
        <div class="logo">
            <div class="logo-icon">♞</div>
            <span>Nova Chess</span>
        </div>

        <div class="turn-label" id="turnLabel">
            Your move
        </div>
    </div>

    <div class="board-wrap">
        <div id="board" class="board"></div>
    </div>

    <div class="board-controls">
        <button class="control-btn" id="undoBtn">
            ↶ Undo
        </button>

        <button class="control-btn" id="flipBtn">
            ⇄ Flip
        </button>

        <button class="control-btn" id="soundBtn">
            🔊 Sound
        </button>

        <button class="control-btn" id="resignBtn">
            ⚑ Resign
        </button>
    </div>

</section>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="card">

        <div class="card-title">
            <span>Engine</span>
            <span id="engineVersion">SF 18</span>
        </div>

        <div class="engine-status">
            <span id="statusDot" class="status-dot loading"></span>
            <span id="engineStatus">Starting Stockfish…</span>
        </div>

        <div id="diagnostic" class="diagnostic"></div>

        <div id="thinking" class="thinking">
            <span class="spinner"></span>
            <span>Stockfish is thinking…</span>
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Clock</span>
            <span id="modeLabel">Blitz 5+0</span>
        </div>

        <div class="clocks">

            <div id="blackClock" class="clock">
                <div class="clock-label">BLACK</div>
                <div id="blackTime" class="clock-time">
                    5:00
                </div>
            </div>

            <div id="whiteClock" class="clock active">
                <div class="clock-label">WHITE</div>
                <div id="whiteTime" class="clock-time">
                    5:00
                </div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Evaluation</span>
        </div>

        <div class="eval">
            <div id="evalFill" class="eval-fill"></div>
        </div>

        <div id="evalNumber" class="eval-number">
            +0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Moves</span>
            <span id="moveCount">0</span>
        </div>

        <div id="moves" class="moves">
            <div class="empty">
                No moves yet
            </div>
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Game</span>
        </div>

        <div class="setting">
            <label>Time control</label>

            <select id="modeSelect">

                <option value="60+0">Bullet 1+0</option>
                <option value="120+1">Bullet 2+1</option>

                <option value="300+0" selected>
                    Blitz 5+0
                </option>

                <option value="300+3">
                    Blitz 5+3
                </option>

                <option value="180+2">
                    Blitz 3+2
                </option>

                <option value="600+0">
                    Rapid 10+0
                </option>

                <option value="600+5">
                    Rapid 10+5
                </option>

                <option value="900+10">
                    Rapid 15+10
                </option>

                <option value="1800+0">
                    Classical 30+0
                </option>

            </select>
        </div>


        <div class="setting">

            <label>Difficulty</label>

            <select id="difficultySelect">

                <option value="250">
                    Easy
                </option>

                <option value="700" selected>
                    Medium
                </option>

                <option value="1400">
                    Hard
                </option>

                <option value="2500">
                    Expert
                </option>

            </select>

        </div>


        <div class="setting">

            <label>Board theme</label>

            <select id="themeSelect">

                <option value="classic" selected>
                    Classic
                </option>

                <option value="blue">
                    Blue
                </option>

            </select>

        </div>

    </div>


    <div class="card">

        <div class="actions">

            <button
                id="newGameBtn"
                class="action primary">
                New Game
            </button>

            <button
                id="settingsBtn"
                class="action">
                Settings
            </button>

        </div>

    </div>

</aside>

</div>
</div>


<!-- ================= PROMOTION ================= -->

<div id="promotionOverlay" class="overlay">

    <div class="modal">

        <h2>Choose promotion</h2>

        <p>
            Pick the piece for your pawn.
        </p>

        <div class="promotion-grid">

            <button class="promo" data-piece="q">
                ♕
            </button>

            <button class="promo" data-piece="r">
                ♖
            </button>

            <button class="promo" data-piece="b">
                ♗
            </button>

            <button class="promo" data-piece="n">
                ♘
            </button>

        </div>

    </div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOverOverlay" class="overlay">

    <div class="modal">

        <h2 id="gameOverTitle">
            Game Over
        </h2>

        <p id="gameOverText"></p>

        <button
            id="gameOverNewBtn"
            class="action primary"
            style="width:100%">
            New Game
        </button>

    </div>

</div>


<script>

/* =========================================================
   NOVA CHESS
   ========================================================= */


/* =========================
   GAME
========================= */

let game = new Chess();

let boardEl =
    document.getElementById("board");

let movesEl =
    document.getElementById("moves");

let moveCountEl =
    document.getElementById("moveCount");

let turnLabel =
    document.getElementById("turnLabel");

let engineStatusEl =
    document.getElementById("engineStatus");

let statusDot =
    document.getElementById("statusDot");

let diagnosticEl =
    document.getElementById("diagnostic");

let thinkingEl =
    document.getElementById("thinking");

let evalFill =
    document.getElementById("evalFill");

let evalNumber =
    document.getElementById("evalNumber");

let whiteTimeEl =
    document.getElementById("whiteTime");

let blackTimeEl =
    document.getElementById("blackTime");

let whiteClockEl =
    document.getElementById("whiteClock");

let blackClockEl =
    document.getElementById("blackClock");

let modeLabelEl =
    document.getElementById("modeLabel");


/* =========================
   BOARD
========================= */

const pieceSymbols = {

    w:{
        p:"♙",
        n:"♘",
        b:"♗",
        r:"♖",
        q:"♕",
        k:"♔"
    },

    b:{
        p:"♟",
        n:"♞",
        b:"♝",
        r:"♜",
        q:"♛",
        k:"♚"
    }

};

let orientation = "w";

let selectedSquare = null;

let legalTargets = [];

let lastMove = null;

let squareMap = {};

let pendingPromotion = null;


/* =========================
   ENGINE
========================= */

/*
   IMPORTANT:

   Stockfish.js supports the:

   stockfish.js#stockfish.wasm

   worker path format.

   Both files should be beside index.html:

   index.html
   stockfish-18-lite-single.js
   stockfish-18-lite-single.wasm
*/

const workerURL =
    "./stockfish-18-lite-single.js#./stockfish-18-lite-single.wasm";

let engine = null;

let engineReady = false;

let engineInitializing = false;

let engineThinking = false;

let pendingEngineMove = false;

let engineTimeout = null;

let searchGeneration = 0;

let activeSearchGeneration = null;


/* =========================
   DIFFICULTY
========================= */

let engineThinkTime = 700;


/* =========================
   CLOCK
========================= */

let whiteSeconds = 300;

let blackSeconds = 300;

let incrementSeconds = 0;

let currentTurn = "w";

let clockInterval = null;

let gameStarted = false;

let gameFinished = false;


/* =========================
   SOUND
========================= */

let soundEnabled = true;

let audioContext = null;


/* =========================
   MODE
========================= */

const modeNames = {

    "60+0":"Bullet 1+0",
    "120+1":"Bullet 2+1",

    "300+0":"Blitz 5+0",
    "300+3":"Blitz 5+3",
    "180+2":"Blitz 3+2",

    "600+0":"Rapid 10+0",
    "600+5":"Rapid 10+5",

    "900+10":"Rapid 15+10",

    "1800+0":"Classical 30+0"

};

let currentMode = "300+0";


/* =========================
   BOARD CREATION
========================= */

function createBoard(){

    boardEl.innerHTML = "";

    squareMap = {};

    const fragment =
        document.createDocumentFragment();

    for(let rank=8;rank>=1;rank--){

        for(let file=0;file<8;file++){

            const fileChar =
                String.fromCharCode(97 + file);

            const squareName =
                fileChar + rank;

            const square =
                document.createElement("div");

            square.className =
                "square " +
                (((file + rank) % 2 === 0)
                    ? "light"
                    : "dark");

            square.dataset.square =
                squareName;

            square.addEventListener(
                "click",
                onSquareClick
            );

            const fileCoord =
                document.createElement("span");

            fileCoord.className =
                "coord file";

            fileCoord.textContent =
                fileChar;

            const rankCoord =
                document.createElement("span");

            rankCoord.className =
                "coord rank";

            rankCoord.textContent =
                rank;

            square.appendChild(fileCoord);
            square.appendChild(rankCoord);

            squareMap[squareName] =
                square;

            fragment.appendChild(square);
        }
    }

    boardEl.appendChild(fragment);

    renderBoard();
}


/* =========================
   BOARD RENDER
========================= */

function renderBoard(){

    const fragment =
        document.createDocumentFragment();

    const files =
        orientation === "w"
            ? ["a","b","c","d","e","f","g","h"]
            : ["h","g","f","e","d","c","b","a"];

    const ranks =
        orientation === "w"
            ? [8,7,6,5,4,3,2,1]
            : [1,2,3,4,5,6,7,8];

    Object.values(squareMap).forEach(
        square => {

            square.classList.remove(
                "selected",
                "legal",
                "capture",
                "last",
                "check"
            );

            const oldPiece =
                square.querySelector(".piece");

            if(oldPiece){
                oldPiece.remove();
            }
        }
    );

    const board =
        game.board();

    const pieces = {};

    for(let r=0;r<8;r++){

        for(let f=0;f<8;f++){

            const piece =
                board[r][f];

            if(!piece) continue;

            const square =
                String.fromCharCode(97 + f)
                + (8-r);

            pieces[square] =
                piece;
        }
    }


    for(const rank of ranks){

        for(const file of files){

            const squareName =
                file + rank;

            const square =
                squareMap[squareName];

            fragment.appendChild(square);

            const piece =
                pieces[squareName];

            if(piece){

                const pieceEl =
                    document.createElement("span");

                pieceEl.className =
                    "piece " +
                    (piece.color === "w"
                        ? "white-piece"
                        : "black-piece");

                pieceEl.textContent =
                    pieceSymbols[
                        piece.color
                    ][piece.type];

                square.appendChild(pieceEl);
            }
        }
    }

    boardEl.appendChild(fragment);


    /* selection */

    if(selectedSquare &&
       squareMap[selectedSquare]){

        squareMap[selectedSquare]
            .classList.add("selected");
    }


    /* legal moves */

    legalTargets.forEach(
        target => {

            const square =
                squareMap[target];

            if(!square) return;

            const piece =
                game.get(target);

            square.classList.add(
                piece
                    ? "capture"
                    : "legal"
            );
        }
    );


    /* last move */

    if(lastMove){

        if(squareMap[lastMove.from])
            squareMap[lastMove.from]
                .classList.add("last");

        if(squareMap[lastMove.to])
            squareMap[lastMove.to]
                .classList.add("last");
    }


    /* check */

    const turn =
        game.turn();

    if(game.in_check()){

        game.board().forEach(
            (row,r) => {

                row.forEach(
                    (piece,f) => {

                        if(
                            piece &&
                            piece.type === "k" &&
                            piece.color === turn
                        ){

                            const square =
                                String.fromCharCode(
                                    97 + f
                                ) + (8-r);

                            if(squareMap[square])
                                squareMap[square]
                                    .classList.add("check");
                        }
                    }
                );
            }
        );
    }
}


/* =========================
   PLAYER INPUT
========================= */

function onSquareClick(event){

    if(gameFinished) return;

    if(engineThinking) return;

    if(game.turn() !== "w") return;

    const square =
        event.currentTarget.dataset.square;


    if(selectedSquare){

        if(legalTargets.includes(square)){

            attemptMove(
                selectedSquare,
                square
            );

            return;
        }
    }


    const piece =
        game.get(square);

    if(
        piece &&
        piece.color === game.turn()
    ){

        selectedSquare =
            square;

        legalTargets =
            game.moves({
                square:square,
                verbose:true
            }).map(
                move => move.to
            );

        renderBoard();

        return;
    }


    selectedSquare = null;

    legalTargets = [];

    renderBoard();
}


/* =========================
   MOVE
========================= */

function attemptMove(from,to){

    const piece =
        game.get(from);

    if(!piece) return;


    /* promotion */

    if(
        piece.type === "p" &&
        (
            (piece.color === "w" && to[1] === "8") ||
            (piece.color === "b" && to[1] === "1")
        )
    ){

        pendingPromotion = {
            from:from,
            to:to
        };

        document
            .getElementById("promotionOverlay")
            .classList.add("show");

        return;
    }


    makeMove({
        from:from,
        to:to
    });
}


/* =========================
   MAKE MOVE
========================= */

function makeMove(move){

    const result =
        game.move(move);

    if(!result) return;

    lastMove = {
        from:result.from,
        to:result.to
    };

    selectedSquare = null;
    legalTargets = [];

    playMoveSound(result);

    if(gameStarted === false){
        gameStarted = true;
        startClock();
    }

    currentTurn =
        game.turn();

    renderBoard();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    checkGameState();

    if(!gameFinished &&
       game.turn() === "b"){

        requestEngineMove();
    }
}


/* =========================
   ENGINE START
========================= */

function startEngine(){

    if(engine) return;

    engineInitializing = true;

    setEngineStatus(
        "loading",
        "Starting Stockfish…"
    );

    diagnosticEl.classList.remove("show");

    try{

        engine =
            new Worker(workerURL);

    }catch(error){

        failEngine(
            "The Stockfish worker could not start."
        );

        return;
    }


    engine.onmessage =
        function(event){

            const line =
                String(event.data).trim();

            if(!line) return;


            /* UCI handshake */

            if(line === "uciok"){

                /*
                   DO NOT send:

                   setoption name Threads value 1

                   The lite single-thread build
                   does not need that option.
                */

                engine.postMessage(
                    "setoption name Hash value 16"
                );

                engine.postMessage(
                    "isready"
                );

                return;
            }


            if(line === "readyok"){

                clearTimeout(engineTimeout);

                engineReady = true;

                engineInitializing = false;

                setEngineStatus(
                    "ready",
                    "Stockfish 18 ready"
                );

                if(
                    pendingEngineMove &&
                    game.turn() === "b" &&
                    !gameFinished
                ){

                    pendingEngineMove = false;

                    requestEngineMove();
                }

                return;
            }


            if(line.startsWith("info ")){

                parseEvaluation(line);

                return;
            }


            if(line.startsWith("bestmove ")){

                if(!engineThinking)
                    return;

                const generation =
                    activeSearchGeneration;

                if(
                    generation === null ||
                    generation !== searchGeneration
                ){

                    return;
                }


                const moveText =
                    line.split(/\s+/)[1];

                engineThinking = false;

                activeSearchGeneration = null;

                thinkingEl
                    .classList
                    .remove("show");


                if(
                    !moveText ||
                    moveText === "(none)"
                ){

                    checkGameState();

                    return;
                }


                makeEngineMove(
                    moveText
                );
            }
        };


    engine.onerror =
        function(){

            failEngine(
                "Stockfish could not load. Make sure the JS and WASM files are deployed together."
            );
        };


    engine.onmessageerror =
        function(){

            failEngine(
                "The Stockfish worker stopped responding."
            );
        };


    /*
       If the worker never answers, show
       a useful message instead of staying
       on Loading forever.
    */

    engineTimeout =
        setTimeout(
            function(){

                if(!engineReady){

                    failEngine(
                        "Stockfish timed out while loading. Make sure these 3 files are in the same folder: index.html, stockfish-18-lite-single.js, and stockfish-18-lite-single.wasm."
                    );
                }

            },
            15000
        );


    engine.postMessage("uci");
}


/* =========================
   ENGINE ERROR
========================= */

function failEngine(message){

    clearTimeout(engineTimeout);

    engineReady = false;

    engineInitializing = false;

    engineThinking = false;

    activeSearchGeneration = null;

    thinkingEl
        .classList
        .remove("show");

    setEngineStatus(
        "error",
        "Stockfish unavailable"
    );

    diagnosticEl.textContent =
        message;

    diagnosticEl.classList.add("show");


    if(engine){

        try{
            engine.terminate();
        }catch(e){}

        engine = null;
    }
}


/* =========================
   ENGINE MOVE
========================= */

function requestEngineMove(){

    if(gameFinished) return;

    if(game.turn() !== "b") return;


    if(!engine){

        pendingEngineMove = true;

        startEngine();

        return;
    }


    if(!engineReady){

        pendingEngineMove = true;

        return;
    }


    if(engineThinking) return;


    pendingEngineMove = false;

    engineThinking = true;

    thinkingEl
        .classList
        .add("show");

    setEngineStatus(
        "ready",
        "Stockfish calculating…"
    );


    /*
       Every search gets a generation.

       If a new game happens before Stockfish
       finishes, the old bestmove is ignored.
    */

    const generation =
        ++searchGeneration;

    activeSearchGeneration =
        generation;


    engine.postMessage(
        "position fen " + game.fen()
    );


    /*
       movetime is much more predictable
       than depth on a Chromebook.
    */

    engine.postMessage(
        "go movetime " +
        engineThinkTime
    );
}


/* =========================
   ENGINE MOVE APPLY
========================= */

function makeEngineMove(moveText){

    if(gameFinished) return;

    if(game.turn() !== "b") return;


    const from =
        moveText.slice(0,2);

    const to =
        moveText.slice(2,4);

    const promotion =
        moveText.length >= 5
            ? moveText[4]
            : undefined;


    const move = {
        from:from,
        to:to
    };

    if(promotion)
        move.promotion =
            promotion;


    const result =
        game.move(move);


    if(!result){

        setEngineStatus(
            "error",
            "Engine returned an invalid move"
        );

        return;
    }


    lastMove = {
        from:result.from,
        to:result.to
    };


    currentTurn =
        game.turn();


    playMoveSound(result);

    renderBoard();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    checkGameState();
}


/* =========================
   ENGINE STOP
========================= */

function cancelEngineSearch(){

    searchGeneration++;

    activeSearchGeneration = null;

    engineThinking = false;

    pendingEngineMove = false;

    thinkingEl
        .classList
        .remove("show");

    if(engine){

        try{
            engine.postMessage("stop");
        }catch(e){}
    }
}


/* =========================
   ENGINE STATUS
========================= */

function setEngineStatus(type,text){

    engineStatusEl.textContent =
        text;

    statusDot.className =
        "status-dot " + type;
}


/* =========================
   EVALUATION
========================= */

function parseEvaluation(line){

    if(!engineThinking) return;

    const match =
        line.match(
            /score (cp|mate) (-?\d+)/
        );

    if(!match) return;


    const type =
        match[1];

    const value =
        parseInt(match[2],10);


    let score = 0;


    if(type === "cp"){

        score =
            value / 100;

    }else{

        score =
            value > 0
                ? 10
                : -10;
    }


    /*
       Stockfish score is from side to move.
       Since engine is thinking for Black,
       invert it so positive means White.
    */

    score *= -1;


    score =
        Math.max(
            -10,
            Math.min(10,score)
        );


    const percentage =
        50 + score * 4.5;


    evalFill.style.width =
        percentage + "%";


    evalNumber.textContent =
        (score >= 0 ? "+" : "") +
        score.toFixed(2);
}


/* =========================
   STATIC EVAL
========================= */

function updateEvaluationFromPosition(){

    if(engineThinking) return;

    evalFill.style.width = "50%";

    evalNumber.textContent = "+0.00";
}


/* =========================
   MOVES LIST
========================= */

function updateMoves(){

    const history =
        game.history();

    moveCountEl.textContent =
        history.length;


    if(history.length === 0){

        movesEl.innerHTML =
            '<div class="empty">No moves yet</div>';

        return;
    }


    movesEl.innerHTML = "";


    for(
        let i=0;
        i<history.length;
        i+=2
    ){

        const row =
            document.createElement("div");

        row.className =
            "move-row";


        const number =
            document.createElement("span");

        number.className =
            "move-number";

        number.textContent =
            (Math.floor(i/2)+1) + ".";


        const white =
            document.createElement("span");

        white.className =
            "move";

        white.textContent =
            history[i] || "";


        const black =
            document.createElement("span");

        black.className =
            "move";

        black.textContent =
            history[i+1] || "";


        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        movesEl.appendChild(row);
    }


    movesEl.scrollTop =
        movesEl.scrollHeight;
}


/* =========================
   TURN UI
========================= */

function updateTurnUI(){

    if(gameFinished) return;


    if(game.turn() === "w"){

        turnLabel.textContent =
            "Your move";

    }else{

        turnLabel.textContent =
            engineThinking
                ? "Stockfish thinking…"
                : "Black to move";
    }


    whiteClockEl
        .classList.toggle(
            "active",
            game.turn() === "w"
        );

    blackClockEl
        .classList.toggle(
            "active",
            game.turn() === "b"
        );
}


/* =========================
   GAME STATE
========================= */

function checkGameState(){

    if(game.is_checkmate()){

        finishGame(
            game.turn() === "w"
                ? "Black wins"
                : "White wins",
            "Checkmate."
        );

        return;
    }


    if(game.is_stalemate()){

        finishGame(
            "Draw",
            "Stalemate."
        );

        return;
    }


    if(game.is_insufficient_material()){

        finishGame(
            "Draw",
            "Insufficient material."
        );

        return;
    }


    if(game.is_threefold_repetition()){

        finishGame(
            "Draw",
            "Threefold repetition."
        );

        return;
    }


    if(game.is_draw()){

        finishGame(
            "Draw",
            "The game is drawn."
        );

        return;
    }


    updateTurnUI();
}


/* =========================
   FINISH
========================= */

function finishGame(title,text){

    gameFinished = true;

    cancelEngineSearch();

    stopClock();

    document.getElementById(
        "gameOverTitle"
    ).textContent = title;

    document.getElementById(
        "gameOverText"
    ).textContent = text;

    document.getElementById(
        "gameOverOverlay"
    ).classList.add("show");
}


/* =========================
   CLOCK
========================= */

function parseMode(value){

    const parts =
        value.split("+");

    return {
        initial:
            parseInt(parts[0],10),

        increment:
            parseInt(parts[1],10)
    };
}


function formatTime(seconds){

    seconds =
        Math.max(0,seconds);

    const minutes =
        Math.floor(seconds/60);

    const secs =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(secs).padStart(2,"0")
    );
}


function updateClockUI(){

    whiteTimeEl.textContent =
        formatTime(whiteSeconds);

    blackTimeEl.textContent =
        formatTime(blackSeconds);


    whiteClockEl.classList.toggle(
        "low",
        whiteSeconds <= 10
    );

    blackClockEl.classList.toggle(
        "low",
        blackSeconds <= 10
    );
}


function startClock(){

    if(clockInterval)
        return;


    clockInterval =
        setInterval(
            tickClock,
            1000
        );
}


function stopClock(){

    if(clockInterval){

        clearInterval(clockInterval);

        clockInterval = null;
    }
}


function tickClock(){

    if(!gameStarted) return;

    if(gameFinished) return;


    if(currentTurn === "w"){

        whiteSeconds--;

        if(whiteSeconds <= 0){

            whiteSeconds = 0;

            updateClockUI();

            finishGame(
                "Black wins",
                "White ran out of time."
            );

            return;
        }

    }else{

        blackSeconds--;

        if(blackSeconds <= 0){

            blackSeconds = 0;

            updateClockUI();

            finishGame(
                "White wins",
                "Black ran out of time."
            );

            return;
        }
    }


    updateClockUI();
}


/* =========================
   NEW GAME
========================= */

function newGame(){

    cancelEngineSearch();

    stopClock();

    game = new Chess();

    selectedSquare = null;

    legalTargets = [];

    lastMove = null;

    pendingPromotion = null;

    gameFinished = false;

    gameStarted = false;

    currentTurn = "w";


    const mode =
        parseMode(currentMode);


    whiteSeconds =
        mode.initial;

    blackSeconds =
        mode.initial;

    incrementSeconds =
        mode.increment;


    updateClockUI();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    renderBoard();


    document
        .getElementById("gameOverOverlay")
        .classList.remove("show");


    /*
       Reset engine state safely.

       We don't destroy the worker because
       restarting a WASM engine unnecessarily
       is slow on a Chromebook.
    */

    if(engine){

        engineReady = false;

        setEngineStatus(
            "loading",
            "Resetting Stockfish…"
        );

        try{

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        }catch(error){

            failEngine(
                "Stockfish stopped responding."
            );
        }

    }else{

        startEngine();
    }
}


/* =========================
   UNDO
========================= */

function undoMove(){

    if(gameFinished) return;

    cancelEngineSearch();


    /*
       Undo the player's move and the engine's
       previous move when possible.
    */

    if(game.history().length >= 2){

        game.undo();
        game.undo();

    }else if(game.history().length === 1){

        game.undo();
    }


    lastMove = null;

    selectedSquare = null;

    legalTargets = [];


    /*
       chess.js doesn't store clocks, so return
       to the selected mode's initial clock.
    */

    const mode =
        parseMode(currentMode);

    whiteSeconds =
        mode.initial;

    blackSeconds =
        mode.initial;


    gameStarted =
        game.history().length > 0;

    currentTurn =
        game.turn();


    updateClockUI();

    updateMoves();

    updateTurnUI();

    renderBoard();

    updateEvaluationFromPosition();
}


/* =========================
   FLIP
========================= */

function flipBoard(){

    orientation =
        orientation === "w"
            ? "b"
            : "w";

    renderBoard();
}


/* =========================
   PROMOTION
========================= */

document
    .querySelectorAll(".promo")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    if(!pendingPromotion)
                        return;


                    const promotion =
                        button.dataset.piece;


                    document
                        .getElementById(
                            "promotionOverlay"
                        )
                        .classList
                        .remove("show");


                    makeMove({

                        from:
                            pendingPromotion.from,

                        to:
                            pendingPromotion.to,

                        promotion:
                            promotion
                    });


                    pendingPromotion = null;
                }
            );
        }
    );


/* =========================
   SOUND
========================= */

function playMoveSound(move){

    if(!soundEnabled) return;


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            move.captured
                ? "square"
                : "sine";


        oscillator.frequency.value =
            move.captured
                ? 180
                : 320;


        gain.gain.setValueAtTime(
            0.045,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + .09
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .09
        );

    }catch(error){}
}


/* =========================
   SETTINGS
========================= */

document
    .getElementById("difficultySelect")
    .addEventListener(
        "change",
        function(){

            engineThinkTime =
                parseInt(
                    this.value,
                    10
                );
        }
    );


document
    .getElementById("modeSelect")
    .addEventListener(
        "change",
        function(){

            currentMode =
                this.value;

            modeLabelEl.textContent =
                modeNames[currentMode];

            newGame();
        }
    );


document
    .getElementById("themeSelect")
    .addEventListener(
        "change",
        function(){

            const theme =
                this.value;

            if(theme === "blue"){

                document.documentElement
                    .style.setProperty(
                        "--light",
                        "#dcecff"
                    );

                document.documentElement
                    .style.setProperty(
                        "--dark",
                        "#4f72a4"
                    );

            }else{

                document.documentElement
                    .style.setProperty(
                        "--light",
                        "#e7edf5"
                    );

                document.documentElement
                    .style.setProperty(
                        "--dark",
                        "#61708c"
                    );
            }
        }
    );


/* =========================
   BUTTONS
========================= */

document
    .getElementById("newGameBtn")
    .addEventListener(
        "click",
        newGame
    );


document
    .getElementById("gameOverNewBtn")
    .addEventListener(
        "click",
        newGame
    );


document
    .getElementById("undoBtn")
    .addEventListener(
        "click",
        undoMove
    );


document
    .getElementById("flipBtn")
    .addEventListener(
        "click",
        flipBoard
    );


document
    .getElementById("soundBtn")
    .addEventListener(
        "click",
        function(){

            soundEnabled =
                !soundEnabled;

            this.textContent =
                soundEnabled
                    ? "🔊 Sound"
                    : "🔇 Sound";
        }
    );


document
    .getElementById("resignBtn")
    .addEventListener(
        "click",
        function(){

            if(gameFinished) return;

            finishGame(
                "Black wins",
                "You resigned."
            );
        }
    );


/* =========================
   INITIALIZE
========================= */

createBoard();

updateClockUI();

updateMoves();

updateTurnUI();

startEngine();

</script>
