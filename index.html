<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(70,100,255,.16), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(0,220,255,.10), transparent 30%),
        #070a12;
    color: #f4f7ff;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

button, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1400px, 100%);
    margin: 0 auto;
    padding: 14px;
}

/* HEADER */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #6677ff, #26d9ff);
    color: white;
    font-size: 25px;
    box-shadow: 0 0 28px rgba(76,150,255,.25);
}

.title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .4px;
}

.subtitle {
    font-size: 12px;
    color: #8d97ad;
    margin-top: 2px;
}

.version {
    font-size: 11px;
    color: #7f8ba5;
    padding: 7px 10px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
}

/* LAYOUT */

.layout {
    display: grid;
    grid-template-columns: minmax(400px, 1fr) 330px;
    gap: 14px;
    align-items: start;
}

/* BOARD */

.board-panel {
    background: rgba(13,17,29,.82);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
}

.board-wrap {
    width: min(78vh, 760px, calc(100vw - 390px));
    min-width: 400px;
    max-width: 100%;
    margin: 0 auto;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 18px 50px rgba(0,0,0,.45);
    user-select: none;
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    border: 0;
    padding: 0;
}

.light {
    background: #dce4f0;
}

.dark {
    background: #65748d;
}

.square.last-move {
    box-shadow: inset 0 0 0 999px rgba(255,220,80,.22);
}

.square.selected {
    box-shadow: inset 0 0 0 5px rgba(65,210,255,.85);
}

.square.check {
    box-shadow: inset 0 0 0 999px rgba(255,70,80,.42);
}

.piece {
    position: relative;
    z-index: 2;
    font-family: "DejaVu Sans", "Arial Unicode MS", sans-serif;
    font-size: clamp(31px, 7vw, 70px);
    line-height: 1;
    transform: translateY(-2%);
    text-shadow:
        0 2px 2px rgba(0,0,0,.42),
        0 4px 8px rgba(0,0,0,.22);
}

.white-piece {
    color: #ffffff;
}

.black-piece {
    color: #11151e;
    text-shadow:
        0 2px 1px rgba(255,255,255,.18),
        0 4px 8px rgba(0,0,0,.4);
}

.move-dot {
    position: absolute;
    width: 20%;
    height: 20%;
    border-radius: 50%;
    background: rgba(20,35,50,.34);
    z-index: 1;
}

.capture-ring {
    position: absolute;
    inset: 8%;
    border: 5px solid rgba(25,35,45,.30);
    border-radius: 50%;
    z-index: 1;
}

.coord-file,
.coord-rank {
    position: absolute;
    font-size: 10px;
    font-weight: 700;
    opacity: .72;
    z-index: 3;
}

.coord-file {
    right: 5px;
    bottom: 3px;
}

.coord-rank {
    left: 5px;
    top: 3px;
}

.light .coord-file,
.light .coord-rank {
    color: #59677b;
}

.dark .coord-file,
.dark .coord-rank {
    color: #e3e9f2;
}

/* CLOCKS */

.clock-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.clock {
    background: #111624;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 9px 12px;
}

.clock.active {
    border-color: rgba(77,215,255,.7);
    box-shadow: 0 0 18px rgba(30,190,255,.12);
}

.clock-label {
    color: #8490a7;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.clock-time {
    margin-top: 2px;
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

/* SIDE PANEL */

.side {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card {
    background: rgba(13,17,29,.86);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 13px;
}

.card-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8995ad;
    margin-bottom: 10px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.btn {
    min-height: 40px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    background: #151b2b;
    color: #eef3ff;
    transition: .15s;
}

.btn:hover {
    background: #1c2538;
    transform: translateY(-1px);
}

.btn.primary {
    background: linear-gradient(135deg, #5667ff, #2abde8);
    border: 0;
    font-weight: 800;
}

.btn.danger {
    background: #27151b;
    color: #ff9ba6;
}

.full {
    grid-column: 1 / -1;
}

select {
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    border-radius: 10px;
    background: #151b2b;
    color: white;
    border: 1px solid rgba(255,255,255,.09);
}

/* STATUS */

.engine-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-radius: 10px;
    background: #0b101b;
    border: 1px solid rgba(255,255,255,.07);
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff5264;
    flex: none;
}

.status-dot.ready {
    background: #52e89b;
    box-shadow: 0 0 10px rgba(82,232,155,.6);
}

.status-dot.thinking {
    background: #52c8ff;
    box-shadow: 0 0 12px rgba(82,200,255,.7);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: .35;
    }
}

.status-text {
    font-size: 12px;
    color: #c6cede;
}

/* MOVES */

.moves {
    max-height: 220px;
    overflow-y: auto;
    background: #0a0e17;
    border-radius: 10px;
    padding: 7px;
}

.move-line {
    display: grid;
    grid-template-columns: 35px 1fr 1fr;
    padding: 6px 7px;
    border-radius: 7px;
    font-size: 12px;
}

.move-line:nth-child(even) {
    background: rgba(255,255,255,.025);
}

.move-number {
    color: #6f7a91;
}

.move-san {
    color: #eef3ff;
}

/* DEBUG */

.debug {
    font-family: monospace;
    font-size: 10px;
    line-height: 1.55;
    color: #9eabc2;
    overflow-wrap: anywhere;
}

.debug strong {
    color: #dce5f8;
}

.debug-line {
    margin-bottom: 5px;
}

/* EVAL */

.eval {
    height: 10px;
    background: #0a0e16;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 9px;
}

.eval-fill {
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, #65748d, #e8edf6);
    transition: width .35s ease;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.68);
    z-index: 50;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(390px, 100%);
    background: #111725;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 30px 90px rgba(0,0,0,.5);
}

.modal-title {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 7px;
}

.modal-text {
    color: #9ca8bc;
    font-size: 13px;
    margin-bottom: 15px;
}

.promotion-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.promo {
    min-height: 62px;
    font-size: 36px;
    background: #181f31;
    border: 1px solid rgba(255,255,255,.08);
    color: white;
    border-radius: 10px;
}

/* MOBILE */

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .board-wrap {
        width: min(92vw, 680px);
        min-width: 0;
    }

    .side {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .card {
        min-width: 0;
    }
}

@media (max-width: 560px) {
    .app {
        padding: 8px;
    }

    .title {
        font-size: 18px;
    }

    .version {
        display: none;
    }

    .board-panel {
        padding: 6px;
    }

    .side {
        display: flex;
    }

    .clock-time {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">♞</div>
            <div>
                <div class="title">NOVA CHESS</div>
                <div class="subtitle">Human vs Stockfish</div>
            </div>
        </div>

        <div class="version">ENGINE BUILD • 18</div>
    </header>

    <main class="layout">

        <section class="board-panel">

            <div id="board" class="board"></div>

            <div class="clock-row">

                <div id="whiteClock" class="clock active">
                    <div class="clock-label">White</div>
                    <div id="whiteTime" class="clock-time">05:00</div>
                </div>

                <div id="blackClock" class="clock">
                    <div class="clock-label">Nova</div>
                    <div id="blackTime" class="clock-time">05:00</div>
                </div>

            </div>

        </section>

        <aside class="side">

            <section class="card">

                <div class="card-title">Game</div>

                <div class="controls">
                    <button id="newGameBtn" class="btn primary">
                        New Game
                    </button>

                    <button id="flipBtn" class="btn">
                        Flip Board
                    </button>

                    <select id="difficulty">
                        <option value="5">Beginner</option>
                        <option value="7" selected>Easy</option>
                        <option value="10">Medium</option>
                        <option value="12">Hard</option>
                        <option value="14">Expert</option>
                        <option value="16">Maximum</option>
                    </select>

                    <button id="undoBtn" class="btn">
                        Undo
                    </button>
                </div>

            </section>

            <section class="card">

                <div class="card-title">Stockfish</div>

                <div class="engine-status">
                    <div id="statusDot" class="status-dot"></div>
                    <div id="engineStatus" class="status-text">
                        Starting Stockfish…
                    </div>
                </div>

                <div style="height:8px"></div>

                <button id="testBtn" class="btn full">
                    Test Engine
                </button>

                <div class="eval">
                    <div id="evalFill" class="eval-fill"></div>
                </div>

            </section>

            <section class="card">

                <div class="card-title">Moves</div>

                <div id="moves" class="moves"></div>

            </section>

            <section class="card">

                <div class="card-title">Engine Diagnostics</div>

                <div class="debug">

                    <div class="debug-line">
                        <strong>State:</strong>
                        <span id="debugState">Starting</span>
                    </div>

                    <div class="debug-line">
                        <strong>Last command:</strong>
                        <span id="debugCommand">—</span>
                    </div>

                    <div class="debug-line">
                        <strong>Last output:</strong>
                        <span id="debugOutput">—</span>
                    </div>

                    <div class="debug-line">
                        <strong>Engine:</strong>
                        <span>./stockfish-18-asm.js</span>
                    </div>

                </div>

            </section>

        </aside>

    </main>

</div>

<!-- PROMOTION -->

<div id="promotionModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">Choose Promotion</div>

        <div class="modal-text">
            Select the piece for your pawn promotion.
        </div>

        <div class="promotion-buttons">
            <button class="promo" data-piece="q">♕</button>
            <button class="promo" data-piece="r">♖</button>
            <button class="promo" data-piece="b">♗</button>
            <button class="promo" data-piece="n">♘</button>
        </div>

    </div>

</div>

<!-- GAME OVER -->

<div id="gameOverModal" class="modal">

    <div class="modal-box">

        <div id="gameOverTitle" class="modal-title">
            Game Over
        </div>

        <div id="gameOverText" class="modal-text"></div>

        <button id="gameOverNewBtn" class="btn primary full">
            New Game
        </button>

    </div>

</div>

<script>

/* =========================================================
   NOVA CHESS
   STOCKFISH + CHESS.JS
   ========================================================= */

const ENGINE_FILE = "./stockfish-18-asm.js";

/* -------------------------
   PIECES
   ------------------------- */

const PIECES = {
    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"
};

/* -------------------------
   STATE
   ------------------------- */

let game = new Chess();

let engine = null;

let engineReady = false;
let engineThinking = false;
let engineStarting = false;

let engineTestMode = false;

let selectedSquare = null;
let legalMoves = [];

let lastMove = null;

let flipped = false;

let pendingPromotion = null;

let whiteSeconds = 300;
let blackSeconds = 300;

let clockInterval = null;
let gameStarted = false;
let gameEnded = false;

let lastClockTick = null;

/* -------------------------
   DOM
   ------------------------- */

const boardEl = document.getElementById("board");

const whiteTimeEl = document.getElementById("whiteTime");
const blackTimeEl = document.getElementById("blackTime");

const whiteClockEl = document.getElementById("whiteClock");
const blackClockEl = document.getElementById("blackClock");

const movesEl = document.getElementById("moves");

const engineStatusEl = document.getElementById("engineStatus");
const statusDotEl = document.getElementById("statusDot");

const debugStateEl = document.getElementById("debugState");
const debugCommandEl = document.getElementById("debugCommand");
const debugOutputEl = document.getElementById("debugOutput");

const evalFillEl = document.getElementById("evalFill");

const promotionModal = document.getElementById("promotionModal");
const gameOverModal = document.getElementById("gameOverModal");
const gameOverTitle = document.getElementById("gameOverTitle");
const gameOverText = document.getElementById("gameOverText");

/* =========================================================
   ENGINE STATUS
   ========================================================= */

function setEngineStatus(text, state = "normal") {

    engineStatusEl.textContent = text;

    statusDotEl.className = "status-dot";

    if (state === "ready") {
        statusDotEl.classList.add("ready");
    }

    if (state === "thinking") {
        statusDotEl.classList.add("thinking");
    }

    debugStateEl.textContent = text;
}

function setDebugCommand(command) {
    debugCommandEl.textContent = command || "—";
}

function setDebugOutput(output) {
    debugOutputEl.textContent = output || "—";
}

/* =========================================================
   ENGINE START
   ========================================================= */

function startEngine() {

    if (engine) {
        try {
            engine.terminate();
        } catch (e) {}
    }

    engine = null;
    engineReady = false;
    engineThinking = false;
    engineStarting = true;

    setEngineStatus(
        "Loading Stockfish…",
        "normal"
    );

    setDebugCommand("creating Worker");

    try {

        engine = new Worker(ENGINE_FILE);

    } catch (error) {

        engineStarting = false;

        setEngineStatus(
            "Could not create Stockfish worker.",
            "normal"
        );

        setDebugOutput(
            error.message || String(error)
        );

        return;
    }

    engine.onmessage = function(event) {

        const line = String(event.data || "").trim();

        if (!line) return;

        setDebugOutput(line);

        /* UCI handshake */

        if (line === "uciok") {

            setDebugCommand("isready");

            setEngineStatus(
                "Checking Stockfish…",
                "normal"
            );

            engine.postMessage("isready");

            return;
        }

        if (line === "readyok") {

            engineReady = true;
            engineStarting = false;

            setEngineStatus(
                "Stockfish ready",
                "ready"
            );

            setDebugState("READY");

            return;
        }

        /* Engine move */

        if (line.startsWith("bestmove")) {

            handleBestMove(line);

            return;
        }

    };

    engine.onerror = function(error) {

        engineReady = false;
        engineThinking = false;
        engineStarting = false;

        setEngineStatus(
            "Stockfish ERROR",
            "normal"
        );

        setDebugOutput(
            error.message ||
            "Worker failed to load. Check that stockfish-18-asm.js is beside index.html."
        );
    };

    /* Start UCI */

    setDebugCommand("uci");

    engine.postMessage("uci");

}

/* =========================================================
   ENGINE COMMAND
   ========================================================= */

function sendEngine(command) {

    if (!engine) return;

    setDebugCommand(command);

    try {
        engine.postMessage(command);
    } catch (error) {

        setDebugOutput(
            error.message || String(error)
        );

    }
}

/* =========================================================
   BUILD UCI HISTORY
   ========================================================= */

function buildUciHistory() {

    const history = game.history({
        verbose: true
    });

    return history.map(move => {

        return move.from + move.to +
            (move.promotion ? move.promotion : "");

    }).join(" ");

}

/* =========================================================
   REQUEST STOCKFISH MOVE
   ========================================================= */

function requestEngineMove() {

    if (!engineReady) {

        setEngineStatus(
            "Stockfish is not ready.",
            "normal"
        );

        return;
    }

    if (engineThinking) return;

    if (gameEnded || game.game_over()) return;

    /* Must be Black's turn */

    if (game.turn() !== "b") return;

    engineThinking = true;

    setEngineStatus(
        "Nova is thinking…",
        "thinking"
    );

    const history = buildUciHistory();

    /*
       This is deliberately the simple,
       proven UCI protocol.
    */

    sendEngine("stop");

    sendEngine("ucinewgame");

    let positionCommand = "position startpos";

    if (history) {
        positionCommand += " moves " + history;
    }

    sendEngine(positionCommand);

    const depth =
        parseInt(
            document.getElementById("difficulty").value,
            10
        ) || 7;

    sendEngine("go depth " + depth);

}

/* =========================================================
   HANDLE BESTMOVE
   ========================================================= */

function handleBestMove(line) {

    const parts = line.trim().split(/\s+/);

    const bestMove = parts[1];

    /* Engine test */

    if (engineTestMode) {

        engineTestMode = false;

        engineThinking = false;

        setEngineStatus(
            "Test successful: " + (bestMove || "no move"),
            "ready"
        );

        setDebugState(
            "TEST → " + (bestMove || "none")
        );

        return;
    }

    if (!engineThinking) return;

    engineThinking = false;

    if (!bestMove || bestMove === "(none)") {

        setEngineStatus(
            "Stockfish returned no move.",
            "normal"
        );

        checkGameEnd();

        return;
    }

    setDebugState(
        "BESTMOVE " + bestMove
    );

    /* Validate UCI */

    if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(bestMove)) {

        setEngineStatus(
            "Invalid Stockfish move.",
            "normal"
        );

        return;
    }

    const from = bestMove.substring(0, 2);
    const to = bestMove.substring(2, 4);

    const promotion =
        bestMove.length >= 5
            ? bestMove.substring(4, 5)
            : undefined;

    /*
       Verify the move against chess.js.
       This prevents Stockfish output from
       silently failing.
    */

    const possibleMoves = game.moves({
        verbose: true
    });

    const legal = possibleMoves.find(move => {

        return (
            move.from === from &&
            move.to === to &&
            (
                !move.promotion ||
                move.promotion === promotion
            )
        );

    });

    if (!legal) {

        setEngineStatus(
            "Stockfish returned an illegal move.",
            "normal"
        );

        setDebugOutput(
            "Illegal move: " +
            bestMove +
            " | Turn: " +
            game.turn()
        );

        return;
    }

    const moveObject = {
        from: from,
        to: to
    };

    if (promotion) {
        moveObject.promotion = promotion;
    }

    const result = game.move(moveObject);

    if (!result) {

        setEngineStatus(
            "Could not apply Stockfish move.",
            "normal"
        );

        return;
    }

    lastMove = {
        from: from,
        to: to
    };

    setEngineStatus(
        "Your move",
        "ready"
    );

    renderEverything();

    checkGameEnd();

}

/* =========================================================
   ENGINE TEST
   ========================================================= */

function testEngine() {

    if (!engineReady) {

        setEngineStatus(
            "Stockfish is still loading.",
            "normal"
        );

        return;
    }

    if (engineThinking) {

        setEngineStatus(
            "Stockfish is already thinking.",
            "thinking"
        );

        return;
    }

    engineTestMode = true;

    engineThinking = true;

    setEngineStatus(
        "Testing Stockfish…",
        "thinking"
    );

    sendEngine("stop");

    sendEngine("ucinewgame");

    sendEngine("position startpos");

    sendEngine("go depth 6");
}

/* =========================================================
   BOARD RENDER
   ========================================================= */

function renderBoard() {

    boardEl.innerHTML = "";

    const files = ["a","b","c","d","e","f","g","h"];
    const ranks = ["8","7","6","5","4","3","2","1"];

    const displayFiles =
        flipped
            ? [...files].reverse()
            : files;

    const displayRanks =
        flipped
            ? [...ranks].reverse()
            : ranks;

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const file = displayFiles[col];
            const rank = displayRanks[row];

            const squareName = file + rank;

            const squareEl =
                document.createElement("button");

            squareEl.className = "square";

            const fileIndex =
                files.indexOf(file);

            const rankNumber =
                parseInt(rank, 10);

            const isLight =
                (fileIndex + rankNumber) % 2 === 0;

            squareEl.classList.add(
                isLight ? "light" : "dark"
            );

            if (
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ) {
                squareEl.classList.add("last-move");
            }

            if (selectedSquare === squareName) {
                squareEl.classList.add("selected");
            }

            /* Check square */

            if (game.in_check()) {

                const kingColor = game.turn();

                const piece = game.get(squareName);

                if (
                    piece &&
                    piece.type === "k" &&
                    piece.color === kingColor
                ) {
                    squareEl.classList.add("check");
                }
            }

            /* Legal move indicator */

            const legal =
                legalMoves.find(
                    move => move.to === squareName
                );

            if (legal) {

                if (game.get(squareName)) {

                    const ring =
                        document.createElement("div");

                    ring.className = "capture-ring";

                    squareEl.appendChild(ring);

                } else {

                    const dot =
                        document.createElement("div");

                    dot.className = "move-dot";

                    squareEl.appendChild(dot);

                }
            }

            const piece =
                game.get(squareName);

            if (piece) {

                const pieceEl =
                    document.createElement("div");

                pieceEl.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );

                pieceEl.textContent =
                    PIECES[
                        piece.color + piece.type
                    ];

                squareEl.appendChild(pieceEl);
            }

            /* Coordinates */

            if (
                (!flipped && row === 7) ||
                (flipped && row === 7)
            ) {

                const coord =
                    document.createElement("span");

                coord.className = "coord-file";
                coord.textContent = file;

                squareEl.appendChild(coord);
            }

            if (col === 0) {

                const coord =
                    document.createElement("span");

                coord.className = "coord-rank";
                coord.textContent = rank;

                squareEl.appendChild(coord);
            }

            squareEl.addEventListener(
                "click",
                () => handleSquareClick(squareName)
            );

            boardEl.appendChild(squareEl);
        }
    }
}

/* =========================================================
   SQUARE CLICK
   ========================================================= */

function handleSquareClick(square) {

    if (gameEnded) return;

    /*
       User is White.
       Never allow the player to move Black pieces.
    */

    if (game.turn() !== "w") return;

    if (engineThinking) return;

    const piece = game.get(square);

    /* Select a piece */

    if (!selectedSquare) {

        if (
            piece &&
            piece.color === "w"
        ) {

            selectedSquare = square;

            legalMoves =
                game.moves({
                    square: square,
                    verbose: true
                });

            renderBoard();
        }

        return;
    }

    /* Clicking selected square again */

    if (square === selectedSquare) {

        selectedSquare = null;
        legalMoves = [];

        renderBoard();

        return;
    }

    /* Another own piece */

    if (
        piece &&
        piece.color === "w"
    ) {

        selectedSquare = square;

        legalMoves =
            game.moves({
                square: square,
                verbose: true
            });

        renderBoard();

        return;
    }

    /* Is destination legal? */

    const move =
        legalMoves.find(
            m => m.to === square
        );

    if (!move) {

        selectedSquare = null;
        legalMoves = [];

        renderBoard();

        return;
    }

    /* Promotion */

    if (
        move.promotion === "q" ||
        move.promotion === "r" ||
        move.promotion === "b" ||
        move.promotion === "n"
    ) {

        pendingPromotion = {
            from: selectedSquare,
            to: square
        };

        promotionModal.classList.add("show");

        return;
    }

    makePlayerMove(
        selectedSquare,
        square
    );
}

/* =========================================================
   PLAYER MOVE
   ========================================================= */

function makePlayerMove(
    from,
    to,
    promotion = undefined
) {

    const moveObject = {
        from: from,
        to: to
    };

    if (promotion) {
        moveObject.promotion = promotion;
    }

    const result =
        game.move(moveObject);

    if (!result) {

        selectedSquare = null;
        legalMoves = [];

        renderBoard();

        return;
    }

    lastMove = {
        from: from,
        to: to
    };

    selectedSquare = null;
    legalMoves = [];

    /* Start clock on first actual move */

    if (!gameStarted) {
        gameStarted = true;
        startClock();
    }

    renderEverything();

    /* Check whether game ended */

    if (checkGameEnd()) return;

    /*
       It is now Black's turn.
       Stockfish gets the move.
    */

    requestEngineMove();
}

/* =========================================================
   PROMOTION
   ========================================================= */

document.querySelectorAll(".promo").forEach(button => {

    button.addEventListener("click", () => {

        if (!pendingPromotion) return;

        const promotion =
            button.dataset.piece;

        const from =
            pendingPromotion.from;

        const to =
            pendingPromotion.to;

        pendingPromotion = null;

        promotionModal.classList.remove("show");

        makePlayerMove(
            from,
            to,
            promotion
        );
    });

});

/* =========================================================
   MOVE LIST
   ========================================================= */

function renderMoves() {

    movesEl.innerHTML = "";

    const history =
        game.history();

    for (
        let i = 0;
        i < history.length;
        i += 2
    ) {

        const line =
            document.createElement("div");

        line.className = "move-line";

        const number =
            document.createElement("span");

        number.className = "move-number";

        number.textContent =
            (i / 2 + 1) + ".";

        const white =
            document.createElement("span");

        white.className = "move-san";

        white.textContent =
            history[i] || "";

        const black =
            document.createElement("span");

        black.className = "move-san";

        black.textContent =
            history[i + 1] || "";

        line.appendChild(number);
        line.appendChild(white);
        line.appendChild(black);

        movesEl.appendChild(line);
    }

    movesEl.scrollTop =
        movesEl.scrollHeight;
}

/* =========================================================
   CLOCK
   ========================================================= */

function formatTime(seconds) {

    seconds = Math.max(
        0,
        Math.ceil(seconds)
    );

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}

function updateClockDisplay() {

    whiteTimeEl.textContent =
        formatTime(whiteSeconds);

    blackTimeEl.textContent =
        formatTime(blackSeconds);

    whiteClockEl.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameEnded
    );

    blackClockEl.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameEnded
    );
}

function startClock() {

    if (clockInterval) return;

    lastClockTick = performance.now();

    clockInterval =
        setInterval(() => {

            if (!gameStarted || gameEnded) {
                return;
            }

            const now =
                performance.now();

            const elapsed =
                (now - lastClockTick) / 1000;

            lastClockTick = now;

            /*
               IMPORTANT:
               We subtract from whoever's turn it is.

               During Stockfish thinking,
               game.turn() is Black,
               so Black's clock runs.
            */

            if (game.turn() === "w") {

                whiteSeconds -= elapsed;

                if (whiteSeconds <= 0) {

                    whiteSeconds = 0;

                    endByTime("Black wins on time.");

                }

            } else {

                blackSeconds -= elapsed;

                if (blackSeconds <= 0) {

                    blackSeconds = 0;

                    endByTime("White wins on time.");

                }
            }

            updateClockDisplay();

        }, 100);

}

function stopClock() {

    if (clockInterval) {

        clearInterval(clockInterval);

        clockInterval = null;
    }
}

/* =========================================================
   GAME END
   ========================================================= */

function endByTime(message) {

    if (gameEnded) return;

    gameEnded = true;

    engineThinking = false;

    stopClock();

    showGameOver(
        "Time!",
        message
    );
}

function checkGameEnd() {

    if (game.is_checkmate()) {

        gameEnded = true;

        stopClock();

        engineThinking = false;

        const winner =
            game.turn() === "w"
                ? "Nova wins by checkmate."
                : "You win by checkmate!";

        showGameOver(
            "Checkmate",
            winner
        );

        return true;
    }

    if (game.is_stalemate()) {

        gameEnded = true;

        stopClock();

        engineThinking = false;

        showGameOver(
            "Stalemate",
            "The game ends in a draw."
        );

        return true;
    }

    if (game.is_insufficient_material()) {

        gameEnded = true;

        stopClock();

        engineThinking = false;

        showGameOver(
            "Draw",
            "There is insufficient material to checkmate."
        );

        return true;
    }

    if (game.in_threefold_repetition()) {

        gameEnded = true;

        stopClock();

        engineThinking = false;

        showGameOver(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }

    if (game.is_draw_by_fifty_moves()) {

        gameEnded = true;

        stopClock();

        engineThinking = false;

        showGameOver(
            "Draw",
            "The fifty-move rule has been reached."
        );

        return true;
    }

    return false;
}

/* =========================================================
   GAME OVER MODAL
   ========================================================= */

function showGameOver(title, text) {

    gameOverTitle.textContent = title;
    gameOverText.textContent = text;

    gameOverModal.classList.add("show");

    updateClockDisplay();
}

/* =========================================================
   NEW GAME
   ========================================================= */

function newGame() {

    /* Stop old search */

    if (engine) {
        try {
            engine.postMessage("stop");
        } catch (e) {}
    }

    game = new Chess();

    selectedSquare = null;
    legalMoves = [];
    lastMove = null;

    engineThinking = false;
    engineTestMode = false;

    gameStarted = false;
    gameEnded = false;

    whiteSeconds = 300;
    blackSeconds = 300;

    stopClock();

    promotionModal.classList.remove("show");
    gameOverModal.classList.remove("show");

    updateClockDisplay();

    renderEverything();

    setEngineStatus(
        engineReady
            ? "Stockfish ready"
            : "Loading Stockfish…",
        engineReady
            ? "ready"
            : "normal"
    );

    /*
       Reset Stockfish's internal position.
    */

    if (engineReady) {

        sendEngine("stop");
        sendEngine("ucinewgame");
        sendEngine("isready");
    }
}

/* =========================================================
   UNDO
   ========================================================= */

function undoMove() {

    if (engineThinking) return;

    if (game.history().length === 0) return;

    /*
       Undo Nova's move first,
       then undo the player's move.
    */

    if (game.history().length >= 2) {
        game.undo();
    }

    game.undo();

    selectedSquare = null;
    legalMoves = [];

    const history =
        game.history({
            verbose: true
        });

    if (history.length) {

        const last =
            history[history.length - 1];

        lastMove = {
            from: last.from,
            to: last.to
        };

    } else {

        lastMove = null;
    }

    gameEnded = false;

    gameOverModal.classList.remove("show");

    renderEverything();

    if (
        gameStarted &&
        !clockInterval
    ) {
        startClock();
    }
}

/* =========================================================
   FLIP BOARD
   ========================================================= */

function flipBoard() {

    flipped = !flipped;

    renderBoard();
}

/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderEverything() {

    renderBoard();
    renderMoves();
    updateClockDisplay();

}

/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById("newGameBtn")
    .addEventListener(
        "click",
        newGame
    );

document
    .getElementById("gameOverNewBtn")
    .addEventListener(
        "click",
        newGame
    );

document
    .getElementById("flipBtn")
    .addEventListener(
        "click",
        flipBoard
    );

document
    .getElementById("undoBtn")
    .addEventListener(
        "click",
        undoMove
    );

document
    .getElementById("testBtn")
    .addEventListener(
        "click",
        testEngine
    );

/* =========================================================
   START
   ========================================================= */

renderEverything();

startEngine();

</script>
