<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>Nova Chess</title>

<!--
============================================================
NOVA CHESS
============================================================

FILES REQUIRED:

    index.html
    stockfish-18-asm.js

Both files MUST be in the same folder.

This version uses the ASM-JS Stockfish worker directly.

============================================================
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root {

  --bg: #070a10;
  --bg2: #0b1019;

  --panel: rgba(18, 24, 35, .92);
  --panel2: rgba(24, 31, 45, .95);

  --line: rgba(255,255,255,.09);

  --text: #f5f7fb;
  --muted: #8f9aab;

  --accent: #65a8ff;
  --accent2: #8b6cff;

  --good: #49d98a;
  --bad: #ff6262;
  --warning: #ffc85a;

  --light-square: #dce5ee;
  --dark-square: #536d89;

  --board-size:
    min(
      590px,
      calc(100vh - 160px),
      calc(100vw - 350px)
    );
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  min-height: 100%;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(77,130,255,.14),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(130,75,255,.11),
      transparent 32%
    ),

    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* =========================================================
   APP
   ========================================================= */

.app {

  min-height: 100vh;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  height: 58px;
  flex: 0 0 58px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  border-bottom:
    1px solid var(--line);

  background:
    rgba(7,10,16,.84);

  backdrop-filter:
    blur(18px);

  position: relative;
  z-index: 20;
}


.logo {

  display: flex;
  align-items: center;

  gap: 10px;

  font-size: 19px;
  font-weight: 800;

  letter-spacing: -.5px;
}


.logo-icon {

  width: 34px;
  height: 34px;

  display: grid;
  place-items: center;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 0 24px rgba(100,160,255,.22);

  font-size: 20px;
}


.version {

  color: var(--muted);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: .8px;

  margin-left: 3px;
}


/* =========================================================
   ENGINE PILL
   ========================================================= */

.engine-pill {

  display: flex;
  align-items: center;

  gap: 8px;

  padding: 7px 11px;

  border:
    1px solid var(--line);

  border-radius: 999px;

  background:
    rgba(255,255,255,.035);

  font-size: 12px;
  font-weight: 700;

  color: var(--muted);
}


.engine-dot {

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: var(--warning);

  box-shadow:
    0 0 10px rgba(255,200,90,.5);
}


.engine-pill.ready {

  color: var(--good);

  border-color:
    rgba(73,217,138,.22);
}


.engine-pill.ready .engine-dot {

  background: var(--good);

  box-shadow:
    0 0 12px rgba(73,217,138,.65);
}


.engine-pill.thinking {

  color: var(--accent);

  border-color:
    rgba(101,168,255,.25);
}


.engine-pill.thinking .engine-dot {

  background: var(--accent);

  animation:
    pulse 1s infinite;
}


.engine-pill.error {

  color: var(--bad);

  border-color:
    rgba(255,98,98,.3);
}


.engine-pill.error .engine-dot {

  background: var(--bad);

  box-shadow:
    0 0 12px rgba(255,98,98,.6);
}


@keyframes pulse {

  0% {
    opacity: .35;
    transform: scale(.85);
  }

  50% {
    opacity: 1;
    transform: scale(1.15);
  }

  100% {
    opacity: .35;
    transform: scale(.85);
  }

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

  flex: 1;

  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    285px;

  gap: 16px;

  padding: 12px 16px 14px;

  align-items: start;
}


/* =========================================================
   BOARD AREA
   ========================================================= */

.board-area {

  min-width: 0;

  display: flex;

  justify-content: center;
}


.board-column {

  width:
    var(--board-size);

  max-width: 100%;
}


.player-strip {

  height: 38px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 4px;

  margin-bottom: 7px;
}


.player-name {

  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 13px;
  font-weight: 700;
}


.player-piece {

  width: 25px;
  height: 25px;

  display: grid;
  place-items: center;

  border-radius: 7px;

  background:
    rgba(255,255,255,.06);

  font-size: 17px;
}


.clock {

  min-width: 65px;

  padding: 5px 9px;

  border-radius: 8px;

  background:
    rgba(255,255,255,.055);

  color: var(--muted);

  text-align: center;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size: 14px;
  font-weight: 800;
}


.clock.active {

  color: var(--text);

  background:
    rgba(101,168,255,.13);

  box-shadow:
    0 0 0 1px
    rgba(101,168,255,.16);
}


/* =========================================================
   BOARD SHELL
   ========================================================= */

.board-shell {

  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  border-radius: 10px;

  padding: 5px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 18px 55px rgba(0,0,0,.42),
    0 0 0 1px rgba(255,255,255,.06);
}


#board {

  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    repeat(8,1fr);

  grid-template-rows:
    repeat(8,1fr);

  overflow: hidden;

  border-radius: 6px;
}


/* =========================================================
   SQUARES
   ========================================================= */

.square {

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  user-select: none;

  cursor: pointer;

  transition:
    filter .08s ease;
}


.square.light {
  background: var(--light-square);
}


.square.dark {
  background: var(--dark-square);
}


.square:hover {
  filter: brightness(1.06);
}


/* =========================================================
   LAST MOVE
   ========================================================= */

.square.last-move {

  box-shadow:
    inset 0 0 0 999px
    rgba(255,205,70,.25);
}


/* =========================================================
   CHECK
   ========================================================= */

.square.check {

  box-shadow:
    inset 0 0 0 999px
    rgba(255,60,60,.42);

  animation:
    checkFlash .45s ease;
}


@keyframes checkFlash {

  0% {
    filter: brightness(1.35);
  }

  100% {
    filter: brightness(1);
  }

}


/* =========================================================
   PIECES
   ========================================================= */

.piece {

  position: relative;

  z-index: 3;

  font-family:
    "Arial Unicode MS",
    "Noto Sans Symbols 2",
    "Segoe UI Symbol",
    sans-serif;

  font-size:
    clamp(30px, 6.5vw, 53px);

  line-height: 1;

  transform:
    translateY(-1px);

  cursor: pointer;

  pointer-events: none;

  user-select: none;
}


/*
White pieces get a subtle shadow.
Black pieces remain dark but readable.
*/

.piece.white {

  color: #ffffff;

  text-shadow:
    0 2px 0 rgba(0,0,0,.38),
    0 4px 8px rgba(0,0,0,.25);
}


.piece.black {

  color: #202633;

  text-shadow:
    0 1px 0 rgba(255,255,255,.2),
    0 3px 5px rgba(0,0,0,.35);
}


/* =========================================================
   MOVE DOT
   ========================================================= */

.move-dot {

  position: absolute;

  width: 18%;
  height: 18%;

  border-radius: 50%;

  background:
    rgba(30,40,55,.42);

  z-index: 2;

  pointer-events: none;
}


/* =========================================================
   CAPTURE RING
   ========================================================= */

.capture-ring {

  position: absolute;

  inset: 10%;

  border:
    5px solid
    rgba(35,45,60,.42);

  border-radius: 50%;

  z-index: 2;

  pointer-events: none;
}


/* =========================================================
   BOARD LABELS
   ========================================================= */

.coord-file,
.coord-rank {

  position: absolute;

  font-size: 9px;
  font-weight: 800;

  opacity: .75;

  pointer-events: none;
}


.coord-file {
  right: 3px;
  bottom: 2px;
}


.coord-rank {
  left: 3px;
  top: 2px;
}


.square.light .coord-file,
.square.light .coord-rank {

  color:
    rgba(50,65,80,.7);
}


.square.dark .coord-file,
.square.dark .coord-rank {

  color:
    rgba(240,245,250,.72);
}


/* =========================================================
   THINKING OVERLAY
   ========================================================= */

.thinking-overlay {

  position: absolute;

  inset: 5px;

  display: none;

  align-items: flex-end;
  justify-content: center;

  padding-bottom: 14px;

  pointer-events: none;

  z-index: 10;
}


.thinking-overlay.show {
  display: flex;
}


.thinking-card {

  display: flex;
  align-items: center;

  gap: 9px;

  padding: 8px 12px;

  border:
    1px solid rgba(101,168,255,.2);

  border-radius: 999px;

  background:
    rgba(8,12,20,.86);

  backdrop-filter:
    blur(10px);

  font-size: 11px;
  font-weight: 700;

  box-shadow:
    0 7px 25px rgba(0,0,0,.35);
}


.spinner {

  width: 12px;
  height: 12px;

  border:
    2px solid rgba(255,255,255,.18);

  border-top-color:
    var(--accent);

  border-radius: 50%;

  animation:
    spin .7s linear infinite;
}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls {

  display: grid;

  grid-template-columns:
    1.4fr
    1fr
    1fr
    1fr;

  gap: 7px;

  margin-top: 9px;
}


button,
select {

  font: inherit;
}


.controls button,
.test-button {

  min-height: 34px;

  border:
    1px solid var(--line);

  border-radius: 8px;

  background:
    rgba(255,255,255,.045);

  color: var(--text);

  font-size: 11px;
  font-weight: 800;

  cursor: pointer;

  transition:
    background .12s ease,
    transform .12s ease,
    border-color .12s ease;
}


.controls button:hover,
.test-button:hover {

  background:
    rgba(255,255,255,.085);

  border-color:
    rgba(255,255,255,.15);
}


.controls button:active,
.test-button:active {

  transform:
    scale(.97);
}


.controls button.primary {

  background:
    linear-gradient(
      135deg,
      rgba(101,168,255,.22),
      rgba(139,108,255,.2)
    );

  border-color:
    rgba(101,168,255,.25);
}


.controls button.danger {

  color:
    #ff8b8b;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

  display: flex;

  flex-direction: column;

  gap: 10px;

  min-width: 0;
}


/* =========================================================
   CARD
   ========================================================= */

.card {

  border:
    1px solid var(--line);

  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      rgba(23,29,42,.95),
      rgba(15,20,30,.95)
    );

  box-shadow:
    0 8px 30px rgba(0,0,0,.18);

  overflow: hidden;
}


.card-header {

  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 9px 12px;

  border-bottom:
    1px solid var(--line);

  font-size: 12px;
  font-weight: 800;
}


.card-header span:last-child {

  color: var(--muted);

  font-size: 10px;
}


.card-body {

  padding: 11px 12px;
}


/* =========================================================
   EVALUATION
   ========================================================= */

.eval-wrap {

  display: flex;

  gap: 11px;
}


.eval-bar {

  width: 25px;

  height: 106px;

  border-radius: 6px;

  overflow: hidden;

  background:
    #202632;

  position: relative;
}


.eval-fill {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 50%;

  background:
    #f2f4f7;

  transition:
    height .3s ease;
}


.eval-info {

  min-width: 0;

  display: flex;
  flex-direction: column;

  justify-content: center;
}


.eval-number {

  font-size: 25px;

  font-weight: 900;

  letter-spacing: -1px;
}


.eval-label {

  margin-top: 3px;

  color: var(--muted);

  font-size: 10px;

  line-height: 1.35;
}


/* =========================================================
   MOVES
   ========================================================= */

.moves {

  max-height: 175px;

  overflow-y: auto;

  scrollbar-width: thin;
}


.empty {

  padding: 10px 2px;

  color: var(--muted);

  font-size: 11px;
}


.move-row {

  display: grid;

  grid-template-columns:
    32px
    1fr
    1fr;

  min-height: 27px;

  align-items: center;

  border-radius: 6px;

  font-size: 11px;
}


.move-row:nth-child(even) {

  background:
    rgba(255,255,255,.025);
}


.move-number {

  padding-left: 4px;

  color: var(--muted);

  font-size: 10px;
}


.move {

  padding: 5px 6px;

  border-radius: 5px;

  font-weight: 700;
}


.move.current {

  background:
    rgba(101,168,255,.15);

  color:
    #cfe3ff;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.setting {

  display: grid;

  grid-template-columns:
    1fr
    125px;

  align-items: center;

  gap: 10px;

  margin-bottom: 9px;
}


.setting:last-child {
  margin-bottom: 0;
}


.setting label {

  color: var(--muted);

  font-size: 11px;
  font-weight: 700;
}


.setting select {

  width: 100%;

  height: 32px;

  padding: 0 8px;

  border:
    1px solid var(--line);

  border-radius: 7px;

  background:
    #151c29;

  color: var(--text);

  outline: none;

  font-size: 11px;
  font-weight: 700;
}


/* =========================================================
   ENGINE STATUS
   ========================================================= */

.status {

  color: var(--muted);

  font-size: 11px;

  line-height: 1.45;

  overflow-wrap: anywhere;
}


.status.good {
  color: var(--good);
}


.status.bad {
  color: var(--bad);
}


/* =========================================================
   ENGINE DEBUG
   ========================================================= */

.engine-debug {

  margin-top: 9px;

  padding: 8px;

  border:
    1px solid var(--line);

  border-radius: 8px;

  background:
    rgba(0,0,0,.16);

  font-size: 9px;

  line-height: 1.3;
}


.engine-debug-row {

  display: grid;

  grid-template-columns:
    65px
    1fr;

  gap: 7px;

  margin: 4px 0;
}


.engine-debug-row span {

  color: var(--muted);
}


.engine-debug-row b {

  color: var(--text);

  font-weight: 600;

  overflow-wrap: anywhere;
}


/* =========================================================
   TEST BUTTON
   ========================================================= */

.test-button {

  width: 100%;

  margin-top: 9px;

  min-height: 31px;

  color:
    #cfe3ff;

  border-color:
    rgba(101,168,255,.2);
}


/* =========================================================
   PROMOTION MODAL
   ========================================================= */

.modal {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(0,0,0,.65);

  backdrop-filter:
    blur(7px);

  z-index: 100;
}


.modal.show {
  display: flex;
}


.modal-card {

  width: min(320px,100%);

  padding: 20px;

  border:
    1px solid var(--line);

  border-radius: 15px;

  background:
    #131a27;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55);

  text-align: center;
}


.modal-title {

  font-size: 18px;
  font-weight: 900;
}


.modal-text {

  margin-top: 6px;

  color: var(--muted);

  font-size: 11px;
}


.promotion-buttons {

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 8px;

  margin-top: 16px;
}


.promotion-buttons button {

  height: 58px;

  border:
    1px solid var(--line);

  border-radius: 9px;

  background:
    rgba(255,255,255,.045);

  color: white;

  font-size: 32px;

  cursor: pointer;
}


.promotion-buttons button:hover {

  background:
    rgba(101,168,255,.13);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 820px) {

  :root {

    --board-size:
      min(
        calc(100vw - 24px),
        calc(100vh - 210px),
        620px
      );
  }


  .topbar {

    height: 54px;
    flex-basis: 54px;

    padding: 0 11px;
  }


  .main {

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
      9px 10px 18px;

    gap: 12px;
  }


  .board-area,
  .board-column {

    width: 100%;

    max-width:
      var(--board-size);
  }


  .sidebar {

    width: 100%;

    max-width:
      var(--board-size);
  }


  .controls {

    grid-template-columns:
      repeat(2,1fr);
  }


  .moves {

    max-height: 180px;
  }
}


/* =========================================================
   SHORT CHROMEBOOK SCREEN
   ========================================================= */

@media
(max-height: 720px)
and (min-width: 821px) {

  :root {

    --board-size:
      min(
        540px,
        calc(100vh - 142px),
        calc(100vw - 335px)
      );
  }


  .topbar {

    height: 52px;
    flex-basis: 52px;
  }


  .main {

    padding:
      7px 12px 9px;

    gap: 12px;
  }


  .player-strip {

    height: 32px;

    margin-bottom: 4px;
  }


  .controls {

    margin-top: 5px;
  }


  .card-header {

    min-height: 32px;

    padding:
      7px 10px;
  }


  .card-body {

    padding:
      8px 10px;
  }


  .eval-bar {

    height: 82px;
  }


  .moves {

    max-height: 125px;
  }


  .engine-debug {

    margin-top: 5px;

    padding: 5px;
  }


  .engine-debug-row {

    margin: 2px 0;
  }


  .test-button {

    margin-top: 5px;
  }
}


/* =========================================================
   VERY SHORT SCREEN
   ========================================================= */

@media (max-height: 650px) {

  :root {

    --board-size:
      min(
        485px,
        calc(100vh - 125px),
        calc(100vw - 330px)
      );
  }


  .topbar {

    height: 48px;
    flex-basis: 48px;
  }


  .logo {

    font-size: 17px;
  }


  .logo-icon {

    width: 29px;
    height: 29px;

    font-size: 17px;
  }


  .player-strip {

    height: 27px;
  }


  .clock {

    padding: 3px 7px;

    font-size: 12px;
  }


  .controls button {

    min-height: 29px;

    font-size: 10px;
  }
}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     TOP BAR
     ======================================================= -->

<header class="topbar">

  <div class="logo">

    <div class="logo-icon">
      ♞
    </div>

    <span>
      Nova Chess
    </span>

    <span class="version">
      V3.1
    </span>

  </div>


  <div
    id="enginePill"
    class="engine-pill"
  >

    <span class="engine-dot"></span>

    <span id="engineText">
      Starting Stockfish…
    </span>

  </div>

</header>



<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="main">


<!-- =======================================================
     BOARD
     ======================================================= -->

<section class="board-area">

<div class="board-column">


<!-- BLACK -->

<div class="player-strip">

  <div class="player-name">

    <span class="player-piece">
      ♟
    </span>

    <span>
      Nova Engine
    </span>

  </div>


  <div
    id="blackClock"
    class="clock"
  >
    5:00
  </div>

</div>



<!-- BOARD -->

<div class="board-shell">

  <div id="board"></div>


  <div
    id="thinkingOverlay"
    class="thinking-overlay"
  >

    <div class="thinking-card">

      <span class="spinner"></span>

      <span>
        Nova is thinking…
      </span>

    </div>

  </div>

</div>



<!-- WHITE -->

<div
  class="player-strip"
  style="
    margin-top:7px;
    margin-bottom:0;
  "
>

  <div class="player-name">

    <span class="player-piece">
      ♙

<script>

"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const ENGINE_FILE =
  "./stockfish-18-asm.js";


/* =========================================================
   ENGINE VARIABLES
   ========================================================= */

let engine = null;

let engineReady = false;

let engineStarting = false;

let engineThinking = false;

let engineTesting = false;

let engineSearchId = 0;

let engineStartTimer = null;

let engineMoveTimer = null;

let engineTestTimer = null;

let engineLastCommand = "";

let engineLastOutput = "";


/* =========================================================
   CHESS
   ========================================================= */

let game =
  new Chess();

let selectedSquare =
  null;

let legalTargets =
  [];

let flipped =
  false;

let pendingPromotion =
  null;

let lastMove =
  null;


/* =========================================================
   CLOCK
   ========================================================= */

let initialSeconds =
  300;

let whiteSeconds =
  300;

let blackSeconds =
  300;

let incrementSeconds =
  0;

let clockTimer =
  null;

let gameStarted =
  false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const boardElement =
  document.getElementById("board");

const enginePill =
  document.getElementById("enginePill");

const engineText =
  document.getElementById("engineText");

const engineStatus =
  document.getElementById("engineStatus");

const thinkingOverlay =
  document.getElementById("thinkingOverlay");

const whiteClock =
  document.getElementById("whiteClock");

const blackClock =
  document.getElementById("blackClock");

const movesElement =
  document.getElementById("moves");

const moveCount =
  document.getElementById("moveCount");

const evalNumber =
  document.getElementById("evalNumber");

const evalLabel =
  document.getElementById("evalLabel");

const evalFill =
  document.getElementById("evalFill");

const depthLabel =
  document.getElementById("depthLabel");

const difficulty =
  document.getElementById("difficulty");

const timeControl =
  document.getElementById("timeControl");

const promotionModal =
  document.getElementById("promotionModal");

const engineDebug =
  document.getElementById("engineDebug");

const testEngineBtn =
  document.getElementById("testEngineBtn");


/* =========================================================
   PIECES
   ========================================================= */

const PIECES = {

  w: {
    p: "♙",
    n: "♘",
    b: "♗",
    r: "♖",
    q: "♕",
    k: "♔"
  },

  b: {
    p: "♟",
    n: "♞",
    b: "♝",
    r: "♜",
    q: "♛",
    k: "♚"
  }

};


/* =========================================================
   FILE / RANK ARRAYS
   ========================================================= */

const FILES =
  ["a","b","c","d","e","f","g","h"];

const RANKS =
  ["8","7","6","5","4","3","2","1"];


/* =========================================================
   ENGINE UI
   ========================================================= */

function updateEngineDebug() {

  if (!engineDebug) {
    return;
  }

  const rows =
    engineDebug.querySelectorAll(
      ".engine-debug-row"
    );

  if (rows[0]) {

    rows[0]
      .querySelector("b")
      .textContent =
      engineText.textContent || "—";
  }

  if (rows[1]) {

    rows[1]
      .querySelector("b")
      .textContent =
      engineLastCommand || "—";
  }

  if (rows[2]) {

    rows[2]
      .querySelector("b")
      .textContent =
      engineLastOutput || "—";
  }

}


function setEngineStatus(
  text,
  type = ""
) {

  engineText.textContent =
    text;

  engineStatus.textContent =
    text;

  engineStatus.className =
    "status " +
    (
      type === "ready"
        ? "good"
        : type === "error"
          ? "bad"
          : ""
    );

  enginePill.className =
    "engine-pill " + type;

  updateEngineDebug();

}


function setCommand(
  command
) {

  engineLastCommand =
    command;

  updateEngineDebug();

}


function setOutput(
  output
) {

  engineLastOutput =
    output;

  updateEngineDebug();

}


/* =========================================================
   ENGINE ERROR
   ========================================================= */

function engineError(
  message
) {

  engineReady =
    false;

  engineStarting =
    false;

  engineThinking =
    false;

  engineTesting =
    false;

  clearTimeout(
    engineStartTimer
  );

  clearTimeout(
    engineMoveTimer
  );

  clearTimeout(
    engineTestTimer
  );

  thinkingOverlay.classList.remove(
    "show"
  );

  setEngineStatus(
    "ENGINE ERROR: " + message,
    "error"
  );

}


/* =========================================================
   START ENGINE
   ========================================================= */

function startEngine() {

  if (engineStarting) {
    return;
  }

  engineStarting =
    true;

  engineReady =
    false;

  setEngineStatus(
    "Loading Stockfish ASM…"
  );

  setCommand(
    "creating Worker"
  );


  try {

    engine =
      new Worker(
        ENGINE_FILE
      );

  } catch (error) {

    engineError(
      "Could not create Worker: " +
      error.message
    );

    return;
  }


  /* -------------------------------------------------------
     MESSAGE HANDLER
     ------------------------------------------------------- */

  engine.onmessage =
    function(event) {

      const raw =
        String(
          event.data || ""
        );

      /*
        Some worker builds send several UCI lines
        in one message. Handle every line.
      */

      const lines =
        raw.split(/\r?\n/);

      for (
        let i = 0;
        i < lines.length;
        i++
      ) {

        const line =
          lines[i].trim();

        if (!line) {
          continue;
        }

        handleEngineLine(
          line
        );

      }

    };


  /* -------------------------------------------------------
     WORKER ERROR
     ------------------------------------------------------- */

  engine.onerror =
    function() {

      engineError(
        "Worker failed to load. Make sure stockfish-18-asm.js is beside index.html."
      );

    };


  engine.onmessageerror =
    function() {

      engineError(
        "Worker message error."
      );

    };


  /* -------------------------------------------------------
     UCI
     ------------------------------------------------------- */

  try {

    setCommand(
      "uci"
    );

    engine.postMessage(
      "uci"
    );

  } catch (error) {

    engineError(
      "Could not send UCI command: " +
      error.message
    );

    return;
  }


  /*
    ASM-JS may take a while on a Chromebook.
  */

  engineStartTimer =
    setTimeout(
      function() {

        if (!engineReady) {

          engineError(
            "Stockfish did not finish starting after 30 seconds."
          );

        }

      },
      30000
    );

}


/* =========================================================
   ENGINE OUTPUT
   ========================================================= */

function handleEngineLine(
  line
) {

  /*
    Always display useful output.
  */

  setOutput(
    line
  );


  /* -------------------------------------------------------
     UCI OK
     ------------------------------------------------------- */

  if (
    line === "uciok"
  ) {

    setEngineStatus(
      "Stockfish identified — checking readiness…"
    );

    setCommand(
      "isready"
    );

    try {

      engine.postMessage(
        "isready"
      );

    } catch (error) {

      engineError(
        "isready failed: " +
        error.message
      );

    }

    return;
  }


  /* -------------------------------------------------------
     READY OK
     ------------------------------------------------------- */

  if (
    line === "readyok"
  ) {

    clearTimeout(
      engineStartTimer
    );

    engineReady =
      true;

    engineStarting =
      false;

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

    return;
  }


  /* -------------------------------------------------------
     INFO
     ------------------------------------------------------- */

  if (
    line.startsWith("info ")
  ) {

    parseEngineInfo(
      line
    );

    return;
  }


  /* -------------------------------------------------------
     BEST MOVE
     ------------------------------------------------------- */

  if (
    line.startsWith("bestmove")
  ) {

    handleBestMove(
      line
    );

    return;
  }

}


/* =========================================================
   PARSE ENGINE INFO
   ========================================================= */

function parseEngineInfo(
  line
) {

  /*
    Depth
  */

  const depthMatch =
    line.match(
      /\bdepth\s+(\d+)/
    );

  if (depthMatch) {

    const depth =
      Number(
        depthMatch[1]
      );

    if (
      Number.isFinite(depth)
    ) {

      depthLabel.textContent =
        "Depth " + depth;

    }

  }


  /*
    Score
  */

  const scoreMatch =
    line.match(
      /\bscore\s+(cp|mate)\s+(-?\d+)/
    );

  if (!scoreMatch) {
    return;
  }


  const kind =
    scoreMatch[1];

  const value =
    Number(
      scoreMatch[2]
    );


  if (!Number.isFinite(value)) {
    return;
  }


  let evaluation;


  if (
    kind === "mate"
  ) {

    evaluation =
      value > 0
        ? 99
        : -99;

  } else {

    evaluation =
      value / 100;

  }


  lastEvaluation =
    evaluation;

  updateEvaluation(
    evaluation
  );

}


/* =========================================================
   EVALUATION
   ========================================================= */

function updateEvaluation(
  value
) {

  if (!Number.isFinite(value)) {
    return;
  }


  /*
    Clamp for display.
  */

  const clamped =
    Math.max(
      -5,
      Math.min(
        5,
        value
      )
    );


  /*
    Convert -5..+5 to 0..100.
  */

  const percent =
    ((clamped + 5) / 10) * 100;


  evalFill.style.height =
    percent + "%";


  if (
    value > 20
  ) {

    evalNumber.textContent =
      "M" +
      Math.round(
        value
      );

    evalLabel.textContent =
      "Nova has a forced mate";

  } else if (
    value < -20
  ) {

    evalNumber.textContent =
      "M" +
      Math.round(
        Math.abs(value)
      );

    evalLabel.textContent =
      "You have a forced mate";

  } else {

    const sign =
      value > 0
        ? "+"
        : "";

    evalNumber.textContent =
      sign +
      value.toFixed(1);

    if (value > .35) {

      evalLabel.textContent =
        "Nova is better";

    } else if (value < -.35) {

      evalLabel.textContent =
        "You are better";

    } else {

      evalLabel.textContent =
        "Position is balanced";

    }

  }

}


/* =========================================================
   BOARD CREATION
   ========================================================= */

function createBoard() {

  boardElement.innerHTML =
    "";


  const files =
    flipped
      ? [...FILES].reverse()
      : FILES;


  const ranks =
    flipped
      ? [...RANKS].reverse()
      : RANKS;


  for (
    let rankIndex = 0;
    rankIndex < 8;
    rankIndex++
  ) {

    for (
      let fileIndex = 0;
      fileIndex < 8;
      fileIndex++
    ) {

      const file =
        files[fileIndex];

      const rank =
        ranks[rankIndex];

      const square =
        file + rank;


      const squareElement =
        document.createElement(
          "div"
        );


      squareElement.className =
        "square " +
        (
          (
            FILES.indexOf(file) +
            Number(rank)
          ) % 2 === 0
            ? "light"
            : "dark"
        );


      squareElement.dataset.square =
        square;


      /*
        Last move.
      */

      if (
        lastMove &&
        (
          square === lastMove.from ||
          square === lastMove.to
        )
      ) {

        squareElement.classList.add(
          "last-move"
        );

      }


      /*
        Check king.
      */

      if (
        isKingInCheckSquare(
          square
        )
      ) {

        squareElement.classList.add(
          "check"
        );

      }


      /*
        Selected square.
      */

      if (
        selectedSquare === square
      ) {

        squareElement.style.filter =
          "brightness(1.12)";

        squareElement.style.boxShadow =
          "inset 0 0 0 999px rgba(101,168,255,.22)";

      }


      /*
        Piece.
      */

      const piece =
        game.get(square);


      if (piece) {

        const pieceElement =
          document.createElement(
            "div"
          );

        pieceElement.className =
          "piece " +
          (
            piece.color === "w"
              ? "white"
              : "black"
          );

        pieceElement.textContent =
          PIECES[
            piece.color
          ][
            piece.type
          ];


        squareElement.appendChild(
          pieceElement
        );

      }


      /*
        Legal target.
      */

      if (
        legalTargets.includes(
          square
        )
      ) {

        const targetPiece =
          game.get(square);


        if (targetPiece) {

          const ring =
            document.createElement(
              "div"
            );

          ring.className =
            "capture-ring";

          squareElement.appendChild(
            ring
          );

        } else {

          const dot =
            document.createElement(
              "div"
            );

          dot.className =
            "move-dot";

          squareElement.appendChild(
            dot
          );

        }

      }


      /*
        Coordinates.
      */

      if (
        fileIndex === 7
      ) {

        const fileLabel =
          document.createElement(
            "span"
          );

        fileLabel.className =
          "coord-file";

        fileLabel.textContent =
          file;

        squareElement.appendChild(
          fileLabel
        );

      }


      if (
        fileIndex === 0
      ) {

        const rankLabel =
          document.createElement(
            "span"
          );

        rankLabel.className =
          "coord-rank";

        rankLabel.textContent =
          rank;

        squareElement.appendChild(
          rankLabel
        );

      }


      squareElement.addEventListener(
        "click",
        function() {

          handleSquareClick(
            square
          );

        }
      );


      boardElement.appendChild(
        squareElement
      );

    }

  }

}


/* =========================================================
   CHECK SQUARE
   ========================================================= */

function isKingInCheckSquare(
  square
) {

  /*
    Don't use game.in_check() on every square.
    Instead find the king and test whether the
    current side is in check.
  */

  if (
    !game.in_check()
  ) {

    return false;
  }


  const turn =
    game.turn();


  const piece =
    game.get(square);


  return (
    piece &&
    piece.type === "k" &&
    piece.color === turn
  );

}


/* =========================================================
   CLICK SQUARE
   ========================================================= */

function handleSquareClick(
  square
) {

  /*
    Player is White.
  */

  if (
    game.game_over()
  ) {

    return;
  }


  if (
    game.turn() !== "w"
  ) {

    return;
  }


  if (
    engineThinking
  ) {

    return;
  }


  const piece =
    game.get(square);


  /*
    Existing selection.
  */

  if (
    selectedSquare
  ) {

    /*
      Legal destination.
    */

    if (
      legalTargets.includes(
        square
      )
    ) {

      attemptPlayerMove(
        selectedSquare,
        square
      );

      return;
    }


    /*
      Select another white piece.
    */

    if (
      piece &&
      piece.color === "w"
    ) {

      selectSquare(
        square
      );

      return;
    }


    clearSelection();

    return;
  }


  /*
    Select white piece.
  */

  if (
    piece &&
    piece.color === "w"
  ) {

    selectSquare(
      square
    );

  }

}


/* =========================================================
   SELECT
   ========================================================= */

function selectSquare(
  square
) {

  selectedSquare =
    square;


  legalTargets =
    game.moves({
      square: square,
      verbose: true
    }).map(
      move => move.to
    );


  createBoard();

}


/* =========================================================
   CLEAR SELECTION
   ========================================================= */

function clearSelection() {

  selectedSquare =
    null;

  legalTargets =
    [];

  createBoard();

}


/* =========================================================
   ATTEMPT PLAYER MOVE
   ========================================================= */

function attemptPlayerMove(
  from,
  to
) {

  const piece =
    game.get(from);


  /*
    Promotion.
  */

  if (
    piece &&
    piece.type === "p" &&
    to[1] === "8"
  ) {

    pendingPromotion = {
      from: from,
      to: to
    };


    promotionModal.classList.add(
      "show"
    );

    return;
  }


  makePlayerMove(
    from,
    to,
    "q"
  );

}


/* =========================================================
   MAKE PLAYER MOVE
   ========================================================= */

function makePlayerMove(
  from,
  to,
  promotion
) {

  const move =
    game.move({
      from: from,
      to: to,
      promotion: promotion
    });


  if (!move) {

    clearSelection();

    return;
  }


  /*
    Store last move.
  */

  lastMove = {
    from: move.from,
    to: move.to
  };


  selectedSquare =
    null;

  legalTargets =
    [];


  /*
    Add increment.
  */

  whiteSeconds +=
    incrementSeconds;


  gameStarted =
    true;


  renderEverything();


  const ended =
    checkGameEnd();


  if (
    !ended &&
    game.turn() === "b"
  ) {

    startClock();

    requestEngineMove();

  }

}


/* =========================================================
   PROMOTION BUTTONS
   ========================================================= */

document
  .querySelectorAll(
    ".promotion-buttons button"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          if (
            !pendingPromotion
          ) {

            return;
          }


          const promotion =
            this.dataset.piece;


          const move =
            pendingPromotion;


          pendingPromotion =
            null;


          promotionModal.classList.remove(
            "show"
          );


          makePlayerMove(
            move.from,
            move.to,
            promotion
          );

        }
      );

    }
  );


/* =========================================================
   REQUEST ENGINE MOVE
   ========================================================= */

function requestEngineMove() {

  /*
    Visible diagnostic.
  */

  setCommand(
    "REQUEST ENGINE MOVE"
  );


  if (
    !engineReady
  ) {

    setEngineStatus(
      "Waiting for Stockfish…"
    );

    return;
  }


  if (
    game.game_over()
  ) {

    return;
  }


  if (
    game.turn() !== "b"
  ) {

    return;
  }


  clearTimeout(
    engineMoveTimer
  );


  const mySearchId =
    ++engineSearchId;


  engineThinking =
    true;


  thinkingOverlay.classList.add(
    "show"
  );


  enginePill.className =
    "engine-pill thinking";


  engineText.textContent =
    "Nova is thinking";


  engineStatus.textContent =
    "Preparing engine search…";


  /*
  ==========================================================
  IMPORTANT ENGINE FIX
  ==========================================================

  Use the COMPLETE UCI move history.

  This is the protocol path that works reliably
  with the ASM-JS Stockfish build.
  */

  const history =
    game.history({
      verbose: true
    });


  const uciMoves =
    history.map(
      function(move) {

        return (
          move.from +
          move.to +
          (
            move.promotion || ""
          )
        );

      }
    );


  const positionCommand =
    "position startpos" +
    (
      uciMoves.length
        ? " moves " +
          uciMoves.join(" ")
        : ""
    );


  /*
    Difficulty is search depth.

    Lower depths are much faster on a Chromebook.
  */

  const depth =
    Number(
      difficulty.value
    );


  const goCommand =
    "go depth " +
    depth;


  try {

    /*
      Stop anything old.
    */

    setCommand(
      "stop"
    );

    engine.postMessage(
      "stop"
    );


    /*
      Start a clean search.
    */

    setCommand(
      "ucinewgame"
    );

    engine.postMessage(
      "ucinewgame"
    );


    /*
      Send complete position.
    */

    setCommand(
      positionCommand
    );

    engine.postMessage(
      positionCommand
    );


    /*
      Search.
    */

    setCommand(
      goCommand
    );

    engine.postMessage(
      goCommand
    );


    engineStatus.textContent =
      "Searching at depth " +
      depth +
      "…";

    updateEngineDebug();

  } catch (error) {

    finishEngineThinking();

    engineError(
      "Could not send search: " +
      error.message
    );

    return;
  }


  /*
    Safety watchdog.

    Depth searches can take longer on a Chromebook,
    so allow plenty of time.
  */

  engineMoveTimer =
    setTimeout(
      function() {

        if (
          engineThinking &&
          mySearchId === engineSearchId
        ) {

          try {

            engine.postMessage(
              "stop"
            );

          } catch (_) {}


          finishEngineThinking();


          engineError(
            "Search timed out. Last command: " +
            engineLastCommand
          );

        }

      },
      30000
    );

}


/* =========================================================
   HANDLE BEST MOVE
   ========================================================= */

function handleBestMove(
  line
) {

  /*
    A test search can also return bestmove.
  */

  if (
    engineTesting
  ) {

    clearTimeout(
      engineTestTimer
    );

    engineTesting =
      false;

    const parts =
      line.split(
        /\s+/
      );


    const bestmove =
      parts[1] || "none";


    setEngineStatus(
      "TEST PASSED — bestmove " +
      bestmove,
      "ready"
    );


    setCommand(
      "test complete"
    );

    setOutput(
      line
    );


    return;
  }


  if (
    !engineThinking
  ) {

    return;
  }


  clearTimeout(
    engineMoveTimer
  );


  const parts =
    line.split(
      /\s+/
    );


  const bestmove =
    parts[1];


  if (
    !bestmove ||
    bestmove === "(none)"
  ) {

    finishEngineThinking();

    checkGameEnd();

    return;
  }


  /*
    UCI move format:

      e2e4
      e7e8q
  */

  const from =
    bestmove.substring(
      0,
      2
    );


  const to =
    bestmove.substring(
      2,
      4
    );


  const promotion =
    bestmove.length >= 5
      ? bestmove.substring(
          4,
          5
        )
      : undefined;


  try {

    const move =
      game.move({
        from: from,
        to: to,
        promotion: promotion
      });


    if (!move) {

      finishEngineThinking();

      engineError(
        "Stockfish returned an illegal move: " +
        bestmove
      );

      return;
    }


    lastMove = {
      from: move.from,
      to: move.to
    };


    blackSeconds +=
      incrementSeconds;


    finishEngineThinking();


    renderEverything();


    checkGameEnd();

  } catch (error) {

    finishEngineThinking();

    engineError(
      "Could not apply Stockfish move: " +
      error.message
    );

  }

}


/* =========================================================
   FINISH ENGINE THINKING
   ========================================================= */

function finishEngineThinking() {

  engineThinking =
    false;

  clearTimeout(
    engineMoveTimer
  );

  thinkingOverlay.classList.remove(
    "show"
  );


  if (
    engineReady
  ) {

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }

}


/* =========================================================
   TEST STOCKFISH
   ========================================================= */

function testStockfish() {

  if (
    !engineReady
  ) {

    setEngineStatus(
      "Stockfish is not ready yet."
    );

    return;
  }


  if (
    engineThinking
  ) {

    setEngineStatus(
      "Nova is currently thinking."
    );

    return;
  }


  if (
    engineTesting
  ) {

    return;
  }


  engineTesting =
    true;


  setEngineStatus(
    "Testing Stockfish…"
  );


  setCommand(
    "stop"
  );

  engine.postMessage(
    "stop"
  );


  setCommand(
    "ucinewgame"
  );

  engine.postMessage(
    "ucinewgame"
  );


  /*
    Simple starting-position test.

    If Stockfish returns a bestmove,
    the engine itself is working.
  */

  setCommand(
    "position startpos"
  );

  engine.postMessage(
    "position startpos"
  );


  setCommand(
    "go depth 6"
  );

  engine.postMessage(
    "go depth 6"
  );


  engineTestTimer =
    setTimeout(
      function() {

        if (
          engineTesting
        ) {

          engineTesting =
            false;

          try {

            engine.postMessage(
              "stop"
            );

          } catch (_) {}


          engineError(
            "TEST FAILED — no bestmove after 20 seconds."
          );

        }

      },
      20000
    );

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderEverything() {

  createBoard();

  renderMoves();

  updateClocks();

}


/* =========================================================
   MOVE LIST
   ========================================================= */

function renderMoves() {

  const history =
    game.history();


  moveCount.textContent =
    history.length;


  if (
    history.length === 0
  ) {

    movesElement.innerHTML =
      '<div class="empty">Make your first move.</div>';

    return;
  }


  let html = "";


  for (
    let i = 0;
    i < history.length;
    i += 2
  ) {

    const moveNumber =
      Math.floor(i / 2) + 1;


    const white =
      history[i] || "";


    const black =
      history[i + 1] || "";


    const whiteCurrent =
      i === history.length - 1;


    const blackCurrent =
      i + 1 === history.length - 1;


    html +=
      '<div class="move-row">' +

        '<div class="move-number">' +
          moveNumber +
          '.</div>' +

        '<div class="move ' +
          (
            whiteCurrent
              ? "current"
              : ""
          ) +
        '">' +
          white +
        '</div>' +

        '<div class="move ' +
          (
            blackCurrent
              ? "current"
              : ""
          ) +
        '">' +
          black +
        '</div>' +

      '</div>';

  }


  movesElement.innerHTML =
    html;


  movesElement.scrollTop =
    movesElement.scrollHeight;

}


/* =========================================================
   CLOCK FORMAT
   ========================================================= */

function formatTime(
  seconds
) {

  seconds =
    Math.max(
      0,
      Math.ceil(
        seconds
      )
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    minutes +
    ":" +
    String(
      secs
    ).padStart(
      2,
      "0"
    )
  );

}


/* =========================================================
   UPDATE CLOCKS
   ========================================================= */

function updateClocks() {

  whiteClock.textContent =
    formatTime(
      whiteSeconds
    );


  blackClock.textContent =
    formatTime(
      blackSeconds
    );


  whiteClock.classList.toggle(
    "active",
    game.turn() === "w" &&
    !game.game_over()
  );


  blackClock.classList.toggle(
    "active",
    game.turn() === "b" &&
    !game.game_over()
  );

}


/* =========================================================
   START CLOCK
   ========================================================= */

function startClock() {

  clearInterval(
    clockTimer
  );


  if (
    game.game_over()
  ) {

    return;
  }


  clockTimer =
    setInterval(
      function() {

        if (
          !gameStarted ||
          engineThinking ||
          engineTesting
        ) {

          return;
        }


        if (
          game.turn() === "w"
        ) {

          whiteSeconds =
            Math.max(
              0,
              whiteSeconds - .1
            );

        } else {

          blackSeconds =
            Math.max(
              0,
              blackSeconds - .1
            );

        }


        updateClocks();


        if (
          whiteSeconds <= 0
        ) {

          clearInterval(
            clockTimer
          );

          endGame(
            "Nova wins on time."
          );

        }


        if (
          blackSeconds <= 0
        ) {

          clearInterval(
            clockTimer
          );

          endGame(
            "You win on time."
          );

        }

      },
      100
    );

}


/* =========================================================
   CHECK GAME END
   ========================================================= */

function checkGameEnd() {

  if (
    game.is_checkmate()
  ) {

    const message =
      game.turn() === "w"
        ? "Nova wins by checkmate."
        : "You win by checkmate.";


    endGame(
      message
    );

    return true;
  }


  if (
    game.is_draw()
  ) {

    endGame(
      "Draw."
    );

    return true;
  }


  return false;

}


/* =========================================================
   END GAME
   ========================================================= */

function endGame(
  message
) {

  clearInterval(
    clockTimer
  );


  clearTimeout(
    engineMoveTimer
  );


  engineThinking =
    false;


  thinkingOverlay.classList.remove(
    "show"
  );


  engineText.textContent =
    message;


  engineStatus.textContent =
    message;


  enginePill.className =
    "engine-pill";


  updateClocks();

}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame() {

  clearInterval(
    clockTimer
  );


  clearTimeout(
    engineMoveTimer
  );


  clearTimeout(
    engineTestTimer
  );


  engineThinking =
    false;


  engineTesting =
    false;


  engineSearchId++;


  thinkingOverlay.classList.remove(
    "show"
  );


  promotionModal.classList.remove(
    "show"
  );


  pendingPromotion =
    null;


  game =
    new Chess();


  selectedSquare =
    null;


  legalTargets =
    [];


  lastMove =
    null;


  initialSeconds =
    Number(
      timeControl.value
    );


  whiteSeconds =
    initialSeconds;


  blackSeconds =
    initialSeconds;


  gameStarted =
    false;


  lastEvaluation =
    0;


  evalNumber.textContent =
    "0.0";


  evalLabel.textContent =
    "Starting position";


  evalFill.style.height =
    "50%";


  depthLabel.textContent =
    "Depth —";


  renderEverything();


  /*
    Reset the engine state without replacing
    the worker.
  */

  if (
    engine &&
    engineReady
  ) {

    try {

      setCommand(
        "stop"
      );

      engine.postMessage(
        "stop"
      );


      setCommand(
        "ucinewgame"
      );

      engine.postMessage(
        "ucinewgame"
      );


      setCommand(
        "isready"
      );

      engine.postMessage(
        "isready"
      );

    } catch (_) {}

  }


  if (
    engineReady
  ) {

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  } else {

    setEngineStatus(
      "Waiting for Stockfish…"
    );

  }

}


/* =========================================================
   UNDO
   ========================================================= */

function undoMove() {

  if (
    engineThinking
  ) {

    try {

      engine.postMessage(
        "stop"
      );

    } catch (_) {}


    clearTimeout(
      engineMoveTimer
    );


    engineThinking =
      false;


    engineSearchId++;


    thinkingOverlay.classList.remove(
      "show"
    );

  }


  /*
    Normally remove:

      your move
      Nova's move

    so you get the turn back.
  */

  const historyLength =
    game.history().length;


  if (
    historyLength >= 2
  ) {

    game.undo();
    game.undo();

  } else if (
    historyLength === 1
  ) {

    game.undo();

  } else {

    return;
  }


  selectedSquare =
    null;


  legalTargets =
    [];


  lastMove =
    null;


  whiteSeconds =
    initialSeconds;


  blackSeconds =
    initialSeconds;


  gameStarted =
    false;


  renderEverything();


  if (
    engineReady
  ) {

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }

}


/* =========================================================
   RESIGN
   ========================================================= */

function resign() {

  if (
    game.game_over()
  ) {

    return;
  }


  endGame(
    "You resigned. Nova wins."
  );

}


/* =========================================================
   FLIP BOARD
   ========================================================= */

function flipBoard() {

  flipped =
    !flipped;

  createBoard();

}


/* =========================================================
   DIFFICULTY
   ========================================================= */

difficulty.addEventListener(
  "change",
  function() {

    /*
      Nothing is sent to Stockfish here.

      We deliberately use search depth instead of
      Skill Level / Threads options because this keeps
      the ASM-JS engine path simple and reliable.
    */

    if (
      engineReady
    ) {

      setEngineStatus(
        "Difficulty set to " +
        this.options[
          this.selectedIndex
        ].text,
        "ready"
      );

    }

  }
);


/* =========================================================
   TIME CONTROL
   ========================================================= */

timeControl.addEventListener(
  "change",
  function() {

    /*
      Only change clocks before the game begins.
    */

    if (
      game.history().length === 0
    ) {

      initialSeconds =
        Number(
          this.value
        );


      whiteSeconds =
        initialSeconds;


      blackSeconds =
        initialSeconds;


      updateClocks();

    }

  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById(
    "newGameBtn"
  )
  .addEventListener(
    "click",
    newGame
  );


document
  .getElementById(
    "undoBtn"
  )
  .addEventListener(
    "click",
    undoMove
  );


document
  .getElementById(
    "resignBtn"
  )
  .addEventListener(
    "click",
    resign
  );


document
  .getElementById(
    "flipBtn"
  )
  .addEventListener(
    "click",
    flipBoard
  );


testEngineBtn.addEventListener(
  "click",
  testStockfish
);


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize() {

  /*
    Make sure chess.js loaded.
  */

  if (
    typeof Chess !== "function"
  ) {

    setEngineStatus(
      "CHESS ERROR: chess.js did not load. Your school network may be blocking the CDN.",
      "error"
    );

    return;
  }


  initialSeconds =
    Number(
      timeControl.value
    );


  whiteSeconds =
    initialSeconds;


  blackSeconds =
    initialSeconds;


  updateClocks();

  createBoard();

  renderMoves();

  updateEvaluation(
    0
  );


  /*
    START REAL STOCKFISH.
  */

  startEngine();

}


initialize();

</script>
