<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stockfish Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070910;
    --panel:rgba(17,21,32,.82);
    --panel-border:rgba(255,255,255,.09);

    --text:#f5f7ff;
    --muted:#8f98ab;

    --purple:#8577ff;
    --blue:#55d8ff;

    --light:#e6ecf4;
    --dark:#65748b;

    --board-size:min(70vh, 70vw, 720px);
}

html{
    min-height:100%;
    background:var(--bg);
}

body{
    min-height:100vh;
    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(106,88,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(55,205,255,.11),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            #05070d,
            #0a0d16 50%,
            #060810
        );

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    pointer-events:none;

    background-image:
        radial-gradient(
            rgba(255,255,255,.08) 1px,
            transparent 1px
        );

    background-size:42px 42px;
    transform:rotate(12deg);
    opacity:.18;
}

button,
select{
    font:inherit;
}

/* =========================
   APP
========================= */

.app{
    width:min(1500px,96vw);
    min-height:100vh;
    margin:auto;
    padding:20px 0 35px;
    position:relative;
    z-index:1;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 17px;

    border-radius:21px;
    border:1px solid var(--panel-border);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 55px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.07);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    font-family:Georgia,serif;
    font-size:25px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #9d91ff,
            #52d8ff
        );

    box-shadow:
        0 8px 28px rgba(106,125,255,.35);
}

.title{
    font-size:16px;
    font-weight:850;
    letter-spacing:-.3px;
}

.subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.engine-pill{
    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 13px;

    border-radius:999px;
    border:1px solid rgba(255,255,255,.09);

    background:rgba(255,255,255,.035);

    color:#cbd2df;

    font-size:11px;
    font-weight:750;

    transition:.2s ease;
}

.engine-dot{
    width:8px;
    height:8px;
    border-radius:50%;

    background:#4cff9b;

    box-shadow:
        0 0 14px rgba(76,255,155,.8);
}

.engine-pill.thinking .engine-dot{
    animation:thinkingPulse .65s infinite alternate;
}

@keyframes thinkingPulse{
    from{
        transform:scale(.7);
        opacity:.45;
    }

    to{
        transform:scale(1.3);
        opacity:1;
    }
}

/* =========================
   MAIN
========================= */

.main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 350px;

    gap:25px;

    align-items:start;

    margin-top:22px;
}

/* =========================
   BOARD
========================= */

.board-area{
    width:100%;

    display:flex;
    justify-content:center;

    min-width:0;
}

.board-shell{
    width:var(--board-size);
    height:var(--board-size);

    max-width:100%;

    padding:10px;

    border-radius:27px;

    border:1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.025) 40%,
            rgba(0,0,0,.25)
        );

    box-shadow:
        0 35px 90px rgba(0,0,0,.48),
        0 0 70px rgba(100,100,255,.08),
        inset 0 1px rgba(255,255,255,.12);

    min-width:0;
    min-height:0;
}

/*
   IMPORTANT:
   minmax(0,1fr) prevents chess pieces
   from making the board columns wider.
*/

.board{
    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:
        repeat(8,minmax(0,1fr));

    grid-template-rows:
        repeat(8,minmax(0,1fr));

    min-width:0;
    min-height:0;

    overflow:hidden;

    border-radius:17px;

    position:relative;

    isolation:isolate;
}

/* =========================
   SQUARES
========================= */

.square{
    position:relative;

    min-width:0;
    min-height:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    cursor:pointer;
    user-select:none;

    transition:
        filter .14s ease,
        box-shadow .16s ease;
}

.square.light{
    background:
        linear-gradient(
            145deg,
            #eef3f9,
            #d6e0ec
        );
}

.square.dark{
    background:
        linear-gradient(
            145deg,
            #74839a,
            #5b6a80
        );
}

.square:hover{
    filter:brightness(1.06);
}

.square.selected{
    box-shadow:
        inset 0 0 0 999px rgba(130,116,255,.28),
        inset 0 0 35px rgba(130,116,255,.5);
}

.square.last{
    box-shadow:
        inset 0 0 0 999px rgba(255,205,70,.18);
}

.square.check{
    box-shadow:
        inset 0 0 0 999px rgba(255,45,70,.27),
        inset 0 0 35px rgba(255,45,70,.7);

    animation:checkGlow .8s infinite alternate;
}

@keyframes checkGlow{
    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(1.16);
    }
}

/* =========================
   PIECES
========================= */

.piece{
    position:relative;

    z-index:4;

    display:block;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    /*
       Responsive without allowing
       the piece to enlarge its grid cell.
    */
    font-size:
        clamp(29px, 5vw, 64px);

    line-height:1;

    pointer-events:none;

    transform:translateZ(0);

    transition:
        transform .14s cubic-bezier(.2,.9,.2,1),
        filter .14s ease;

    will-change:transform;

    filter:
        drop-shadow(0 5px 4px rgba(0,0,0,.28));
}

.square:hover .piece{
    transform:
        translateY(-2px)
        scale(1.035);
}

.white-piece{
    color:#ffffff;

    text-shadow:
        0 2px 0 #cbd3df,
        0 5px 9px rgba(0,0,0,.38);
}

.black-piece{
    color:#20252e;

    text-shadow:
        0 1px 0 #596272,
        0 5px 9px rgba(0,0,0,.48);
}

/* =========================
   COORDINATES
========================= */

.coord{
    position:absolute;

    z-index:6;

    pointer-events:none;

    font-size:9px;
    font-weight:850;

    opacity:.58;
}

.rank{
    top:4px;
    left:5px;
}

.file{
    right:5px;
    bottom:4px;
}

.light .coord{
    color:#5d697c;
}

.dark .coord{
    color:#edf2f8;
}

/* =========================
   LEGAL MOVE DOTS
========================= */

.move-dot{
    position:absolute;

    z-index:2;

    width:20%;
    aspect-ratio:1;

    border-radius:50%;

    background:rgba(45,37,30,.30);

    pointer-events:none;
}

.capture-ring{
    position:absolute;

    z-index:2;

    width:72%;
    height:72%;

    border-radius:50%;

    border:
        5px solid rgba(45,37,30,.28);

    pointer-events:none;
}

/* =========================
   RIPPLE
========================= */

.ripple{
    position:absolute;

    z-index:10;

    width:13px;
    height:13px;

    border-radius:50%;

    background:rgba(255,255,255,.65);

    pointer-events:none;

    animation:
        rippleAnimation .55s ease-out forwards;
}

@keyframes rippleAnimation{
    from{
        transform:scale(0);
        opacity:.8;
    }

    to{
        transform:scale(8);
        opacity:0;
    }
}

/* =========================
   SIDE PANEL
========================= */

.side{
    display:flex;
    flex-direction:column;

    gap:14px;

    min-width:0;
}

.card{
    border:1px solid var(--panel-border);

    border-radius:21px;

    background:var(--panel);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 55px rgba(0,0,0,.22),
        inset 0 1px rgba(255,255,255,.05);

    overflow:hidden;
}

/* =========================
   STATUS
========================= */

.status{
    padding:18px;
}

.status-label{
    color:var(--muted);

    font-size:10px;

    font-weight:850;

    text-transform:uppercase;

    letter-spacing:1.5px;
}

.status-text{
    margin-top:6px;

    font-size:18px;

    font-weight:850;

    letter-spacing:-.3px;
}

.status-text.thinking{
    color:#9488ff;
}

/* =========================
   EVALUATION
========================= */

.eval-wrap{
    height:13px;

    margin-top:17px;

    border-radius:999px;

    overflow:hidden;

    background:#10141d;

    border:1px solid rgba(255,255,255,.06);
}

.eval-fill{
    height:100%;

    width:50%;

    background:
        linear-gradient(
            90deg,
            #cbd4df,
            #ffffff
        );

    transition:
        width .5s cubic-bezier(.2,.8,.2,1);
}

.eval-number{
    margin-top:7px;

    text-align:right;

    color:var(--muted);

    font-size:10px;

    font-variant-numeric:tabular-nums;
}

/* =========================
   CLOCKS
========================= */

.clocks{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    padding:14px;
}

.clock{
    padding:13px;

    border-radius:15px;

    background:rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.065);

    transition:.2s ease;
}

.clock.active{
    border-color:
        rgba(133,119,255,.5);

    box-shadow:
        0 0 25px rgba(133,119,255,.09);
}

.clock-name{
    color:var(--muted);

    font-size:9px;

    font-weight:850;

    text-transform:uppercase;

    letter-spacing:1.2px;
}

.clock-time{
    margin-top:4px;

    font-size:24px;

    font-weight:850;

    font-variant-numeric:tabular-nums;
}

/* =========================
   MOVE LIST
========================= */

.moves{
    height:300px;

    overflow-y:auto;

    padding:10px;
}

.moves::-webkit-scrollbar{
    width:5px;
}

.moves::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:99px;
}

.empty-moves{
    height:100%;

    display:grid;
    place-items:center;

    color:var(--muted);

    font-size:11px;
}

.move-row{
    display:grid;

    grid-template-columns:32px 1fr 1fr;

    gap:5px;

    padding:8px 7px;

    border-radius:9px;

    font-size:12px;

    animation:
        moveAppear .2s ease both;
}

.move-row.latest{
    background:
        rgba(133,119,255,.13);
}

.move-number{
    color:var(--muted);
}

.move-white,
.move-black{
    font-weight:750;
}

@keyframes moveAppear{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   CONTROLS
========================= */

.controls{
    padding:14px;

    display:grid;

    gap:9px;
}

select{
    width:100%;

    padding:12px;

    border-radius:13px;

    border:
        1px solid rgba(255,255,255,.09);

    outline:none;

    color:var(--text);

    background:#171b27;

    cursor:pointer;
}

select option{
    background:#171b27;
    color:white;
}

.button-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}

.btn{
    border:1px solid rgba(255,255,255,.09);

    border-radius:13px;

    padding:12px;

    background:
        rgba(255,255,255,.045);

    color:var(--text);

    cursor:pointer;

    font-weight:800;

    transition:
        transform .14s ease,
        background .14s ease,
        box-shadow .14s ease;
}

.btn:hover{
    transform:translateY(-2px);

    background:
        rgba(255,255,255,.085);
}

.btn:active{
    transform:scale(.98);
}

.btn.primary{
    border-color:transparent;

    background:
        linear-gradient(
            135deg,
            #7769ef,
            #5c93ff
        );

    box-shadow:
        0 10px 25px rgba(100,105,255,.22);
}

.engine-info{
    display:flex;

    justify-content:space-between;

    color:var(--muted);

    font-size:10px;

    padding:2px 3px;
}

/* =========================
   PROMOTION
========================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    place-items:center;

    padding:20px;

    background:
        rgba(2,4,10,.72);

    backdrop-filter:blur(10px);
}

.overlay.show{
    display:grid;
}

.modal{
    width:min(400px,90vw);

    padding:25px;

    border-radius:24px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(16,20,31,.96);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);

    animation:
        modalAppear .25s cubic-bezier(.2,.9,.2,1);
}

.modal-title{
    text-align:center;

    font-size:19px;

    font-weight:850;

    margin-bottom:17px;
}

.promotion-options{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.promotion-button{
    padding:13px 4px;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.05);

    color:white;

    font-family:Georgia,serif;

    font-size:43px;

    cursor:pointer;

    transition:.15s ease;
}

.promotion-button:hover{
    transform:translateY(-4px);

    background:
        rgba(133,119,255,.17);
}

@keyframes modalAppear{
    from{
        opacity:0;
        transform:
            translateY(12px)
            scale(.94);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   GAME OVER
========================= */

.gameover-box{
    width:min(430px,90vw);

    padding:34px;

    border-radius:25px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(16,20,31,.96);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);

    text-align:center;

    animation:
        modalAppear .25s ease;
}

.gameover-title{
    font-size:30px;

    font-weight:900;
}

.gameover-sub{
    color:var(--muted);

    margin:
        7px 0 22px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

    :root{
        --board-size:min(88vw,720px);
    }

    .main{
        grid-template-columns:1fr;
    }

    .side{
        width:min(720px,88vw);
        margin:auto;
    }
}

@media(max-width:600px){

    :root{
        --board-size:92vw;
    }

    .app{
        width:96vw;
        padding-top:10px;
    }

    .topbar{
        height:60px;
        border-radius:17px;
    }

    .logo{
        width:36px;
        height:36px;
    }

    .subtitle{
        display:none;
    }

    .engine-pill{
        padding:8px 10px;
    }

    .board-shell{
        padding:7px;
        border-radius:20px;
    }

    .board{
        border-radius:13px;
    }

    .piece{
        font-size:
            clamp(25px,8vw,50px);
    }

    .moves{
        height:250px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="brand">

            <div class="logo">♞</div>

            <div>
                <div class="title">
                    Stockfish Chess
                </div>

                <div class="subtitle">
                    Premium browser chess
                </div>
            </div>

        </div>

        <div class="engine-pill" id="enginePill">

            <span class="engine-dot"></span>

            <span id="engineStatus">
                Starting engine
            </span>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- BOARD -->
        <section class="board-area">

            <div class="board-shell">

                <div
                    class="board"
                    id="board"
                ></div>

            </div>

        </section>


        <!-- SIDE -->
        <aside class="side">

            <!-- STATUS -->
            <section class="card status">

                <div class="status-label">
                    Game status
                </div>

                <div
                    class="status-text"
                    id="statusText"
                >
                    Starting…
                </div>

                <div class="eval-wrap">

                    <div
                        class="eval-fill"
                        id="evalFill"
                    ></div>

                </div>

                <div
                    class="eval-number"
                    id="evalNumber"
                >
                    0.00
                </div>

            </section>


            <!-- CLOCKS -->
            <section class="card">

                <div class="clocks">

                    <div
                        class="clock"
                        id="whiteClockBox"
                    >

                        <div class="clock-name">
                            White
                        </div>

                        <div
                            class="clock-time"
                            id="whiteClock"
                        >
                            10:00
                        </div>

                    </div>


                    <div
                        class="clock"
                        id="blackClockBox"
                    >

                        <div class="clock-name">
                            Black
                        </div>

                        <div
                            class="clock-time"
                            id="blackClock"
                        >
                            10:00
                        </div>

                    </div>

                </div>

            </section>


            <!-- MOVES -->
            <section class="card">

                <div
                    class="moves"
                    id="moves"
                ></div>

            </section>


            <!-- CONTROLS -->
            <section class="card controls">

                <select id="difficulty">

                    <option value="8">
                        Beginner — Depth 8
                    </option>

                    <option value="12" selected>
                        Intermediate — Depth 12
                    </option>

                    <option value="16">
                        Advanced — Depth 16
                    </option>

                    <option value="20">
                        Expert — Depth 20
                    </option>

                </select>


                <div class="button-row">

                    <button
                        class="btn primary"
                        id="newGame"
                    >
                        New Game
                    </button>

                    <button
                        class="btn"
                        id="undo"
                    >
                        Undo
                    </button>

                </div>


                <div class="engine-info">

                    <span id="depthText">
                        Depth 0
                    </span>

                    <span id="turnText">
                        White to move
                    </span>

                </div>

            </section>

        </aside>

    </main>

</div>


<!-- PROMOTION -->
<div
    class="overlay"
    id="promotionOverlay"
>

    <div class="modal">

        <div class="modal-title">
            Choose your promotion
        </div>

        <div class="promotion-options">

            <button
                class="promotion-button"
                data-piece="q"
            >
                ♕
            </button>

            <button
                class="promotion-button"
                data-piece="r"
            >
                ♖
            </button>

            <button
                class="promotion-button"
                data-piece="b"
            >
                ♗
            </button>

            <button
                class="promotion-button"
                data-piece="n"
            >
                ♘
            </button>

        </div>

    </div>

</div>


<!-- GAME OVER -->
<div
    class="overlay"
    id="gameoverOverlay"
>

    <div class="gameover-box">

        <div
            class="gameover-title"
            id="gameoverTitle"
        >
            Game Over
        </div>

        <div
            class="gameover-sub"
            id="gameoverSub"
        ></div>

        <button
            class="btn primary"
            id="playAgain"
        >
            Play Again
        </button>

    </div>

</div>


<script>

/* =========================================================
   CHESS
========================================================= */

const game = new Chess();


/* =========================================================
   ELEMENTS
========================================================= */

const board =
    document.getElementById("board");

const movesElement =
    document.getElementById("moves");

const statusElement =
    document.getElementById("statusText");

const engineStatus =
    document.getElementById("engineStatus");

const enginePill =
    document.getElementById("enginePill");

const evalFill =
    document.getElementById("evalFill");

const evalNumber =
    document.getElementById("evalNumber");

const depthText =
    document.getElementById("depthText");

const turnText =
    document.getElementById("turnText");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const whiteClockBox =
    document.getElementById("whiteClockBox");

const blackClockBox =
    document.getElementById("blackClockBox");

const difficulty =
    document.getElementById("difficulty");

const promotionOverlay =
    document.getElementById("promotionOverlay");

const gameoverOverlay =
    document.getElementById("gameoverOverlay");

const gameoverTitle =
    document.getElementById("gameoverTitle");

const gameoverSub =
    document.getElementById("gameoverSub");


/* =========================================================
   PIECES
========================================================= */

const pieces = {

    wp:"♙",
    wn:"♘",
    wb:"♗",
    wr:"♖",
    wq:"♕",
    wk:"♔",

    bp:"♟",
    bn:"♞",
    bb:"♝",
    br:"♜",
    bq:"♛",
    bk:"♚"

};


/* =========================================================
   STATE
========================================================= */

let selectedSquare = null;

let lastMove = null;

let promotionMove = null;

let engine = null;

let engineReady = false;

let engineThinking = false;

let gameVersion = 0;

let engineRequestVersion = 0;

let gameEnded = false;

let clocks = {
    w:600,
    b:600
};


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function playSound(type){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        const now =
            audioContext.currentTime;

        if(type === "capture"){

            oscillator.frequency.setValueAtTime(
                150,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                75,
                now + .12
            );

            gain.gain.setValueAtTime(
                .055,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now + .13
            );

        }else if(type === "check"){

            oscillator.frequency.setValueAtTime(
                620,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                850,
                now + .15
            );

            gain.gain.setValueAtTime(
                .04,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now + .17
            );

        }else{

            oscillator.frequency.setValueAtTime(
                330,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                250,
                now + .07
            );

            gain.gain.setValueAtTime(
                .028,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now + .08
            );

        }

        oscillator.start(now);
        oscillator.stop(now + .2);

    }catch(error){

        /* Audio is optional. */
    }
}


/* =========================================================
   BOARD RENDER
========================================================= */

function renderBoard(){

    board.innerHTML = "";

    const position =
        game.board();

    for(let row = 0; row < 8; row++){

        for(let col = 0; col < 8; col++){

            const squareName =
                String.fromCharCode(97 + col)
                +
                (8 - row);

            const square =
                document.createElement("div");

            square.className =
                "square "
                +
                (
                    (row + col) % 2 === 0
                    ? "light"
                    : "dark"
                );

            square.dataset.square =
                squareName;


            /* Last move */

            if(
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ){

                square.classList.add("last");

            }


            /* Selected square */

            if(
                selectedSquare === squareName
            ){

                square.classList.add("selected");

            }


            /* Piece */

            const piece =
                position[row][col];

            if(piece){

                const pieceElement =
                    document.createElement("div");

                pieceElement.className =
                    "piece "
                    +
                    (
                        piece.color === "w"
                        ? "white-piece"
                        : "black-piece"
                    );

                pieceElement.textContent =
                    pieces[
                        piece.color + piece.type
                    ];

                square.appendChild(
                    pieceElement
                );

            }


            /* Coordinates */

            const rank =
                document.createElement("span");

            rank.className =
                "coord rank";

            rank.textContent =
                col === 0
                ? (8 - row)
                : "";

            square.appendChild(rank);


            const file =
                document.createElement("span");

            file.className =
                "coord file";

            file.textContent =
                row === 7
                ? String.fromCharCode(97 + col)
                : "";

            square.appendChild(file);


            square.addEventListener(
                "click",
                () => handleSquareClick(squareName)
            );


            board.appendChild(square);
        }
    }


    if(selectedSquare){

        showLegalMoves(
            selectedSquare
        );

    }


    highlightKingInCheck();
}


/* =========================================================
   LEGAL MOVES
========================================================= */

function showLegalMoves(square){

    const moves =
        game.moves({
            square:square,
            verbose:true
        });

    for(const move of moves){

        const target =
            board.querySelector(
                `[data-square="${move.to}"]`
            );

        if(!target) continue;


        if(move.captured){

            const ring =
                document.createElement("div");

            ring.className =
                "capture-ring";

            target.appendChild(ring);

        }else{

            const dot =
                document.createElement("div");

            dot.className =
                "move-dot";

            target.appendChild(dot);

        }
    }
}


/* =========================================================
   CHECK HIGHLIGHT
========================================================= */

function highlightKingInCheck(){

    if(!game.in_check()) return;

    const side =
        game.turn();

    const position =
        game.board();

    for(let row = 0; row < 8; row++){

        for(let col = 0; col < 8; col++){

            const piece =
                position[row][col];

            if(
                piece &&
                piece.type === "k" &&
                piece.color === side
            ){

                const squareName =
                    String.fromCharCode(97 + col)
                    +
                    (8 - row);

                const element =
                    board.querySelector(
                        `[data-square="${squareName}"]`
                    );

                if(element){

                    element.classList.add(
                        "check"
                    );

                }
            }
        }
    }
}


/* =========================================================
   RIPPLE
========================================================= */

function ripple(squareName){

    const square =
        board.querySelector(
            `[data-square="${squareName}"]`
        );

    if(!square) return;

    const effect =
        document.createElement("div");

    effect.className =
        "ripple";

    effect.style.left =
        "50%";

    effect.style.top =
        "50%";

    effect.style.transform =
        "translate(-50%,-50%)";

    square.appendChild(effect);

    setTimeout(
        () => effect.remove(),
        600
    );
}


/* =========================================================
   PLAYER INPUT
========================================================= */

function handleSquareClick(squareName){

    if(gameEnded) return;

    if(engineThinking) return;

    if(!engineReady) return;

    /* Player is White */

    if(game.turn() !== "w") return;


    const clickedPiece =
        game.get(squareName);


    /* Nothing selected */

    if(!selectedSquare){

        if(
            clickedPiece &&
            clickedPiece.color === "w"
        ){

            selectedSquare =
                squareName;

            renderBoard();

        }

        return;
    }


    /* Select another own piece */

    if(
        clickedPiece &&
        clickedPiece.color === "w"
    ){

        selectedSquare =
            squareName;

        renderBoard();

        return;
    }


    /* Check legal destination */

    const legalMoves =
        game.moves({
            square:selectedSquare,
            verbose:true
        });

    const chosenMove =
        legalMoves.find(
            move =>
                move.to === squareName
        );


    if(!chosenMove){

        selectedSquare = null;

        renderBoard();

        return;
    }


    /* Promotion */

    if(chosenMove.promotion){

        promotionMove = {
            from:selectedSquare,
            to:squareName
        };

        promotionOverlay.classList.add(
            "show"
        );

        return;
    }


    makePlayerMove({
        from:selectedSquare,
        to:squareName
    });
}


/* =========================================================
   PLAYER MOVE
========================================================= */

function makePlayerMove(move){

    if(gameEnded) return;

    const result =
        game.move(move);

    if(!result) return;


    selectedSquare = null;

    lastMove = {
        from:result.from,
        to:result.to
    };


    if(result.captured){

        playSound("capture");

    }else{

        playSound("move");

    }


    if(game.in_check()){

        playSound("check");

    }


    ripple(result.to);

    renderBoard();
    renderMoves();
    updateEvaluation(0);
    updateInterface();


    if(checkGameOver()){

        return;
    }


    requestEngine();
}


/* =========================================================
   PROMOTION
========================================================= */

document
.querySelectorAll(".promotion-button")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            if(!promotionMove) return;

            const promotion =
                button.dataset.piece;

            promotionOverlay.classList.remove(
                "show"
            );

            makePlayerMove({

                from:promotionMove.from,

                to:promotionMove.to,

                promotion:promotion

            });

            promotionMove = null;

        }
    );

});


/* =========================================================
   MOVE HISTORY
========================================================= */

function renderMoves(){

    movesElement.innerHTML = "";

    const history =
        game.history();

    if(history.length === 0){

        const empty =
            document.createElement("div");

        empty.className =
            "empty-moves";

        empty.textContent =
            "Your game begins here";

        movesElement.appendChild(empty);

        return;
    }


    for(
        let i = 0;
        i < history.length;
        i += 2
    ){

        const row =
            document.createElement("div");

        row.className =
            "move-row";


        if(
            i >= history.length - 2
        ){

            row.classList.add(
                "latest"
            );

        }


        const number =
            document.createElement("div");

        number.className =
            "move-number";

        number.textContent =
            (i / 2) + 1;


        const white =
            document.createElement("div");

        white.className =
            "move-white";

        white.textContent =
            history[i] || "";


        const black =
            document.createElement("div");

        black.className =
            "move-black";

        black.textContent =
            history[i + 1] || "";


        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        movesElement.appendChild(row);
    }


    movesElement.scrollTop =
        movesElement.scrollHeight;
}


/* =========================================================
   STATUS
========================================================= */

function updateInterface(){

    turnText.textContent =
        game.turn() === "w"
        ? "White to move"
        : "Black to move";


    whiteClockBox.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameEnded
    );

    blackClockBox.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameEnded
    );


    if(gameEnded) return;


    if(engineThinking){

        statusElement.textContent =
            "Stockfish is thinking…";

        statusElement.classList.add(
            "thinking"
        );

    }else if(game.in_check()){

        statusElement.textContent =
            game.turn() === "w"
            ? "Check — your king is attacked!"
            : "Check!";

        statusElement.classList.remove(
            "thinking"
        );

    }else{

        statusElement.textContent =
            game.turn() === "w"
            ? "Your move"
            : "Stockfish's move";

        statusElement.classList.remove(
            "thinking"
        );
    }
}


/* =========================================================
   ENGINE
========================================================= */

function startEngine(){

    try{

        engine =
            new Worker(
                "./stockfish-18-lite-single.js"
            );


        engine.onmessage =
            handleEngineMessage;


        engine.onerror =
            function(){

                engineReady = false;

                engineThinking = false;

                enginePill.classList.remove(
                    "thinking"
                );

                engineStatus.textContent =
                    "Engine error";

                statusElement.textContent =
                    "Stockfish could not start";

            };


        engine.postMessage("uci");

    }catch(error){

        engineStatus.textContent =
            "Engine unavailable";

    }
}


/* =========================================================
   ENGINE MESSAGES
========================================================= */

function handleEngineMessage(event){

    const line =
        String(event.data);


    if(line === "uciok"){

        engine.postMessage(
            "isready"
        );

        return;
    }


    if(line === "readyok"){

        engineReady = true;

        engineStatus.textContent =
            "Stockfish ready";

        updateInterface();

        return;
    }


    if(line.startsWith("info")){

        parseEngineEvaluation(line);

        const depthMatch =
            line.match(
                /\bdepth\s+(\d+)/
            );

        if(depthMatch){

            depthText.textContent =
                "Depth " +
                depthMatch[1];

        }

        return;
    }


    if(line.startsWith("bestmove")){

        if(!engineThinking){

            return;
        }


        const requestedVersion =
            engineRequestVersion;


        engineThinking = false;

        enginePill.classList.remove(
            "thinking"
        );

        engineStatus.textContent =
            "Stockfish ready";


        if(
            requestedVersion !== gameVersion
        ){

            updateInterface();

            return;
        }


        const match =
            line.match(
                /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/
            );


        if(!match){

            updateInterface();

            return;
        }


        const moveString =
            match[1];


        const move = {

            from:
                moveString.substring(0,2),

            to:
                moveString.substring(2,4)

        };


        if(moveString.length > 4){

            move.promotion =
                moveString.substring(4,5);

        }


        makeEngineMove(move);

    }
}


/* =========================================================
   ENGINE MOVE
========================================================= */

function requestEngine(){

    if(!engineReady) return;

    if(gameEnded) return;

    if(game.turn() !== "b") return;


    engineThinking = true;

    engineRequestVersion =
        gameVersion;


    enginePill.classList.add(
        "thinking"
    );

    engineStatus.textContent =
        "Thinking…";

    updateInterface();


    const depth =
        parseInt(
            difficulty.value,
            10
        );


    try{

        engine.postMessage(
            "stop"
        );

        engine.postMessage(
            "position fen " +
            game.fen()
        );

        engine.postMessage(
            "go depth " +
            depth
        );

    }catch(error){

        engineThinking = false;

        enginePill.classList.remove(
            "thinking"
        );

        engineStatus.textContent =
            "Stockfish ready";

        updateInterface();
    }
}


/* =========================================================
   MAKE ENGINE MOVE
========================================================= */

function makeEngineMove(move){

    if(gameEnded) return;

    if(game.turn() !== "b") return;


    const result =
        game.move(move);


    if(!result){

        updateInterface();

        return;
    }


    lastMove = {

        from:result.from,

        to:result.to

    };


    if(result.captured){

        playSound("capture");

    }else{

        playSound("move");

    }


    if(game.in_check()){

        playSound("check");

    }


    ripple(result.to);

    renderBoard();
    renderMoves();
    updateInterface();


    checkGameOver();
}


/* =========================================================
   ENGINE EVALUATION
========================================================= */

function parseEngineEvaluation(line){

    const mate =
        line.match(
            /score mate (-?\d+)/
        );

    const cp =
        line.match(
            /score cp (-?\d+)/
        );


    /*
       Stockfish is called when BLACK is to move.

       UCI scores are from the side-to-move
       perspective, so invert them to display
       White's perspective.
    */

    if(mate){

        const mateNumber =
            parseInt(
                mate[1],
                10
            );


        const whiteMate =
            -mateNumber;


        if(whiteMate > 0){

            evalNumber.textContent =
                "M+" +
                whiteMate;

        }else{

            evalNumber.textContent =
                "M" +
                whiteMate;

        }


        evalFill.style.width =
            whiteMate > 0
            ? "96%"
            : "4%";


        return;
    }


    if(cp){

        const blackScore =
            parseInt(
                cp[1],
                10
            ) / 100;


        const whiteScore =
            -blackScore;


        const limited =
            Math.max(
                -10,
                Math.min(
                    10,
                    whiteScore
                )
            );


        evalNumber.textContent =
            (
                limited >= 0
                ? "+"
                : ""
            )
            +
            limited.toFixed(2);


        /*
           Smooth logistic-style evaluation bar.
        */

        const percent =
            50 +
            (
                limited / 10
            ) * 50;


        evalFill.style.width =
            Math.max(
                4,
                Math.min(
                    96,
                    percent
                )
            ) + "%";
    }
}


function updateEvaluation(value){

    if(value === 0){

        evalFill.style.width =
            "50%";

        evalNumber.textContent =
            "0.00";

    }
}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver(){

    if(game.is_checkmate()){

        gameEnded = true;

        if(game.turn() === "w"){

            showGameOver(
                "Checkmate",
                "Stockfish wins the game."
            );

        }else{

            showGameOver(
                "Checkmate",
                "You defeated Stockfish!"
            );

        }

        return true;
    }


    if(game.is_stalemate()){

        gameEnded = true;

        showGameOver(
            "Stalemate",
            "The game ends in a draw."
        );

        return true;
    }


    if(game.is_threefold_repetition()){

        gameEnded = true;

        showGameOver(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }


    if(game.is_insufficient_material()){

        gameEnded = true;

        showGameOver(
            "Draw",
            "There isn't enough material to checkmate."
        );

        return true;
    }


    if(game.is_draw()){

        gameEnded = true;

        showGameOver(
            "Draw",
            "The game ends in a draw."
        );

        return true;
    }


    return false;
}


function showGameOver(
    title,
    subtitle
){

    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

        }catch(error){}

    }


    engineThinking = false;

    enginePill.classList.remove(
        "thinking"
    );


    gameoverTitle.textContent =
        title;

    gameoverSub.textContent =
        subtitle;


    gameoverOverlay.classList.add(
        "show"
    );


    updateInterface();
}


/* =========================================================
   CLOCK
========================================================= */

function formatTime(seconds){

    seconds =
        Math.max(
            0,
            seconds
        );


    const minutes =
        Math.floor(
            seconds / 60
        );

    const remaining =
        seconds % 60;


    return (
        String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(remaining)
        .padStart(2,"0")
    );
}


function updateClocks(){

    whiteClock.textContent =
        formatTime(
            clocks.w
        );

    blackClock.textContent =
        formatTime(
            clocks.b
        );


    whiteClockBox.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameEnded
    );

    blackClockBox.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameEnded
    );
}


setInterval(
    () => {

        if(gameEnded) return;

        /*
           Don't start the clock until
           the engine has loaded.
        */

        if(!engineReady) return;


        const side =
            game.turn();


        clocks[side] =
            Math.max(
                0,
                clocks[side] - 1
            );


        updateClocks();


        if(clocks[side] <= 0){

            gameEnded = true;

            if(engine){

                try{

                    engine.postMessage(
                        "stop"
                    );

                }catch(error){}

            }


            engineThinking = false;

            enginePill.classList.remove(
                "thinking"
            );


            if(side === "w"){

                showGameOver(
                    "Time Out",
                    "Stockfish wins on time."
                );

            }else{

                showGameOver(
                    "Time Out",
                    "You win on time!"
                );

            }
        }

    },
    1000
);


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    gameVersion++;

    engineRequestVersion =
        gameVersion;


    if(engine){

        try{

            engine.postMessage(
                "stop"
            );

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        }catch(error){}

    }


    game.reset();


    selectedSquare = null;

    lastMove = null;

    promotionMove = null;

    engineThinking = false;

    gameEnded = false;


    clocks.w = 600;
    clocks.b = 600;


    promotionOverlay.classList.remove(
        "show"
    );

    gameoverOverlay.classList.remove(
        "show"
    );


    evalFill.style.width =
        "50%";

    evalNumber.textContent =
        "0.00";

    depthText.textContent =
        "Depth 0";


    enginePill.classList.remove(
        "thinking"
    );


    engineStatus.textContent =
        engineReady
        ? "Stockfish ready"
        : "Starting engine";


    renderBoard();
    renderMoves();
    updateInterface();
    updateClocks();
}


/* =========================================================
   UNDO
========================================================= */

document
.getElementById("undo")
.addEventListener(
    "click",
    () => {

        if(game.history().length === 0)
            return;


        if(engine){

            try{

                engine.postMessage(
                    "stop"
                );

            }catch(error){}

        }


        engineThinking = false;

        enginePill.classList.remove(
            "thinking"
        );


        gameVersion++;


        /*
           If it is White's turn,
           Stockfish just moved.

           Undo Black + White.

           If it is Black's turn,
           the player just moved.

           Undo only White.
        */

        if(
            game.turn() === "w"
        ){

            if(game.history().length >= 1)
                game.undo();

            if(game.history().length >= 1)
                game.undo();

        }else{

            game.undo();

        }


        gameEnded = false;

        selectedSquare = null;


        /*
           Restore last move highlight.
        */

        const history =
            game.history({
                verbose:true
            });


        if(history.length > 0){

            const last =
                history[
                    history.length - 1
                ];

            lastMove = {

                from:last.from,

                to:last.to

            };

        }else{

            lastMove = null;

        }


        gameoverOverlay.classList.remove(
            "show"
        );

        promotionOverlay.classList.remove(
            "show"
        );


        renderBoard();
        renderMoves();
        updateInterface();

    }
);


/* =========================================================
   NEW GAME BUTTONS
========================================================= */

document
.getElementById("newGame")
.addEventListener(
    "click",
    newGame
);


document
.getElementById("playAgain")
.addEventListener(
    "click",
    newGame
);


/* =========================================================
   DIFFICULTY
========================================================= */

difficulty.addEventListener(
    "change",
    () => {

        /*
           If Stockfish is currently thinking,
           stop the current search.

           The next move will use the
           newly selected depth.
        */

        if(engineThinking){

            try{

                engine.postMessage(
                    "stop"
                );

            }catch(error){}

            engineThinking = false;

            enginePill.classList.remove(
                "thinking"
            );

            updateInterface();
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderBoard();

renderMoves();

updateInterface();

updateClocks();

startEngine();

</script>
