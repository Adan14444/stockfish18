<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stockfish Chess — V2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#070910;
  --panel:rgba(18,22,34,.72);
  --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10);
  --text:#f5f7ff;
  --muted:#8e96aa;
  --accent:#8b7cff;
  --accent2:#57d9ff;

  --light:#dfe7f2;
  --dark:#66748b;

  --board-size:min(72vh, min(72vw, 760px));
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(105,88,255,.18),transparent 28%),
    radial-gradient(circle at 90% 85%,rgba(35,197,255,.12),transparent 30%),
    linear-gradient(145deg,#060810,#0a0d16 55%,#070910);
}

body:before{
  content:"";
  position:fixed;
  inset:-30%;
  pointer-events:none;
  background:
    radial-gradient(circle,rgba(139,124,255,.08) 0 1px,transparent 1px);
  background-size:42px 42px;
  transform:rotate(12deg);
  opacity:.4;
}

button,select{
  font:inherit;
}

button{
  color:inherit;
}

.app{
  width:min(1500px,96vw);
  margin:auto;
  min-height:100vh;
  padding:22px 0 35px;
  position:relative;
}

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  margin-bottom:22px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(15,18,29,.72);
  backdrop-filter:blur(22px);
  box-shadow:
    0 20px 60px rgba(0,0,0,.25),
    inset 0 1px rgba(255,255,255,.06);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:linear-gradient(135deg,#9d91ff,#4bd7ff);
  box-shadow:0 8px 25px rgba(102,125,255,.35);
}

.title{
  font-weight:800;
  letter-spacing:-.5px;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.engine-pill{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 13px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.045);
  color:#cbd1df;
  font-size:12px;
  font-weight:700;
}

.engine-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4cff9b;
  box-shadow:0 0 14px #4cff9b;
}

.engine-pill.thinking .engine-dot{
  animation:pulse .75s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(.7);opacity:.45}
  to{transform:scale(1.25);opacity:1}
}

.main{
  display:grid;
  grid-template-columns:minmax(500px,1fr) 350px;
  gap:25px;
  align-items:start;
}

.board-area{
  display:flex;
  justify-content:center;
}

.board-shell{
  width:var(--board-size);
  height:var(--board-size);
  padding:11px;
  border-radius:28px;
  position:relative;

  background:
    linear-gradient(145deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.035) 35%,
      rgba(0,0,0,.3));

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 35px 90px rgba(0,0,0,.48),
    0 0 80px rgba(100,100,255,.10),
    inset 0 1px rgba(255,255,255,.12);
}

.board{
  width:100%;
  height:100%;
  position:relative;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  overflow:hidden;
  border-radius:18px;
  isolation:isolate;
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  transition:
    filter .16s ease,
    box-shadow .16s ease;
}

.square.light{
  background:
    linear-gradient(145deg,#edf2f8,#d6dfeb);
}

.square.dark{
  background:
    linear-gradient(145deg,#718097,#59687e);
}

.square:hover{
  filter:brightness(1.08);
}

.square.last{
  box-shadow:inset 0 0 0 999px rgba(255,210,78,.18);
}

.square.selected{
  box-shadow:
    inset 0 0 0 999px rgba(123,108,255,.30),
    inset 0 0 30px rgba(123,108,255,.5);
}

.square.check{
  box-shadow:
    inset 0 0 0 999px rgba(255,57,82,.28),
    inset 0 0 38px rgba(255,44,70,.75);
  animation:checkPulse .9s infinite alternate;
}

@keyframes checkPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.16)}
}

.coord{
  position:absolute;
  font-size:10px;
  font-weight:800;
  opacity:.55;
  pointer-events:none;
  z-index:5;
}

.rank{
  top:4px;
  left:5px;
}

.file{
  right:5px;
  bottom:4px;
}

.light .coord{color:#647186}
.dark .coord{color:#e8edf5}

.piece{
  position:relative;
  z-index:4;
  font-family:"Times New Roman",Georgia,serif;
  font-size:clamp(38px,5.8vw,72px);
  line-height:1;
  transform:translateZ(0);
  transition:
    transform .16s cubic-bezier(.2,.9,.2,1),
    filter .16s ease;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.25));
  pointer-events:none;
}

.square:hover .piece{
  transform:translateY(-3px) scale(1.045);
}

.white-piece{
  color:#fff;
  text-shadow:
    0 2px 0 #c8d0dc,
    0 5px 8px rgba(0,0,0,.35);
}

.black-piece{
  color:#1c2028;
  text-shadow:
    0 1px 0 #515a69,
    0 5px 8px rgba(0,0,0,.42);
}

.move-dot{
  width:19%;
  aspect-ratio:1;
  border-radius:50%;
  position:absolute;
  background:rgba(50,40,30,.30);
  z-index:2;
  pointer-events:none;
}

.capture-ring{
  position:absolute;
  width:74%;
  height:74%;
  border-radius:50%;
  border:5px solid rgba(50,40,30,.30);
  z-index:2;
  pointer-events:none;
}

.ripple{
  position:absolute;
  width:15px;
  height:15px;
  border-radius:50%;
  background:rgba(255,255,255,.6);
  transform:scale(0);
  animation:ripple .55s ease-out forwards;
  pointer-events:none;
  z-index:8;
}

@keyframes ripple{
  to{
    transform:scale(8);
    opacity:0;
  }
}

.side{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--panel);
  backdrop-filter:blur(22px);
  box-shadow:
    0 20px 55px rgba(0,0,0,.22),
    inset 0 1px rgba(255,255,255,.055);
  overflow:hidden;
}

.status{
  padding:18px;
}

.status-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
  font-weight:800;
}

.status-text{
  font-size:18px;
  font-weight:800;
  margin-top:6px;
}

.thinking-text{
  color:#8d81ff;
}

.eval-wrap{
  margin-top:17px;
  height:13px;
  border-radius:999px;
  overflow:hidden;
  background:#111520;
  border:1px solid rgba(255,255,255,.07);
  position:relative;
}

.eval-fill{
  height:100%;
  width:50%;
  background:linear-gradient(90deg,#cbd5e1,#fff);
  transition:width .65s cubic-bezier(.2,.8,.2,1);
}

.eval-number{
  margin-top:7px;
  font-size:11px;
  color:var(--muted);
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.clocks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 18px 18px;
}

.clock{
  padding:13px;
  border-radius:15px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
}

.clock-name{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}

.clock-time{
  font-size:25px;
  margin-top:4px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.clock.active{
  border-color:rgba(139,124,255,.45);
  box-shadow:0 0 25px rgba(139,124,255,.10);
}

.moves{
  max-height:350px;
  min-height:250px;
  overflow:auto;
  padding:12px;
}

.moves::-webkit-scrollbar{
  width:5px;
}

.moves::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:99px;
}

.move-row{
  display:grid;
  grid-template-columns:35px 1fr 1fr;
  gap:5px;
  padding:8px 7px;
  border-radius:10px;
  font-size:13px;
  animation:moveIn .25s ease both;
}

@keyframes moveIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.move-row.latest{
  background:rgba(139,124,255,.12);
}

.move-number{
  color:var(--muted);
}

.move-white,.move-black{
  font-weight:700;
}

.controls{
  padding:15px;
  display:grid;
  gap:9px;
}

select,.btn{
  width:100%;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.055);
  padding:12px 13px;
  color:var(--text);
  outline:none;
}

select{
  cursor:pointer;
}

.btn{
  cursor:pointer;
  font-weight:800;
  transition:
    transform .15s ease,
    background .15s ease,
    border-color .15s ease;
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.09);
}

.btn:active{
  transform:translateY(0) scale(.98);
}

.btn.primary{
  background:linear-gradient(135deg,#7668ed,#5c91ff);
  border-color:transparent;
  box-shadow:0 10px 28px rgba(100,105,255,.24);
}

.btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.engine-info{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  padding:0 3px;
}

.promotion{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:center;
  background:rgba(2,4,10,.70);
  backdrop-filter:blur(12px);
}

.promotion.show{
  display:grid;
}

.promotion-box{
  width:min(420px,90vw);
  padding:24px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  background:rgba(17,20,31,.94);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
  text-align:center;
  animation:modalIn .25s cubic-bezier(.2,.9,.2,1);
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.92) translateY(15px)}
  to{opacity:1;transform:none}
}

.promotion-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:17px;
}

.promotion-options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.promo{
  font-size:45px;
  padding:13px 4px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;
  transition:.15s ease;
}

.promo:hover{
  transform:translateY(-4px);
  background:rgba(139,124,255,.16);
}

.gameover{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  place-items:center;
  background:rgba(2,4,10,.58);
  backdrop-filter:blur(8px);
}

.gameover.show{
  display:grid;
}

.gameover-box{
  text-align:center;
  padding:35px 45px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(15,18,29,.94);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
  animation:modalIn .3s ease;
}

.gameover-title{
  font-size:32px;
  font-weight:900;
}

.gameover-sub{
  color:var(--muted);
  margin:7px 0 22px;
}

@media(max-width:1000px){
  :root{
    --board-size:min(90vw,720px);
  }

  .main{
    grid-template-columns:1fr;
  }

  .side{
    width:min(720px,90vw);
    margin:auto;
  }
}

@media(max-width:560px){
  .app{
    width:96vw;
    padding-top:10px;
  }

  .topbar{
    height:60px;
    border-radius:17px;
  }

  .subtitle{
    display:none;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .board-shell{
    padding:7px;
    border-radius:20px;
  }

  .board{
    border-radius:14px;
  }

  .piece{
    font-size:11vw;
  }

  .main{
    gap:15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">♞</div>
      <div>
        <div class="title">Stockfish Chess</div>
        <div class="subtitle">Premium browser chess</div>
      </div>
    </div>

    <div class="engine-pill" id="enginePill">
      <span class="engine-dot"></span>
      <span id="engineStatus">Starting engine</span>
    </div>
  </header>

  <main class="main">

    <section class="board-area">
      <div class="board-shell">
        <div class="board" id="board"></div>
      </div>
    </section>

    <aside class="side">

      <section class="card status">
        <div class="status-top">
          <div>
            <div class="status-label">Game status</div>
            <div class="status-text" id="statusText">Your move</div>
          </div>
        </div>

        <div class="eval-wrap">
          <div class="eval-fill" id="evalFill"></div>
        </div>

        <div class="eval-number" id="evalNumber">0.00</div>
      </section>

      <section class="card">
        <div class="clocks">
          <div class="clock" id="whiteClockBox">
            <div class="clock-name">White</div>
            <div class="clock-time" id="whiteClock">10:00</div>
          </div>

          <div class="clock" id="blackClockBox">
            <div class="clock-name">Black</div>
            <div class="clock-time" id="blackClock">10:00</div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="moves" id="moves"></div>
      </section>

      <section class="card controls">

        <select id="difficulty">
          <option value="8">Beginner — Depth 8</option>
          <option value="12" selected>Intermediate — Depth 12</option>
          <option value="16">Advanced — Depth 16</option>
          <option value="20">Expert — Depth 20</option>
        </select>

        <div class="btn-row">
          <button class="btn primary" id="newGame">New Game</button>
          <button class="btn" id="undo">Undo</button>
        </div>

        <div class="engine-info">
          <span id="depthText">Depth 0</span>
          <span id="turnText">White to move</span>
        </div>

      </section>

    </aside>

  </main>
</div>

<div class="promotion" id="promotion">
  <div class="promotion-box">
    <div class="promotion-title">Choose your promotion</div>
    <div class="promotion-options">
      <button class="promo" data-piece="q">♕</button>
      <button class="promo" data-piece="r">♖</button>
      <button class="promo" data-piece="b">♗</button>
      <button class="promo" data-piece="n">♘</button>
    </div>
  </div>
</div>

<div class="gameover" id="gameover">
  <div class="gameover-box">
    <div class="gameover-title" id="gameoverTitle">Checkmate</div>
    <div class="gameover-sub" id="gameoverSub"></div>
    <button class="btn primary" id="gameoverNew">Play Again</button>
  </div>
</div>

<script>
/* =========================
   GAME
========================= */

const game = new Chess();

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const statusText = document.getElementById("statusText");
const evalFill = document.getElementById("evalFill");
const evalNumber = document.getElementById("evalNumber");
const engineStatus = document.getElementById("engineStatus");
const enginePill = document.getElementById("enginePill");
const depthText = document.getElementById("depthText");
const turnText = document.getElementById("turnText");

const whiteClockEl = document.getElementById("whiteClock");
const blackClockEl = document.getElementById("blackClock");
const whiteClockBox = document.getElementById("whiteClockBox");
const blackClockBox = document.getElementById("blackClockBox");

const promotion = document.getElementById("promotion");
const gameover = document.getElementById("gameover");
const gameoverTitle = document.getElementById("gameoverTitle");
const gameoverSub = document.getElementById("gameoverSub");

let selected = null;
let lastMove = null;
let pendingPromotion = null;

let engine = null;
let engineReady = false;
let engineThinking = false;
let gameId = 0;

let clocks = {
  w: 600,
  b: 600
};

let clockTimer = null;

const pieceSymbols = {
  wp:"♙",
  wn:"♘",
  wb:"♗",
  wr:"♖",
  wq:"♕",
  wk:"♔",
  bp:"♟",
  bn:"♞",
  bb:"♝",
  br:"♜",
  bq:"♛",
  bk:"♚"
};

/* =========================
   AUDIO
========================= */

let audioCtx = null;

function sound(type){
  try{
    if(!audioCtx)
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if(type === "capture"){
      osc.frequency.setValueAtTime(130,now);
      osc.frequency.exponentialRampToValueAtTime(70,now+.12);
      gain.gain.setValueAtTime(.07,now);
      gain.gain.exponentialRampToValueAtTime(.001,now+.13);
    }else if(type === "check"){
      osc.frequency.setValueAtTime(650,now);
      osc.frequency.exponentialRampToValueAtTime(900,now+.16);
      gain.gain.setValueAtTime(.045,now);
      gain.gain.exponentialRampToValueAtTime(.001,now+.18);
    }else{
      osc.frequency.setValueAtTime(330,now);
      osc.frequency.exponentialRampToValueAtTime(250,now+.07);
      gain.gain.setValueAtTime(.035,now);
      gain.gain.exponentialRampToValueAtTime(.001,now+.08);
    }

    osc.start(now);
    osc.stop(now+.2);
  }catch(e){}
}

/* =========================
   BOARD
========================= */

function renderBoard(){

  board.innerHTML = "";

  const position = game.board();

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){

      const squareName =
        String.fromCharCode(97+c) + (8-r);

      const sq = document.createElement("div");

      sq.className =
        "square " + (((r+c)%2===0) ? "light" : "dark");

      sq.dataset.square = squareName;

      if(lastMove &&
        (lastMove.from === squareName ||
         lastMove.to === squareName)){
        sq.classList.add("last");
      }

      if(selected === squareName){
        sq.classList.add("selected");
      }

      const piece = position[r][c];

      if(piece){

        const p = document.createElement("div");

        p.className =
          "piece " +
          (piece.color === "w" ? "white-piece" : "black-piece");

        p.textContent =
          pieceSymbols[piece.color + piece.type];

        sq.appendChild(p);
      }

      const rank = document.createElement("span");
      rank.className = "coord rank";
      rank.textContent = c === 0 ? (8-r) : "";

      const file = document.createElement("span");
      file.className = "coord file";
      file.textContent = r === 7 ? String.fromCharCode(97+c) : "";

      sq.appendChild(rank);
      sq.appendChild(file);

      sq.addEventListener("click",()=>handleSquare(squareName));

      board.appendChild(sq);
    }
  }

  if(selected){
    showLegalMoves(selected);
  }

  markKingCheck();
}

function showLegalMoves(square){

  const moves = game.moves({
    square,
    verbose:true
  });

  moves.forEach(move=>{

    const el =
      board.querySelector(`[data-square="${move.to}"]`);

    if(!el) return;

    if(move.captured){
      const ring = document.createElement("div");
      ring.className = "capture-ring";
      el.appendChild(ring);
    }else{
      const dot = document.createElement("div");
      dot.className = "move-dot";
      el.appendChild(dot);
    }
  });
}

function markKingCheck(){

  if(!game.in_check()) return;

  const color = game.turn();

  const boardData = game.board();

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){

      const p = boardData[r][c];

      if(p && p.type === "k" && p.color === color){

        const sq =
          String.fromCharCode(97+c)+(8-r);

        const el =
          board.querySelector(`[data-square="${sq}"]`);

        if(el) el.classList.add("check");
      }
    }
  }
}

function createRipple(square){

  const el =
    board.querySelector(`[data-square="${square}"]`);

  if(!el) return;

  const ripple = document.createElement("div");
  ripple.className = "ripple";

  el.appendChild(ripple);

  setTimeout(()=>ripple.remove(),600);
}

/* =========================
   MOVING
========================= */

function handleSquare(square){

  if(engineThinking || game.game_over()) return;

  if(game.turn() !== "w") return;

  const piece = game.get(square);

  if(!selected){

    if(piece && piece.color === game.turn()){

      selected = square;
      renderBoard();

      return;
    }
  }

  if(selected){

    const possible =
      game.moves({
        square:selected,
        verbose:true
      });

    const move = possible.find(m=>m.to === square);

    if(!move){

      if(piece && piece.color === game.turn()){

        selected = square;
        renderBoard();

      }else{

        selected = null;
        renderBoard();
      }

      return;
    }

    if(move.promotion){

      pendingPromotion = {
        from:selected,
        to:square
      };

      promotion.classList.add("show");
      return;
    }

    makeMove({
      from:selected,
      to:square
    });
  }
}

function makeMove(move){

  const movingColor = game.turn();

  const result = game.move(move);

  if(!result) return;

  selected = null;
  lastMove = {
    from:result.from,
    to:result.to
  };

  createRipple(result.to);

  if(result.captured){
    sound("capture");
  }else{
    sound("move");
  }

  if(game.in_check()){
    sound("check");
  }

  renderBoard();
  renderMoves();
  updateStatus();
  updateClocks();

  if(game.game_over()){

    endGame();
    return;
  }

  if(movingColor === "w"){

    requestEngine();

  }
}

/* =========================
   PROMOTION
========================= */

document.querySelectorAll(".promo").forEach(button=>{

  button.addEventListener("click",()=>{

    const piece = button.dataset.piece;

    promotion.classList.remove("show");

    if(!pendingPromotion) return;

    makeMove({
      from:pendingPromotion.from,
      to:pendingPromotion.to,
      promotion:piece
    });

    pendingPromotion = null;
  });

});

/* =========================
   MOVE HISTORY
========================= */

function renderMoves(){

  movesEl.innerHTML = "";

  const history = game.history();

  if(history.length === 0){

    const empty = document.createElement("div");

    empty.style.color = "var(--muted)";
    empty.style.textAlign = "center";
    empty.style.padding = "35px 10px";
    empty.style.fontSize = "12px";

    empty.textContent = "Your game begins here";

    movesEl.appendChild(empty);

    return;
  }

  for(let i=0;i<history.length;i+=2){

    const row = document.createElement("div");

    row.className = "move-row";

    if(i >= history.length-2)
      row.classList.add("latest");

    const num = document.createElement("div");
    num.className = "move-number";
    num.textContent = (i/2)+1;

    const white = document.createElement("div");
    white.className = "move-white";
    white.textContent = history[i] || "";

    const black = document.createElement("div");
    black.className = "move-black";
    black.textContent = history[i+1] || "";

    row.append(num,white,black);

    movesEl.appendChild(row);
  }

  movesEl.scrollTop = movesEl.scrollHeight;
}

/* =========================
   STATUS
========================= */

function updateStatus(){

  turnText.textContent =
    game.turn() === "w"
      ? "White to move"
      : "Black to move";

  if(game.game_over()) return;

  if(engineThinking){

    statusText.textContent = "Stockfish is thinking…";
    statusText.classList.add("thinking-text");

  }else if(game.in_check()){

    statusText.textContent =
      game.turn() === "w"
        ? "Check — your king is attacked!"
        : "Check!";

    statusText.classList.remove("thinking-text");

  }else{

    statusText.textContent =
      game.turn() === "w"
        ? "Your move"
        : "Stockfish's move";

    statusText.classList.remove("thinking-text");
  }
}

/* =========================
   ENGINE
========================= */

function startEngine(){

  try{

    engine = new Worker("./stockfish-18-lite-single.js");

    engine.onmessage = handleEngineMessage;

    engine.onerror = function(){

      engineReady = false;
      engineThinking = false;

      engineStatus.textContent = "Engine error";
      enginePill.classList.remove("thinking");

      statusText.textContent =
        "Stockfish failed to load";

    };

    engine.postMessage("uci");

  }catch(e){

    engineStatus.textContent = "Engine unavailable";
  }
}

function handleEngineMessage(event){

  const line = String(event.data);

  if(line === "uciok"){

    engine.postMessage("isready");
    return;
  }

  if(line === "readyok"){

    engineReady = true;

    engineStatus.textContent = "Stockfish ready";

    updateStatus();

    return;
  }

  if(line.startsWith("info")){

    parseEvaluation(line);

    const depth =
      line.match(/\bdepth\s+(\d+)/);

    if(depth){
      depthText.textContent =
        "Depth " + depth[1];
    }

    return;
  }

  if(line.startsWith("bestmove")){

    if(!engineThinking) return;

    const move =
      line.match(/^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/);

    if(!move){

      engineThinking = false;
      enginePill.classList.remove("thinking");
      updateStatus();
      return;
    }

    const moveString = move[1];

    engineThinking = false;
    enginePill.classList.remove("thinking");

    const idAtRequest = currentEngineGameId;

    if(idAtRequest !== gameId){
      updateStatus();
      return;
    }

    const obj = {
      from:moveString.substring(0,2),
      to:moveString.substring(2,4)
    };

    if(moveString.length > 4)
      obj.promotion = moveString[4];

    makeEngineMove(obj);
  }
}

let currentEngineGameId = 0;

function requestEngine(){

  if(!engineReady || game.game_over()) return;

  engineThinking = true;
  currentEngineGameId = gameId;

  enginePill.classList.add("thinking");
  engineStatus.textContent = "Thinking…";

  updateStatus();

  const depth =
    parseInt(document.getElementById("difficulty").value,10);

  engine.postMessage("stop");

  engine.postMessage("position fen " + game.fen());

  engine.postMessage("go depth " + depth);
}

function makeEngineMove(move){

  if(game.game_over()) return;

  if(game.turn() !== "b") return;

  const result = game.move(move);

  if(!result){
    updateStatus();
    return;
  }

  lastMove = {
    from:result.from,
    to:result.to
  };

  createRipple(result.to);

  if(result.captured)
    sound("capture");
  else
    sound("move");

  if(game.in_check())
    sound("check");

  renderBoard();
  renderMoves();
  updateStatus();
  updateClocks();

  if(game.game_over()){
    endGame();
  }
}

/* =========================
   EVALUATION
========================= */

function parseEvaluation(line){

  const cpMatch =
    line.match(/score cp (-?\d+)/);

  const mateMatch =
    line.match(/score mate (-?\d+)/);

  let score = 0;

  if(mateMatch){

    const mate = parseInt(mateMatch[1]);

    score = mate > 0 ? 9 : -9;

    evalNumber.textContent =
      mate > 0
        ? "Mate +" + mate
        : "Mate " + mate;

  }else if(cpMatch){

    let cp =
      parseInt(cpMatch[1],10) / 100;

    cp = Math.max(-10,Math.min(10,cp));

    score = cp;

    evalNumber.textContent =
      (cp >= 0 ? "+" : "") + cp.toFixed(2);
  }

  const percentage =
    50 + (score / 10) * 50;

  evalFill.style.width =
    Math.max(4,Math.min(96,percentage)) + "%";
}

/* =========================
   UNDO
========================= */

document.getElementById("undo").addEventListener("click",()=>{

  if(engineThinking){

    engine.postMessage("stop");
    engineThinking = false;

  }

  if(game.history().length === 0) return;

  game.undo();

  if(game.turn() === "b" && game.history().length > 0){
    game.undo();
  }

  gameId++;

  selected = null;
  lastMove = null;

  renderBoard();
  renderMoves();
  updateStatus();

});

/* =========================
   NEW GAME
========================= */

function newGame(){

  gameId++;

  if(engine){

    try{
      engine.postMessage("stop");
      engine.postMessage("ucinewgame");
      engine.postMessage("isready");
    }catch(e){}
  }

  game.reset();

  selected = null;
  lastMove = null;
  pendingPromotion = null;

  engineThinking = false;

  clocks.w = 600;
  clocks.b = 600;

  promotion.classList.remove("show");
  gameover.classList.remove("show");

  evalFill.style.width = "50%";
  evalNumber.textContent = "0.00";
  depthText.textContent = "Depth 0";

  enginePill.classList.remove("thinking");
  engineStatus.textContent =
    engineReady ? "Stockfish ready" : "Starting engine";

  renderBoard();
  renderMoves();
  updateStatus();
  updateClocks();
}

document.getElementById("newGame")
  .addEventListener("click",newGame);

document.getElementById("gameoverNew")
  .addEventListener("click",newGame);

/* =========================
   GAME OVER
========================= */

function endGame(){

  engineThinking = false;
  enginePill.classList.remove("thinking");

  let title = "Game Over";
  let sub = "";

  if(game.is_checkmate()){

    title = "Checkmate";

    sub =
      game.turn() === "w"
        ? "Stockfish wins the game."
        : "You defeated Stockfish!";

  }else if(game.is_stalemate()){

    title = "Stalemate";
    sub = "The game ends in a draw.";

  }else if(game.is_threefold_repetition()){

    title = "Threefold Repetition";
    sub = "The game ends in a draw.";

  }else if(game.is_insufficient_material()){

    title = "Draw";
    sub = "There isn't enough material to checkmate.";

  }else if(game.is_draw()){

    title = "Draw";
    sub = "The game ends in a draw.";
  }

  gameoverTitle.textContent = title;
  gameoverSub.textContent = sub;

  gameover.classList.add("show");

  updateStatus();
}

/* =========================
   CLOCKS
========================= */

function formatTime(seconds){

  seconds = Math.max(0,seconds);

  const min =
    Math.floor(seconds/60);

  const sec =
    seconds % 60;

  return (
    String(min).padStart(2,"0") +
    ":" +
    String(sec).padStart(2,"0")
  );
}

function updateClocks(){

  whiteClockEl.textContent =
    formatTime(clocks.w);

  blackClockEl.textContent =
    formatTime(clocks.b);

  whiteClockBox.classList.toggle(
    "active",
    game.turn() === "w" && !game.game_over()
  );

  blackClockBox.classList.toggle(
    "active",
    game.turn() === "b" && !game.game_over()
  );
}

clockTimer = setInterval(()=>{

  if(game.game_over()) return;

  const side = game.turn();

  clocks[side]--;

  updateClocks();

  if(clocks[side] <= 0){

    gameoverTitle.textContent =
      side === "w"
        ? "Time Out"
        : "Stockfish Time Out";

    gameoverSub.textContent =
      side === "w"
        ? "Stockfish wins on time."
        : "You win on time!";

    gameover.classList.add("show");

    if(engine){
      try{
        engine.postMessage("stop");
      }catch(e){}
    }

    engineThinking = false;
    enginePill.classList.remove("thinking");

  }

},1000);

/* =========================
   DIFFICULTY
========================= */

document.getElementById("difficulty")
  .addEventListener("change",()=>{

    if(engineThinking){

      try{
        engine.postMessage("stop");
      }catch(e){}

      engineThinking = false;
      enginePill.classList.remove("thinking");
    }

    updateStatus();
  });

/* =========================
   START
========================= */

renderBoard();
renderMoves();
updateStatus();
updateClocks();
startEngine();

</script>
