<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockfish — Premium Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  background: #070a0f;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #f4f7fb;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(77, 113, 170, .18),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(115, 83, 180, .14),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #06090e,
      #0c111b 50%,
      #080b11
    );

  overflow-x: hidden;
}

/* =========================================================
   BACKGROUND LIGHT
========================================================= */

body::before {
  content: "";

  position: fixed;

  width: 650px;
  height: 650px;

  left: 50%;
  top: -350px;

  transform: translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(125, 170, 255, .08),
      transparent 68%
    );

  pointer-events: none;
}

/* =========================================================
   APP
========================================================= */

.app {
  width: min(1500px, 100%);
  margin: auto;

  padding:
    28px
    28px
    45px;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 25px;

  padding:
    15px
    18px;

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(24,31,44,.82),
      rgba(12,17,26,.72)
    );

  box-shadow:
    0 15px 45px rgba(0,0,0,.3);

  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-icon {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #aeb8c8
    );

  color: #111722;

  font-size: 25px;

  box-shadow:
    0 5px 20px rgba(255,255,255,.08);
}

.brand-name {
  font-weight: 800;

  letter-spacing: 1.5px;

  font-size: 18px;
}

.brand-subtitle {
  color: #7f8ba0;

  font-size: 12px;

  margin-top: 2px;
}

.engine-pill {
  display: flex;
  align-items: center;
  gap: 8px;

  padding:
    8px
    12px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.07);

  color: #aab5c8;

  font-size: 12px;
}

.engine-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #777;

  box-shadow:
    0 0 10px rgba(255,255,255,.15);
}

.engine-dot.ready {
  background: #62e6a5;

  box-shadow:
    0 0 14px rgba(98,230,165,.65);
}

/* =========================================================
   MAIN
========================================================= */

.main {
  display: grid;

  grid-template-columns:
    minmax(420px, 850px)
    minmax(290px, 360px);

  gap: 24px;

  justify-content: center;

  align-items: start;
}

/* =========================================================
   BOARD AREA
========================================================= */

.board-section {
  position: relative;
}

.board-shell {
  position: relative;

  width: 100%;

  aspect-ratio: 1;

  padding: 9px;

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      #39475e,
      #151c29 42%,
      #0d121b
    );

  box-shadow:
    0 35px 90px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.05),
    inset 0 1px 0 rgba(255,255,255,.08);

  animation:
    boardEnter .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes boardEnter {
  from {
    opacity: 0;
    transform: translateY(14px) scale(.985);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.board {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    repeat(8, minmax(0,1fr));

  grid-template-rows:
    repeat(8, minmax(0,1fr));

  overflow: hidden;

  border-radius: 17px;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.25);
}

/* =========================================================
   SQUARES
========================================================= */

.square {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  user-select: none;

  transition:
    filter .14s ease,
    box-shadow .14s ease;
}

.light {
  background:
    linear-gradient(
      145deg,
      #dfe8f3,
      #c9d5e4
    );
}

.dark {
  background:
    linear-gradient(
      145deg,
      #617894,
      #506983
    );
}

.square:hover {
  filter: brightness(1.08);
}

/* =========================================================
   COORDINATES
========================================================= */

.coordinate {
  position: absolute;

  font-size: 11px;

  font-weight: 700;

  opacity: .65;

  pointer-events: none;
}

.file-coordinate {
  bottom: 5px;
  right: 7px;
}

.rank-coordinate {
  top: 5px;
  left: 7px;
}

.light .coordinate {
  color: #617087;
}

.dark .coordinate {
  color: #dce5f0;
}

/* =========================================================
   LAST MOVE
========================================================= */

.last-move {
  box-shadow:
    inset 0 0 0 999px
    rgba(245, 204, 74, .17);
}

/* =========================================================
   SELECTED
========================================================= */

.selected {
  box-shadow:
    inset 0 0 0 4px
    rgba(255, 220, 90, .95),
    inset 0 0 35px
    rgba(255,220,90,.16);
}

/* =========================================================
   LEGAL MOVES
========================================================= */

.possible::after {
  content: "";

  position: absolute;

  width: 20%;
  height: 20%;

  border-radius: 50%;

  background:
    rgba(25,31,40,.42);

  box-shadow:
    0 1px 5px rgba(0,0,0,.25);

  animation:
    dotIn .15s ease;
}

@keyframes dotIn {
  from {
    opacity: 0;
    transform: scale(.4);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.capture::after {
  content: "";

  position: absolute;

  width: 76%;
  height: 76%;

  border-radius: 50%;

  border:
    4px solid
    rgba(255,255,255,.58);

  box-shadow:
    inset 0 0 0 999px
    rgba(190,45,55,.10);

  animation:
    capturePulse .7s ease infinite alternate;
}

@keyframes capturePulse {
  from {
    opacity: .65;
  }

  to {
    opacity: 1;
  }
}

/* =========================================================
   CHECK
========================================================= */

.in-check {
  background:
    radial-gradient(
      circle,
      rgba(255,67,67,.65),
      rgba(190,40,50,.35)
    ) !important;

  box-shadow:
    inset 0 0 35px
    rgba(255,50,50,.45);
}

/* =========================================================
   PIECES
========================================================= */

.piece {
  position: relative;

  z-index: 5;

  font-family:
    "Arial Unicode MS",
    "DejaVu Sans",
    sans-serif;

  font-size:
    clamp(34px, 7vw, 78px);

  line-height: 1;

  transform-origin: center;

  transition:
    transform .12s cubic-bezier(.2,.8,.2,1);

  pointer-events: none;
}

.square:hover .piece {
  transform: translateY(-2px) scale(1.035);
}

/* White */

.white-piece {
  color: #ffffff;

  text-shadow:
    0 2px 0 #c7ced8,
    0 5px 8px rgba(0,0,0,.42),
    0 0 2px #4a5260;
}

/* Black */

.black-piece {
  color: #161b24;

  text-shadow:
    0 2px 0 #303845,
    0 5px 8px rgba(0,0,0,.55),
    0 0 2px rgba(255,255,255,.35);
}

/* =========================================================
   SIDE PANEL
========================================================= */

.panel {
  min-width: 0;

  border:
    1px solid rgba(255,255,255,.075);

  border-radius: 22px;

  padding: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(25,33,47,.9),
      rgba(13,18,28,.88)
    );

  box-shadow:
    0 25px 65px rgba(0,0,0,.4);

  backdrop-filter: blur(20px);

  animation:
    panelEnter .7s .08s both
    cubic-bezier(.2,.8,.2,1);
}

@keyframes panelEnter {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================================
   STATUS
========================================================= */

.status-card {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 14px;

  border-radius: 15px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.055);

  margin-bottom: 14px;
}

.status-icon {
  width: 35px;
  height: 35px;

  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background:
    rgba(255,255,255,.07);

  font-size: 17px;
}

.status-main {
  font-size: 14px;

  font-weight: 700;
}

.status-sub {
  color: #7f8b9f;

  font-size: 11px;

  margin-top: 3px;
}

/* =========================================================
   EVALUATION
========================================================= */

.eval-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    18px
    2px
    7px;
}

.eval-title {
  color: #7f8b9f;

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 1px;
}

.eval-value {
  font-size: 12px;

  font-weight: 800;

  color: #dce5f3;
}

.eval-container {
  height: 15px;

  border-radius: 99px;

  overflow: hidden;

  background: #090c11;

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 2px 5px rgba(0,0,0,.5);
}

.eval-fill {
  height: 100%;

  width: 50%;

  background:
    linear-gradient(
      90deg,
      #5e6b7d,
      #f4f6f9
    );

  transition:
    width .45s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin-top: 17px;
}

.control {
  padding: 12px;

  border-radius: 13px;

  border:
    1px solid rgba(255,255,255,.07);

  background:
    rgba(255,255,255,.045);

  color: #e8edf5;

  cursor: pointer;

  font-size: 12px;

  font-weight: 700;

  transition:
    background .15s ease,
    transform .15s ease,
    border-color .15s ease;
}

.control:hover {
  background:
    rgba(255,255,255,.08);

  border-color:
    rgba(255,255,255,.13);

  transform: translateY(-1px);
}

.control.primary {
  background:
    linear-gradient(
      135deg,
      #4d7dff,
      #765cff
    );

  border-color:
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(80,100,255,.2);
}

.control:active {
  transform: translateY(0);
}

/* =========================================================
   SELECT
========================================================= */

.settings {
  margin-top: 16px;

  padding-top: 15px;

  border-top:
    1px solid
    rgba(255,255,255,.06);
}

.setting-row {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 10px;
}

.setting-label {
  color: #8d99ac;

  font-size: 12px;
}

select {
  color: #edf2f9;

  background:
    #161d29;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius: 9px;

  padding:
    7px
    9px;

  outline: none;

  font-weight: 700;
}

/* =========================================================
   MOVES
========================================================= */

.moves-title {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 19px;

  margin-bottom: 9px;
}

.moves-title h2 {
  margin: 0;

  font-size: 15px;
}

.move-count {
  color: #68758a;

  font-size: 11px;
}

.moves {
  height: 280px;

  overflow-y: auto;

  border-radius: 14px;

  background:
    rgba(0,0,0,.17);

  border:
    1px solid rgba(255,255,255,.045);

  padding: 7px;

  scrollbar-width: thin;
}

.moves::-webkit-scrollbar {
  width: 5px;
}

.moves::-webkit-scrollbar-thumb {
  background: #3a4556;

  border-radius: 99px;
}

.move-row {
  display: grid;

  grid-template-columns:
    38px 1fr 1fr;

  padding:
    9px
    7px;

  border-radius: 9px;

  font-size: 12px;

  transition:
    background .15s ease;
}

.move-row:hover {
  background:
    rgba(255,255,255,.045);
}

.move-number {
  color: #647188;

  font-weight: 700;
}

.move-white,
.move-black {
  color: #dce4f0;

  font-weight: 600;
}

.empty-moves {
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #566174;

  font-size: 12px;
}

/* =========================================================
   CLOCKS
========================================================= */

.clocks {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin-top: 14px;
}

.clock {
  padding: 11px 13px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.04);

  border:
    1px solid rgba(255,255,255,.055);
}

.clock-label {
  color: #68758a;

  font-size: 9px;

  text-transform: uppercase;

  letter-spacing: 1px;
}

.clock-time {
  margin-top: 3px;

  font-size: 18px;

  font-weight: 800;

  letter-spacing: 1px;
}

.clock.active {
  border-color:
    rgba(91,137,255,.45);

  box-shadow:
    inset 0 0 20px
    rgba(80,120,255,.07);
}

/* =========================================================
   THINKING
========================================================= */

.thinking {
  display: none;

  align-items: center;

  gap: 6px;

  color: #8290a6;

  font-size: 10px;

  margin-top: 12px;
}

.thinking.show {
  display: flex;
}

.thinking-dot {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: #7d9cff;

  animation:
    think 1s infinite ease-in-out;
}

.thinking-dot:nth-child(2) {
  animation-delay: .15s;
}

.thinking-dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes think {
  0%, 80%, 100% {
    opacity: .25;
    transform: translateY(0);
  }

  40% {
    opacity: 1;
    transform: translateY(-3px);
  }
}

/* =========================================================
   GAME OVER
========================================================= */

.game-over {
  position: absolute;

  inset: 9px;

  display: none;

  align-items: center;
  justify-content: center;

  border-radius: 17px;

  background:
    rgba(5,8,13,.73);

  backdrop-filter:
    blur(8px);

  z-index: 30;
}

.game-over.show {
  display: flex;
}

.game-over-card {
  width: min(320px, 80%);

  padding: 27px;

  text-align: center;

  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(30,39,55,.96),
      rgba(13,18,27,.97)
    );

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.6);

  animation:
    pop .3s ease;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.9);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.game-over-icon {
  font-size: 42px;

  margin-bottom: 8px;
}

.game-over-title {
  font-size: 23px;

  font-weight: 800;
}

.game-over-sub {
  color: #8995a8;

  font-size: 12px;

  margin-top: 6px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

  .main {
    grid-template-columns: 1fr;
  }

  .panel {
    max-width: 850px;

    width: 100%;

    margin: auto;
  }
}

@media (max-width: 600px) {

  .app {
    padding:
      12px
      12px
      30px;
  }

  .topbar {
    padding: 12px;
  }

  .brand-name {
    font-size: 15px;
  }

  .engine-pill {
    display: none;
  }

  .board-shell {
    padding: 6px;

    border-radius: 18px;
  }

  .board {
    border-radius: 12px;
  }

  .piece {
    font-size: 11vw;
  }

  .coordinate {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        ♞
      </div>

      <div>
        <div class="brand-name">
          STOCKFISH
        </div>

        <div class="brand-subtitle">
          Premium Chess
        </div>
      </div>

    </div>


    <div class="engine-pill">

      <span
        id="engineDot"
        class="engine-dot">
      </span>

      <span id="engineText">
        Connecting to engine...
      </span>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <!-- BOARD -->

    <section class="board-section">

      <div class="board-shell">

        <div
          id="board"
          class="board">
        </div>


        <!-- GAME OVER -->

        <div
          id="gameOver"
          class="game-over">

          <div class="game-over-card">

            <div
              id="gameOverIcon"
              class="game-over-icon">
              🏆
            </div>

            <div
              id="gameOverTitle"
              class="game-over-title">
              Game Over
            </div>

            <div
              id="gameOverSub"
              class="game-over-sub">
              Well played.
            </div>

            <button
              class="control primary"
              style="width:100%; margin-top:18px;"
              onclick="newGame()">
              Play Again
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- SIDE PANEL -->

    <aside class="panel">

      <!-- STATUS -->

      <div class="status-card">

        <div
          id="statusIcon"
          class="status-icon">
          ♙
        </div>

        <div>

          <div
            id="statusMain"
            class="status-main">
            Starting Stockfish...
          </div>

          <div
            id="statusSub"
            class="status-sub">
            Initializing chess engine
          </div>

        </div>

      </div>


      <!-- EVALUATION -->

      <div class="eval-header">

        <span class="eval-title">
          Engine Evaluation
        </span>

        <span
          id="evalValue"
          class="eval-value">
          0.00
        </span>

      </div>

      <div class="eval-container">

        <div
          id="evalFill"
          class="eval-fill">
        </div>

      </div>


      <!-- CLOCKS -->

      <div class="clocks">

        <div
          id="whiteClock"
          class="clock active">

          <div class="clock-label">
            You · White
          </div>

          <div
            id="whiteTime"
            class="clock-time">
            10:00
          </div>

        </div>


        <div
          id="blackClock"
          class="clock">

          <div class="clock-label">
            Engine · Black
          </div>

          <div
            id="blackTime"
            class="clock-time">
            10:00
          </div>

        </div>

      </div>


      <!-- THINKING -->

      <div
        id="thinking"
        class="thinking">

        <span>
          Stockfish is thinking
        </span>

        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>

      </div>


      <!-- BUTTONS -->

      <div class="controls">

        <button
          class="control primary"
          onclick="newGame()">
          ↻ New Game
        </button>

        <button
          class="control"
          onclick="undoMove()">
          ↶ Undo
        </button>

      </div>


      <!-- SETTINGS -->

      <div class="settings">

        <div class="setting-row">

          <span class="setting-label">
            Difficulty
          </span>

          <select id="difficulty">

            <option value="8">
              Beginner
            </option>

            <option value="12" selected>
              Intermediate
            </option>

            <option value="16">
              Advanced
            </option>

            <option value="20">
              Expert
            </option>

          </select>

        </div>

      </div>


      <!-- MOVES -->

      <div class="moves-title">

        <h2>
          Move History
        </h2>

        <span
          id="moveCount"
          class="move-count">
          0 moves
        </span>

      </div>


      <div
        id="moves"
        class="moves">

        <div class="empty-moves">
          Your game starts here
        </div>

      </div>

    </aside>

  </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const boardElement =
  document.getElementById("board");

const statusMain =
  document.getElementById("statusMain");

const statusSub =
  document.getElementById("statusSub");

const statusIcon =
  document.getElementById("statusIcon");

const movesElement =
  document.getElementById("moves");

const moveCount =
  document.getElementById("moveCount");

const evalFill =
  document.getElementById("evalFill");

const evalValue =
  document.getElementById("evalValue");

const engineDot =
  document.getElementById("engineDot");

const engineText =
  document.getElementById("engineText");

const thinkingElement =
  document.getElementById("thinking");

const difficulty =
  document.getElementById("difficulty");

const whiteTime =
  document.getElementById("whiteTime");

const blackTime =
  document.getElementById("blackTime");

const whiteClock =
  document.getElementById("whiteClock");

const blackClock =
  document.getElementById("blackClock");

const gameOver =
  document.getElementById("gameOver");

const gameOverIcon =
  document.getElementById("gameOverIcon");

const gameOverTitle =
  document.getElementById("gameOverTitle");

const gameOverSub =
  document.getElementById("gameOverSub");


/* =========================================================
   CHESS
========================================================= */

let game =
  new Chess();

let engine =
  null;

let engineReady =
  false;

let thinking =
  false;

let selectedSquare =
  null;

let lastMove =
  null;

let whiteSeconds =
  600;

let blackSeconds =
  600;

let clockInterval =
  null;


/* =========================================================
   PIECES
========================================================= */

const pieces = {

  wK: "♔",
  wQ: "♕",
  wR: "♖",
  wB: "♗",
  wN: "♘",
  wP: "♙",

  bK: "♚",
  bQ: "♛",
  bR: "♜",
  bB: "♝",
  bN: "♞",
  bP: "♟"

};


/* =========================================================
   SOUND
========================================================= */

let audioContext = null;

function playSound(type) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    let frequency = 420;

    if (type === "capture") {
      frequency = 260;
    }

    if (type === "check") {
      frequency = 620;
    }


    oscillator.frequency.value =
      frequency;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .045,
      audioContext.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioContext.currentTime + .12
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + .13
    );

  } catch (e) {}

}


/* =========================================================
   DRAW BOARD
========================================================= */

function drawBoard() {

  boardElement.innerHTML = "";

  const board =
    game.board();


  for (
    let row = 0;
    row < 8;
    row++
  ) {

    for (
      let col = 0;
      col < 8;
      col++
    ) {

      const square =
        document.createElement("div");


      const file =
        String.fromCharCode(
          97 + col
        );

      const rank =
        8 - row;

      const name =
        file + rank;


      square.className =
        "square " +
        (
          (row + col) % 2 === 0
            ? "light"
            : "dark"
        );


      square.dataset.square =
        name;


      /* Last move */

      if (
        lastMove &&
        (
          name === lastMove.from ||
          name === lastMove.to
        )
      ) {

        square.classList.add(
          "last-move"
        );

      }


      /* Selected */

      if (
        name === selectedSquare
      ) {

        square.classList.add(
          "selected"
        );

      }


      /* Check */

      if (
        game.in_check()
      ) {

        const piece =
          board[row][col];


        if (
          piece &&
          piece.type === "k" &&
          piece.color === game.turn()
        ) {

          square.classList.add(
            "in-check"
          );

        }

      }


      /* Piece */

      const piece =
        board[row][col];


      if (piece) {

        const span =
          document.createElement(
            "span"
          );


        span.className =
          "piece " +
          (
            piece.color === "w"
              ? "white-piece"
              : "black-piece"
          );


        span.textContent =
          pieces[
            piece.color +
            piece.type.toUpperCase()
          ];


        square.appendChild(
          span
        );

      }


      /* Coordinates */

      if (row === 7) {

        const coord =
          document.createElement(
            "span"
          );

        coord.className =
          "coordinate file-coordinate";

        coord.textContent =
          file;

        square.appendChild(
          coord
        );

      }


      if (col === 0) {

        const coord =
          document.createElement(
            "span"
          );

        coord.className =
          "coordinate rank-coordinate";

        coord.textContent =
          rank;

        square.appendChild(
          coord
        );

      }


      square.onclick =
        () => clickSquare(name);


      boardElement.appendChild(
        square
      );

    }

  }


  if (selectedSquare) {

    highlightMoves(
      selectedSquare
    );

  }

}


/* =========================================================
   LEGAL MOVES
========================================================= */

function highlightMoves(square) {

  const moves =
    game.moves({
      square: square,
      verbose: true
    });


  moves.forEach(
    move => {

      const target =
        document.querySelector(
          `[data-square="${move.to}"]`
        );


      if (!target) {
        return;
      }


      if (move.captured) {

        target.classList.add(
          "capture"
        );

      } else {

        target.classList.add(
          "possible"
        );

      }

    }
  );

}


/* =========================================================
   CLICK
========================================================= */

function clickSquare(square) {

  if (
    !engineReady ||
    thinking ||
    game.game_over()
  ) {

    return;

  }


  /* Only allow White */

  if (
    game.turn() !== "w"
  ) {

    return;

  }


  const piece =
    game.get(square);


  /* Select */

  if (!selectedSquare) {

    if (
      !piece ||
      piece.color !== "w"
    ) {

      return;

    }


    selectedSquare =
      square;

    drawBoard();

    return;

  }


  /* Reselect */

  if (
    piece &&
    piece.color === "w"
  ) {

    selectedSquare =
      square;

    drawBoard();

    return;

  }


  /* Try move */

  const move =
    game.move({

      from:
        selectedSquare,

      to:
        square,

      promotion:
        "q"

    });


  if (!move) {

    return;

  }


  lastMove = {
    from: move.from,
    to: move.to
  };


  selectedSquare =
    null;


  if (move.captured) {

    playSound("capture");

  } else {

    playSound("move");

  }


  if (game.in_check()) {

    playSound("check");

  }


  updateEverything();

  checkGameOver();


  if (
    !game.game_over()
  ) {

    thinking =
      true;

    setThinking(true);

    statusMain.textContent =
      "Stockfish is thinking...";

    statusSub.textContent =
      "Calculating the best move";


    engine.postMessage(
      "position fen " +
      game.fen()
    );


    const depth =
      Number(
        difficulty.value
      );


    engine.postMessage(
      "go depth " + depth
    );

  }

}


/* =========================================================
   ENGINE
========================================================= */

function startEngine() {

  try {

    engine =
      new Worker(
        "./stockfish-18-lite-single.js"
      );


    engine.onmessage =
      function(event) {

        const message =
          String(event.data);


        if (
          message === "uciok"
        ) {

          engineReady =
            true;


          engineDot.classList.add(
            "ready"
          );


          engineText.textContent =
            "Stockfish 18 · Online";


          statusMain.textContent =
            "Your turn";

          statusSub.textContent =
            "White to move";


          engine.postMessage(
            "isready"
          );


          return;

        }


        /* Evaluation */

        if (
          message.startsWith("info")
        ) {

          parseEvaluation(
            message
          );

        }


        /* Best move */

        if (
          message.startsWith(
            "bestmove"
          )
        ) {

          makeEngineMove(
            message
          );

        }

      };


    engine.onerror =
      function() {

        engineReady =
          false;


        engineDot.classList.remove(
          "ready"
        );


        engineText.textContent =
          "Engine error";


        statusMain.textContent =
          "Engine error";

        statusSub.textContent =
          "Stockfish could not start";

      };


    engine.postMessage(
      "uci"
    );

  } catch (error) {

    statusMain.textContent =
      "Engine error";

    statusSub.textContent =
      "Could not create worker";

  }

}


/* =========================================================
   ENGINE MOVE
========================================================= */

function makeEngineMove(message) {

  const parts =
    message.split(" ");

  const bestMove =
    parts[1];


  if (
    !bestMove ||
    bestMove === "(none)"
  ) {

    thinking =
      false;

    setThinking(false);

    updateStatus();

    return;

  }


  const from =
    bestMove.substring(
      0,
      2
    );

  const to =
    bestMove.substring(
      2,
      4
    );


  let promotion =
    "q";


  if (
    bestMove.length >= 5
  ) {

    promotion =
      bestMove.substring(
        4,
        5
      );

  }


  const move =
    game.move({

      from: from,

      to: to,

      promotion: promotion

    });


  if (move) {

    lastMove = {
      from: move.from,
      to: move.to
    };


    if (move.captured) {

      playSound(
        "capture"
      );

    } else {

      playSound(
        "move"
      );

    }


    if (game.in_check()) {

      playSound(
        "check"
      );

    }

  }


  thinking =
    false;

  setThinking(false);

  updateEverything();

  checkGameOver();

}


/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(message) {

  const match =
    message.match(
      /\bscore cp (-?\d+)/
    );


  if (!match) {
    return;
  }


  const cp =
    Number(match[1]);


  const score =
    Math.max(
      -1000,
      Math.min(
        1000,
        cp
      )
    );


  const percent =
    50 +
    score /
    20;


  evalFill.style.width =
    Math.max(
      5,
      Math.min(
        95,
        percent
      )
    ) + "%";


  const value =
    cp / 100;


  evalValue.textContent =
    (
      value >= 0
        ? "+"
        : ""
    ) +
    value.toFixed(2);

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

  if (
    game.game_over()
  ) {

    return;

  }


  if (
    game.in_check()
  ) {

    statusIcon.textContent =
      "⚠️";

    statusMain.textContent =
      "Check!";

    statusSub.textContent =
      game.turn() === "w"
        ? "Your king is under attack"
        : "Stockfish is in check";

    return;

  }


  if (
    game.turn() === "w"
  ) {

    statusIcon.textContent =
      "♙";

    statusMain.textContent =
      "Your turn";

    statusSub.textContent =
      "White to move";

  } else {

    statusIcon.textContent =
      "♟";

    statusMain.textContent =
      "Stockfish's turn";

    statusSub.textContent =
      "Black to move";

  }

}


/* =========================================================
   EVERYTHING
========================================================= */

function updateEverything() {

  drawBoard();

  updateMoves();

  updateStatus();

  updateClocks();

}


/* =========================================================
   MOVES
========================================================= */

function updateMoves() {

  const history =
    game.history();


  moveCount.textContent =
    history.length +
    (
      history.length === 1
        ? " move"
        : " moves"
    );


  if (!history.length) {

    movesElement.innerHTML = `
      <div class="empty-moves">
        Your game starts here
      </div>
    `;

    return;

  }


  movesElement.innerHTML =
    "";


  for (
    let i = 0;
    i < history.length;
    i += 2
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "move-row";


    const number =
      document.createElement(
        "span"
      );

    number.className =
      "move-number";

    number.textContent =
      (i / 2 + 1) + ".";


    const white =
      document.createElement(
        "span"
      );

    white.className =
      "move-white";

    white.textContent =
      history[i] || "";


    const black =
      document.createElement(
        "span"
      );

    black.className =
      "move-black";

    black.textContent =
      history[i + 1] || "";


    row.appendChild(
      number
    );

    row.appendChild(
      white
    );

    row.appendChild(
      black
    );


    movesElement.appendChild(
      row
    );

  }


  movesElement.scrollTop =
    movesElement.scrollHeight;

}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver() {

  if (
    !game.game_over()
  ) {

    return;

  }


  stopClock();


  let title =
    "Game Over";

  let subtitle =
    "Well played.";

  let icon =
    "🏁";


  if (
    game.in_checkmate()
  ) {

    icon =
      "🏆";


    if (
      game.turn() === "b"
    ) {

      title =
        "Checkmate — You Win!";

      subtitle =
        "A brilliant finish.";

    } else {

      title =
        "Checkmate";

      subtitle =
        "Stockfish wins this round.";

    }

  } else if (
    game.in_draw()
  ) {

    icon =
      "🤝";

    title =
      "Draw";

    subtitle =
      "Neither side could win.";

  }


  gameOverIcon.textContent =
    icon;

  gameOverTitle.textContent =
    title;

  gameOverSub.textContent =
    subtitle;


  gameOver.classList.add(
    "show"
  );

}


/* =========================================================
   THINKING
========================================================= */

function setThinking(show) {

  if (show) {

    thinkingElement.classList.add(
      "show"
    );

  } else {

    thinkingElement.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

  game.reset();


  selectedSquare =
    null;

  lastMove =
    null;

  thinking =
    false;


  setThinking(
    false
  );


  gameOver.classList.remove(
    "show"
  );


  whiteSeconds =
    600;

  blackSeconds =
    600;


  evalFill.style.width =
    "50%";

  evalValue.textContent =
    "0.00";


  updateEverything();


  if (engineReady) {

    statusIcon.textContent =
      "♙";

    statusMain.textContent =
      "Your turn";

    statusSub.textContent =
      "White to move";

  }


  startClock();

}


/* =========================================================
   UNDO
========================================================= */

function undoMove() {

  if (
    thinking
  ) {

    return;

  }


  const history =
    game.history();


  if (
    history.length === 0
  ) {

    return;

  }


  /* Undo engine move */

  if (
    history.length >= 2
  ) {

    game.undo();

  }


  /* Undo player's move */

  game.undo();


  const remaining =
    game.history();


  if (
    remaining.length === 0
  ) {

    lastMove =
      null;

  }


  selectedSquare =
    null;


  updateEverything();

  startClock();

}


/* =========================================================
   CLOCK
========================================================= */

function startClock() {

  stopClock();


  clockInterval =
    setInterval(
      () => {

        if (
          thinking
        ) {

          blackSeconds--;

        } else {

          whiteSeconds--;

        }


        updateClocks();


        if (
          whiteSeconds <= 0
        ) {

          endOnTime(
            "You ran out of time."
          );

        }


        if (
          blackSeconds <= 0
        ) {

          endOnTime(
            "Stockfish ran out of time."
          );

        }

      },
      1000
    );

}


function stopClock() {

  if (
    clockInterval
  ) {

    clearInterval(
      clockInterval
    );

    clockInterval =
      null;

  }

}


function endOnTime(reason) {

  stopClock();

  thinking =
    false;

  setThinking(false);


  gameOverIcon.textContent =
    "⏱️";

  gameOverTitle.textContent =
    reason.includes("You")
      ? "Time's Up — Stockfish Wins"
      : "Time's Up — You Win";

  gameOverSub.textContent =
    "The clock decided the game.";

  gameOver.classList.add(
    "show"
  );

}


function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      seconds
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(secs)
      .padStart(2, "0")
  );

}


function updateClocks() {

  whiteTime.textContent =
    formatTime(
      whiteSeconds
    );

  blackTime.textContent =
    formatTime(
      blackSeconds
    );


  if (
    game.turn() === "w" &&
    !thinking
  ) {

    whiteClock.classList.add(
      "active"
    );

    blackClock.classList.remove(
      "active"
    );

  } else {

    whiteClock.classList.remove(
      "active"
    );

    blackClock.classList.add(
      "active"
    );

  }

}


/* =========================================================
   START
========================================================= */

drawBoard();

updateMoves();

updateClocks();

startEngine();

startClock();

</script>
