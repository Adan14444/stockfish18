<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nova Chess</title>

<!--
  IMPORTANT:
  Put these two files in the SAME folder:
    index.html
    stockfish-18-asm.js

  The ASM engine does NOT need a .wasm file.
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
  --bg: #080b12;
  --panel: rgba(18, 23, 34, .88);
  --panel2: rgba(25, 31, 45, .9);
  --line: rgba(255,255,255,.08);
  --text: #f4f7fb;
  --muted: #8f9bad;

  --light-square: #dbe5f0;
  --dark-square: #58708d;

  --accent: #63a8ff;
  --accent2: #8d6cff;
  --green: #51d88a;
  --red: #ff6262;

  --board-max: min(
    590px,
    calc(100vw - 310px),
    calc(100vh - 175px)
  );
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background:
    radial-gradient(circle at 20% 10%, rgba(82,127,255,.12), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(130,70,255,.09), transparent 28%),
    var(--bg);
  color: var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}

/* ---------- APP ---------- */

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- TOP BAR ---------- */

.topbar {
  height: 52px;
  flex: 0 0 52px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 16px;

  border-bottom: 1px solid var(--line);

  background: rgba(7,10,17,.78);
  backdrop-filter: blur(18px);

  position: relative;
  z-index: 20;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;

  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.4px;
}

.logo-icon {
  width: 34px;
  height: 34px;

  display: grid;
  place-items: center;

  border-radius: 10px;

  background:
    linear-gradient(135deg, var(--accent), var(--accent2));

  box-shadow:
    0 0 22px rgba(99,168,255,.22);

  font-size: 19px;
}

.engine-pill {
  display: flex;
  align-items: center;
  gap: 8px;

  padding: 8px 12px;

  border: 1px solid var(--line);
  border-radius: 999px;

  background: rgba(255,255,255,.035);

  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.engine-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  box-shadow: 0 0 0 transparent;
}

.engine-pill.ready .engine-dot {
  background: var(--green);
  box-shadow: 0 0 12px rgba(81,216,138,.7);
}

.engine-pill.thinking .engine-dot {
  background: var(--accent);
  box-shadow: 0 0 14px rgba(99,168,255,.8);
  animation: pulse 1s infinite;
}

.engine-pill.error .engine-dot {
  background: var(--red);
  box-shadow: 0 0 12px rgba(255,98,98,.6);
}

@keyframes pulse {
  50% {
    opacity: .35;
    transform: scale(.7);
  }
}

/* ---------- MAIN ---------- */

.main {
  flex: 1;

  width: 100%;
  max-width: 1420px;

  margin: 0 auto;

  padding: 18px;

  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 18px;

  align-items: start;
}

/* ---------- BOARD AREA ---------- */

.board-area {
  min-width: 0;

  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.board-column {
  width: min(100%, 760px);
}

.player-strip {
  width: var(--board-max);
  max-width: 100%;

  margin: 0 auto 9px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.player-name {
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-piece {
  width: 22px;
  height: 22px;

  display: grid;
  place-items: center;

  border-radius: 7px;

  background: rgba(255,255,255,.07);

  font-size: 15px;
}

.clock {
  min-width: 76px;

  padding: 5px 9px;

  text-align: center;

  border-radius: 9px;

  background: rgba(255,255,255,.05);

  font-variant-numeric: tabular-nums;

  font-size: 14px;
  font-weight: 800;

  color: var(--text);
}

.clock.active {
  background: rgba(99,168,255,.16);
  box-shadow: inset 0 0 0 1px rgba(99,168,255,.25);
}

/* ---------- BOARD ---------- */

.board-shell {
  position: relative;

  width: var(--board-max);
  max-width: 100%;
  aspect-ratio: 1;

  margin: 0 auto;

  border-radius: 13px;

  box-shadow:
    0 22px 55px rgba(0,0,0,.42),
    0 0 0 1px rgba(255,255,255,.07);

  overflow: hidden;
}

#board {
  width: 100%;
  height: 100%;

  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;
}

.square {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition:
    filter .1s ease,
    box-shadow .1s ease;

  overflow: hidden;
}

.square.light {
  background: var(--light-square);
}

.square.dark {
  background: var(--dark-square);
}

.square:hover {
  filter: brightness(1.07);
}

.square.selected {
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.75);
  z-index: 2;
}

.square.last-move {
  box-shadow:
    inset 0 0 0 999px rgba(255,214,78,.22);
}

.square.legal::after {
  content: "";

  width: 20%;
  height: 20%;

  position: absolute;

  border-radius: 50%;

  background: rgba(20,25,35,.27);
}

.square.capture::after {
  content: "";

  position: absolute;

  width: 76%;
  height: 76%;

  border-radius: 50%;

  border: 5px solid rgba(255,255,255,.33);
}

.square.check {
  background:
    radial-gradient(circle,
      rgba(255,50,50,.92),
      rgba(255,50,50,.38) 43%,
      transparent 72%);
}

/* ---------- PIECES ---------- */

.piece {
  position: relative;

  width: 68%;
  height: 68%;

  display: grid;
  place-items: center;

  font-family:
    "Arial Unicode MS",
    "Segoe UI Symbol",
    "Noto Sans Symbols 2",
    serif;

  font-size: clamp(24px, 4.8vw, 52px);

  line-height: 1;

  z-index: 3;

  transform: translateY(-1px);

  pointer-events: none;

  text-shadow:
    0 2px 2px rgba(0,0,0,.35);
}

.piece.white {
  color: #fff;
  text-shadow:
    0 1px 1px rgba(0,0,0,.75),
    0 2px 5px rgba(0,0,0,.25);
}

.piece.black {
  color: #151922;
  text-shadow:
    0 1px 1px rgba(255,255,255,.18),
    0 2px 5px rgba(0,0,0,.3);
}

/* Coordinates */

.coord {
  position: absolute;

  font-size: 10px;
  font-weight: 800;

  opacity: .7;

  pointer-events: none;
}

.rank {
  top: 3px;
  left: 4px;
}

.file {
  right: 4px;
  bottom: 3px;
}

.light .coord {
  color: var(--dark-square);
}

.dark .coord {
  color: var(--light-square);
}

/* ---------- THINKING ---------- */

.thinking-overlay {
  position: absolute;
  inset: 0;

  display: none;
  place-items: center;

  background: rgba(5,8,14,.20);

  pointer-events: none;

  z-index: 10;
}

.thinking-overlay.show {
  display: grid;
}

.thinking-card {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 14px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 999px;

  background: rgba(10,14,22,.82);
  backdrop-filter: blur(12px);

  font-size: 12px;
  font-weight: 800;
}

.spinner {
  width: 13px;
  height: 13px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.25);
  border-top-color: var(--accent);

  animation: spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ---------- BOARD CONTROLS ---------- */

.controls {
  width: var(--board-max);
  max-width: 100%;

  margin: 12px auto 0;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

button,
select {
  border: 1px solid var(--line);

  border-radius: 10px;

  background: rgba(255,255,255,.055);

  color: var(--text);

  padding: 8px 9px;

  font: inherit;
  font-size: 13px;
  font-weight: 750;

  cursor: pointer;

  outline: none;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .1s ease;
}

button:hover,
select:hover {
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.15);
}

button:active {
  transform: translateY(1px);
}

button.primary {
  background:
    linear-gradient(135deg, rgba(99,168,255,.22), rgba(141,108,255,.22));

  border-color: rgba(99,168,255,.28);
}

button.danger {
  color: #ff9b9b;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.full {
  grid-column: 1 / -1;
}

/* ---------- SIDEBAR ---------- */

.sidebar {
  min-width: 0;

  display: flex;
  flex-direction: column;

  gap: 12px;
}

.card {
  background: var(--panel);

  border: 1px solid var(--line);

  border-radius: 15px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.2);

  overflow: hidden;
}

.card-header {
  padding: 14px 15px 11px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--line);

  font-size: 12px;
  font-weight: 850;

  text-transform: uppercase;
  letter-spacing: .8px;

  color: var(--muted);
}

.card-body {
  padding: 14px;
}

/* ---------- EVAL ---------- */

.eval-wrap {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 12px;

  align-items: center;
}

.eval-bar {
  width: 10px;
  height: 145px;

  border-radius: 999px;

  background:
    linear-gradient(
      to top,
      #1a1d24 0%,
      #1a1d24 50%,
      #f1f3f5 50%,
      #f1f3f5 100%
    );

  position: relative;
  overflow: hidden;

  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
}

.eval-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  height: 50%;

  background: #f1f3f5;

  transition: height .25s ease;
}

.eval-number {
  font-size: 31px;
  font-weight: 900;

  letter-spacing: -1.5px;
}

.eval-label {
  margin-top: 3px;

  color: var(--muted);
  font-size: 11px;
}

/* ---------- MOVES ---------- */

.moves {
  max-height: 315px;

  overflow-y: auto;

  scrollbar-width: thin;
}

.move-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr;

  min-height: 34px;

  align-items: center;

  border-radius: 7px;

  font-size: 13px;
}

.move-row:nth-child(odd) {
  background: rgba(255,255,255,.025);
}

.move-number {
  padding-left: 8px;

  color: #687487;
  font-variant-numeric: tabular-nums;
}

.move {
  padding: 0 6px;

  font-weight: 700;
}

.move.current {
  color: #fff;
  background: rgba(99,168,255,.14);
  border-radius: 6px;
}

.empty {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 12px 0;
}

/* ---------- SETTINGS ---------- */

.setting {
  display: grid;

  grid-template-columns: 1fr auto;

  align-items: center;

  gap: 10px;

  margin-bottom: 12px;
}

.setting:last-child {
  margin-bottom: 0;
}

.setting label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.setting select {
  min-width: 125px;
}

/* ---------- STATUS ---------- */

.status {
  padding: 10px 12px;

  border-radius: 10px;

  background: rgba(255,255,255,.035);

  color: var(--muted);

  font-size: 11px;
  line-height: 1.45;

  word-break: break-word;
}

.status.good {
  color: #8eeab1;
  background: rgba(81,216,138,.07);
}

.status.bad {
  color: #ff9d9d;
  background: rgba(255,98,98,.07);
}

/* ---------- MODAL ---------- */

.modal {
  position: fixed;
  inset: 0;

  display: none;
  place-items: center;

  background: rgba(0,0,0,.64);

  backdrop-filter: blur(7px);

  z-index: 100;
}

.modal.show {
  display: grid;
}

.modal-card {
  width: min(420px, calc(100vw - 32px));

  padding: 22px;

  border-radius: 17px;

  border: 1px solid var(--line);

  background: #121722;

  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.modal-title {
  font-size: 20px;
  font-weight: 900;

  margin-bottom: 8px;
}

.modal-text {
  color: var(--muted);
  font-size: 13px;

  line-height: 1.55;

  margin-bottom: 18px;
}

.promotion-buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);

  gap: 8px;
}

.promotion-buttons button {
  font-size: 28px;
  padding: 13px 5px;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 1050px) {
  :root {
    --board-max: min(
      70vh,
      calc(100vw - 355px),
      620px
    );
  }

  .main {
    grid-template-columns: minmax(0,1fr) 290px;
    gap: 14px;
    padding: 14px;
  }
}

@media (max-width: 820px) {
  :root {
    --board-max: min(
      calc(100vw - 24px),
      72vh,
      680px
    );
  }

  .topbar {
    height: 56px;
    flex-basis: 56px;
    padding: 0 12px;
  }

  .engine-pill {
    padding: 7px 9px;
  }

  .main {
    display: flex;
    flex-direction: column;

    padding: 10px 10px 18px;

    gap: 14px;
  }

  .board-area {
    width: 100%;
  }

  .board-column {
    width: 100%;
  }

  .sidebar {
    width: 100%;
  }

  .card {
    width: 100%;
  }
}

@media (max-height: 720px) and (min-width: 821px) {
  :root {
    --board-max: min(
      62vh,
      calc(100vw - 380px),
      580px
    );
  }

  .topbar {
    height: 54px;
    flex-basis: 54px;
  }

  .main {
    padding-top: 9px;
    padding-bottom: 9px;
  }

  .sidebar {
    gap: 8px;
  }

  .card-header {
    padding: 10px 13px 8px;
  }

  .card-body {
    padding: 10px 13px;
  }

  .eval-bar {
    height: 100px;
  }

  .moves {
    max-height: 220px;
  }
}

/* Chromebook small landscape */

@media (max-height: 650px) {
  :root {
    --board-max: min(
      57vh,
      calc(100vw - 365px),
      500px
    );
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <header class="topbar">

    <div class="logo">
      <div class="logo-icon">♞</div>
      <span>Nova Chess</span>
    </div>

    <div id="enginePill" class="engine-pill">
      <span class="engine-dot"></span>
      <span id="engineText">Starting engine…</span>
    </div>

  </header>


  <!-- MAIN -->

  <main class="main">

    <!-- BOARD -->

    <section class="board-area">

      <div class="board-column">

        <div class="player-strip">

          <div class="player-name">
            <span class="player-piece">♟</span>
            <span>Nova Engine</span>
          </div>

          <div id="blackClock" class="clock">
            5:00
          </div>

        </div>


        <div class="board-shell">

          <div id="board"></div>

          <div id="thinkingOverlay" class="thinking-overlay">

            <div class="thinking-card">
              <span class="spinner"></span>
              <span>Nova is thinking…</span>
            </div>

          </div>

        </div>


        <div class="player-strip" style="margin-top:9px;margin-bottom:0;">

          <div class="player-name">
            <span class="player-piece">♙</span>
            <span>You</span>
          </div>

          <div id="whiteClock" class="clock active">
            5:00
          </div>

        </div>


        <div class="controls">

          <button id="newGameBtn" class="primary">
            New Game
          </button>

          <button id="undoBtn">
            Undo
          </button>

          <button id="resignBtn" class="danger">
            Resign
          </button>

          <button id="flipBtn">
            Flip Board
          </button>

        </div>

      </div>

    </section>


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <!-- EVALUATION -->

      <section class="card">

        <div class="card-header">
          <span>Evaluation</span>
          <span id="depthLabel">Depth —</span>
        </div>

        <div class="card-body">

          <div class="eval-wrap">

            <div class="eval-bar">
              <div id="evalFill" class="eval-fill"></div>
            </div>

            <div>
              <div id="evalNumber" class="eval-number">
                0.0
              </div>

              <div id="evalLabel" class="eval-label">
                Starting position
              </div>
            </div>

          </div>

        </div>

      </section>


      <!-- MOVES -->

      <section class="card">

        <div class="card-header">
          <span>Moves</span>
          <span id="moveCount">0</span>
        </div>

        <div id="moves" class="moves">

          <div class="empty">
            Make your first move.
          </div>

        </div>

      </section>


      <!-- SETTINGS -->

      <section class="card">

        <div class="card-header">
          <span>Game Settings</span>
        </div>

        <div class="card-body">

          <div class="setting">

            <label for="difficulty">
              Difficulty
            </label>

            <select id="difficulty">

              <option value="500">
                Easy
              </option>

              <option value="1200" selected>
                Medium
              </option>

              <option value="2200">
                Hard
              </option>

              <option value="4000">
                Expert
              </option>

            </select>

          </div>


          <div class="setting">

            <label for="timeControl">
              Time Control
            </label>

            <select id="timeControl">

              <option value="60">
                1 + 0
              </option>

              <option value="180">
                3 + 0
              </option>

              <option value="300" selected>
                5 + 0
              </option>

              <option value="600">
                10 + 0
              </option>

            </select>

          </div>

        </div>

      </section>


      <!-- ENGINE STATUS -->

      <section class="card">

        <div class="card-header">
          <span>Engine</span>
        </div>

        <div class="card-body">

          <div id="engineStatus" class="status">
            Loading Stockfish…
          </div>

        </div>

      </section>

    </aside>

  </main>

</div>


<!-- PROMOTION -->

<div id="promotionModal" class="modal">

  <div class="modal-card">

    <div class="modal-title">
      Promote Pawn
    </div>

    <div class="modal-text">
      Choose the piece you want your pawn to become.
    </div>

    <div class="promotion-buttons">

      <button data-piece="q">♕</button>
      <button data-piece="r">♖</button>
      <button data-piece="b">♗</button>
      <button data-piece="n">♘</button>

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   NOVA CHESS
   Stockfish ASM-JS Worker
   ========================================================= */


/* ---------- ENGINE CONFIG ---------- */

const ENGINE_FILE = "./stockfish-18-asm.js";

let engine = null;

let engineReady = false;
let engineStarting = false;
let engineThinking = false;

let engineStartTimer = null;
let engineMoveTimer = null;


/* ---------- CHESS ---------- */

let game = new Chess();

let selectedSquare = null;
let legalTargets = [];

let flipped = false;

let pendingPromotion = null;


/* ---------- CLOCK ---------- */

let initialSeconds = 300;

let whiteSeconds = 300;
let blackSeconds = 300;

let incrementSeconds = 0;

let clockTimer = null;
let lastClockTick = 0;

let gameStarted = false;


/* ---------- SETTINGS ---------- */

let engineThinkTime = 1200;


/* ---------- ENGINE EVALUATION ---------- */

let lastEvaluation = 0;
let lastDepth = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const boardElement =
  document.getElementById("board");

const enginePill =
  document.getElementById("enginePill");

const engineText =
  document.getElementById("engineText");

const engineStatus =
  document.getElementById("engineStatus");

const thinkingOverlay =
  document.getElementById("thinkingOverlay");

const whiteClock =
  document.getElementById("whiteClock");

const blackClock =
  document.getElementById("blackClock");

const movesElement =
  document.getElementById("moves");

const moveCount =
  document.getElementById("moveCount");

const evalNumber =
  document.getElementById("evalNumber");

const evalLabel =
  document.getElementById("evalLabel");

const evalFill =
  document.getElementById("evalFill");

const depthLabel =
  document.getElementById("depthLabel");

const difficulty =
  document.getElementById("difficulty");

const timeControl =
  document.getElementById("timeControl");

const promotionModal =
  document.getElementById("promotionModal");


/* =========================================================
   PIECES
   ========================================================= */

const PIECES = {

  w: {
    p: "♙",
    n: "♘",
    b: "♗",
    r: "♖",
    q: "♕",
    k: "♔"
  },

  b: {
    p: "♟",
    n: "♞",
    b: "♝",
    r: "♜",
    q: "♛",
    k: "♚"
  }

};


/* =========================================================
   ENGINE STATUS UI
   ========================================================= */

function setEngineStatus(
  text,
  type = ""
) {

  engineText.textContent = text;

  enginePill.className =
    "engine-pill " + type;

  engineStatus.textContent = text;

  engineStatus.className =
    "status " +
    (type === "ready"
      ? "good"
      : type === "error"
        ? "bad"
        : "");

}


function engineError(message) {

  engineReady = false;
  engineStarting = false;

  clearTimeout(engineStartTimer);

  setEngineStatus(
    "ENGINE ERROR: " + message,
    "error"
  );

  console.error(message);
}


/* =========================================================
   START STOCKFISH
   ========================================================= */

function startEngine() {

  if (engineStarting) return;

  engineStarting = true;
  engineReady = false;

  setEngineStatus(
    "Loading Stockfish ASM…"
  );

  try {

    /*
      IMPORTANT:
      This is deliberately just the JS file.

      No .wasm.
      No Module config.
      No Hash option.
    */

    engine = new Worker(
      ENGINE_FILE
    );

  } catch (error) {

    engineError(
      "Could not create Worker: " +
      error.message
    );

    return;
  }


  engine.onmessage = function(event) {

    const line =
      String(event.data || "").trim();

    if (!line) return;

    handleEngineLine(line);
  };


  engine.onerror = function(event) {

    engineError(
      "Worker failed to load. Check that stockfish-18-asm.js is beside index.html."
    );

  };


  engine.onmessageerror = function() {

    engineError(
      "Worker message error."
    );

  };


  /*
    Start UCI.

    We intentionally do NOT send Hash here.
  */

  try {

    engine.postMessage("uci");

  } catch (error) {

    engineError(
      "Could not communicate with engine: " +
      error.message
    );

    return;
  }


  /*
    ASM-JS can take a while to initialize on a Chromebook.
  */

  engineStartTimer = setTimeout(
    function() {

      if (!engineReady) {

        engineError(
          "Stockfish did not finish starting. The ASM engine can be slow on Chromebooks."
        );

      }

    },
    30000
  );

}


/* =========================================================
   ENGINE OUTPUT
   ========================================================= */

function handleEngineLine(line) {

  /*
    UCI handshake
  */

  if (line === "uciok") {

    setEngineStatus(
      "Stockfish identified — preparing…"
    );

    try {

      engine.postMessage(
        "isready"
      );

    } catch (error) {

      engineError(
        "isready failed: " +
        error.message
      );
    }

    return;
  }


  if (line === "readyok") {

    clearTimeout(engineStartTimer);

    engineReady = true;
    engineStarting = false;

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

    return;
  }


  /*
    Evaluation information
  */

  if (line.startsWith("info ")) {

    parseEngineInfo(line);

    return;
  }


  /*
    Actual engine move
  */

  if (line.startsWith("bestmove")) {

    handleBestMove(line);

    return;
  }


  /*
    Show engine errors directly on screen.
  */

  if (
    line.toLowerCase().includes("error") ||
    line.toLowerCase().includes("failed")
  ) {

    engineStatus.textContent =
      "Stockfish: " + line;

  }

}


/* =========================================================
   ENGINE INFO
   ========================================================= */

function parseEngineInfo(line) {

  const depthMatch =
    line.match(/\bdepth\s+(\d+)/);

  if (depthMatch) {

    lastDepth =
      Number(depthMatch[1]);

    depthLabel.textContent =
      "Depth " + lastDepth;
  }


  /*
    cp = centipawns
    mate = mating score
  */

  const cpMatch =
    line.match(/\bscore\s+cp\s+(-?\d+)/);

  const mateMatch =
    line.match(/\bscore\s+mate\s+(-?\d+)/);

  if (mateMatch) {

    const mate =
      Number(mateMatch[1]);

    /*
      Stockfish score is from side-to-move perspective.
      During Black's turn, reverse it so our display remains
      White-positive.
    */

    const whiteMate =
      game.turn() === "w"
        ? mate
        : -mate;

    lastEvaluation =
      whiteMate > 0
        ? 100
        : -100;

    evalNumber.textContent =
      "M" + Math.abs(mate);

    evalLabel.textContent =
      mate > 0
        ? "Mate for side to move"
        : "Mate against side to move";

    updateEvalBar();

    return;
  }


  if (cpMatch) {

    let cp =
      Number(cpMatch[1]) / 100;

    /*
      Stockfish score is relative to side to move.
    */

    if (game.turn() === "b") {
      cp = -cp;
    }

    /*
      Keep evaluation sane visually.
    */

    cp =
      Math.max(-10, Math.min(10, cp));

    lastEvaluation = cp;

    evalNumber.textContent =
      (cp >= 0 ? "+" : "") +
      cp.toFixed(1);

    evalLabel.textContent =
      cp > .15
        ? "White advantage"
        : cp < -.15
          ? "Black advantage"
          : "Balanced";

    updateEvalBar();
  }

}


/* =========================================================
   EVALUATION BAR
   ========================================================= */

function updateEvalBar() {

  /*
    Logistic-style visual mapping.

    +10 => almost 100%
    -10 => almost 0%
     0  => 50%
  */

  const x =
    Math.max(
      0.04,
      Math.min(
        0.96,
        1 / (1 + Math.exp(-lastEvaluation))
      )
    );

  evalFill.style.height =
    (x * 100) + "%";

}


/* =========================================================
   BOARD CREATION
   ========================================================= */

function createBoard() {

  boardElement.innerHTML = "";

  for (let visualRow = 0; visualRow < 8; visualRow++) {

    for (let visualCol = 0; visualCol < 8; visualCol++) {

      const square =
        document.createElement("div");

      square.className = "square";

      const row =
        flipped
          ? 7 - visualRow
          : visualRow;

      const col =
        flipped
          ? 7 - visualCol
          : visualCol;

      const file =
        String.fromCharCode(
          97 + col
        );

      const rank =
        8 - row;

      const name =
        file + rank;

      square.dataset.square = name;

      square.addEventListener(
        "click",
        function() {
          handleSquareClick(name);
        }
      );

      boardElement.appendChild(square);
    }
  }

  renderBoard();
}


/* =========================================================
   BOARD RENDER
   ========================================================= */

function renderBoard() {

  const board =
    game.board();

  const squareElements =
    boardElement.children;


  /*
    We reuse the same 64 DOM elements.
    This is much cheaper than rebuilding the board.
  */

  for (let visualIndex = 0;
       visualIndex < 64;
       visualIndex++) {

    const squareElement =
      squareElements[visualIndex];

    const name =
      squareElement.dataset.square;

    const file =
      name.charCodeAt(0) - 97;

    const rank =
      Number(name[1]);

    const row =
      8 - rank;

    const piece =
      board[row][file];


    /*
      Square colors
    */

    squareElement.className =
      "square " +
      (
        (row + file) % 2 === 0
          ? "light"
          : "dark"
      );


    /*
      Selection
    */

    if (selectedSquare === name) {

      squareElement.classList.add(
        "selected"
      );

    }


    /*
      Legal target
    */

    if (
      legalTargets.includes(name)
    ) {

      if (game.get(name)) {

        squareElement.classList.add(
          "capture"
        );

      } else {

        squareElement.classList.add(
          "legal"
        );

      }

    }


    /*
      Last move
    */

    const history =
      game.history({
        verbose: true
      });

    const last =
      history.length
        ? history[history.length - 1]
        : null;

    if (
      last &&
      (
        last.from === name ||
        last.to === name
      )
    ) {

      squareElement.classList.add(
        "last-move"
      );

    }


    /*
      Check square
    */

    if (
      game.in_check() &&
      piece &&
      piece.type === "k"
    ) {

      if (
        piece.color === game.turn()
      ) {

        squareElement.classList.add(
          "check"
        );

      }

    }


    /*
      Piece
    */

    let pieceElement =
      squareElement.querySelector(
        ".piece"
      );

    if (piece) {

      if (!pieceElement) {

        pieceElement =
          document.createElement("div");

        pieceElement.className =
          "piece";

        squareElement.appendChild(
          pieceElement
        );
      }

      pieceElement.textContent =
        PIECES[piece.color][piece.type];

      pieceElement.className =
        "piece " +
        (
          piece.color === "w"
            ? "white"
            : "black"
        );

    } else {

      if (pieceElement) {
        pieceElement.remove();
      }

    }


    /*
      Coordinates
    */

    let rankLabel =
      squareElement.querySelector(
        ".rank"
      );

    let fileLabel =
      squareElement.querySelector(
        ".file"
      );


    if (file === 0) {

      if (!rankLabel) {

        rankLabel =
          document.createElement("span");

        rankLabel.className =
          "coord rank";

        squareElement.appendChild(
          rankLabel
        );
      }

      rankLabel.textContent =
        rank;

    } else if (rankLabel) {

      rankLabel.remove();

    }


    if (rank === 1) {

      if (!fileLabel) {

        fileLabel =
          document.createElement("span");

        fileLabel.className =
          "coord file";

        squareElement.appendChild(
          fileLabel
        );
      }

      fileLabel.textContent =
        file;

    } else if (fileLabel) {

      fileLabel.remove();

    }

  }

}


/* =========================================================
   CLICK SQUARE
   ========================================================= */

function handleSquareClick(square) {

  /*
    Player is always White.
  */

  if (game.game_over()) {
    return;
  }

  if (game.turn() !== "w") {
    return;
  }

  if (engineThinking) {
    return;
  }


  const piece =
    game.get(square);


  /*
    If a piece is already selected,
    try to move it.
  */

  if (selectedSquare) {

    if (
      legalTargets.includes(square)
    ) {

      attemptPlayerMove(
        selectedSquare,
        square
      );

      return;
    }


    /*
      Clicking another white piece changes selection.
    */

    if (
      piece &&
      piece.color === "w"
    ) {

      selectSquare(square);

      return;
    }


    clearSelection();

    return;
  }


  /*
    Select white piece.
  */

  if (
    piece &&
    piece.color === "w"
  ) {

    selectSquare(square);

  }

}


/* =========================================================
   SELECT
   ========================================================= */

function selectSquare(square) {

  selectedSquare = square;

  legalTargets =
    game.moves({
      square: square,
      verbose: true
    }).map(
      move => move.to
    );

  renderBoard();
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearSelection() {

  selectedSquare = null;
  legalTargets = [];

  renderBoard();

}


/* =========================================================
   PLAYER MOVE
   ========================================================= */

function attemptPlayerMove(
  from,
  to
) {

  const piece =
    game.get(from);


  /*
    Promotion?
  */

  if (
    piece &&
    piece.type === "p" &&
    to[1] === "8"
  ) {

    pendingPromotion = {
      from: from,
      to: to
    };

    promotionModal.classList.add(
      "show"
    );

    return;
  }


  makePlayerMove(
    from,
    to,
    "q"
  );

}


/* =========================================================
   MAKE PLAYER MOVE
   ========================================================= */

function makePlayerMove(
  from,
  to,
  promotion
) {

  const move =
    game.move({
      from: from,
      to: to,
      promotion: promotion
    });

  if (!move) {

    clearSelection();

    return;
  }


  clearSelection();

  whiteSeconds +=
    incrementSeconds;

  gameStarted = true;

  renderBoard();
  renderMoves();
  updateClocks();

  checkGameEnd();

  if (!game.game_over()) {

    startClock();

    requestEngineMove();

  }

}


/* =========================================================
   PROMOTION
   ========================================================= */

document
  .querySelectorAll(
    ".promotion-buttons button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        const promotion =
          this.dataset.piece;

        if (!pendingPromotion) {
          return;
        }

        const move =
          pendingPromotion;

        pendingPromotion = null;

        promotionModal.classList.remove(
          "show"
        );

        makePlayerMove(
          move.from,
          move.to,
          promotion
        );

      }
    );

  });


/* =========================================================
   ENGINE MOVE
   ========================================================= */

function requestEngineMove() {

  if (!engineReady) {

    setEngineStatus(
      "Waiting for Stockfish…"
    );

    return;
  }

  if (game.game_over()) {
    return;
  }

  engineThinking = true;

  thinkingOverlay.classList.add(
    "show"
  );

  enginePill.className =
    "engine-pill thinking";

  engineText.textContent =
    "Nova is thinking";

  engineStatus.textContent =
    "Nova is calculating a move…";


  /*
    Stop old move timeout.
  */

  clearTimeout(engineMoveTimer);


  /*
    Get current FEN.
  */

  const fen =
    game.fen();


  try {

    engine.postMessage(
      "stop"
    );

    engine.postMessage(
      "position fen " + fen
    );

    engine.postMessage(
      "go movetime " +
      engineThinkTime
    );

  } catch (error) {

    finishEngineThinking();

    engineError(
      "Could not send position: " +
      error.message
    );

    return;
  }


  /*
    Safety timeout.

    If ASM somehow doesn't return bestmove,
    the UI won't stay frozen forever.
  */

  engineMoveTimer =
    setTimeout(
      function() {

        if (engineThinking) {

          try {
            engine.postMessage("stop");
          } catch (_) {}

          finishEngineThinking();

          engineError(
            "Stockfish timed out before returning bestmove."
          );

        }

      },
      Math.max(
        engineThinkTime + 15000,
        20000
      )
    );

}


/* =========================================================
   BEST MOVE
   ========================================================= */

function handleBestMove(line) {

  if (!engineThinking) {
    return;
  }

  clearTimeout(engineMoveTimer);


  const parts =
    line.split(/\s+/);

  const bestMove =
    parts[1];


  if (
    !bestMove ||
    bestMove === "(none)"
  ) {

    finishEngineThinking();

    checkGameEnd();

    return;
  }


  /*
    UCI move:
      e7e5
      e7e8q
  */

  const from =
    bestMove.slice(0,2);

  const to =
    bestMove.slice(2,4);

  const promotion =
    bestMove.length >= 5
      ? bestMove[4]
      : undefined;


  const move =
    game.move({
      from: from,
      to: to,
      promotion: promotion
    });


  if (!move) {

    finishEngineThinking();

    engineError(
      "Stockfish returned illegal move: " +
      bestMove
    );

    return;
  }


  blackSeconds +=
    incrementSeconds;


  finishEngineThinking();

  renderBoard();
  renderMoves();
  updateClocks();

  checkGameEnd();

  if (!game.game_over()) {

    startClock();

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }

}


/* =========================================================
   FINISH ENGINE
   ========================================================= */

function finishEngineThinking() {

  engineThinking = false;

  thinkingOverlay.classList.remove(
    "show"
  );

  enginePill.className =
    "engine-pill ready";

  engineText.textContent =
    "Stockfish ready";

}


/* =========================================================
   MOVE LIST
   ========================================================= */

function renderMoves() {

  const history =
    game.history();


  moveCount.textContent =
    history.length;


  if (!history.length) {

    movesElement.innerHTML =
      '<div class="empty">Make your first move.</div>';

    return;
  }


  let html = "";


  for (
    let i = 0;
    i < history.length;
    i += 2
  ) {

    const moveNumber =
      Math.floor(i / 2) + 1;

    const white =
      history[i] || "";

    const black =
      history[i + 1] || "";

    const whiteCurrent =
      i === history.length - 1;

    const blackCurrent =
      i + 1 === history.length - 1;


    html += `
      <div class="move-row">
        <div class="move-number">${moveNumber}.</div>

        <div class="move ${whiteCurrent ? "current" : ""}">
          ${white}
        </div>

        <div class="move ${blackCurrent ? "current" : ""}">
          ${black}
        </div>
      </div>
    `;

  }


  movesElement.innerHTML =
    html;

  movesElement.scrollTop =
    movesElement.scrollHeight;

}


/* =========================================================
   CLOCK
   ========================================================= */

function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      Math.ceil(seconds)
    );

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    minutes +
    ":" +
    String(secs).padStart(2,"0")
  );

}


function updateClocks() {

  whiteClock.textContent =
    formatTime(whiteSeconds);

  blackClock.textContent =
    formatTime(blackSeconds);


  whiteClock.classList.toggle(
    "active",
    game.turn() === "w" &&
    !game.game_over()
  );

  blackClock.classList.toggle(
    "active",
    game.turn() === "b" &&
    !game.game_over()
  );

}


function startClock() {

  clearInterval(clockTimer);

  if (game.game_over()) return;

  lastClockTick = performance.now();

  clockTimer = setInterval(function() {

    if (!gameStarted || game.game_over()) return;

    const now = performance.now();
    const elapsed = (now - lastClockTick) / 1000;
    lastClockTick = now;

    // The clock keeps running while Stockfish thinks.
    if (game.turn() === "w") {
      whiteSeconds = Math.max(0, whiteSeconds - elapsed);
    } else {
      blackSeconds = Math.max(0, blackSeconds - elapsed);
    }

    updateClocks();

    if (whiteSeconds <= 0) {
      clearInterval(clockTimer);
      endGame("Nova wins on time.");
      return;
    }

    if (blackSeconds <= 0) {
      clearInterval(clockTimer);
      endGame("You win on time.");
    }

  }, 50);
}

/* =========================================================
   GAME END
   ========================================================= */

function checkGameEnd() {

  if (game.is_checkmate()) {

    const winner =
      game.turn() === "w"
        ? "Nova wins by checkmate."
        : "You win by checkmate.";

    endGame(winner);

    return true;
  }


  if (game.is_draw()) {

    endGame(
      "Draw."
    );

    return true;
  }


  return false;

}


function endGame(message) {

  clearInterval(clockTimer);

  engineThinking = false;

  thinkingOverlay.classList.remove(
    "show"
  );

  engineText.textContent =
    message;

  engineStatus.textContent =
    message;

  enginePill.className =
    "engine-pill";

}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame() {

  clearInterval(clockTimer);
  clearTimeout(engineMoveTimer);

  engineThinking = false;

  pendingPromotion = null;

  promotionModal.classList.remove(
    "show"
  );


  game =
    new Chess();


  selectedSquare = null;
  legalTargets = [];


  const seconds =
    Number(
      timeControl.value
    );

  initialSeconds =
    seconds;

  whiteSeconds =
    seconds;

  blackSeconds =
    seconds;


  lastEvaluation = 0;
  lastDepth = 0;


  evalNumber.textContent =
    "0.0";

  evalLabel.textContent =
    "Starting position";

  depthLabel.textContent =
    "Depth —";


  gameStarted = false;


  updateClocks();
  renderMoves();
  createBoard();


  if (engine) {

    try {

      engine.postMessage(
        "stop"
      );

      engine.postMessage(
        "ucinewgame"
      );

      engine.postMessage(
        "isready"
      );

    } catch (_) {}

  }


  if (engineReady) {

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  } else {

    setEngineStatus(
      "Waiting for Stockfish…"
    );

  }

}


/* =========================================================
   UNDO
   ========================================================= */

function undoMove() {

  if (engineThinking) {

    try {
      engine.postMessage("stop");
    } catch (_) {}

    clearTimeout(
      engineMoveTimer
    );

    engineThinking = false;

    thinkingOverlay.classList.remove(
      "show"
    );

  }


  /*
    Always undo the engine move + your move
    when possible.
  */

  if (game.history().length >= 2) {

    game.undo();
    game.undo();

  } else if (
    game.history().length === 1
  ) {

    game.undo();

  } else {

    return;
  }


  selectedSquare = null;
  legalTargets = [];


  whiteSeconds =
    initialSeconds;

  blackSeconds =
    initialSeconds;


  gameStarted = false;


  updateClocks();
  renderBoard();
  renderMoves();


  if (engineReady) {

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }

}


/* =========================================================
   RESIGN
   ========================================================= */

function resign() {

  if (game.game_over()) {
    return;
  }

  endGame(
    "You resigned. Nova wins."
  );

}


/* =========================================================
   FLIP BOARD
   ========================================================= */

function flipBoard() {

  flipped =
    !flipped;

  createBoard();

}


/* =========================================================
   SETTINGS
   ========================================================= */

difficulty.addEventListener(
  "change",
  function() {

    engineThinkTime =
      Number(
        this.value
      );

  }
);


timeControl.addEventListener(
  "change",
  function() {

    /*
      Only change clocks before
      a game has started.
    */

    if (
      game.history().length === 0
    ) {

      const seconds =
        Number(
          this.value
        );

      initialSeconds =
        seconds;

      whiteSeconds =
        seconds;

      blackSeconds =
        seconds;

      updateClocks();

    }

  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("newGameBtn")
  .addEventListener(
    "click",
    newGame
  );


document
  .getElementById("undoBtn")
  .addEventListener(
    "click",
    undoMove
  );


document
  .getElementById("resignBtn")
  .addEventListener(
    "click",
    resign
  );


document
  .getElementById("flipBtn")
  .addEventListener(
    "click",
    flipBoard
  );


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize() {

  if (typeof Chess !== "function") {
    setEngineStatus(
      "CHESS ERROR: chess.js did not load. Your school network may be blocking the CDN.",
      "error"
    );
    return;
  }

  const seconds =
    Number(
      timeControl.value
    );

  initialSeconds =
    seconds;

  whiteSeconds =
    seconds;

  blackSeconds =
    seconds;


  updateClocks();

  createBoard();

  renderMoves();

  updateEvalBar();

  startEngine();

}


initialize();

</script>
