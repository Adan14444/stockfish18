<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Chess — Stockfish 18</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b10;
    --panel:#10151d;
    --panel2:#151b24;
    --line:#242d39;
    --text:#f4f7fb;
    --muted:#8994a3;
    --accent:#5ee7ff;
    --accent2:#7c6cff;

    --light:#d9e1e7;
    --dark:#526477;

    --selected:#62e6ff;
    --last:#d6c86b;
    --check:#ff536b;

    --board-shadow:0 18px 55px rgba(0,0,0,.48);
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    position:relative;
}

/* subtle background without expensive blur */
body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    left:-180px;
    top:-220px;
    border-radius:50%;
    background:rgba(43,185,220,.08);
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:360px;
    height:360px;
    right:-160px;
    bottom:-180px;
    border-radius:50%;
    background:rgba(106,89,235,.06);
    pointer-events:none;
}

button,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    height:100svh;
    min-height:520px;
    display:grid;
    grid-template-rows:58px 1fr;
}

/* ================= HEADER ================= */

.header{
    height:58px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#0a0e14;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
    letter-spacing:-.02em;
}

.brand-icon{
    width:32px;
    height:32px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:#151e28;
    border:1px solid #2b3947;
    color:var(--accent);
    font-size:20px;
}

.brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.05;
}

.brand-name{
    font-size:15px;
}

.brand-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:9px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.engine-pill{
    display:flex;
    align-items:center;
    gap:8px;
    height:32px;
    padding:0 12px;
    border:1px solid #26313d;
    border-radius:9px;
    background:#0f141b;
    color:#aeb9c7;
    font-size:11px;
    font-weight:700;
}

.engine-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#52e49c;
    box-shadow:0 0 8px rgba(82,228,156,.6);
}

.engine-dot.loading{
    background:#ffc857;
    box-shadow:0 0 8px rgba(255,200,87,.55);
}

.engine-dot.error{
    background:#ff536b;
    box-shadow:0 0 8px rgba(255,83,107,.55);
}

/* ================= MAIN ================= */

.main{
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) 325px;
    gap:18px;
    padding:16px 18px;
}

/* ================= BOARD AREA ================= */

.board-area{
    min-width:0;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.board-wrap{
    /*
      Chromebook-first sizing.

      The board can never become taller than the usable viewport,
      and cannot become wider than the available left column.
    */
    width:min(
        calc(100vh - 112px),
        calc(100vw - 385px)
    );

    aspect-ratio:1;
    position:relative;
    flex:none;
}

.board{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border:1px solid #394756;
    border-radius:5px;
    overflow:hidden;
    box-shadow:var(--board-shadow);
    background:#526477;

    /* Allows pieces to use cqw for perfect scaling */
    container-type:size;
}

.square{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    cursor:pointer;
}

.square.light{
    background:var(--light);
}

.square.dark{
    background:var(--dark);
}

/* Coordinates */

.coord-file,
.coord-rank{
    position:absolute;
    z-index:1;
    pointer-events:none;
    font-size:clamp(7px,1.3cqw,12px);
    font-weight:800;
    opacity:.72;
}

.coord-file{
    bottom:3px;
    right:5px;
}

.coord-rank{
    top:3px;
    left:5px;
}

.square.light .coord-file,
.square.light .coord-rank{
    color:#526477;
}

.square.dark .coord-file,
.square.dark .coord-rank{
    color:#e4ebf0;
}

/* pieces */

.piece{
    position:relative;
    z-index:3;

    /*
      10cqw means the piece scales with the board.
      A square is 12.5% of the board, so this gives
      roughly 80% square width.
    */
    width:10cqw;
    height:10cqw;

    display:grid;
    place-items:center;

    font-family:
        "DejaVu Sans",
        "Noto Sans Symbols 2",
        "Segoe UI Symbol",
        sans-serif;

    font-size:9.7cqw;
    line-height:1;

    transform:translateZ(0);
    transition:transform .08s ease;
    pointer-events:none;

    /* makes unicode pieces more readable */
    text-shadow:
        0 1px 0 rgba(255,255,255,.14),
        0 2px 3px rgba(0,0,0,.4);
}

.piece.white{
    color:#fff;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.48));
}

.piece.black{
    color:#161b22;
    text-shadow:
        0 1px 0 rgba(255,255,255,.2),
        0 2px 2px rgba(0,0,0,.65);
}

.square:hover .piece{
    transform:scale(1.035);
}

.square.selected{
    box-shadow:inset 0 0 0 4px rgba(94,231,255,.85);
}

.square.last-move{
    background:#c5bd67 !important;
}

.square.legal::after{
    content:"";
    position:absolute;
    width:19%;
    height:19%;
    border-radius:50%;
    background:rgba(20,28,36,.45);
    z-index:2;
}

.square.capture::after{
    content:"";
    position:absolute;
    width:83%;
    height:83%;
    border:4px solid rgba(28,37,47,.42);
    border-radius:50%;
    z-index:2;
}

.square.in-check{
    background:var(--check) !important;
}

/* ================= SIDEBAR ================= */

.sidebar{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
}

.card{
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
}

.status-card{
    padding:13px;
}

.status-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status-title{
    font-size:12px;
    font-weight:800;
}

.status-sub{
    margin-top:4px;
    color:var(--muted);
    font-size:10px;
}

.status-badge{
    border-radius:7px;
    padding:5px 8px;
    background:#17232b;
    color:#65e8aa;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.07em;
}

/* clocks */

.clocks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.clock{
    padding:11px 12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:11px;
}

.clock-label{
    color:var(--muted);
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.clock-time{
    margin-top:3px;
    font-variant-numeric:tabular-nums;
    font-size:27px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.04em;
}

.clock.active{
    border-color:#385967;
}

.clock.low .clock-time{
    color:#ff697a;
}

/* evaluation */

.eval-card{
    padding:10px 12px;
}

.eval-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.section-label{
    color:var(--muted);
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.1em;
}

.eval-number{
    font-size:12px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
}

.eval-track{
    height:6px;
    border-radius:99px;
    overflow:hidden;
    background:#222b35;
}

.eval-fill{
    width:50%;
    height:100%;
    background:#edf1f4;
    border-radius:99px;
    transition:width .18s ease;
}

/* moves */

.moves-card{
    min-height:0;
    flex:1;
    display:flex;
    flex-direction:column;
}

.moves-header{
    padding:11px 13px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
}

.moves{
    min-height:0;
    overflow:auto;
    padding:7px;
}

.moves::-webkit-scrollbar{
    width:5px;
}

.moves::-webkit-scrollbar-thumb{
    background:#303b48;
    border-radius:10px;
}

.move-row{
    display:grid;
    grid-template-columns:28px 1fr 1fr;
    padding:5px 7px;
    border-radius:6px;
    font-size:11px;
    font-variant-numeric:tabular-nums;
}

.move-row:nth-child(even){
    background:#131922;
}

.move-number{
    color:#657180;
}

.move{
    font-weight:700;
}

/* controls */

.controls-card{
    padding:10px;
}

.control-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.control-btn{
    min-height:34px;
    border:1px solid #293440;
    border-radius:8px;
    background:#131922;
    color:#c7d0db;
    font-size:10px;
    font-weight:800;
    transition:background .12s,border-color .12s;
}

.control-btn:hover{
    background:#1a222d;
    border-color:#3b4a5a;
}

.control-btn.primary{
    background:#172f38;
    border-color:#2e6a79;
    color:#69e8ff;
}

.control-btn.danger{
    color:#ff7788;
}

/* modes */

.modes-card{
    padding:10px;
}

.mode-title{
    margin-bottom:7px;
}

.mode-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.mode-btn{
    min-height:30px;
    border:1px solid #28323d;
    border-radius:7px;
    background:#121820;
    color:#9ba7b5;
    font-size:9px;
    font-weight:800;
}

.mode-btn.active{
    background:#18313a;
    border-color:#397486;
    color:#6be9ff;
}

.settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:7px;
}

.setting{
    min-width:0;
}

.setting label{
    display:block;
    margin:0 0 4px 2px;
    color:#6f7b89;
    font-size:8px;
    font-weight:800;
    text-transform:uppercase;
}

select{
    width:100%;
    height:31px;
    border:1px solid #293440;
    border-radius:7px;
    background:#121820;
    color:#cbd4de;
    outline:none;
    padding:0 7px;
    font-size:10px;
}

/* thinking */

.thinking{
    display:none;
    align-items:center;
    gap:7px;
    padding:6px 2px 0;
    color:#7d8a99;
    font-size:9px;
    font-weight:700;
}

.thinking.show{
    display:flex;
}

.thinking-dots{
    display:flex;
    gap:3px;
}

.thinking-dots i{
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--accent);
    animation:pulse 1s infinite;
}

.thinking-dots i:nth-child(2){
    animation-delay:.15s;
}

.thinking-dots i:nth-child(3){
    animation-delay:.3s;
}

@keyframes pulse{
    0%,100%{opacity:.25}
    50%{opacity:1}
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    place-items:center;
    background:rgba(3,5,8,.76);
}

.modal.show{
    display:grid;
}

.modal-box{
    width:min(340px,calc(100vw - 32px));
    padding:20px;
    border:1px solid #303b49;
    border-radius:14px;
    background:#10151d;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.modal-title{
    font-size:20px;
    font-weight:800;
}

.modal-text{
    margin-top:5px;
    color:#8e9aa8;
    font-size:11px;
}

.modal-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:16px;
}

.promo{
    height:55px;
    border:1px solid #2b3744;
    border-radius:9px;
    background:#161d26;
    color:white;
    font-size:32px;
}

/* responsive */

@media(max-width:900px){
    .main{
        grid-template-columns:minmax(0,1fr) 280px;
        gap:10px;
        padding:10px;
    }

    .board-wrap{
        width:min(
            calc(100vh - 88px),
            calc(100vw - 305px)
        );
    }

    .clock-time{
        font-size:23px;
    }
}

@media(max-width:700px){
    html,
    body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100svh;
    }

    .main{
        grid-template-columns:1fr;
    }

    .board-area{
        min-height:auto;
    }

    .board-wrap{
        width:min(calc(100vw - 20px),calc(100svh - 90px));
    }

    .sidebar{
        overflow:visible;
    }

    .moves-card{
        min-height:180px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="brand">
        <div class="brand-icon">♞</div>
        <div class="brand-text">
            <div class="brand-name">NOVA CHESS</div>
            <div class="brand-sub">Play against Stockfish</div>
        </div>
    </div>

    <div class="engine-pill">
        <span id="engineDot" class="engine-dot loading"></span>
        <span id="engineStatus">Starting Stockfish 18…</span>
    </div>
</header>

<main class="main">

    <section class="board-area">
        <div class="board-wrap">
            <div id="board" class="board"></div>
        </div>
    </section>

    <aside class="sidebar">

        <div class="status-card card">
            <div class="status-top">
                <div>
                    <div id="statusTitle" class="status-title">Your move</div>
                    <div id="statusSub" class="status-sub">White to move</div>
                </div>

                <div id="statusBadge" class="status-badge">Ready</div>
            </div>

            <div id="thinking" class="thinking">
                <div class="thinking-dots">
                    <i></i><i></i><i></i>
                </div>
                Stockfish is thinking
            </div>
        </div>

        <div class="clocks">
            <div id="whiteClock" class="clock active">
                <div class="clock-label">You · White</div>
                <div id="whiteTime" class="clock-time">10:00</div>
            </div>

            <div id="blackClock" class="clock">
                <div class="clock-label">Stockfish</div>
                <div id="blackTime" class="clock-time">10:00</div>
            </div>
        </div>

        <div class="eval-card card">
            <div class="eval-row">
                <span class="section-label">Evaluation</span>
                <span id="evalNumber" class="eval-number">0.00</span>
            </div>

            <div class="eval-track">
                <div id="evalFill" class="eval-fill"></div>
            </div>
        </div>

        <div class="moves-card card">
            <div class="moves-header">
                <span class="section-label">Moves</span>
                <span id="moveCount" class="section-label">0</span>
            </div>

            <div id="moves" class="moves"></div>
        </div>

        <div class="modes-card card">
            <div class="mode-title section-label">Game mode</div>

            <div class="mode-grid">
                <button class="mode-btn" data-time="60" data-inc="0">Bullet<br>1+0</button>
                <button class="mode-btn" data-time="120" data-inc="1">Bullet<br>2+1</button>

                <button class="mode-btn active" data-time="300" data-inc="0">Blitz<br>5+0</button>
                <button class="mode-btn" data-time="300" data-inc="3">Blitz<br>5+3</button>
                <button class="mode-btn" data-time="180" data-inc="2">Blitz<br>3+2</button>

                <button class="mode-btn" data-time="600" data-inc="0">Rapid<br>10+0</button>
                <button class="mode-btn" data-time="600" data-inc="5">Rapid<br>10+5</button>
                <button class="mode-btn" data-time="900" data-inc="10">Rapid<br>15+10</button>

                <button class="mode-btn" data-time="1800" data-inc="0">Classical<br>30+0</button>
            </div>

            <div class="settings">
                <div class="setting">
                    <label>Difficulty</label>
                    <select id="difficulty">
                        <option value="8">Easy</option>
                        <option value="12" selected>Medium</option>
                        <option value="16">Hard</option>
                        <option value="20">Expert</option>
                    </select>
                </div>

                <div class="setting">
                    <label>Board</label>
                    <select id="boardTheme">
                        <option value="classic" selected>Classic</option>
                        <option value="blue">Blue</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="controls-card card">
            <div class="control-grid">
                <button id="newGame" class="control-btn primary">New Game</button>
                <button id="undo" class="control-btn">Undo</button>
                <button id="flip" class="control-btn">Flip Board</button>
                <button id="sound" class="control-btn">Sound: On</button>
                <button id="resign" class="control-btn danger">Resign</button>
            </div>
        </div>

    </aside>
</main>
</div>

<!-- Promotion -->
<div id="promotionModal" class="modal">
    <div class="modal-box">
        <div class="modal-title">Choose promotion</div>
        <div class="modal-text">Select the piece you want.</div>

        <div class="modal-buttons">
            <button class="promo" data-piece="q">♕</button>
            <button class="promo" data-piece="r">♖</button>
            <button class="promo" data-piece="b">♗</button>
            <button class="promo" data-piece="n">♘</button>
        </div>
    </div>
</div>

<!-- Game Over -->
<div id="gameOverModal" class="modal">
    <div class="modal-box">
        <div id="gameOverTitle" class="modal-title">Game Over</div>
        <div id="gameOverText" class="modal-text"></div>

        <div class="modal-buttons" style="grid-template-columns:1fr;">
            <button id="modalNewGame" class="control-btn primary">
                Play Again
            </button>
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   GAME
========================================================= */

let game = new Chess();

let selectedSquare = null;
let legalMoves = [];
let flipped = false;

let pendingPromotion = null;

let engine = null;
let engineReady = false;
let engineThinking = false;
let engineInitializing = false;

let searchToken = 0;
let activeSearchToken = null;
let pendingEngineMove = false;

let engineDepth = 12;

let whiteSeconds = 600;
let blackSeconds = 600;
let incrementSeconds = 0;

let clockRunning = false;
let lastClockTime = 0;

let gameFinished = false;
let soundEnabled = true;

let lastMove = null;
let boardTheme = "classic";

const boardEl = document.getElementById("board");
const engineDot = document.getElementById("engineDot");
const engineStatus = document.getElementById("engineStatus");

const statusTitle = document.getElementById("statusTitle");
const statusSub = document.getElementById("statusSub");
const statusBadge = document.getElementById("statusBadge");

const thinkingEl = document.getElementById("thinking");

const whiteClockEl = document.getElementById("whiteClock");
const blackClockEl = document.getElementById("blackClock");
const whiteTimeEl = document.getElementById("whiteTime");
const blackTimeEl = document.getElementById("blackTime");

const evalNumber = document.getElementById("evalNumber");
const evalFill = document.getElementById("evalFill");

const movesEl = document.getElementById("moves");
const moveCountEl = document.getElementById("moveCount");

/* =========================================================
   PIECES
========================================================= */

const PIECES = {
    w:{
        p:"♙",
        n:"♘",
        b:"♗",
        r:"♖",
        q:"♕",
        k:"♔"
    },
    b:{
        p:"♟",
        n:"♞",
        b:"♝",
        r:"♜",
        q:"♛",
        k:"♚"
    }
};

/* =========================================================
   BOARD CREATION
   IMPORTANT:
   The 64 squares are created ONLY ONCE.
========================================================= */

const squares = {};

function createBoard(){

    boardEl.innerHTML = "";

    for(let row = 0; row < 8; row++){

        for(let col = 0; col < 8; col++){

            const square = document.createElement("div");

            const file = String.fromCharCode(97 + col);
            const rank = String(8 - row);
            const name = file + rank;

            square.className =
                "square " +
                (((row + col) % 2 === 0) ? "light" : "dark");

            square.dataset.square = name;

            const fileLabel = document.createElement("span");
            fileLabel.className = "coord-file";
            fileLabel.textContent = file;

            const rankLabel = document.createElement("span");
            rankLabel.className = "coord-rank";
            rankLabel.textContent = rank;

            const piece = document.createElement("span");
            piece.className = "piece";

            square.appendChild(fileLabel);
            square.appendChild(rankLabel);
            square.appendChild(piece);

            square.addEventListener("click", () => {
                handleSquareClick(name);
            });

            boardEl.appendChild(square);

            squares[name] = {
                el:square,
                piece
            };
        }
    }
}

/* =========================================================
   BOARD RENDER
========================================================= */

function renderBoard(){

    const orientation = flipped ? "black" : "white";

    boardEl.innerHTML = "";

    for(let row = 0; row < 8; row++){

        for(let col = 0; col < 8; col++){

            const actualRow =
                orientation === "white" ? row : 7 - row;

            const actualCol =
                orientation === "white" ? col : 7 - col;

            const file =
                String.fromCharCode(97 + actualCol);

            const rank =
                String(8 - actualRow);

            const name = file + rank;

            boardEl.appendChild(squares[name].el);
        }
    }

    updatePieces();
}

function updatePieces(){

    const board = game.board();

    for(let r = 0; r < 8; r++){

        for(let c = 0; c < 8; c++){

            const file = String.fromCharCode(97 + c);
            const rank = String(8 - r);
            const name = file + rank;

            const data = squares[name];

            const pieceData = board[r][c];

            data.el.classList.remove(
                "selected",
                "legal",
                "capture",
                "last-move",
                "in-check"
            );

            data.piece.className = "piece";
            data.piece.textContent = "";

            if(pieceData){

                data.piece.textContent =
                    PIECES[pieceData.color][pieceData.type];

                data.piece.classList.add(
                    pieceData.color === "w" ? "white" : "black"
                );
            }

            if(lastMove &&
                (lastMove.from === name || lastMove.to === name)){

                data.el.classList.add("last-move");
            }
        }
    }

    if(selectedSquare){

        squares[selectedSquare].el.classList.add("selected");

        legalMoves.forEach(move => {

            if(move.captured){
                squares[move.to].el.classList.add("capture");
            }else{
                squares[move.to].el.classList.add("legal");
            }
        });
    }

    /* Check highlight */

    if(game.in_check()){

        const kingColor = game.turn();

        for(let r = 0; r < 8; r++){

            for(let c = 0; c < 8; c++){

                const piece = game.board()[r][c];

                if(piece &&
                   piece.type === "k" &&
                   piece.color === kingColor){

                    const name =
                        String.fromCharCode(97 + c) +
                        String(8-r);

                    squares[name].el.classList.add("in-check");
                }
            }
        }
    }
}

/* =========================================================
   INPUT
========================================================= */

function handleSquareClick(square){

    if(gameFinished) return;

    /* Player is white. */
    if(game.turn() !== "w") return;

    if(engineThinking) return;

    const piece = game.get(square);

    /* Select own piece */
    if(piece && piece.color === "w"){

        selectedSquare = square;

        legalMoves = game.moves({
            square:square,
            verbose:true
        });

        updatePieces();

        return;
    }

    /* Try move */
    if(selectedSquare){

        const possible =
            legalMoves.find(m => m.to === square);

        if(!possible){

            selectedSquare = null;
            legalMoves = [];
            updatePieces();

            return;
        }

        /* Promotion */
        if(possible.promotion){

            pendingPromotion = {
                from:selectedSquare,
                to:square
            };

            document
                .getElementById("promotionModal")
                .classList.add("show");

            return;
        }

        makePlayerMove(
            selectedSquare,
            square
        );
    }
}

function makePlayerMove(from,to,promotion){

    const move = game.move({
        from:from,
        to:to,
        promotion:promotion || undefined
    });

    if(!move) return;

    selectedSquare = null;
    legalMoves = [];

    lastMove = {
        from:move.from,
        to:move.to
    };

    addIncrement("w");

    playMoveSound(move);

    renderBoard();
    renderMoves();

    updateStatus();

    checkGameState();

    if(!gameFinished){

        pendingEngineMove = true;

        requestEngineMove();
    }
}

/* =========================================================
   PROMOTION
========================================================= */

document.querySelectorAll(".promo").forEach(button => {

    button.addEventListener("click", () => {

        if(!pendingPromotion) return;

        const piece = button.dataset.piece;

        document
            .getElementById("promotionModal")
            .classList.remove("show");

        makePlayerMove(
            pendingPromotion.from,
            pendingPromotion.to,
            piece
        );

        pendingPromotion = null;
    });
});

/* =========================================================
   ENGINE
========================================================= */

function startEngine(){

    if(engine) return;

    engineInitializing = true;

    setEngineStatus(
        "loading",
        "Starting Stockfish 18…"
    );

    try{

        engine =
            new Worker("./stockfish-18-lite-single.js");

    }catch(error){

        engineInitializing = false;

        setEngineStatus(
            "error",
            "Stockfish failed to load"
        );

        return;
    }

    engine.onmessage = function(event){

        const line =
            String(event.data).trim();

        if(!line) return;

        /* UCI handshake */

        if(line === "uciok"){

            engine.postMessage(
                "setoption name Threads value 1"
            );

            engine.postMessage(
                "setoption name Hash value 32"
            );

            engine.postMessage("isready");

            return;
        }

        if(line === "readyok"){

            engineReady = true;
            engineInitializing = false;

            setEngineStatus(
                "ready",
                "Stockfish 18 ready"
            );

            if(pendingEngineMove &&
               game.turn() === "b" &&
               !gameFinished){

                pendingEngineMove = false;

                requestEngineMove();
            }

            return;
        }

        /* Evaluation */

        if(line.startsWith("info ")){

            parseEvaluation(line);

            return;
        }

        /* Search result */

        if(line.startsWith("bestmove ")){

            if(!engineThinking){
                return;
            }

            /*
              Ignore results from a search that was cancelled.
            */
            if(activeSearchToken === null){
                return;
            }

            const moveText =
                line.split(/\s+/)[1];

            engineThinking = false;
            activeSearchToken = null;

            thinkingEl.classList.remove("show");

            if(!moveText ||
               moveText === "(none)"){

                checkGameState();

                return;
            }

            makeEngineMove(moveText);
        }
    };

    engine.onerror = function(){

        engineReady = false;
        engineThinking = false;
        activeSearchToken = null;

        thinkingEl.classList.remove("show");

        setEngineStatus(
            "error",
            "Stockfish failed"
        );
    };

    /*
      Start UCI.
    */
    engine.postMessage("uci");
}

function setEngineStatus(type,text){

    engineStatus.textContent = text;

    engineDot.className = "engine-dot";

    if(type === "loading"){
        engineDot.classList.add("loading");
    }

    if(type === "error"){
        engineDot.classList.add("error");
    }
}

function requestEngineMove(){

    if(gameFinished) return;

    if(game.turn() !== "b") return;

    if(!engine){
        pendingEngineMove = true;
        startEngine();
        return;
    }

    if(!engineReady){
        pendingEngineMove = true;
        return;
    }

    if(engineThinking) return;

    pendingEngineMove = false;

    engineThinking = true;

    thinkingEl.classList.add("show");

    setEngineStatus(
        "ready",
        "Stockfish calculating…"
    );

    const token = ++searchToken;

    activeSearchToken = token;

    /*
      position fen is considerably safer than trying to
      reconstruct the entire game manually.
    */
    engine.postMessage(
        "position fen " + game.fen()
    );

    engine.postMessage(
        "go depth " + engineDepth
    );
}

function cancelEngineSearch(){

    searchToken++;

    activeSearchToken = null;

    if(engine && engineThinking){

        try{
            engine.postMessage("stop");
        }catch(e){}
    }

    engineThinking = false;

    thinkingEl.classList.remove("show");
}

function makeEngineMove(moveText){

    if(gameFinished) return;

    if(game.turn() !== "b") return;

    /*
      UCI looks like:
      e7e5
      e7e8q
    */
    const from = moveText.slice(0,2);
    const to = moveText.slice(2,4);
    const promotion =
        moveText.length >= 5
        ? moveText[4]
        : undefined;

    const move = game.move({
        from:from,
        to:to,
        promotion:promotion
    });

    if(!move){

        setEngineStatus(
            "error",
            "Invalid engine move"
        );

        return;
    }

    lastMove = {
        from:move.from,
        to:move.to
    };

    addIncrement("b");

    playMoveSound(move);

    renderBoard();
    renderMoves();

    updateStatus();

    checkGameState();
}

/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(line){

    const cpMatch =
        line.match(/score cp (-?\d+)/);

    const mateMatch =
        line.match(/score mate (-?\d+)/);

    if(mateMatch){

        const mate =
            parseInt(mateMatch[1],10);

        const value =
            mate > 0 ? 100 : -100;

        evalNumber.textContent =
            "M" + Math.abs(mate);

        setEvalBar(value);

        return;
    }

    if(cpMatch){

        let cp =
            parseInt(cpMatch[1],10);

        /*
          Stockfish's score is from the side to move.
          During our engine search that is Black,
          therefore flip it into White's perspective.
        */
        cp = -cp;

        const score = cp / 100;

        evalNumber.textContent =
            (score >= 0 ? "+" : "") +
            score.toFixed(2);

        setEvalBar(score);
    }
}

function setEvalBar(score){

    /*
      Logistic mapping gives a useful visual range
      without allowing huge engine scores to break
      the bar.
    */
    const clamped =
        Math.max(-6,Math.min(6,score));

    const percent =
        50 + (clamped / 6) * 42;

    evalFill.style.width =
        percent.toFixed(1) + "%";
}

/* =========================================================
   MOVES
========================================================= */

function renderMoves(){

    const history = game.history();

    movesEl.innerHTML = "";

    for(let i=0;i<history.length;i+=2){

        const row =
            document.createElement("div");

        row.className = "move-row";

        const number =
            document.createElement("span");

        number.className = "move-number";

        number.textContent =
            (Math.floor(i/2)+1) + ".";

        const white =
            document.createElement("span");

        white.className = "move";

        white.textContent =
            history[i] || "";

        const black =
            document.createElement("span");

        black.className = "move";

        black.textContent =
            history[i+1] || "";

        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        movesEl.appendChild(row);
    }

    moveCountEl.textContent =
        history.length;
    
    movesEl.scrollTop =
        movesEl.scrollHeight;
}

/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    if(gameFinished) return;

    if(game.turn() === "w"){

        statusTitle.textContent =
            "Your move";

        statusSub.textContent =
            game.in_check()
            ? "You are in check"
            : "White to move";

        statusBadge.textContent =
            "Your turn";

        whiteClockEl.classList.add("active");
        blackClockEl.classList.remove("active");

    }else{

        statusTitle.textContent =
            "Stockfish thinking";

        statusSub.textContent =
            "Black to move";

        statusBadge.textContent =
            "Engine";

        whiteClockEl.classList.remove("active");
        blackClockEl.classList.add("active");
    }
}

/* =========================================================
   GAME STATE
========================================================= */

function checkGameState(){

    if(game.is_checkmate()){

        gameFinished = true;
        clockRunning = false;

        const winner =
            game.turn() === "w"
            ? "Stockfish wins"
            : "You win";

        showGameOver(
            winner,
            "Checkmate."
        );

        return true;
    }

    if(game.is_stalemate()){

        gameFinished = true;
        clockRunning = false;

        showGameOver(
            "Draw",
            "Stalemate."
        );

        return true;
    }

    if(game.is_threefold_repetition()){

        gameFinished = true;
        clockRunning = false;

        showGameOver(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }

    if(game.is_insufficient_material()){

        gameFinished = true;
        clockRunning = false;

        showGameOver(
            "Draw",
            "Insufficient material."
        );

        return true;
    }

    if(game.is_draw()){

        gameFinished = true;
        clockRunning = false;

        showGameOver(
            "Draw",
            "The game is drawn."
        );

        return true;
    }

    return false;
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(title,text){

    cancelEngineSearch();

    document.getElementById("gameOverTitle")
        .textContent = title;

    document.getElementById("gameOverText")
        .textContent = text;

    document.getElementById("gameOverModal")
        .classList.add("show");

    statusTitle.textContent = title;
    statusSub.textContent = text;
    statusBadge.textContent = "Finished";
}

/* =========================================================
   CLOCKS
========================================================= */

function formatTime(seconds){

    seconds = Math.max(0,seconds);

    const whole =
        Math.floor(seconds);

    const minutes =
        Math.floor(whole / 60);

    const secs =
        whole % 60;

    if(seconds < 10){

        return (
            minutes +
            ":" +
            secs.toString().padStart(2,"0") +
            "." +
            Math.floor((seconds % 1)*10)
        );
    }

    return (
        minutes +
        ":" +
        secs.toString().padStart(2,"0")
    );
}

function renderClocks(){

    whiteTimeEl.textContent =
        formatTime(whiteSeconds);

    blackTimeEl.textContent =
        formatTime(blackSeconds);

    whiteClockEl.classList.toggle(
        "low",
        whiteSeconds < 10
    );

    blackClockEl.classList.toggle(
        "low",
        blackSeconds < 10
    );
}

function addIncrement(color){

    if(color === "w"){
        whiteSeconds += incrementSeconds;
    }else{
        blackSeconds += incrementSeconds;
    }

    renderClocks();
}

function clockLoop(now){

    if(!lastClockTime){
        lastClockTime = now;
    }

    const delta =
        (now - lastClockTime) / 1000;

    lastClockTime = now;

    if(clockRunning && !gameFinished){

        if(game.turn() === "w"){
            whiteSeconds -= delta;

            if(whiteSeconds <= 0){

                whiteSeconds = 0;

                gameFinished = true;
                clockRunning = false;

                showGameOver(
                    "Stockfish wins",
                    "Your clock ran out."
                );
            }

        }else{

            blackSeconds -= delta;

            if(blackSeconds <= 0){

                blackSeconds = 0;
                gameFinished = true;
                clockRunning = false;

                showGameOver(
                    "You win",
                    "Stockfish's clock ran out."
                );
            }
        }

        renderClocks();
    }

    requestAnimationFrame(clockLoop);
}

/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    cancelEngineSearch();

    if(engine){

        try{
            engine.postMessage("stop");
            engine.postMessage("ucinewgame");
            engine.postMessage("isready");
        }catch(e){}
    }

    game = new Chess();

    selectedSquare = null;
    legalMoves = [];
    pendingPromotion = null;

    lastMove = null;

    gameFinished = false;

    whiteSeconds =
        currentInitialSeconds;

    blackSeconds =
        currentInitialSeconds;

    renderClocks();

    document
        .getElementById("promotionModal")
        .classList.remove("show");

    document
        .getElementById("gameOverModal")
        .classList.remove("show");

    evalNumber.textContent = "0.00";
    evalFill.style.width = "50%";

    renderBoard();
    renderMoves();
    updateStatus();

    clockRunning = true;
    lastClockTime = performance.now();

    if(engine){

        engineReady = false;

        setEngineStatus(
            "loading",
            "Resetting Stockfish…"
        );

    }else{

        startEngine();
    }
}

/* =========================================================
   UNDO
========================================================= */

function undoMove(){

    if(gameFinished) return;

    cancelEngineSearch();

    /*
      Normally there are two moves to undo:
      our move + Stockfish's previous move.
    */
    if(game.history().length >= 2){

        game.undo();
        game.undo();

    }else if(game.history().length === 1){

        game.undo();

    }else{

        return;
    }

    selectedSquare = null;
    legalMoves = [];

    lastMove = null;

    renderBoard();
    renderMoves();
    updateStatus();

    /*
      Give the clocks a reasonable reset.
      Since chess.js doesn't track clocks, return to
      the selected starting position.
    */
    whiteSeconds = currentInitialSeconds;
    blackSeconds = currentInitialSeconds;

    renderClocks();
}

/* =========================================================
   FLIP
========================================================= */

function flipBoard(){

    flipped = !flipped;

    renderBoard();
}

/* =========================================================
   SOUND
========================================================= */

let audioContext = null;

function playMoveSound(move){

    if(!soundEnabled) return;

    try{

        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
            move.captured ? 180 : 290;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .045,
            audioContext.currentTime + .008
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .07
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .08
        );

    }catch(e){}
}

/* =========================================================
   MODES
========================================================= */

let currentInitialSeconds = 600;

document.querySelectorAll(".mode-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".mode-btn")
        .forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");

        currentInitialSeconds =
            Number(button.dataset.time);

        incrementSeconds =
            Number(button.dataset.inc);

        newGame();
    });
});

/* =========================================================
   SETTINGS
========================================================= */

document.getElementById("difficulty")
.addEventListener("change",function(){

    engineDepth =
        Number(this.value);
});

document.getElementById("boardTheme")
.addEventListener("change",function(){

    boardTheme = this.value;

    if(boardTheme === "blue"){

        document.documentElement.style
            .setProperty("--light","#cbdce5");

        document.documentElement.style
            .setProperty("--dark","#466679");

    }else{

        document.documentElement.style
            .setProperty("--light","#d9e1e7");

        document.documentElement.style
            .setProperty("--dark","#526477");
    }
});

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("newGame")
.addEventListener("click",newGame);

document.getElementById("modalNewGame")
.addEventListener("click",newGame);

document.getElementById("undo")
.addEventListener("click",undoMove);

document.getElementById("flip")
.addEventListener("click",flipBoard);

document.getElementById("sound")
.addEventListener("click",function(){

    soundEnabled = !soundEnabled;

    this.textContent =
        soundEnabled
        ? "Sound: On"
        : "Sound: Off";
});

document.getElementById("resign")
.addEventListener("click",function(){

    if(gameFinished) return;

    gameFinished = true;
    clockRunning = false;

    cancelEngineSearch();

    showGameOver(
        "Stockfish wins",
        "You resigned."
    );
});

/* =========================================================
   INITIALIZATION
========================================================= */

createBoard();

renderBoard();

renderMoves();

renderClocks();

updateStatus();

requestAnimationFrame(clockLoop);

/*
  Start the engine immediately.

  Because the worker is local, this uses exactly:

  ./stockfish-18-lite-single.js

  and that worker will load the accompanying WASM file.
*/
startEngine();
</script>
