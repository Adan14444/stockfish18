<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Nova Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root{
    --bg:#080b13;
    --panel:#111724;
    --panel2:#171e2e;
    --border:rgba(255,255,255,.09);
    --text:#f5f7ff;
    --muted:#8b96ad;
    --accent:#7c5cff;
    --accent2:#00d4ff;
    --good:#43e69a;
    --danger:#ff5577;

    --light:#e8edf5;
    --dark:#62718d;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 10% 10%,rgba(124,92,255,.15),transparent 32%),
        radial-gradient(circle at 90% 90%,rgba(0,212,255,.09),transparent 32%),
        var(--bg);
}

button,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:10px;
}

.shell{
    width:min(1240px,100%);
    height:min(760px,100%);

    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;

    gap:12px;
}

/* =========================================================
   BOARD PANEL
========================================================= */

.board-panel{
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:12px;

    border:1px solid var(--border);
    border-radius:20px;

    background:rgba(15,21,34,.72);

    box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(14px);
}

.topbar{
    width:min(100%,660px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:17px;
    font-weight:850;
}

.logo-icon{
    width:31px;
    height:31px;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    box-shadow:0 6px 20px rgba(124,92,255,.25);
}

.turn-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

/* =========================================================
   BOARD
========================================================= */

.board-wrap{
    width:min(
        100%,
        calc(100vh - 145px),
        660px
    );

    aspect-ratio:1;

    padding:5px;

    border-radius:13px;

    background:#090d16;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,255,255,.06);
}

.board{
    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    overflow:hidden;

    border-radius:8px;
}

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    user-select:none;
    touch-action:manipulation;
}

.square.light{
    background:var(--light);
}

.square.dark{
    background:var(--dark);
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px rgba(124,92,255,.9),
        inset 0 0 24px rgba(124,92,255,.35);

    z-index:5;
}

.square.last{
    box-shadow:
        inset 0 0 0 999px rgba(255,220,70,.14);
}

.square.check{
    box-shadow:
        inset 0 0 0 999px rgba(255,50,75,.36),
        inset 0 0 25px rgba(255,50,75,.6);
}

.square.legal::after{
    content:"";

    position:absolute;

    width:22%;
    height:22%;

    border-radius:50%;

    background:rgba(20,28,42,.35);

    z-index:2;
}

.square.capture::after{
    content:"";

    position:absolute;

    width:70%;
    height:70%;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.35);

    z-index:2;
}

.piece{
    position:relative;
    z-index:3;

    font-family:
        "Noto Sans Symbols 2",
        "Segoe UI Symbol",
        "DejaVu Sans",
        serif;

    font-size:clamp(27px,6.8vw,68px);

    line-height:1;

    user-select:none;

    pointer-events:none;

    text-shadow:
        0 2px 3px rgba(0,0,0,.3),
        0 5px 13px rgba(0,0,0,.15);
}

.white-piece{
    color:#fff;
}

.black-piece{
    color:#171c26;
}

.coord{
    position:absolute;

    z-index:4;

    pointer-events:none;

    font-size:8px;
    font-weight:850;

    opacity:.65;
}

.coord.file{
    right:4px;
    bottom:2px;
}

.coord.rank{
    left:4px;
    top:2px;
}

.light .coord{
    color:#61708c;
}

.dark .coord{
    color:#eef3ff;
}

/* =========================================================
   BOARD CONTROLS
========================================================= */

.board-controls{
    width:min(100%,660px);

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:7px;

    margin-top:8px;
}

.control-btn{
    min-width:0;

    padding:8px;

    border:1px solid var(--border);
    border-radius:10px;

    background:rgba(255,255,255,.045);

    color:var(--text);

    font-size:11px;
    font-weight:750;
}

.control-btn:hover{
    background:rgba(255,255,255,.08);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    min-height:0;

    display:flex;
    flex-direction:column;

    gap:8px;

    overflow-y:auto;

    scrollbar-width:none;
}

.sidebar::-webkit-scrollbar{
    display:none;
}

.card{
    padding:11px;

    border:1px solid var(--border);
    border-radius:15px;

    background:rgba(16,22,36,.78);

    box-shadow:
        0 12px 30px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.03);
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;

    color:var(--muted);

    font-size:10px;
    font-weight:850;

    letter-spacing:1px;
    text-transform:uppercase;
}

/* =========================================================
   ENGINE
========================================================= */

.engine-status{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:12px;
    font-weight:750;
}

.status-dot{
    width:8px;
    height:8px;

    flex:none;

    border-radius:50%;

    background:#777;
}

.status-dot.loading{
    background:#ffbd4a;
    box-shadow:0 0 12px rgba(255,189,74,.55);
}

.status-dot.ready{
    background:var(--good);
    box-shadow:0 0 12px rgba(67,230,154,.55);
}

.status-dot.error{
    background:var(--danger);
    box-shadow:0 0 12px rgba(255,85,119,.55);
}

.diagnostic{
    display:none;

    margin-top:8px;

    padding:8px;

    border-radius:9px;

    background:rgba(255,85,119,.08);

    border:1px solid rgba(255,85,119,.2);

    color:#ff9bad;

    font-size:10px;
    line-height:1.4;
}

.diagnostic.show{
    display:block;
}

.thinking{
    display:none;

    align-items:center;
    justify-content:center;

    gap:7px;

    margin-top:8px;

    color:var(--muted);

    font-size:10px;
}

.thinking.show{
    display:flex;
}

.spinner{
    width:11px;
    height:11px;

    border:2px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);

    border-radius:50%;

    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   CLOCK
========================================================= */

.clocks{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;
}

.clock{
    padding:9px;

    border-radius:10px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);
}

.clock.active{
    border-color:rgba(124,92,255,.5);

    background:rgba(124,92,255,.1);
}

.clock.low .clock-time{
    color:#ff6f87;
}

.clock-label{
    color:var(--muted);

    font-size:9px;
    font-weight:750;
}

.clock-time{
    margin-top:2px;

    font-size:21px;
    font-weight:850;

    letter-spacing:-1px;

    font-variant-numeric:tabular-nums;
}

/* =========================================================
   EVALUATION
========================================================= */

.eval{
    height:7px;

    overflow:hidden;

    border-radius:99px;

    background:rgba(255,255,255,.07);
}

.eval-fill{
    width:50%;
    height:100%;

    border-radius:99px;

    background:linear-gradient(
        90deg,
        #59667c,
        #f4f7ff
    );

    transition:width .25s ease;
}

.eval-number{
    margin-top:6px;

    text-align:center;

    color:var(--muted);

    font-size:11px;
    font-weight:800;

    font-variant-numeric:tabular-nums;
}

/* =========================================================
   MOVES
========================================================= */

.moves{
    max-height:145px;

    overflow:auto;

    scrollbar-width:thin;
}

.move-row{
    display:grid;
    grid-template-columns:27px 1fr 1fr;

    padding:4px;

    border-radius:6px;

    font-size:11px;
}

.move-row:nth-child(odd){
    background:rgba(255,255,255,.025);
}

.move-number{
    color:var(--muted);
}

.move{
    font-weight:750;
}

.empty{
    padding:9px;

    color:var(--muted);

    text-align:center;

    font-size:10px;
}

/* =========================================================
   SETTINGS
========================================================= */

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:7px;

    margin:6px 0;
}

.setting label{
    color:#d9dfed;

    font-size:11px;
    font-weight:650;
}

select{
    min-width:116px;

    padding:5px 7px;

    border:1px solid var(--border);
    border-radius:8px;

    outline:none;

    background:#171e2e;
    color:var(--text);

    font-size:10px;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:6px;
}

.action{
    padding:8px;

    border:1px solid var(--border);
    border-radius:9px;

    background:rgba(255,255,255,.045);

    color:var(--text);

    font-size:10px;
    font-weight:800;
}

.action.primary{
    border:0;

    background:linear-gradient(
        135deg,
        var(--accent),
        #5b8cff
    );

    box-shadow:0 7px 20px rgba(124,92,255,.2);
}

.action.danger{
    color:#ff8298;
}

/* =========================================================
   MODALS
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    display:none;
    place-items:center;

    z-index:100;

    background:rgba(0,0,0,.68);

    backdrop-filter:blur(8px);
}

.overlay.show{
    display:grid;
}

.modal{
    width:min(340px,calc(100% - 28px));

    padding:20px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    background:#111725;

    box-shadow:0 30px 80px rgba(0,0,0,.6);

    text-align:center;
}

.modal h2{
    margin:0 0 6px;

    font-size:19px;
}

.modal p{
    margin:0 0 14px;

    color:var(--muted);

    font-size:11px;
}

.promotion-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:7px;
}

.promo{
    padding:7px;

    border:1px solid var(--border);
    border-radius:11px;

    background:rgba(255,255,255,.05);

    color:var(--text);

    font-size:32px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    html,
    body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100dvh;

        align-items:flex-start;

        padding:7px;
    }

    .shell{
        height:auto;

        grid-template-columns:1fr;
    }

    .board-panel{
        padding:8px;
        border-radius:15px;
    }

    .board-wrap{
        width:min(
            calc(100vw - 25px),
            calc(100vh - 125px)
        );
    }

    .sidebar{
        overflow:visible;
    }
}

@media(max-height:700px) and (min-width:901px){

    .board-wrap{
        width:min(
            calc(100vh - 120px),
            calc(100vw - 365px)
        );
    }

    .board-panel{
        padding:8px;
    }

    .card{
        padding:8px;
    }

    .sidebar{
        gap:6px;
    }

    .moves{
        max-height:115px;
    }
}
</style>
</head>

<body>

<div class="app">
<div class="shell">

<section class="board-panel">

    <div class="topbar">

        <div class="logo">
            <div class="logo-icon">♞</div>
            <span>Nova Chess</span>
        </div>

        <div id="turnLabel" class="turn-label">
            Your move
        </div>

    </div>

    <div class="board-wrap">
        <div id="board" class="board"></div>
    </div>

    <div class="board-controls">

        <button id="undoBtn" class="control-btn">
            ↶ Undo
        </button>

        <button id="flipBtn" class="control-btn">
            ⇄ Flip
        </button>

        <button id="soundBtn" class="control-btn">
            🔊 Sound
        </button>

        <button id="resignBtn" class="control-btn">
            ⚑ Resign
        </button>

    </div>

</section>


<aside class="sidebar">

    <div class="card">

        <div class="card-title">
            <span>Engine</span>
            <span>SF 18</span>
        </div>

        <div class="engine-status">
            <span id="statusDot" class="status-dot loading"></span>
            <span id="engineStatus">
                Starting Stockfish…
            </span>
        </div>

        <div id="diagnostic" class="diagnostic"></div>

        <div id="thinking" class="thinking">
            <span class="spinner"></span>
            <span>Stockfish is thinking…</span>
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Clock</span>
            <span id="modeLabel">Blitz 5+0</span>
        </div>

        <div class="clocks">

            <div id="blackClock" class="clock">
                <div class="clock-label">BLACK</div>
                <div id="blackTime" class="clock-time">
                    5:00
                </div>
            </div>

            <div id="whiteClock" class="clock active">
                <div class="clock-label">WHITE</div>
                <div id="whiteTime" class="clock-time">
                    5:00
                </div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Evaluation</span>
        </div>

        <div class="eval">
            <div id="evalFill" class="eval-fill"></div>
        </div>

        <div id="evalNumber" class="eval-number">
            +0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Moves</span>
            <span id="moveCount">0</span>
        </div>

        <div id="moves" class="moves">
            <div class="empty">No moves yet</div>
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            <span>Game</span>
        </div>

        <div class="setting">

            <label>Time control</label>

            <select id="modeSelect">

                <option value="60+0">Bullet 1+0</option>
                <option value="120+1">Bullet 2+1</option>
                <option value="300+0" selected>Blitz 5+0</option>
                <option value="300+3">Blitz 5+3</option>
                <option value="180+2">Blitz 3+2</option>
                <option value="600+0">Rapid 10+0</option>
                <option value="600+5">Rapid 10+5</option>
                <option value="900+10">Rapid 15+10</option>
                <option value="1800+0">Classical 30+0</option>

            </select>

        </div>


        <div class="setting">

            <label>Difficulty</label>

            <select id="difficultySelect">

                <option value="500">Easy</option>
                <option value="1500" selected>Medium</option>
                <option value="3000">Hard</option>
                <option value="5000">Expert</option>

            </select>

        </div>


        <div class="setting">

            <label>Board theme</label>

            <select id="themeSelect">

                <option value="classic" selected>Classic</option>
                <option value="blue">Blue</option>

            </select>

        </div>

    </div>


    <div class="card">

        <div class="actions">

            <button id="newGameBtn" class="action primary">
                New Game
            </button>

            <button id="settingsBtn" class="action">
                Settings
            </button>

        </div>

    </div>

</aside>

</div>
</div>


<!-- =========================================================
     PROMOTION
========================================================= -->

<div id="promotionOverlay" class="overlay">

    <div class="modal">

        <h2>Choose promotion</h2>

        <p>Pick the piece for your pawn.</p>

        <div class="promotion-grid">

            <button class="promo" data-piece="q">♕</button>
            <button class="promo" data-piece="r">♖</button>
            <button class="promo" data-piece="b">♗</button>
            <button class="promo" data-piece="n">♘</button>

        </div>

    </div>

</div>


<!-- =========================================================
     GAME OVER
========================================================= -->

<div id="gameOverOverlay" class="overlay">

    <div class="modal">

        <h2 id="gameOverTitle">Game Over</h2>

        <p id="gameOverText"></p>

        <button
            id="gameOverNewBtn"
            class="action primary"
            style="width:100%">
            New Game
        </button>

    </div>

</div>


<script>

/* =========================================================
   NOVA CHESS
   Stockfish 18 ASM-JS
========================================================= */


/* =========================================================
   GAME
========================================================= */

let game = new Chess();

const boardEl =
    document.getElementById("board");

const movesEl =
    document.getElementById("moves");

const moveCountEl =
    document.getElementById("moveCount");

const turnLabel =
    document.getElementById("turnLabel");

const engineStatusEl =
    document.getElementById("engineStatus");

const statusDot =
    document.getElementById("statusDot");

const diagnosticEl =
    document.getElementById("diagnostic");

const thinkingEl =
    document.getElementById("thinking");

const evalFill =
    document.getElementById("evalFill");

const evalNumber =
    document.getElementById("evalNumber");

const whiteTimeEl =
    document.getElementById("whiteTime");

const blackTimeEl =
    document.getElementById("blackTime");

const whiteClockEl =
    document.getElementById("whiteClock");

const blackClockEl =
    document.getElementById("blackClock");

const modeLabelEl =
    document.getElementById("modeLabel");


/* =========================================================
   PIECES
========================================================= */

const pieceSymbols = {

    w:{
        p:"♙",
        n:"♘",
        b:"♗",
        r:"♖",
        q:"♕",
        k:"♔"
    },

    b:{
        p:"♟",
        n:"♞",
        b:"♝",
        r:"♜",
        q:"♛",
        k:"♚"
    }

};


/* =========================================================
   BOARD STATE
========================================================= */

let orientation = "w";

let selectedSquare = null;

let legalTargets = [];

let lastMove = null;

let squareMap = {};

let pendingPromotion = null;


/* =========================================================
   ENGINE
========================================================= */

/*
   IMPORTANT:

   We are using ONLY:

       stockfish-18-asm.js

   It must be in the same folder as index.html.

   There is NO .wasm dependency.
*/

const ENGINE_FILE =
    "./stockfish-18-asm.js";

let engine = null;

let engineReady = false;

let engineThinking = false;

let engineInitializing = false;

let pendingEngineMove = false;

let engineTimeout = null;

let searchGeneration = 0;

let activeSearchGeneration = null;

let engineThinkTime = 1500;


/* =========================================================
   CLOCK
========================================================= */

let whiteSeconds = 300;

let blackSeconds = 300;

let incrementSeconds = 0;

let currentTurn = "w";

let clockInterval = null;

let gameStarted = false;

let gameFinished = false;


/* =========================================================
   SOUND
========================================================= */

let soundEnabled = true;

let audioContext = null;


/* =========================================================
   MODES
========================================================= */

const modeNames = {

    "60+0":"Bullet 1+0",
    "120+1":"Bullet 2+1",

    "300+0":"Blitz 5+0",
    "300+3":"Blitz 5+3",
    "180+2":"Blitz 3+2",

    "600+0":"Rapid 10+0",
    "600+5":"Rapid 10+5",

    "900+10":"Rapid 15+10",

    "1800+0":"Classical 30+0"

};

let currentMode = "300+0";


/* =========================================================
   BOARD CREATION
========================================================= */

function createBoard(){

    boardEl.innerHTML = "";

    squareMap = {};

    for(let rank=8;rank>=1;rank--){

        for(let file=0;file<8;file++){

            const fileChar =
                String.fromCharCode(97 + file);

            const name =
                fileChar + rank;

            const square =
                document.createElement("div");

            square.className =
                "square " +
                (
                    (file + rank) % 2 === 0
                    ? "light"
                    : "dark"
                );

            square.dataset.square = name;

            square.addEventListener(
                "click",
                onSquareClick
            );

            const fileCoord =
                document.createElement("span");

            fileCoord.className = "coord file";
            fileCoord.textContent = fileChar;

            const rankCoord =
                document.createElement("span");

            rankCoord.className = "coord rank";
            rankCoord.textContent = rank;

            square.appendChild(fileCoord);
            square.appendChild(rankCoord);

            boardEl.appendChild(square);

            squareMap[name] = square;
        }
    }

    renderBoard();
}


/* =========================================================
   BOARD RENDER
========================================================= */

function renderBoard(){

    const files =
        orientation === "w"
        ? ["a","b","c","d","e","f","g","h"]
        : ["h","g","f","e","d","c","b","a"];

    const ranks =
        orientation === "w"
        ? [8,7,6,5,4,3,2,1]
        : [1,2,3,4,5,6,7,8];


    /*
       Put the squares into orientation order.

       We reuse the existing DOM nodes instead
       of recreating the entire board.
    */

    const fragment =
        document.createDocumentFragment();

    for(const rank of ranks){

        for(const file of files){

            fragment.appendChild(
                squareMap[file + rank]
            );
        }
    }

    boardEl.appendChild(fragment);


    /*
       Clear visual state.
    */

    Object.values(squareMap).forEach(
        square => {

            square.classList.remove(
                "selected",
                "legal",
                "capture",
                "last",
                "check"
            );

            const oldPiece =
                square.querySelector(".piece");

            if(oldPiece)
                oldPiece.remove();
        }
    );


    /*
       Add pieces.
    */

    const board =
        game.board();

    for(let r=0;r<8;r++){

        for(let f=0;f<8;f++){

            const piece =
                board[r][f];

            if(!piece) continue;

            const squareName =
                String.fromCharCode(97 + f)
                + (8-r);

            const square =
                squareMap[squareName];

            const pieceEl =
                document.createElement("span");

            pieceEl.className =
                "piece " +
                (
                    piece.color === "w"
                    ? "white-piece"
                    : "black-piece"
                );

            pieceEl.textContent =
                pieceSymbols[
                    piece.color
                ][piece.type];

            square.appendChild(pieceEl);
        }
    }


    /*
       Selected square.
    */

    if(
        selectedSquare &&
        squareMap[selectedSquare]
    ){

        squareMap[selectedSquare]
            .classList.add("selected");
    }


    /*
       Legal moves.
    */

    for(const target of legalTargets){

        const square =
            squareMap[target];

        if(!square) continue;

        const piece =
            game.get(target);

        square.classList.add(
            piece
            ? "capture"
            : "legal"
        );
    }


    /*
       Last move.
    */

    if(lastMove){

        if(squareMap[lastMove.from])
            squareMap[lastMove.from]
                .classList.add("last");

        if(squareMap[lastMove.to])
            squareMap[lastMove.to]
                .classList.add("last");
    }


    /*
       Check indicator.
    */

    if(game.in_check()){

        const turn =
            game.turn();

        const board =
            game.board();

        for(let r=0;r<8;r++){

            for(let f=0;f<8;f++){

                const piece =
                    board[r][f];

                if(
                    piece &&
                    piece.type === "k" &&
                    piece.color === turn
                ){

                    const name =
                        String.fromCharCode(97 + f)
                        + (8-r);

                    squareMap[name]
                        .classList.add("check");
                }
            }
        }
    }
}


/* =========================================================
   PLAYER INPUT
========================================================= */

function onSquareClick(event){

    if(gameFinished) return;

    if(engineThinking) return;

    if(game.turn() !== "w") return;

    const square =
        event.currentTarget.dataset.square;


    if(selectedSquare){

        if(legalTargets.includes(square)){

            attemptMove(
                selectedSquare,
                square
            );

            return;
        }
    }


    const piece =
        game.get(square);

    if(
        piece &&
        piece.color === "w"
    ){

        selectedSquare = square;

        legalTargets =
            game.moves({
                square:square,
                verbose:true
            }).map(
                move => move.to
            );

        renderBoard();

        return;
    }


    selectedSquare = null;

    legalTargets = [];

    renderBoard();
}


/* =========================================================
   MOVE
========================================================= */

function attemptMove(from,to){

    const piece =
        game.get(from);

    if(!piece) return;


    if(
        piece.type === "p" &&
        to[1] === "8"
    ){

        pendingPromotion = {
            from:from,
            to:to
        };

        document
            .getElementById("promotionOverlay")
            .classList.add("show");

        return;
    }


    makePlayerMove({
        from:from,
        to:to
    });
}


/* =========================================================
   PLAYER MOVE
========================================================= */

function makePlayerMove(move){

    const result =
        game.move(move);

    if(!result) return;

    lastMove = {
        from:result.from,
        to:result.to
    };

    selectedSquare = null;
    legalTargets = [];

    playMoveSound(result);

    if(!gameStarted){

        gameStarted = true;

        startClock();
    }

    currentTurn =
        game.turn();

    /*
       Increment belongs to the player
       who just moved.
    */

    whiteSeconds += incrementSeconds;

    renderBoard();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    checkGameState();


    if(
        !gameFinished &&
        game.turn() === "b"
    ){

        requestEngineMove();
    }
}


/* =========================================================
   ENGINE START
========================================================= */

function startEngine(){

    if(engine) return;

    engineInitializing = true;

    setEngineStatus(
        "loading",
        "Starting Stockfish…"
    );

    diagnosticEl.classList.remove("show");


    try{

        engine =
            new Worker(ENGINE_FILE);

    }catch(error){

        failEngine(
            "The Stockfish worker could not start."
        );

        return;
    }


    engine.onmessage =
        function(event){

            const line =
                String(event.data).trim();

            if(!line) return;


            /*
               UCI IDENTIFICATION
            */

            if(line === "uciok"){

                engine.postMessage(
                    "setoption name Hash value 16"
                );

                engine.postMessage(
                    "isready"
                );

                return;
            }


            /*
               ENGINE READY
            */

            if(line === "readyok"){

                clearTimeout(engineTimeout);

                engineReady = true;

                engineInitializing = false;

                setEngineStatus(
                    "ready",
                    "Stockfish 18 ready"
                );


                if(
                    pendingEngineMove &&
                    game.turn() === "b" &&
                    !gameFinished
                ){

                    pendingEngineMove = false;

                    requestEngineMove();
                }

                return;
            }


            /*
               EVALUATION
            */

            if(line.startsWith("info ")){

                parseEvaluation(line);

                return;
            }


            /*
               ENGINE MOVE
            */

            if(line.startsWith("bestmove ")){

                if(!engineThinking)
                    return;


                const generation =
                    activeSearchGeneration;


                if(
                    generation === null ||
                    generation !== searchGeneration
                ){

                    return;
                }


                const moveText =
                    line.split(/\s+/)[1];


                engineThinking = false;

                activeSearchGeneration = null;

                thinkingEl.classList.remove("show");


                if(
                    !moveText ||
                    moveText === "(none)"
                ){

                    checkGameState();

                    return;
                }


                makeEngineMove(moveText);
            }
        };


    engine.onerror =
        function(){

            failEngine(
                "Stockfish could not load. Make sure stockfish-18-asm.js is in the same folder as index.html."
            );
        };


    engine.onmessageerror =
        function(){

            failEngine(
                "Stockfish stopped responding."
            );
        };


    engineTimeout =
        setTimeout(
            function(){

                if(!engineReady){

                    failEngine(
                        "Stockfish timed out. Make sure stockfish-18-asm.js is beside index.html."
                    );
                }

            },
            20000
        );


    /*
       Start UCI.
    */

    try{

        engine.postMessage("uci");

    }catch(error){

        failEngine(
            "Could not send commands to Stockfish."
        );
    }
}


/* =========================================================
   ENGINE ERROR
========================================================= */

function failEngine(message){

    clearTimeout(engineTimeout);

    engineReady = false;

    engineInitializing = false;

    engineThinking = false;

    activeSearchGeneration = null;

    thinkingEl.classList.remove("show");

    setEngineStatus(
        "error",
        "Stockfish unavailable"
    );

    diagnosticEl.textContent =
        message;

    diagnosticEl.classList.add("show");


    if(engine){

        try{
            engine.terminate();
        }catch(e){}

        engine = null;
    }
}


/* =========================================================
   ENGINE MOVE REQUEST
========================================================= */

function requestEngineMove(){

    if(gameFinished) return;

    if(game.turn() !== "b") return;


    if(!engine){

        pendingEngineMove = true;

        startEngine();

        return;
    }


    if(!engineReady){

        pendingEngineMove = true;

        return;
    }


    if(engineThinking) return;


    pendingEngineMove = false;

    engineThinking = true;

    thinkingEl.classList.add("show");

    setEngineStatus(
        "ready",
        "Stockfish calculating…"
    );

    updateTurnUI();


    const generation =
        ++searchGeneration;

    activeSearchGeneration =
        generation;


    try{

        engine.postMessage(
            "position fen " + game.fen()
        );

        engine.postMessage(
            "go movetime " +
            engineThinkTime
        );

    }catch(error){

        engineThinking = false;

        activeSearchGeneration = null;

        thinkingEl.classList.remove("show");

        failEngine(
            "Stockfish could not start calculating."
        );
    }
}


/* =========================================================
   ENGINE MOVE
========================================================= */

function makeEngineMove(moveText){

    if(gameFinished) return;

    if(game.turn() !== "b") return;


    const from =
        moveText.substring(0,2);

    const to =
        moveText.substring(2,4);

    const promotion =
        moveText.length >= 5
        ? moveText.substring(4,5)
        : undefined;


    const move = {
        from:from,
        to:to
    };


    if(promotion)
        move.promotion = promotion;


    const result =
        game.move(move);


    if(!result){

        setEngineStatus(
            "error",
            "Stockfish returned an invalid move."
        );

        return;
    }


    lastMove = {
        from:result.from,
        to:result.to
    };


    /*
       Black's increment.
    */

    blackSeconds += incrementSeconds;


    currentTurn =
        game.turn();


    playMoveSound(result);

    renderBoard();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    checkGameState();
}


/* =========================================================
   CANCEL ENGINE
========================================================= */

function cancelEngineSearch(){

    searchGeneration++;

    activeSearchGeneration = null;

    engineThinking = false;

    pendingEngineMove = false;

    thinkingEl.classList.remove("show");


    if(engine){

        try{
            engine.postMessage("stop");
        }catch(e){}
    }
}


/* =========================================================
   ENGINE STATUS
========================================================= */

function setEngineStatus(type,text){

    engineStatusEl.textContent = text;

    statusDot.className =
        "status-dot " + type;
}


/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(line){

    if(!engineThinking) return;


    const match =
        line.match(
            /score (cp|mate) (-?\d+)/
        );

    if(!match) return;


    const type =
        match[1];

    const value =
        parseInt(match[2],10);


    let score = 0;


    if(type === "cp"){

        score = value / 100;

    }else{

        score =
            value > 0
            ? 10
            : -10;
    }


    /*
       Stockfish is calculating Black's position.
       Positive display = White advantage.
    */

    score *= -1;

    score =
        Math.max(
            -10,
            Math.min(10,score)
        );


    const percentage =
        50 + score * 4.5;


    evalFill.style.width =
        percentage + "%";


    evalNumber.textContent =
        (score >= 0 ? "+" : "") +
        score.toFixed(2);
}


function updateEvaluationFromPosition(){

    if(engineThinking) return;

    evalFill.style.width = "50%";

    evalNumber.textContent = "+0.00";
}


/* =========================================================
   MOVES
========================================================= */

function updateMoves(){

    const history =
        game.history();

    moveCountEl.textContent =
        history.length;


    if(history.length === 0){

        movesEl.innerHTML =
            '<div class="empty">No moves yet</div>';

        return;
    }


    movesEl.innerHTML = "";


    for(
        let i=0;
        i<history.length;
        i+=2
    ){

        const row =
            document.createElement("div");

        row.className = "move-row";


        const number =
            document.createElement("span");

        number.className = "move-number";

        number.textContent =
            (Math.floor(i/2)+1) + ".";


        const white =
            document.createElement("span");

        white.className = "move";

        white.textContent =
            history[i] || "";


        const black =
            document.createElement("span");

        black.className = "move";

        black.textContent =
            history[i+1] || "";


        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        movesEl.appendChild(row);
    }


    movesEl.scrollTop =
        movesEl.scrollHeight;
}


/* =========================================================
   TURN UI
========================================================= */

function updateTurnUI(){

    if(gameFinished) return;


    if(game.turn() === "w"){

        turnLabel.textContent =
            "Your move";

    }else{

        turnLabel.textContent =
            engineThinking
            ? "Stockfish thinking…"
            : "Black to move";
    }


    whiteClockEl.classList.toggle(
        "active",
        game.turn() === "w"
    );

    blackClockEl.classList.toggle(
        "active",
        game.turn() === "b"
    );
}


/* =========================================================
   GAME STATE
========================================================= */

function checkGameState(){

    if(game.is_checkmate()){

        finishGame(
            game.turn() === "w"
            ? "Black wins"
            : "White wins",
            "Checkmate."
        );

        return;
    }


    if(game.is_stalemate()){

        finishGame(
            "Draw",
            "Stalemate."
        );

        return;
    }


    if(game.is_insufficient_material()){

        finishGame(
            "Draw",
            "Insufficient material."
        );

        return;
    }


    if(game.is_threefold_repetition()){

        finishGame(
            "Draw",
            "Threefold repetition."
        );

        return;
    }


    if(game.is_draw()){

        finishGame(
            "Draw",
            "The game is drawn."
        );

        return;
    }


    updateTurnUI();
}


/* =========================================================
   GAME OVER
========================================================= */

function finishGame(title,text){

    gameFinished = true;

    cancelEngineSearch();

    stopClock();


    document.getElementById(
        "gameOverTitle"
    ).textContent = title;


    document.getElementById(
        "gameOverText"
    ).textContent = text;


    document.getElementById(
        "gameOverOverlay"
    ).classList.add("show");
}


/* =========================================================
   CLOCK
========================================================= */

function parseMode(value){

    const parts =
        value.split("+");

    return {
        initial:parseInt(parts[0],10),
        increment:parseInt(parts[1],10)
    };
}


function formatTime(seconds){

    seconds =
        Math.max(0,Math.floor(seconds));

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(secs).padStart(2,"0")
    );
}


function updateClockUI(){

    whiteTimeEl.textContent =
        formatTime(whiteSeconds);

    blackTimeEl.textContent =
        formatTime(blackSeconds);


    whiteClockEl.classList.toggle(
        "low",
        whiteSeconds <= 10
    );

    blackClockEl.classList.toggle(
        "low",
        blackSeconds <= 10
    );
}


function startClock(){

    if(clockInterval)
        return;

    clockInterval =
        setInterval(
            tickClock,
            1000
        );
}


function stopClock(){

    if(clockInterval){

        clearInterval(clockInterval);

        clockInterval = null;
    }
}


function tickClock(){

    if(!gameStarted) return;

    if(gameFinished) return;


    if(currentTurn === "w"){

        whiteSeconds--;

        if(whiteSeconds <= 0){

            whiteSeconds = 0;

            updateClockUI();

            finishGame(
                "Black wins",
                "White ran out of time."
            );

            return;
        }

    }else{

        blackSeconds--;

        if(blackSeconds <= 0){

            blackSeconds = 0;

            updateClockUI();

            finishGame(
                "White wins",
                "Black ran out of time."
            );

            return;
        }
    }


    updateClockUI();
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    cancelEngineSearch();

    stopClock();

    game = new Chess();

    selectedSquare = null;

    legalTargets = [];

    lastMove = null;

    pendingPromotion = null;

    gameFinished = false;

    gameStarted = false;

    currentTurn = "w";


    const mode =
        parseMode(currentMode);


    whiteSeconds =
        mode.initial;

    blackSeconds =
        mode.initial;

    incrementSeconds =
        mode.increment;


    updateClockUI();

    updateMoves();

    updateTurnUI();

    updateEvaluationFromPosition();

    renderBoard();


    document
        .getElementById("gameOverOverlay")
        .classList
        .remove("show");


    /*
       Reset the existing engine.
    */

    if(engine){

        engineReady = false;

        setEngineStatus(
            "loading",
            "Resetting Stockfish…"
        );


        try{

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        }catch(error){

            failEngine(
                "Stockfish stopped responding."
            );
        }

    }else{

        startEngine();
    }
}


/* =========================================================
   UNDO
========================================================= */

function undoMove(){

    if(gameFinished) return;

    cancelEngineSearch();


    /*
       Usually the position is:

       White move
       Black move

       So remove both.
    */

    if(game.history().length >= 2){

        game.undo();
        game.undo();

    }else if(game.history().length === 1){

        game.undo();
    }


    lastMove = null;

    selectedSquare = null;

    legalTargets = [];


    const mode =
        parseMode(currentMode);


    whiteSeconds =
        mode.initial;

    blackSeconds =
        mode.initial;


    gameStarted =
        game.history().length > 0;

    currentTurn =
        game.turn();


    updateClockUI();

    updateMoves();

    updateTurnUI();

    renderBoard();

    updateEvaluationFromPosition();
}


/* =========================================================
   FLIP
========================================================= */

function flipBoard(){

    orientation =
        orientation === "w"
        ? "b"
        : "w";

    renderBoard();
}


/* =========================================================
   PROMOTION
========================================================= */

document
    .querySelectorAll(".promo")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    if(!pendingPromotion)
                        return;


                    const promotion =
                        button.dataset.piece;


                    document
                        .getElementById(
                            "promotionOverlay"
                        )
                        .classList
                        .remove("show");


                    makePlayerMove({

                        from:
                            pendingPromotion.from,

                        to:
                            pendingPromotion.to,

                        promotion:
                            promotion
                    });


                    pendingPromotion = null;
                }
            );
        }
    );


/* =========================================================
   SOUND
========================================================= */

function playMoveSound(move){

    if(!soundEnabled) return;


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            move.captured
            ? "square"
            : "sine";


        oscillator.frequency.value =
            move.captured
            ? 180
            : 320;


        gain.gain.setValueAtTime(
            .04,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .08
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .08
        );

    }catch(error){}
}

   SETTINGS
========================================================= */

document
    .getElementById("difficultySelect")

                    );

            }else{

                document.documentElement
                    .style.setProperty(

                        "#e8edf5"
                    );

                document.documentElement
                    .style.setProperty(

                    );
            }
        }
    );


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("newGameBtn")
    .addEventListener(
        "click",

    );


document
    .getElementById("gameOverNewBtn")
    .addEventListener(
        "click",

    );

    );


document
    .getElementById("flipBtn")
    .addEventListener(

    );

    .getElementById("soundBtn")

            soundEnabled =

            this.textContent =

                ? "🔊 Sound"

    );


document
    .getElementById("resignBtn")
    .addEventListener(
        "click",
        function(){

            if(gameFinished) return;

            finishGame(

            );

    );


/* =========================================================
   SETTINGS BUTTON
========================================================= */

document
    .getElementById("settingsBtn")
    .addEventListener(
        "click",
        function(){

            document
                .getElementById("difficultySelect")
                .focus();
        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

createBoard();

updateClockUI();

updateMoves();

updateTurnUI();

startEngine();
