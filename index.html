<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nova Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root{
  --bg:#070a10;
  --panel:#101621;
  --panel2:#151d2a;
  --line:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#8e9aaa;

  --light:#e5edf5;
  --dark:#536d89;

  --accent:#62a8ff;
  --accent2:#8d6cff;
  --green:#48df8a;
  --red:#ff6262;
  --yellow:#ffd45c;

  --board:min(
    68vh,
    calc(100vw - 360px),
    600px
  );
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(73,125,255,.14),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 85%,
      rgba(130,75,255,.11),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;
}

button,
select{
  font:inherit;
}

/* =========================================================
   APP
   ========================================================= */

.app{
  min-height:100vh;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  border-bottom:1px solid var(--line);

  background:rgba(6,9,15,.82);

  backdrop-filter:blur(16px);

  position:relative;
  z-index:50;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:19px;
  font-weight:800;
}

.logo-icon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 0 22px rgba(98,168,255,.2);

  font-size:20px;
}

.engine-pill{
  display:flex;
  align-items:center;
  gap:8px;

  padding:7px 11px;

  border:1px solid var(--line);

  border-radius:999px;

  background:rgba(255,255,255,.035);

  color:var(--muted);

  font-size:12px;
  font-weight:700;
}

.engine-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#777;

  box-shadow:0 0 8px rgba(255,255,255,.15);
}

.engine-pill.ready .engine-dot{
  background:var(--green);
  box-shadow:0 0 10px rgba(72,223,138,.65);
}

.engine-pill.thinking .engine-dot{
  background:var(--accent);
  box-shadow:0 0 12px rgba(98,168,255,.8);

  animation:pulse 1s infinite;
}

.engine-pill.error .engine-dot{
  background:var(--red);
  box-shadow:0 0 10px rgba(255,98,98,.7);
}

@keyframes pulse{
  50%{
    opacity:.35;
  }
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    285px;

  gap:15px;

  padding:14px;

  max-width:1250px;

  margin:0 auto;
}

/* =========================================================
   BOARD AREA
   ========================================================= */

.board-area{
  min-width:0;

  display:flex;
  justify-content:center;
}

.board-column{
  width:var(--board);

  max-width:100%;
}

/* =========================================================
   PLAYER STRIPS
   ========================================================= */

.player-strip{
  height:38px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:7px;

  padding:0 4px;
}

.player-name{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:13px;
  font-weight:750;
}

.player-piece{
  font-size:19px;
}

.clock{
  min-width:68px;

  text-align:center;

  padding:7px 10px;

  border-radius:9px;

  background:var(--panel);

  border:1px solid var(--line);

  font-size:15px;
  font-weight:800;

  font-variant-numeric:tabular-nums;

  transition:.15s;
}

.clock.active{
  border-color:rgba(98,168,255,.55);

  box-shadow:
    0 0 0 1px rgba(98,168,255,.1),
    0 0 16px rgba(98,168,255,.1);
}

/* =========================================================
   BOARD
   ========================================================= */

.board-shell{
  position:relative;

  width:100%;
  aspect-ratio:1;

  border-radius:12px;

  padding:5px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,255,255,.05);
}

#board{
  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);

  overflow:hidden;

  border-radius:8px;

  user-select:none;

  touch-action:manipulation;
}

.square{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    filter .08s,
    transform .08s;
}

.square.light{
  background:var(--light);
}

.square.dark{
  background:var(--dark);
}

.square:hover{
  filter:brightness(1.045);
}

.square.selected{
  box-shadow:
    inset 0 0 0 4px rgba(98,168,255,.72);
}

.square.last-move{
  box-shadow:
    inset 0 0 0 999px rgba(255,214,83,.18);
}

.square.check{
  box-shadow:
    inset 0 0 0 999px rgba(255,65,65,.38);
}

/* =========================================================
   PIECES
   ========================================================= */

.piece{
  position:relative;
  z-index:3;

  font-family:
    "DejaVu Sans",
    "Segoe UI Symbol",
    serif;

  font-size:clamp(
    30px,
    calc(var(--board) / 9),
    65px
  );

  line-height:1;

  transform:translateY(-1px);

  pointer-events:none;

  text-shadow:
    0 2px 1px rgba(0,0,0,.2),
    0 3px 5px rgba(0,0,0,.15);
}

.piece.white{
  color:#fff;
  text-shadow:
    0 2px 1px rgba(0,0,0,.45),
    0 0 2px rgba(0,0,0,.4);
}

.piece.black{
  color:#161b22;
  text-shadow:
    0 1px 1px rgba(255,255,255,.12),
    0 3px 5px rgba(0,0,0,.3);
}

/* =========================================================
   LEGAL MOVE MARKERS
   ========================================================= */

.move-dot{
  position:absolute;

  width:22%;
  aspect-ratio:1;

  border-radius:50%;

  background:rgba(25,35,45,.35);

  z-index:2;

  pointer-events:none;
}

.capture-ring{
  position:absolute;

  inset:9%;

  border-radius:50%;

  border:5px solid rgba(25,35,45,.34);

  z-index:2;

  pointer-events:none;
}

/* =========================================================
   BOARD COORDINATES
   ========================================================= */

.coord{
  position:absolute;

  z-index:5;

  font-size:10px;
  font-weight:800;

  pointer-events:none;

  opacity:.72;
}

.rank{
  left:4px;
  top:3px;
}

.file{
  right:4px;
  bottom:2px;
}

.square.light .coord{
  color:var(--dark);
}

.square.dark .coord{
  color:var(--light);
}

/* =========================================================
   THINKING
   ========================================================= */

.thinking-overlay{
  position:absolute;

  inset:5px;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(5,8,14,.18);

  border-radius:8px;

  pointer-events:none;

  z-index:10;
}

.thinking-overlay.show{
  display:flex;
}

.thinking-box{
  display:flex;
  align-items:center;
  gap:9px;

  padding:9px 13px;

  border-radius:999px;

  background:rgba(8,12,20,.83);

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(10px);

  font-size:12px;
  font-weight:800;
}

.spinner{
  width:12px;
  height:12px;

  border:2px solid rgba(255,255,255,.2);

  border-top-color:var(--accent);

  border-radius:50%;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   BOARD CONTROLS
   ========================================================= */

.board-controls{
  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

  margin-top:9px;
}

.btn{
  border:1px solid var(--line);

  background:var(--panel);

  color:var(--text);

  border-radius:9px;

  padding:9px 8px;

  cursor:pointer;

  font-size:12px;
  font-weight:750;

  transition:
    background .12s,
    border-color .12s,
    transform .08s;
}

.btn:hover{
  background:var(--panel2);

  border-color:rgba(98,168,255,.28);
}

.btn:active{
  transform:scale(.97);
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
  display:flex;
  flex-direction:column;

  gap:10px;

  min-width:0;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(19,26,38,.93),
      rgba(13,18,27,.93)
    );

  border:1px solid var(--line);

  border-radius:12px;

  overflow:hidden;

  box-shadow:
    0 10px 30px rgba(0,0,0,.14);
}

.card-header{
  height:40px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 13px;

  border-bottom:1px solid var(--line);

  font-size:12px;
  font-weight:800;

  color:#e7ebf2;
}

.card-header span:last-child{
  color:var(--muted);
}

.card-body{
  padding:12px;
}

/* =========================================================
   EVAL
   ========================================================= */

.eval-wrap{
  display:flex;

  gap:10px;
}

.eval-bar{
  width:22px;

  height:120px;

  border-radius:7px;

  overflow:hidden;

  background:#090c11;

  border:1px solid var(--line);

  display:flex;

  align-items:flex-end;
}

.eval-fill{
  width:100%;

  height:50%;

  background:#f1f3f6;

  transition:height .35s ease;
}

.eval-info{
  flex:1;
}

.eval-number{
  font-size:25px;
  font-weight:850;

  letter-spacing:-.8px;
}

.eval-label{
  margin-top:4px;

  color:var(--muted);

  font-size:11px;

  line-height:1.4;
}

.depth{
  margin-top:15px;

  font-size:11px;

  color:var(--muted);
}

/* =========================================================
   MOVES
   ========================================================= */

.moves{
  max-height:245px;

  overflow-y:auto;

  scrollbar-width:thin;
}

.empty{
  color:var(--muted);

  font-size:12px;

  padding:7px 2px;
}

.move-row{
  display:grid;

  grid-template-columns:35px 1fr 1fr;

  min-height:31px;

  align-items:center;

  border-bottom:1px solid rgba(255,255,255,.035);
}

.move-number{
  color:#687588;

  font-size:11px;

  padding-left:2px;
}

.move{
  padding:5px 7px;

  border-radius:6px;

  font-size:12px;

  font-weight:700;
}

.move.current{
  background:rgba(98,168,255,.12);

  color:#fff;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.setting{
  display:grid;

  grid-template-columns:1fr 1fr;

  align-items:center;

  gap:10px;

  margin-bottom:9px;
}

.setting:last-child{
  margin-bottom:0;
}

.setting label{
  font-size:11px;

  color:var(--muted);

  font-weight:700;
}

select{
  width:100%;

  border:1px solid var(--line);

  border-radius:8px;

  background:#0c111a;

  color:var(--text);

  padding:7px 8px;

  outline:none;

  font-size:11px;
}

select:focus{
  border-color:rgba(98,168,255,.45);
}

/* =========================================================
   ENGINE STATUS
   ========================================================= */

.status{
  font-size:11px;

  line-height:1.5;

  color:var(--muted);

  word-break:break-word;
}

.status.good{
  color:var(--green);
}

.status.bad{
  color:var(--red);
}

.engine-debug{
  margin-top:10px;

  padding-top:10px;

  border-top:1px solid var(--line);
}

.engine-debug div{
  display:grid;

  grid-template-columns:75px 1fr;

  gap:7px;

  margin-top:5px;

  font-size:9px;

  line-height:1.3;
}

.engine-debug span{
  color:#69778b;
}

.engine-debug b{
  color:#bdc7d4;

  font-weight:650;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* =========================================================
   PROMOTION
   ========================================================= */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.6);

  backdrop-filter:blur(7px);

  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(320px,calc(100vw - 30px));

  padding:20px;

  border-radius:15px;

  background:#111823;

  border:1px solid var(--line);

  box-shadow:
    0 25px 80px rgba(0,0,0,.5);
}

.modal-title{
  font-size:18px;
  font-weight:850;
}

.modal-text{
  margin-top:6px;

  color:var(--muted);

  font-size:12px;
}

.promotion-buttons{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:8px;

  margin-top:17px;
}

.promotion-buttons button{
  border:1px solid var(--line);

  background:#182130;

  color:white;

  border-radius:10px;

  font-size:31px;

  padding:11px;

  cursor:pointer;
}

.promotion-buttons button:hover{
  border-color:var(--accent);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){
  :root{
    --board:min(
      68vh,
      calc(100vw - 325px),
      560px
    );
  }

  .main{
    grid-template-columns:
      minmax(0,1fr)
      260px;

    gap:11px;

    padding:11px;
  }
}

@media(max-width:760px){
  :root{
    --board:min(
      calc(100vw - 20px),
      68vh,
      620px
    );
  }

  .main{
    display:flex;
    flex-direction:column;

    align-items:center;

    padding:9px;
  }

  .board-area{
    width:100%;
  }

  .board-column{
    width:100%;
  }

  .sidebar{
    width:100%;
    max-width:620px;
  }
}

@media(max-height:700px) and (min-width:761px){
  :root{
    --board:min(
      58vh,
      calc(100vw - 340px),
      510px
    );
  }

  .topbar{
    height:52px;
  }

  .main{
    padding-top:8px;
    padding-bottom:8px;
  }

  .player-strip{
    height:33px;
  }

  .moves{
    max-height:190px;
  }

  .eval-bar{
    height:95px;
  }
}

@media(max-height:620px) and (min-width:761px){
  :root{
    --board:min(
      52vh,
      calc(100vw - 340px),
      450px
    );
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="logo">
    <div class="logo-icon">♞</div>
    <span>Nova Chess</span>
  </div>

  <div id="enginePill" class="engine-pill">
    <span class="engine-dot"></span>
    <span id="engineText">Starting Stockfish…</span>
  </div>

</header>


<main class="main">

<section class="board-area">

<div class="board-column">

  <div class="player-strip">

    <div class="player-name">
      <span class="player-piece">♟</span>
      <span>Nova</span>
    </div>

    <div id="blackClock" class="clock">
      5:00
    </div>

  </div>


  <div class="board-shell">

    <div id="board"></div>

    <div id="thinkingOverlay" class="thinking-overlay">

      <div class="thinking-box">
        <div class="spinner"></div>
        <span>Nova is thinking…</span>
      </div>

    </div>

  </div>


  <div class="player-strip">

    <div class="player-name">
      <span class="player-piece">♙</span>
      <span>You</span>
    </div>

    <div id="whiteClock" class="clock active">
      5:00
    </div>

  </div>


  <div class="board-controls">

    <button id="newGameBtn" class="btn">
      New Game
    </button>

    <button id="undoBtn" class="btn">
      Undo
    </button>

    <button id="flipBtn" class="btn">
      Flip Board
    </button>

  </div>

</div>

</section>


<aside class="sidebar">

  <!-- ENGINE -->

  <section class="card">

    <div class="card-header">
      <span>Stockfish</span>
      <span>ASM</span>
    </div>

    <div class="card-body">

      <div id="engineStatus" class="status">
        Loading Stockfish…
      </div>

      <div id="engineDebug" class="engine-debug">

        <div>
          <span>State</span>
          <b id="debugState">Starting</b>
        </div>

        <div>
          <span>Command</span>
          <b id="debugCommand">—</b>
        </div>

        <div>
          <span>Output</span>
          <b id="debugOutput">—</b>
        </div>

      </div>

    </div>

  </section>


  <!-- EVALUATION -->

  <section class="card">

    <div class="card-header">
      <span>Analysis</span>
      <span id="depthLabel">Depth —</span>
    </div>

    <div class="card-body">

      <div class="eval-wrap">

        <div class="eval-bar">
          <div id="evalFill" class="eval-fill"></div>
        </div>

        <div class="eval-info">

          <div id="evalNumber" class="eval-number">
            0.0
          </div>

          <div id="evalLabel" class="eval-label">
            Starting position
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- MOVES -->

  <section class="card">

    <div class="card-header">

      <span>Moves</span>

      <span id="moveCount">0</span>

    </div>

    <div id="moves" class="moves">

      <div class="empty">
        Make your first move.
      </div>

    </div>

  </section>


  <!-- SETTINGS -->

  <section class="card">

    <div class="card-header">
      <span>Game Settings</span>
    </div>

    <div class="card-body">

      <div class="setting">

        <label for="difficulty">
          Difficulty
        </label>

        <select id="difficulty">

          <option value="5">
            Beginner
          </option>

          <option value="7">
            Easy
          </option>

          <option value="10" selected>
            Medium
          </option>

          <option value="12">
            Hard
          </option>

          <option value="14">
            Expert
          </option>

          <option value="16">
            Maximum
          </option>

        </select>

      </div>


      <div class="setting">

        <label for="timeControl">
          Time Control
        </label>

        <select id="timeControl">

          <option value="60">
            1 + 0
          </option>

          <option value="180">
            3 + 0
          </option>

          <option value="300" selected>
            5 + 0
          </option>

          <option value="600">
            10 + 0
          </option>

        </select>

      </div>

    </div>

  </section>


  <!-- TEST -->

  <section class="card">

    <div class="card-header">
      <span>Engine Test</span>
    </div>

    <div class="card-body">

      <button
        id="testEngineBtn"
        class="btn"
        style="width:100%;"
      >
        Test Stockfish
      </button>

    </div>

  </section>


  <!-- RESIGN -->

  <section class="card">

    <div class="card-body">

      <button
        id="resignBtn"
        class="btn"
        style="width:100%;"
      >
        Resign
      </button>

    </div>

  </section>

</aside>

</main>

</div>


<!-- PROMOTION -->

<div id="promotionModal" class="modal">

  <div class="modal-card">

    <div class="modal-title">
      Promote Pawn
    </div>

    <div class="modal-text">
      Choose a piece.
    </div>

    <div class="promotion-buttons">

      <button data-piece="q">♕</button>
      <button data-piece="r">♖</button>
      <button data-piece="b">♗</button>
      <button data-piece="n">♘</button>

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   NOVA CHESS V4
   Reliable Stockfish ASM-JS integration
   ========================================================= */


/* =========================================================
   ENGINE
   ========================================================= */

const ENGINE_FILE = "./stockfish-18-asm.js";

let engine = null;

let engineReady = false;
let engineStarting = false;
let engineThinking = false;

let engineStartTimer = null;
let engineMoveTimer = null;

let engineLastCommand = "—";
let engineLastOutput = "—";

let engineSearchId = 0;


/* =========================================================
   CHESS
   ========================================================= */

let game = new Chess();

let selectedSquare = null;
let legalTargets = [];

let lastMove = null;

let flipped = false;

let pendingPromotion = null;


/* =========================================================
   CLOCK
   ========================================================= */

let initialSeconds = 300;

let whiteSeconds = 300;
let blackSeconds = 300;

let clockTimer = null;
let lastClockTick = 0;

let gameStarted = false;


/* =========================================================
   SETTINGS
   ========================================================= */

let engineDepth = 10;


/* =========================================================
   ANALYSIS
   ========================================================= */

let lastEvaluation = 0;
let lastDepth = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const boardElement =
  document.getElementById("board");

const enginePill =
  document.getElementById("enginePill");

const engineText =
  document.getElementById("engineText");

const engineStatus =
  document.getElementById("engineStatus");

const thinkingOverlay =
  document.getElementById("thinkingOverlay");

const whiteClock =
  document.getElementById("whiteClock");

const blackClock =
  document.getElementById("blackClock");

const movesElement =
  document.getElementById("moves");

const moveCount =
  document.getElementById("moveCount");

const evalNumber =
  document.getElementById("evalNumber");

const evalLabel =
  document.getElementById("evalLabel");

const evalFill =
  document.getElementById("evalFill");

const depthLabel =
  document.getElementById("depthLabel");

const difficulty =
  document.getElementById("difficulty");

const timeControl =
  document.getElementById("timeControl");

const promotionModal =
  document.getElementById("promotionModal");

const debugState =
  document.getElementById("debugState");

const debugCommand =
  document.getElementById("debugCommand");

const debugOutput =
  document.getElementById("debugOutput");


/* =========================================================
   PIECES
   ========================================================= */

const PIECES = {

  w:{
    p:"♙",
    n:"♘",
    b:"♗",
    r:"♖",
    q:"♕",
    k:"♔"
  },

  b:{
    p:"♟",
    n:"♞",
    b:"♝",
    r:"♜",
    q:"♛",
    k:"♚"
  }

};


/* =========================================================
   ENGINE UI
   ========================================================= */

function updateDebug(){

  debugState.textContent =
    engineThinking
      ? "Thinking"
      : engineReady
        ? "Ready"
        : engineStarting
          ? "Starting"
          : "Stopped";

  debugCommand.textContent =
    engineLastCommand || "—";

  debugOutput.textContent =
    engineLastOutput || "—";
}


function setEngineStatus(
  text,
  type=""
){

  engineText.textContent = text;

  engineStatus.textContent = text;

  enginePill.className =
    "engine-pill " + type;

  updateDebug();
}


function engineError(message){

  engineReady = false;
  engineStarting = false;
  engineThinking = false;

  clearTimeout(engineStartTimer);
  clearTimeout(engineMoveTimer);

  thinkingOverlay.classList.remove("show");

  setEngineStatus(
    "ENGINE ERROR: " + message,
    "error"
  );

}


/* =========================================================
   SEND ENGINE COMMAND
   ========================================================= */

function sendEngine(command){

  if(!engine){
    return false;
  }

  engineLastCommand = command;

  updateDebug();

  try{

    engine.postMessage(command);

    return true;

  }catch(error){

    engineError(
      "Could not send command: " +
      error.message
    );

    return false;
  }
}


/* =========================================================
   START ENGINE
   ========================================================= */

function startEngine(){

  if(engineStarting || engineReady){
    return;
  }

  engineStarting = true;
  engineReady = false;

  setEngineStatus(
    "Loading Stockfish ASM…"
  );

  try{

    engine =
      new Worker(
        ENGINE_FILE
      );

  }catch(error){

    engineError(
      "Could not create Worker: " +
      error.message
    );

    return;
  }


  engine.onmessage =
    function(event){

      const line =
        String(
          event.data || ""
        ).trim();

      if(!line){
        return;
      }

      handleEngineLine(line);
    };


  engine.onerror =
    function(){

      engineError(
        "Stockfish worker failed to load. Make sure stockfish-18-asm.js is beside index.html."
      );

    };


  engine.onmessageerror =
    function(){

      engineError(
        "Stockfish worker message error."
      );

    };


  sendEngine("uci");


  engineStartTimer =
    setTimeout(
      function(){

        if(!engineReady){

          engineError(
            "Stockfish took too long to start."
          );

        }

      },
      30000
    );
}


/* =========================================================
   ENGINE OUTPUT
   ========================================================= */

function handleEngineLine(line){

  engineLastOutput = line;

  updateDebug();


  /* ---------- UCI ---------- */

  if(line === "uciok"){

    setEngineStatus(
      "Stockfish identified — checking engine…"
    );

    /*
      IMPORTANT:
      Do NOT send Skill Level,
      Threads, Hash, etc.

      This keeps the ASM build on
      the exact simple UCI path that
      works reliably.
    */

    sendEngine(
      "isready"
    );

    return;
  }


  /* ---------- READY ---------- */

  if(line === "readyok"){

    clearTimeout(
      engineStartTimer
    );

    engineReady = true;
    engineStarting = false;

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

    return;
  }


  /* ---------- INFO ---------- */

  if(line.startsWith("info ")){

    parseEngineInfo(line);

    return;
  }


  /* ---------- BEST MOVE ---------- */

  if(line.startsWith("bestmove")){

    handleBestMove(line);

    return;
  }
}


/* =========================================================
   ENGINE ANALYSIS
   ========================================================= */

function parseEngineInfo(line){

  const depthMatch =
    line.match(
      /\bdepth\s+(\d+)/
    );

  if(depthMatch){

    lastDepth =
      Number(
        depthMatch[1]
      );

    depthLabel.textContent =
      "Depth " + lastDepth;
  }


  const cpMatch =
    line.match(
      /\bscore\s+cp\s+(-?\d+)/
    );

  if(cpMatch){

    let cp =
      Number(
        cpMatch[1]
      );

    /*
      Stockfish score is from the side
      to move.

      Convert to a simple display.
    */

    lastEvaluation =
      cp / 100;

    updateEvalBar();
  }


  const mateMatch =
    line.match(
      /\bscore\s+mate\s+(-?\d+)/
    );

  if(mateMatch){

    const mate =
      Number(
        mateMatch[1]
      );

    evalNumber.textContent =
      mate > 0
        ? "+" + mate + " M"
        : mate + " M";

    evalLabel.textContent =
      "Forced mate";

  }

}


/* =========================================================
   REQUEST ENGINE MOVE
   ========================================================= */

function requestEngineMove(){

  if(!engineReady){

    setEngineStatus(
      "Waiting for Stockfish…"
    );

    return;
  }


  if(engineThinking){
    return;
  }


  if(game.game_over()){
    return;
  }


  /*
    It should ONLY be Black's turn.
  */

  if(game.turn() !== "b"){
    return;
  }


  engineThinking = true;

  const searchId =
    ++engineSearchId;


  thinkingOverlay.classList.add(
    "show"
  );


  setEngineStatus(
    "Nova is thinking…",
    "thinking"
  );


  clearTimeout(
    engineMoveTimer
  );


  /*
    IMPORTANT.

    We use the proven UCI sequence:

      stop
      ucinewgame
      position startpos moves ...
      go depth N

    instead of position fen.
  */

  sendEngine("stop");

  sendEngine("ucinewgame");


  const history =
    game.history({
      verbose:true
    });


  const moves =
    history.map(
      function(move){

        let uci =
          move.from +
          move.to;

        if(move.promotion){
          uci += move.promotion;
        }

        return uci;
      }
    );


  let positionCommand =
    "position startpos";

  if(moves.length > 0){

    positionCommand +=
      " moves " +
      moves.join(" ");

  }


  sendEngine(
    positionCommand
  );


  const goCommand =
    "go depth " +
    engineDepth;


  sendEngine(
    goCommand
  );


  /*
    Safety timeout.

    The engine normally returns much
    sooner than this at these depths.
  */

  engineMoveTimer =
    setTimeout(
      function(){

        if(
          engineThinking &&
          searchId === engineSearchId
        ){

          try{
            sendEngine("stop");
          }catch(_){}

          finishEngineThinking();

          engineError(
            "Stockfish did not return bestmove."
          );

        }

      },
      30000
    );

}


/* =========================================================
   FINISH ENGINE THINKING
   ========================================================= */

function finishEngineThinking(){

  engineThinking = false;

  clearTimeout(
    engineMoveTimer
  );

  thinkingOverlay.classList.remove(
    "show"
  );

  if(
    engineReady &&
    !game.game_over()
  ){

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }

  updateClocks();
}


/* =========================================================
   APPLY BEST MOVE
   ========================================================= */

function handleBestMove(line){

  /*
    Ignore late results from a search
    that has already been cancelled.
  */

  if(!engineThinking){
    return;
  }


  clearTimeout(
    engineMoveTimer
  );


  const parts =
    line.split(/\s+/);


  const uci =
    parts[1];


  /*
    Stockfish may legally return
    "bestmove (none)".
  */

  if(
    !uci ||
    uci === "(none)"
  ){

    finishEngineThinking();

    checkGameEnd();

    return;
  }


  /*
    UCI format:

      e2e4
      e7e8q
  */

  if(
    !/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(
      uci
    )
  ){

    finishEngineThinking();

    engineError(
      "Invalid bestmove returned: " +
      uci
    );

    return;
  }


  const from =
    uci.substring(0,2);

  const to =
    uci.substring(2,4);

  const promotion =
    uci.length >= 5
      ? uci[4]
      : undefined;


  /*
    Double-check that this move is
    legal in chess.js BEFORE applying it.
  */

  const legalMoves =
    game.moves({
      verbose:true
    });


  const legal =
    legalMoves.find(
      function(move){

        return (
          move.from === from &&
          move.to === to &&
          (
            !promotion ||
            move.promotion === promotion
          )
        );

      }
    );


  if(!legal){

    finishEngineThinking();

    engineError(
      "Stockfish returned an illegal move: " +
      uci
    );

    return;
  }


  /*
    THIS IS THE IMPORTANT PART.

    Actually make the engine move
    in chess.js.
  */

  let move = null;

  try{

    move =
      game.move({
        from:from,
        to:to,
        promotion:promotion
      });

  }catch(error){

    move = null;
  }


  if(!move){

    finishEngineThinking();

    engineError(
      "Could not apply Stockfish move: " +
      uci
    );

    return;
  }


  /*
    Save last move so the board can
    highlight it.
  */

  lastMove = {
    from:from,
    to:to
  };


  selectedSquare = null;
  legalTargets = [];


  /*
    Render EVERYTHING immediately.
  */

  renderBoard();
  renderMoves();

  updateClocks();

  updateEvalBar();


  finishEngineThinking();


  /*
    Check whether the engine move ended
    the game.
  */

  if(checkGameEnd()){
    return;
  }


  /*
    Start White's clock again.
  */

  startClock();
}


/* =========================================================
   BOARD CREATION
   ========================================================= */

function createBoard(){

  boardElement.innerHTML = "";


  const files =
    ["a","b","c","d","e","f","g","h"];

  const ranks =
    ["1","2","3","4","5","6","7","8"];


  for(let row=0; row<8; row++){

    for(let col=0; col<8; col++){

      let file =
        flipped
          ? files[7-col]
          : files[col];

      let rank =
        flipped
          ? ranks[row]
          : ranks[7-row];


      const squareName =
        file + rank;


      const square =
        document.createElement(
          "div"
        );


      square.className =
        "square " +
        (
          (files.indexOf(file) +
           ranks.indexOf(rank)) % 2 === 0
            ? "light"
            : "dark"
        );


      square.dataset.square =
        squareName;


      square.addEventListener(
        "click",
        function(){

          handleSquareClick(
            squareName
          );

        }
      );


      boardElement.appendChild(
        square
      );
    }
  }


  renderBoard();
}


/* =========================================================
   RENDER BOARD
   ========================================================= */

function renderBoard(){

  const squares =
    boardElement.querySelectorAll(
      ".square"
    );


  squares.forEach(
    function(square){

      const name =
        square.dataset.square;


      square.innerHTML = "";


      /*
        Last move.
      */

      if(
        lastMove &&
        (
          lastMove.from === name ||
          lastMove.to === name
        )
      ){

        square.classList.add(
          "last-move"
        );

      }else{

        square.classList.remove(
          "last-move"
        );

      }


      /*
        Selection.
      */

      square.classList.toggle(
        "selected",
        selectedSquare === name
      );


      /*
        Check.
      */

      let isCheckSquare = false;

      if(
        game.in_check()
      ){

        const kingSquare =
          findKingSquare(
            game.turn()
          );

        if(
          kingSquare === name
        ){
          isCheckSquare = true;
        }
      }


      square.classList.toggle(
        "check",
        isCheckSquare
      );


      /*
        Legal move marker.
      */

      if(
        legalTargets.includes(name)
      ){

        const piece =
          game.get(name);


        if(piece){

          const ring =
            document.createElement(
              "div"
            );

          ring.className =
            "capture-ring";

          square.appendChild(
            ring
          );

        }else{

          const dot =
            document.createElement(
              "div"
            );

          dot.className =
            "move-dot";

          square.appendChild(
            dot
          );

        }
      }


      /*
        Piece.
      */

      const piece =
        game.get(name);


      if(piece){

        const element =
          document.createElement(
            "div"
          );

        element.className =
          "piece " +
          (
            piece.color === "w"
              ? "white"
              : "black"
          );

        element.textContent =
          PIECES[
            piece.color
          ][
            piece.type
          ];


        square.appendChild(
          element
        );
      }


      /*
        Coordinates.
      */

      const file =
        name[0];

      const rank =
        name[1];


      const fileIndex =
        flipped
          ? 7 - ["a","b","c","d","e","f","g","h"].indexOf(file)
          : ["a","b","c","d","e","f","g","h"].indexOf(file);


      const rankIndex =
        flipped
          ? Number(rank)-1
          : 8-Number(rank);


      if(fileIndex === 0){

        const label =
          document.createElement(
            "span"
          );

        label.className =
          "coord rank";

        label.textContent =
          rank;

        square.appendChild(
          label
        );
      }


      if(rankIndex === 7){

        const label =
          document.createElement(
            "span"
          );

        label.className =
          "coord file";

        label.textContent =
          file;

        square.appendChild(
          label
        );
      }

    }
  );
}


/* =========================================================
   FIND KING
   ========================================================= */

function findKingSquare(color){

  const board =
    game.board();


  for(let r=0; r<8; r++){

    for(let c=0; c<8; c++){

      const piece =
        board[r][c];


      if(
        piece &&
        piece.color === color &&
        piece.type === "k"
      ){

        return (
          "abcdefgh"[c] +
          (8-r)
        );

      }
    }
  }


  return null;
}


/* =========================================================
   SQUARE CLICK
   ========================================================= */

function handleSquareClick(square){

  /*
    Never allow interaction while Nova
    is thinking.
  */

  if(engineThinking){
    return;
  }


  /*
    Player is White.
  */

  if(game.turn() !== "w"){
    return;
  }


  if(game.game_over()){
    return;
  }


  /*
    Clicking a legal destination.
  */

  if(
    selectedSquare &&
    legalTargets.includes(square)
  ){

    attemptMove(
      selectedSquare,
      square
    );

    return;
  }


  /*
    Clicking another piece.
  */

  const piece =
    game.get(square);


  if(
    piece &&
    piece.color === "w"
  ){

    selectSquare(square);

    return;
  }


  clearSelection();
}


/* =========================================================
   SELECT
   ========================================================= */

function selectSquare(square){

  selectedSquare =
    square;


  const moves =
    game.moves({
      square:square,
      verbose:true
    });


  legalTargets =
    moves.map(
      function(move){
        return move.to;
      }
    );


  renderBoard();
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearSelection(){

  selectedSquare = null;
  legalTargets = [];

  renderBoard();
}


/* =========================================================
   ATTEMPT MOVE
   ========================================================= */

function attemptMove(from,to){

  const piece =
    game.get(from);


  if(
    piece &&
    piece.type === "p" &&
    to[1] === "8"
  ){

    pendingPromotion = {
      from:from,
      to:to
    };

    promotionModal.classList.add(
      "show"
    );

    return;
  }


  makePlayerMove(
    from,
    to,
    "q"
  );
}


/* =========================================================
   PLAYER MOVE
   ========================================================= */

function makePlayerMove(
  from,
  to,
  promotion
){

  let move = null;


  try{

    move =
      game.move({
        from:from,
        to:to,
        promotion:promotion
      });

  }catch(error){

    move = null;
  }


  if(!move){

    clearSelection();

    return;
  }


  lastMove = {
    from:from,
    to:to
  };


  selectedSquare = null;
  legalTargets = [];


  gameStarted = true;


  renderBoard();
  renderMoves();
  updateClocks();
  updateEvalBar();


  /*
    Did the player's move end the game?
  */

  if(checkGameEnd()){
    return;
  }


  /*
    IMPORTANT:
    Immediately ask Stockfish for Black's move.
  */

  requestEngineMove();
}


/* =========================================================
   PROMOTION BUTTONS
   ========================================================= */

document
  .querySelectorAll(
    ".promotion-buttons button"
  )
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          if(!pendingPromotion){
            return;
          }


          const move =
            pendingPromotion;


          const promotion =
            this.dataset.piece;


          pendingPromotion = null;


          promotionModal.classList.remove(
            "show"
          );


          makePlayerMove(
            move.from,
            move.to,
            promotion
          );

        }
      );

    }
  );


/* =========================================================
   MOVES
   ========================================================= */

function renderMoves(){

  const history =
    game.history();


  moveCount.textContent =
    history.length;


  if(history.length === 0){

    movesElement.innerHTML =
      '<div class="empty">Make your first move.</div>';

    return;
  }


  let html = "";


  for(
    let i=0;
    i<history.length;
    i+=2
  ){

    const number =
      Math.floor(i/2)+1;


    const white =
      history[i] || "";


    const black =
      history[i+1] || "";


    const whiteCurrent =
      i === history.length-1;


    const blackCurrent =
      i+1 === history.length-1;


    html +=
      '<div class="move-row">' +

        '<div class="move-number">' +
          number +
          '.' +
        '</div>' +

        '<div class="move ' +
          (whiteCurrent ? "current" : "") +
        '">' +
          white +
        '</div>' +

        '<div class="move ' +
          (blackCurrent ? "current" : "") +
        '">' +
          black +
        '</div>' +

      '</div>';
  }


  movesElement.innerHTML =
    html;


  movesElement.scrollTop =
    movesElement.scrollHeight;
}


/* =========================================================
   CLOCK
   ========================================================= */

function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Math.ceil(seconds)
    );


  const minutes =
    Math.floor(seconds/60);


  const secs =
    seconds%60;


  return (
    minutes +
    ":" +
    String(secs).padStart(2,"0")
  );
}


function updateClocks(){

  whiteClock.textContent =
    formatTime(
      whiteSeconds
    );


  blackClock.textContent =
    formatTime(
      blackSeconds
    );


  whiteClock.classList.toggle(
    "active",
    game.turn() === "w" &&
    !game.game_over() &&
    !engineThinking
  );


  blackClock.classList.toggle(
    "active",
    game.turn() === "b" &&
    !game.game_over() &&
    engineThinking
  );
}


function startClock(){

  clearInterval(
    clockTimer
  );


  if(
    !gameStarted ||
    game.game_over()
  ){
    return;
  }


  lastClockTick =
    performance.now();


  clockTimer =
    setInterval(
      function(){

        const now =
          performance.now();


        const elapsed =
          (now-lastClockTick)/1000;


        lastClockTick =
          now;


        /*
          White clock runs during White's
          turn.

          Black clock runs during Nova's
          turn, including while Stockfish
          is calculating.
        */

        if(game.turn() === "w"){

          whiteSeconds =
            Math.max(
              0,
              whiteSeconds-elapsed
            );

        }else{

          blackSeconds =
            Math.max(
              0,
              blackSeconds-elapsed
            );
        }


        updateClocks();


        if(whiteSeconds <= 0){

          clearInterval(
            clockTimer
          );

          endGame(
            "Nova wins on time."
          );

          return;
        }


        if(blackSeconds <= 0){

          clearInterval(
            clockTimer
          );

          endGame(
            "You win on time."
          );

        }

      },
      100
    );
}


/* =========================================================
   GAME END
   ========================================================= */

function checkGameEnd(){

  if(game.is_checkmate()){

    const message =
      game.turn() === "w"
        ? "Nova wins by checkmate."
        : "You win by checkmate.";


    endGame(
      message
    );

    return true;
  }


  if(game.is_draw()){

    endGame(
      "Draw."
    );

    return true;
  }


  return false;
}


function endGame(message){

  clearInterval(
    clockTimer
  );

  clearTimeout(
    engineMoveTimer
  );


  engineThinking = false;

  thinkingOverlay.classList.remove(
    "show"
  );


  setEngineStatus(
    message
  );


  updateClocks();
}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

  clearInterval(
    clockTimer
  );

  clearTimeout(
    engineMoveTimer
  );


  engineSearchId++;


  engineThinking = false;


  thinkingOverlay.classList.remove(
    "show"
  );


  pendingPromotion = null;

  promotionModal.classList.remove(
    "show"
  );


  game =
    new Chess();


  selectedSquare = null;
  legalTargets = [];
  lastMove = null;


  const seconds =
    Number(
      timeControl.value
    );


  initialSeconds =
    seconds;


  whiteSeconds =
    seconds;


  blackSeconds =
    seconds;


  gameStarted = false;


  lastEvaluation = 0;
  lastDepth = 0;


  evalNumber.textContent =
    "0.0";


  evalLabel.textContent =
    "Starting position";


  depthLabel.textContent =
    "Depth —";


  renderBoard();
  renderMoves();
  updateClocks();
  updateEvalBar();


  if(engine){

    sendEngine("stop");
    sendEngine("ucinewgame");
    sendEngine("isready");

  }


  if(engineReady){

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }else{

    setEngineStatus(
      "Waiting for Stockfish…"
    );

  }
}


/* =========================================================
   UNDO
   ========================================================= */

function undoMove(){

  if(engineThinking){

    engineSearchId++;

    try{
      sendEngine("stop");
    }catch(_){}

    clearTimeout(
      engineMoveTimer
    );

    engineThinking = false;

    thinkingOverlay.classList.remove(
      "show"
    );
  }


  const historyLength =
    game.history().length;


  if(historyLength === 0){
    return;
  }


  /*
    If Nova already moved, undo
    Nova + the player's move.

    If only the player's move exists,
    undo that one.
  */

  if(historyLength >= 2){

    game.undo();
    game.undo();

  }else{

    game.undo();

  }


  selectedSquare = null;
  legalTargets = [];
  lastMove = null;


  whiteSeconds =
    initialSeconds;


  blackSeconds =
    initialSeconds;


  gameStarted = false;


  renderBoard();
  renderMoves();
  updateClocks();
  updateEvalBar();


  if(engineReady){

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }
}


/* =========================================================
   FLIP
   ========================================================= */

document
  .getElementById("flipBtn")
  .addEventListener(
    "click",
    function(){

      flipped =
        !flipped;

      createBoard();

    }
  );


/* =========================================================
   RESIGN
   ========================================================= */

document
  .getElementById("resignBtn")
  .addEventListener(
    "click",
    function(){

      if(!game.game_over()){

        endGame(
          "You resigned. Nova wins."
        );

      }

    }
  );


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("newGameBtn")
  .addEventListener(
    "click",
    newGame
  );


document
  .getElementById("undoBtn")
  .addEventListener(
    "click",
    undoMove
  );


/* =========================================================
   SETTINGS
   ========================================================= */

difficulty.addEventListener(
  "change",
  function(){

    engineDepth =
      Number(
        this.value
      );

  }
);


timeControl.addEventListener(
  "change",
  function(){

    /*
      Only change the clock before
      any moves have been made.
    */

    if(
      game.history().length === 0
    ){

      const seconds =
        Number(
          this.value
        );


      initialSeconds =
        seconds;


      whiteSeconds =
        seconds;


      blackSeconds =
        seconds;


      updateClocks();

    }

  }
);


/* =========================================================
   ENGINE TEST
   ========================================================= */

document
  .getElementById("testEngineBtn")
  .addEventListener(
    "click",
    function(){

      if(!engineReady){

        setEngineStatus(
          "Stockfish is not ready yet."
        );

        return;
      }


      if(engineThinking){

        setEngineStatus(
          "Stockfish is already calculating.",
          "thinking"
        );

        return;
      }


      setEngineStatus(
        "Running engine test…",
        "thinking"
      );


      /*
        This test does NOT change the game.

        It simply asks Stockfish for a
        move from the starting position.
      */

      sendEngine("stop");
      sendEngine("ucinewgame");
      sendEngine("position startpos");
      sendEngine("go depth 6");

    }
  );


/* =========================================================
   EVALUATION BAR
   ========================================================= */

function updateEvalBar(){

  const value =
    Math.max(
      -5,
      Math.min(
        5,
        lastEvaluation
      )
    );


  const percentage =
    50 +
    value * 10;


  evalFill.style.height =
    Math.max(
      4,
      Math.min(
        96,
        percentage
      )
    ) + "%";


  if(
    Math.abs(lastEvaluation) < .05
  ){

    evalNumber.textContent =
      "0.0";

    evalLabel.textContent =
      game.history().length === 0
        ? "Starting position"
        : "Equal";

  }else{

    evalNumber.textContent =
      (
        lastEvaluation >= 0
          ? "+"
          : ""
      ) +
      lastEvaluation.toFixed(1);

    evalLabel.textContent =
      "Engine evaluation";

  }
}


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize(){

  if(typeof Chess !== "function"){

    setEngineStatus(
      "CHESS ERROR: chess.js failed to load.",
      "error"
    );

    return;
  }


  const seconds =
    Number(
      timeControl.value
    );


  initialSeconds =
    seconds;


  whiteSeconds =
    seconds;


  blackSeconds =
    seconds;


  engineDepth =
    Number(
      difficulty.value
    );


  updateClocks();

  createBoard();

  renderMoves();

  updateEvalBar();

  updateDebug();

  startEngine();
}


initialize();

</script>
