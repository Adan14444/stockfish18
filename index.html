<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockfish Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 20% 15%, rgba(95, 85, 255, 0.16), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(40, 190, 255, 0.10), transparent 30%),
        #080a11;

    color: #f4f6fb;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
select {
    font: inherit;
}

/* ================================
   PAGE
================================ */

.page {
    width: min(1400px, 95vw);
    margin: auto;
    padding: 22px 0 35px;
}

/* ================================
   HEADER
================================ */

.header {
    height: 66px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;

    background: rgba(15,18,28,0.82);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.28),
        inset 0 1px rgba(255,255,255,0.05);

    backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    font-size: 25px;
    font-family: Georgia, serif;

    background:
        linear-gradient(135deg, #8d7fff, #52d6ff);

    box-shadow:
        0 8px 25px rgba(100,120,255,0.3);
}

.brand-name {
    font-size: 16px;
    font-weight: 800;
}

.brand-subtitle {
    margin-top: 2px;
    color: #8992a5;
    font-size: 11px;
}

.engine-status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 13px;

    border-radius: 999px;

    border: 1px solid rgba(255,255,255,0.09);

    background: rgba(255,255,255,0.035);

    color: #cbd1dc;

    font-size: 11px;
    font-weight: 700;
}

.engine-light {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #48f49a;

    box-shadow:
        0 0 12px rgba(72,244,154,0.9);
}

.engine-status.thinking .engine-light {
    animation: enginePulse 0.65s infinite alternate;
}

@keyframes enginePulse {
    from {
        transform: scale(0.65);
        opacity: 0.45;
    }

    to {
        transform: scale(1.25);
        opacity: 1;
    }
}

/* ================================
   LAYOUT
================================ */

.layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        330px;

    gap: 24px;

    margin-top: 22px;

    align-items: start;
}

/* ================================
   BOARD
================================ */

.board-container {
    display: flex;
    justify-content: center;

    min-width: 0;
}

.board-frame {
    width: min(70vh, 70vw, 720px);
    aspect-ratio: 1 / 1;

    padding: 9px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.15),
            rgba(255,255,255,0.025)
        );

    border: 1px solid rgba(255,255,255,0.11);

    box-shadow:
        0 30px 75px rgba(0,0,0,0.45),
        0 0 70px rgba(100,100,255,0.08),
        inset 0 1px rgba(255,255,255,0.10);
}

.board {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(8, minmax(0, 1fr));

    grid-template-rows:
        repeat(8, minmax(0, 1fr));

    overflow: hidden;

    border-radius: 17px;
}

.square {
    position: relative;

    min-width: 0;
    min-height: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;
    user-select: none;

    transition:
        filter 0.12s ease,
        box-shadow 0.16s ease;
}

.square.light {
    background: #e3e9f1;
}

.square.dark {
    background: #69798f;
}

.square:hover {
    filter: brightness(1.07);
}

.square.selected {
    box-shadow:
        inset 0 0 0 999px rgba(112,96,255,0.28),
        inset 0 0 25px rgba(112,96,255,0.35);
}

.square.last {
    box-shadow:
        inset 0 0 0 999px rgba(255,205,60,0.17);
}

.square.check {
    box-shadow:
        inset 0 0 0 999px rgba(255,50,70,0.28),
        inset 0 0 28px rgba(255,50,70,0.65);

    animation: checkFlash 0.7s infinite alternate;
}

@keyframes checkFlash {
    from {
        filter: brightness(1);
    }

    to {
        filter: brightness(1.13);
    }
}

/* ================================
   PIECES
================================ */

.piece {
    position: relative;

    z-index: 3;

    pointer-events: none;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    /*
       The piece is intentionally capped.
       It can never make the board larger.
    */
    font-size: clamp(30px, 5.1vw, 62px);

    line-height: 0.9;

    transform: translateY(0);

    transition:
        transform 0.12s ease,
        filter 0.12s ease;

    will-change: transform;

    filter:
        drop-shadow(0 4px 3px rgba(0,0,0,0.28));
}

.square:hover .piece {
    transform: translateY(-2px);
}

.white-piece {
    color: #ffffff;

    text-shadow:
        0 2px 0 #c8d0dc,
        0 4px 7px rgba(0,0,0,0.38);
}

.black-piece {
    color: #20252d;

    text-shadow:
        0 1px 0 #596270,
        0 4px 7px rgba(0,0,0,0.42);
}

/* ================================
   COORDINATES
================================ */

.coordinate {
    position: absolute;

    z-index: 5;

    pointer-events: none;

    font-size: 9px;
    font-weight: 800;

    opacity: 0.55;
}

.rank {
    top: 4px;
    left: 5px;
}

.file {
    right: 5px;
    bottom: 4px;
}

.square.light .coordinate {
    color: #536073;
}

.square.dark .coordinate {
    color: #f0f4fa;
}

/* ================================
   LEGAL MOVE INDICATORS
================================ */

.move-dot {
    position: absolute;

    z-index: 2;

    width: 18%;
    aspect-ratio: 1;

    border-radius: 50%;

    background: rgba(45,35,25,0.30);

    pointer-events: none;
}

.capture {
    position: absolute;

    z-index: 2;

    width: 73%;
    height: 73%;

    border-radius: 50%;

    border: 5px solid rgba(45,35,25,0.28);

    pointer-events: none;
}

/* ================================
   SIDE CARDS
================================ */

.sidebar {
    display: flex;
    flex-direction: column;

    gap: 13px;

    min-width: 0;
}

.card {
    border-radius: 19px;

    border: 1px solid rgba(255,255,255,0.085);

    background: rgba(16,20,31,0.82);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.22),
        inset 0 1px rgba(255,255,255,0.045);

    backdrop-filter: blur(18px);

    overflow: hidden;
}

/* ================================
   STATUS
================================ */

.status-card {
    padding: 17px;
}

.small-label {
    color: #8992a5;

    font-size: 9px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1.4px;
}

.status {
    margin-top: 6px;

    font-size: 18px;
    font-weight: 800;
}

.status.thinking {
    color: #9488ff;
}

.evaluation {
    margin-top: 16px;

    height: 12px;

    border-radius: 999px;

    overflow: hidden;

    background: #10141d;

    border: 1px solid rgba(255,255,255,0.06);
}

.evaluation-fill {
    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #cbd3de,
            #ffffff
        );

    transition:
        width 0.45s ease;
}

.eval-text {
    margin-top: 6px;

    text-align: right;

    color: #8992a5;

    font-size: 10px;

    font-variant-numeric: tabular-nums;
}

/* ================================
   CLOCKS
================================ */

.clocks {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;

    padding: 13px;
}

.clock {
    padding: 12px;

    border-radius: 14px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.06);

    transition: 0.18s ease;
}

.clock.active {
    border-color: rgba(133,119,255,0.48);

    box-shadow:
        0 0 22px rgba(133,119,255,0.08);
}

.clock-name {
    color: #8992a5;

    font-size: 9px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.clock-time {
    margin-top: 4px;

    font-size: 23px;
    font-weight: 800;

    font-variant-numeric: tabular-nums;
}

/* ================================
   MOVES
================================ */

.moves {
    height: 290px;

    overflow-y: auto;

    padding: 9px;
}

.moves::-webkit-scrollbar {
    width: 5px;
}

.moves::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
}

.empty {
    height: 100%;

    display: grid;
    place-items: center;

    color: #8992a5;

    font-size: 11px;
}

.move-row {
    display: grid;

    grid-template-columns:
        30px
        1fr
        1fr;

    gap: 5px;

    padding: 8px 7px;

    border-radius: 9px;

    font-size: 12px;

    animation: moveIn 0.18s ease;
}

.move-row.latest {
    background: rgba(133,119,255,0.12);
}

.move-number {
    color: #737d91;
}

.move {
    font-weight: 750;
}

@keyframes moveIn {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

/* ================================
   CONTROLS
================================ */

.controls {
    padding: 13px;

    display: grid;

    gap: 9px;
}

select {
    width: 100%;

    padding: 11px 12px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,0.08);

    background: #171b26;

    color: white;

    outline: none;

    cursor: pointer;
}

select option {
    background: #171b26;
    color: white;
}

.buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.button {
    padding: 11px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,0.08);

    background: rgba(255,255,255,0.045);

    color: white;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.12s ease,
        background 0.12s ease;
}

.button:hover {
    transform: translateY(-2px);

    background: rgba(255,255,255,0.085);
}

.button:active {
    transform: scale(0.98);
}

.button.primary {
    border: 0;

    background:
        linear-gradient(
            135deg,
            #786bed,
            #5d91ff
        );

    box-shadow:
        0 8px 23px rgba(90,105,255,0.22);
}

.info {
    display: flex;

    justify-content: space-between;

    color: #737d91;

    font-size: 10px;
}

/* ================================
   MODALS
================================ */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(2,4,10,0.72);

    backdrop-filter: blur(9px);
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(390px, 90vw);

    padding: 25px;

    border-radius: 22px;

    border: 1px solid rgba(255,255,255,0.11);

    background: #111520;

    box-shadow:
        0 30px 90px rgba(0,0,0,0.55);

    text-align: center;

    animation: modalIn 0.2s ease;
}

.modal-title {
    font-size: 19px;
    font-weight: 850;

    margin-bottom: 17px;
}

.promotion-buttons {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;
}

.promotion-button {
    padding: 12px 4px;

    border-radius: 13px;

    border: 1px solid rgba(255,255,255,0.08);

    background: rgba(255,255,255,0.045);

    color: white;

    font-family: Georgia, serif;

    font-size: 42px;

    cursor: pointer;

    transition: 0.13s ease;
}

.promotion-button:hover {
    transform: translateY(-3px);

    background: rgba(133,119,255,0.15);
}

.game-result {
    font-size: 29px;
    font-weight: 900;
}

.game-result-sub {
    margin: 7px 0 20px;

    color: #8992a5;

    font-size: 13px;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

/* ================================
   RESPONSIVE
================================ */

@media (max-width: 1000px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .board-frame {
        width: min(88vw, 720px);
    }

    .sidebar {
        width: min(88vw, 720px);
        margin: auto;
    }
}

@media (max-width: 560px) {

    .page {
        width: 96vw;
        padding-top: 10px;
    }

    .header {
        height: 59px;
        border-radius: 16px;
    }

    .logo {
        width: 36px;
        height: 36px;
    }

    .brand-subtitle {
        display: none;
    }

    .engine-status {
        padding: 8px 10px;
    }

    .board-frame {
        width: 94vw;
        padding: 7px;
        border-radius: 19px;
    }

    .board {
        border-radius: 13px;
    }

    .piece {
        font-size: clamp(25px, 8vw, 50px);
    }

    .moves {
        height: 250px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">

            <div class="logo">♞</div>

            <div>
                <div class="brand-name">
                    Stockfish Chess
                </div>

                <div class="brand-subtitle">
                    Premium browser chess
                </div>
            </div>

        </div>

        <div
            class="engine-status"
            id="engineStatus"
        >
            <span class="engine-light"></span>

            <span id="engineStatusText">
                Loading Stockfish
            </span>
        </div>

    </header>


    <!-- GAME -->
    <main class="layout">

        <!-- BOARD -->
        <section class="board-container">

            <div class="board-frame">

                <div
                    class="board"
                    id="board"
                ></div>

            </div>

        </section>


        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- STATUS -->
            <section class="card status-card">

                <div class="small-label">
                    Game status
                </div>

                <div
                    class="status"
                    id="status"
                >
                    Loading…
                </div>

                <div class="evaluation">

                    <div
                        class="evaluation-fill"
                        id="evaluationFill"
                    ></div>

                </div>

                <div
                    class="eval-text"
                    id="evalText"
                >
                    0.00
                </div>

            </section>


            <!-- CLOCKS -->
            <section class="card">

                <div class="clocks">

                    <div
                        class="clock"
                        id="whiteClockBox"
                    >

                        <div class="clock-name">
                            White
                        </div>

                        <div
                            class="clock-time"
                            id="whiteClock"
                        >
                            10:00
                        </div>

                    </div>

                    <div
                        class="clock"
                        id="blackClockBox"
                    >

                        <div class="clock-name">
                            Black
                        </div>

                        <div
                            class="clock-time"
                            id="blackClock"
                        >
                            10:00
                        </div>

                    </div>

                </div>

            </section>


            <!-- MOVES -->
            <section class="card">

                <div
                    class="moves"
                    id="moves"
                ></div>

            </section>


            <!-- CONTROLS -->
            <section class="card controls">

                <select id="difficulty">

                    <option value="8">
                        Beginner — Depth 8
                    </option>

                    <option
                        value="12"
                        selected
                    >
                        Intermediate — Depth 12
                    </option>

                    <option value="16">
                        Advanced — Depth 16
                    </option>

                    <option value="20">
                        Expert — Depth 20
                    </option>

                </select>

                <div class="buttons">

                    <button
                        class="button primary"
                        id="newGame"
                    >
                        New Game
                    </button>

                    <button
                        class="button"
                        id="undo"
                    >
                        Undo
                    </button>

                </div>

                <div class="info">

                    <span id="depth">
                        Depth 0
                    </span>

                    <span id="turn">
                        White
                    </span>

                </div>

            </section>

        </aside>

    </main>

</div>


<!-- PROMOTION -->
<div
    class="modal-overlay"
    id="promotionOverlay"
>

    <div class="modal">

        <div class="modal-title">
            Promote your pawn
        </div>

        <div class="promotion-buttons">

            <button
                class="promotion-button"
                data-piece="q"
            >
                ♕
            </button>

            <button
                class="promotion-button"
                data-piece="r"
            >
                ♖
            </button>

            <button
                class="promotion-button"
                data-piece="b"
            >
                ♗
            </button>

            <button
                class="promotion-button"
                data-piece="n"
            >
                ♘
            </button>

        </div>

    </div>

</div>


<!-- GAME OVER -->
<div
    class="modal-overlay"
    id="gameOverOverlay"
>

    <div class="modal">

        <div
            class="game-result"
            id="gameResult"
        >
            Game Over
        </div>

        <div
            class="game-result-sub"
            id="gameResultSub"
        ></div>

        <button
            class="button primary"
            id="playAgain"
        >
            Play Again
        </button>

    </div>

</div>


<script>

/* ============================================================
   GAME
============================================================ */

const game = new Chess();


/* ============================================================
   ELEMENTS
============================================================ */

const board =
    document.getElementById("board");

const status =
    document.getElementById("status");

const moves =
    document.getElementById("moves");

const engineStatus =
    document.getElementById("engineStatus");

const engineStatusText =
    document.getElementById("engineStatusText");

const evaluationFill =
    document.getElementById("evaluationFill");

const evalText =
    document.getElementById("evalText");

const depthText =
    document.getElementById("depth");

const turnText =
    document.getElementById("turn");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const whiteClockBox =
    document.getElementById("whiteClockBox");

const blackClockBox =
    document.getElementById("blackClockBox");

const difficulty =
    document.getElementById("difficulty");

const promotionOverlay =
    document.getElementById("promotionOverlay");

const gameOverOverlay =
    document.getElementById("gameOverOverlay");

const gameResult =
    document.getElementById("gameResult");

const gameResultSub =
    document.getElementById("gameResultSub");


/* ============================================================
   PIECES
============================================================ */

const symbols = {

    wp: "♙",
    wn: "♘",
    wb: "♗",
    wr: "♖",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    bn: "♞",
    bb: "♝",
    br: "♜",
    bq: "♛",
    bk: "♚"

};


/* ============================================================
   STATE
============================================================ */

let selected = null;

let lastMove = null;

let promotion = null;

let engine = null;

let engineReady = false;

let thinking = false;

let gameNumber = 0;

let engineGameNumber = 0;

let gameOver = false;

let clocks = {
    w: 600,
    b: 600
};


/* ============================================================
   BOARD
============================================================ */

function drawBoard() {

    board.innerHTML = "";

    const position = game.board();

    for(let row = 0; row < 8; row++) {

        for(let col = 0; col < 8; col++) {

            const squareName =
                String.fromCharCode(97 + col)
                +
                (8 - row);

            const square =
                document.createElement("div");

            square.className =
                "square "
                +
                (
                    (row + col) % 2 === 0
                    ? "light"
                    : "dark"
                );

            square.dataset.square =
                squareName;


            /* Last move */

            if(
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ) {

                square.classList.add("last");

            }


            /* Selected */

            if(selected === squareName) {

                square.classList.add("selected");

            }


            /* Piece */

            const piece =
                position[row][col];

            if(piece) {

                const element =
                    document.createElement("div");

                element.className =
                    "piece "
                    +
                    (
                        piece.color === "w"
                        ? "white-piece"
                        : "black-piece"
                    );

                element.textContent =
                    symbols[
                        piece.color + piece.type
                    ];

                square.appendChild(element);

            }


            /* Coordinates */

            const rank =
                document.createElement("span");

            rank.className =
                "coordinate rank";

            rank.textContent =
                col === 0
                ? 8 - row
                : "";

            square.appendChild(rank);


            const file =
                document.createElement("span");

            file.className =
                "coordinate file";

            file.textContent =
                row === 7
                ? String.fromCharCode(97 + col)
                : "";

            square.appendChild(file);


            square.addEventListener(
                "click",
                function() {
                    clickSquare(squareName);
                }
            );


            board.appendChild(square);

        }
    }


    if(selected) {

        showMoves(selected);

    }


    showCheck();
}


/* ============================================================
   LEGAL MOVES
============================================================ */

function showMoves(squareName) {

    const legal =
        game.moves({
            square: squareName,
            verbose: true
        });

    legal.forEach(function(move) {

        const target =
            board.querySelector(
                '[data-square="' + move.to + '"]'
            );

        if(!target) return;


        if(move.captured) {

            const ring =
                document.createElement("div");

            ring.className = "capture";

            target.appendChild(ring);

        } else {

            const dot =
                document.createElement("div");

            dot.className = "move-dot";

            target.appendChild(dot);

        }

    });
}


/* ============================================================
   CHECK
============================================================ */

function showCheck() {

    if(!game.in_check()) return;

    const side =
        game.turn();

    const position =
        game.board();

    for(let row = 0; row < 8; row++) {

        for(let col = 0; col < 8; col++) {

            const piece =
                position[row][col];

            if(
                piece &&
                piece.type === "k" &&
                piece.color === side
            ) {

                const squareName =
                    String.fromCharCode(97 + col)
                    +
                    (8 - row);

                const element =
                    board.querySelector(
                        '[data-square="' +
                        squareName +
                        '"]'
                    );

                if(element) {
                    element.classList.add("check");
                }

            }

        }

    }
}


/* ============================================================
   PLAYER CLICK
============================================================ */

function clickSquare(squareName) {

    if(gameOver) return;

    if(!engineReady) return;

    if(thinking) return;

    /* Player controls White */

    if(game.turn() !== "w") return;


    const piece =
        game.get(squareName);


    /* Nothing selected */

    if(!selected) {

        if(
            piece &&
            piece.color === "w"
        ) {

            selected =
                squareName;

            drawBoard();

        }

        return;
    }


    /* Clicking another white piece */

    if(
        piece &&
        piece.color === "w"
    ) {

        selected =
            squareName;

        drawBoard();

        return;
    }


    /* Find legal move */

    const legal =
        game.moves({
            square: selected,
            verbose: true
        });

    const move =
        legal.find(function(item) {
            return item.to === squareName;
        });


    /* Illegal move */

    if(!move) {

        selected = null;

        drawBoard();

        return;
    }


    /* Promotion */

    if(move.promotion) {

        promotion = {
            from: selected,
            to: squareName
        };

        promotionOverlay.classList.add("show");

        return;
    }


    makeMove({
        from: selected,
        to: squareName
    });
}


/* ============================================================
   MAKE PLAYER MOVE
============================================================ */

function makeMove(move) {

    const result =
        game.move(move);

    if(!result) return;


    selected = null;


    lastMove = {
        from: result.from,
        to: result.to
    };


    drawBoard();
    drawMoves();
    updateStatus();


    if(checkGameOver()) {
        return;
    }


    /* Now Stockfish plays */

    askEngine();
}


/* ============================================================
   PROMOTION
============================================================ */

document
.querySelectorAll(".promotion-button")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            if(!promotion) return;


            const chosen =
                button.dataset.piece;


            promotionOverlay.classList.remove(
                "show"
            );


            const move = {
                from: promotion.from,
                to: promotion.to,
                promotion: chosen
            };


            promotion = null;

            makeMove(move);

        }
    );

});


/* ============================================================
   MOVE LIST
============================================================ */

function drawMoves() {

    moves.innerHTML = "";

    const history =
        game.history();


    if(history.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Make the first move";

        moves.appendChild(empty);

        return;
    }


    for(
        let i = 0;
        i < history.length;
        i += 2
    ) {

        const row =
            document.createElement("div");

        row.className = "move-row";


        if(i >= history.length - 2) {
            row.classList.add("latest");
        }


        const number =
            document.createElement("div");

        number.className =
            "move-number";

        number.textContent =
            (i / 2) + 1;


        const white =
            document.createElement("div");

        white.className = "move";

        white.textContent =
            history[i] || "";


        const black =
            document.createElement("div");

        black.className = "move";

        black.textContent =
            history[i + 1] || "";


        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        moves.appendChild(row);

    }


    moves.scrollTop =
        moves.scrollHeight;
}


/* ============================================================
   STATUS
============================================================ */

function updateStatus() {

    turnText.textContent =
        game.turn() === "w"
        ? "White"
        : "Black";


    whiteClockBox.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameOver
    );

    blackClockBox.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameOver
    );


    if(gameOver) return;


    if(thinking) {

        status.textContent =
            "Stockfish is thinking…";

        status.classList.add("thinking");

    } else if(game.in_check()) {

        status.textContent =
            "Check!";

        status.classList.remove("thinking");

    } else if(game.turn() === "w") {

        status.textContent =
            "Your move";

        status.classList.remove("thinking");

    } else {

        status.textContent =
            "Stockfish's move";

        status.classList.remove("thinking");

    }
}


/* ============================================================
   STOCKFISH
============================================================ */

function startEngine() {

    try {

        engine =
            new Worker(
                "./stockfish-18-lite-single.js"
            );


        engine.onmessage =
            engineMessage;


        engine.onerror =
            function() {

                engineReady = false;

                thinking = false;

                engineStatus.classList.remove(
                    "thinking"
                );

                engineStatusText.textContent =
                    "Engine error";

                status.textContent =
                    "Stockfish failed to load";

            };


        engine.postMessage("uci");

    } catch(error) {

        engineStatusText.textContent =
            "Engine unavailable";

    }
}


/* ============================================================
   STOCKFISH MESSAGES
============================================================ */

function engineMessage(event) {

    const line =
        String(event.data);


    if(line === "uciok") {

        engine.postMessage("isready");

        return;
    }


    if(line === "readyok") {

        engineReady = true;

        engineStatusText.textContent =
            "Stockfish ready";

        updateStatus();

        return;
    }


    /* Evaluation */

    if(line.indexOf("info") === 0) {

        readEvaluation(line);

        const depth =
            line.match(
                /\bdepth\s+(\d+)/
            );

        if(depth) {

            depthText.textContent =
                "Depth " +
                depth[1];

        }

        return;
    }


    /* Best move */

    if(line.indexOf("bestmove") === 0) {

        if(!thinking) return;


        thinking = false;

        engineStatus.classList.remove(
            "thinking"
        );

        engineStatusText.textContent =
            "Stockfish ready";


        /*
           Ignore a response from an
           old position.
        */

        if(
            engineGameNumber !== gameNumber
        ) {

            updateStatus();

            return;
        }


        const match =
            line.match(
                /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/
            );


        if(!match) {

            updateStatus();

            return;
        }


        const notation =
            match[1];


        const move = {
            from: notation.substring(0,2),
            to: notation.substring(2,4)
        };


        if(notation.length === 5) {

            move.promotion =
                notation.substring(4,5);

        }


        makeEngineMove(move);

    }
}


/* ============================================================
   ASK STOCKFISH
============================================================ */

function askEngine() {

    if(!engineReady) return;

    if(gameOver) return;

    if(game.turn() !== "b") return;


    thinking = true;

    engineGameNumber =
        gameNumber;


    engineStatus.classList.add(
        "thinking"
    );

    engineStatusText.textContent =
        "Thinking…";

    updateStatus();


    const depth =
        parseInt(
            difficulty.value,
            10
        );


    try {

        engine.postMessage("stop");

        engine.postMessage(
            "position fen " +
            game.fen()
        );

        engine.postMessage(
            "go depth " +
            depth
        );

    } catch(error) {

        thinking = false;

        engineStatus.classList.remove(
            "thinking"
        );

        engineStatusText.textContent =
            "Stockfish ready";

        updateStatus();

    }
}


/* ============================================================
   STOCKFISH MOVE
============================================================ */

function makeEngineMove(move) {

    if(gameOver) return;

    if(game.turn() !== "b") return;


    const result =
        game.move(move);


    if(!result) {

        updateStatus();

        return;
    }


    lastMove = {
        from: result.from,
        to: result.to
    };


    drawBoard();
    drawMoves();
    updateStatus();


    checkGameOver();
}


/* ============================================================
   EVALUATION
============================================================ */

function readEvaluation(line) {

    /*
       Stockfish is called when Black is to move.

       UCI scores are from the side-to-move
       perspective.

       Therefore:
       Black score -> invert it
       -> White perspective.
    */


    const mate =
        line.match(
            /score mate (-?\d+)/
        );


    if(mate) {

        const blackMate =
            parseInt(
                mate[1],
                10
            );

        const whiteMate =
            -blackMate;


        evalText.textContent =
            whiteMate > 0
            ? "M+" + whiteMate
            : "M" + whiteMate;


        evaluationFill.style.width =
            whiteMate > 0
            ? "96%"
            : "4%";


        return;
    }


    const cp =
        line.match(
            /score cp (-?\d+)/
        );


    if(!cp) return;


    const blackScore =
        parseInt(
            cp[1],
            10
        ) / 100;


    const whiteScore =
        -blackScore;


    const score =
        Math.max(
            -10,
            Math.min(
                10,
                whiteScore
            )
        );


    evalText.textContent =
        (
            score >= 0
            ? "+"
            : ""
        )
        +
        score.toFixed(2);


    const percentage =
        50 +
        score * 5;


    evaluationFill.style.width =
        Math.max(
            4,
            Math.min(
                96,
                percentage
            )
        ) + "%";
}


/* ============================================================
   GAME OVER CHECKING
============================================================ */

function checkGameOver() {

    /*
       CHECKMATE
    */

    if(game.is_checkmate()) {

        gameOver = true;

        if(game.turn() === "w") {

            showResult(
                "Checkmate",
                "Stockfish wins."
            );

        } else {

            showResult(
                "Checkmate",
                "You defeated Stockfish!"
            );

        }

        return true;
    }


    /*
       STALEMATE
    */

    if(game.is_stalemate()) {

        gameOver = true;

        showResult(
            "Stalemate",
            "The game ends in a draw."
        );

        return true;
    }


    /*
       THREEFOLD REPETITION
    */

    if(game.is_threefold_repetition()) {

        gameOver = true;

        showResult(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }


    /*
       INSUFFICIENT MATERIAL
    */

    if(game.is_insufficient_material()) {

        gameOver = true;

        showResult(
            "Draw",
            "Insufficient material."
        );

        return true;
    }


    /*
       OTHER DRAW
    */

    if(game.is_draw()) {

        gameOver = true;

        showResult(
            "Draw",
            "The game ends in a draw."
        );

        return true;
    }


    return false;
}


/* ============================================================
   RESULT
============================================================ */

function showResult(
    title,
    subtitle
) {

    if(engine) {

        try {
            engine.postMessage("stop");
        } catch(error) {}

    }


    thinking = false;


    engineStatus.classList.remove(
        "thinking"
    );

    engineStatusText.textContent =
        "Game finished";


    gameResult.textContent =
        title;

    gameResultSub.textContent =
        subtitle;


    gameOverOverlay.classList.add(
        "show"
    );


    updateStatus();
}


/* ============================================================
   CLOCKS
============================================================ */

function formatClock(seconds) {

    seconds =
        Math.max(
            0,
            seconds
        );


    const minutes =
        Math.floor(
            seconds / 60
        );

    const remaining =
        seconds % 60;


    return (
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(remaining).padStart(2,"0")
    );
}


function updateClocks() {

    whiteClock.textContent =
        formatClock(
            clocks.w
        );

    blackClock.textContent =
        formatClock(
            clocks.b
        );


    whiteClockBox.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameOver
    );

    blackClockBox.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameOver
    );
}


setInterval(
    function() {

        if(!engineReady) return;

        if(gameOver) return;


        const side =
            game.turn();


        clocks[side] =
            Math.max(
                0,
                clocks[side] - 1
            );


        updateClocks();


        if(clocks[side] === 0) {

            gameOver = true;


            if(engine) {

                try {
                    engine.postMessage("stop");
                } catch(error) {}

            }


            thinking = false;


            if(side === "w") {

                showResult(
                    "Time Out",
                    "Stockfish wins on time."
                );

            } else {

                showResult(
                    "Time Out",
                    "You win on time!"
                );

            }

        }

    },
    1000
);


/* ============================================================
   NEW GAME
============================================================ */

function newGame() {

    gameNumber++;


    if(engine) {

        try {

            engine.postMessage("stop");

            engine.postMessage("ucinewgame");

            engine.postMessage("isready");

        } catch(error) {}

    }


    game.reset();


    selected = null;

    lastMove = null;

    promotion = null;

    thinking = false;

    gameOver = false;


    clocks.w = 600;
    clocks.b = 600;


    promotionOverlay.classList.remove(
        "show"
    );

    gameOverOverlay.classList.remove(
        "show"
    );


    evaluationFill.style.width =
        "50%";

    evalText.textContent =
        "0.00";

    depthText.textContent =
        "Depth 0";


    engineStatus.classList.remove(
        "thinking"
    );

    engineStatusText.textContent =
        engineReady
        ? "Stockfish ready"
        : "Loading Stockfish";


    drawBoard();
    drawMoves();
    updateStatus();
    updateClocks();
}


/* ============================================================
   UNDO
============================================================ */

document
.getElementById("undo")
.addEventListener(
    "click",
    function() {

        if(game.history().length === 0)
            return;


        if(engine) {

            try {
                engine.postMessage("stop");
            } catch(error) {}

        }


        thinking = false;

        engineStatus.classList.remove(
            "thinking"
        );


        gameNumber++;


        /*
           If White is to move,
           Black has already played.

           Undo Black, then White.

           If Black is to move,
           White just played.

           Undo White.
        */

        if(game.turn() === "w") {

            game.undo();

            if(game.history().length > 0) {
                game.undo();
            }

        } else {

            game.undo();

        }


        gameOver = false;

        selected = null;


        const history =
            game.history({
                verbose: true
            });


        if(history.length > 0) {

            const last =
                history[
                    history.length - 1
                ];

            lastMove = {
                from: last.from,
                to: last.to
            };

        } else {

            lastMove = null;

        }


        gameOverOverlay.classList.remove(
            "show"
        );


        promotionOverlay.classList.remove(
            "show"
        );


        drawBoard();
        drawMoves();
        updateStatus();

    }
);


/* ============================================================
   BUTTONS
============================================================ */

document
.getElementById("newGame")
.addEventListener(
    "click",
    newGame
);


document
.getElementById("playAgain")
.addEventListener(
    "click",
    newGame
);


/* ============================================================
   DIFFICULTY
============================================================ */

difficulty.addEventListener(
    "change",
    function() {

        if(!thinking) return;


        if(engine) {

            try {
                engine.postMessage("stop");
            } catch(error) {}

        }


        thinking = false;

        engineStatus.classList.remove(
            "thinking"
        );

        engineStatusText.textContent =
            "Stockfish ready";

        updateStatus();

    }
);


/* ============================================================
   START
============================================================ */

drawBoard();

drawMoves();

updateStatus();

updateClocks();

startEngine();

</script>
