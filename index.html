<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#090d16;
  color:#f4f7ff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:14px 18px;
  gap:12px;
}

/* ---------- HEADER ---------- */

.topbar{
  height:54px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  box-shadow:0 8px 25px #0008;
  font-size:23px;
}

.brand h1{
  margin:0;
  font-size:22px;
  letter-spacing:-.5px;
}

.brand p{
  margin:2px 0 0;
  color:#8792aa;
  font-size:11px;
}

.engine-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid #263149;
  background:#111827;
  border-radius:999px;
  font-size:12px;
  color:#aeb8cc;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
}

.dot.ready{
  background:#4ade80;
  box-shadow:0 0 10px #4ade80;
}

.dot.thinking{
  background:#facc15;
  box-shadow:0 0 10px #facc15;
}

.dot.error{
  background:#f87171;
  box-shadow:0 0 10px #f87171;
}

/* ---------- MAIN ---------- */

.main{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:16px;
  align-items:center;
}

.board-area{
  min-width:0;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.board-wrap{
  width:min(
    590px,
    calc(100vh - 145px),
    calc(100vw - 370px)
  );

  aspect-ratio:1;
  position:relative;
  padding:7px;
  border-radius:16px;

  background:#151b2a;
  box-shadow:
    0 25px 70px #0009,
    0 0 0 1px #29334a;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  overflow:hidden;
  border-radius:10px;
}

.square{
  position:relative;
  display:grid;
  place-items:center;
  cursor:pointer;
  user-select:none;
  transition:filter .08s;
}

.square.light{
  background:#e8edf5;
}

.square.dark{
  background:#66748e;
}

.square:hover{
  filter:brightness(1.08);
}

.square.selected{
  box-shadow:inset 0 0 0 4px #a78bfa;
}

.square.legal::after{
  content:"";
  width:22%;
  height:22%;
  border-radius:50%;
  background:#11182788;
  position:absolute;
}

.square.capture::after{
  content:"";
  position:absolute;
  inset:7%;
  border:4px solid #11182788;
  border-radius:50%;
}

.piece{
  position:relative;
  z-index:2;
  font-family:"Arial Unicode MS","Noto Sans Symbols 2",serif;
  font-size:clamp(29px,6vw,62px);
  line-height:1;
  text-shadow:
    0 3px 2px #0007,
    0 0 1px #000;
  transform:translateY(-1px);
  pointer-events:none;
}

.white-piece{
  color:#fff;
}

.black-piece{
  color:#171b24;
  text-shadow:
    0 2px 1px #fff6,
    0 0 2px #000;
}

.coord{
  position:absolute;
  font-size:9px;
  font-weight:700;
  opacity:.65;
  pointer-events:none;
}

.coord.file{
  right:4px;
  bottom:3px;
}

.coord.rank{
  left:4px;
  top:3px;
}

/* ---------- SIDE PANEL ---------- */

.side{
  width:300px;
  max-height:min(590px,calc(100vh - 145px));
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card{
  background:#111827;
  border:1px solid #253049;
  border-radius:14px;
  padding:13px;
  box-shadow:0 12px 35px #0004;
}

.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 12px;
  background:#0c1220;
  border:1px solid #202a40;
  border-radius:11px;
}

.player-info{
  display:flex;
  align-items:center;
  gap:9px;
}

.player-piece{
  width:29px;
  height:29px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#202a3d;
  font-size:18px;
}

.player-name{
  font-weight:700;
  font-size:13px;
}

.player-sub{
  color:#7d899f;
  font-size:10px;
  margin-top:2px;
}

.clock{
  font-family:monospace;
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.clock.active{
  color:#fff;
}

.moves-card{
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  color:#cbd5e1;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.moves{
  min-height:0;
  flex:1;
  overflow:auto;
  padding-right:3px;
}

.move-row{
  display:grid;
  grid-template-columns:32px 1fr 1fr;
  gap:3px;
  padding:5px 6px;
  border-radius:7px;
  font-size:12px;
}

.move-row:nth-child(even){
  background:#0c1220;
}

.move-number{
  color:#66748e;
}

.move{
  font-weight:700;
}

.empty{
  color:#59657b;
  font-size:12px;
  text-align:center;
  padding:18px 5px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

button{
  border:1px solid #2b3852;
  background:#182136;
  color:#eef2ff;
  border-radius:9px;
  padding:9px 8px;
  font-weight:700;
  font-size:11px;
  cursor:pointer;
}

button:hover{
  background:#222e48;
}

button.primary{
  background:#6d4aff;
  border-color:#7c5cff;
}

button.primary:hover{
  background:#7958ff;
}

.engine-card{
  font-size:10px;
  color:#7e8ba3;
  line-height:1.5;
}

.engine-state{
  color:#d8def0;
  font-weight:700;
}

.debug{
  margin-top:6px;
  padding:7px;
  border-radius:8px;
  background:#080c14;
  border:1px solid #1c2538;
  font-family:monospace;
  font-size:9px;
  line-height:1.5;
  overflow:hidden;
}

.debug b{
  color:#929db3;
}

.debug span{
  color:#dce3f2;
  word-break:break-word;
}

/* ---------- PROMOTION ---------- */

.promotion{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  place-items:center;
  z-index:50;
}

.promotion.show{
  display:grid;
}

.promo-box{
  background:#111827;
  border:1px solid #34405b;
  border-radius:15px;
  padding:18px;
  width:250px;
  box-shadow:0 30px 80px #000b;
  text-align:center;
}

.promo-title{
  font-weight:800;
  margin-bottom:13px;
}

.promo-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.promo-buttons button{
  height:48px;
  font-size:27px;
}

/* ---------- GAME OVER ---------- */

.overlay{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  place-items:center;
  z-index:40;
}

.overlay.show{
  display:grid;
}

.gameover{
  width:280px;
  padding:23px;
  border-radius:16px;
  background:#111827;
  border:1px solid #34405b;
  text-align:center;
  box-shadow:0 30px 80px #000b;
}

.gameover h2{
  margin:0 0 7px;
}

.gameover p{
  color:#8d99af;
  font-size:12px;
}

/* ---------- SMALL SCREENS ---------- */

@media(max-width:850px){
  html,body{
    overflow:auto;
  }

  .app{
    min-height:100vh;
    height:auto;
    padding:10px;
  }

  .main{
    grid-template-columns:1fr;
  }

  .side{
    width:100%;
    max-height:none;
  }

  .board-wrap{
    width:min(94vw,590px);
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">♞</div>
      <div>
        <h1>Nova Chess</h1>
        <p>Play against Stockfish</p>
      </div>
    </div>

    <div class="engine-pill">
      <span id="statusDot" class="dot"></span>
      <span id="engineStatus">Starting Stockfish…</span>
    </div>
  </header>

  <main class="main">

    <section class="board-area">
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
    </section>

    <aside class="side">

      <div class="card">

        <div class="player">
          <div class="player-info">
            <div class="player-piece">♙</div>
            <div>
              <div class="player-name">You</div>
              <div class="player-sub">White</div>
            </div>
          </div>
          <div id="whiteClock" class="clock">10:00</div>
        </div>

        <div style="height:7px"></div>

        <div class="player">
          <div class="player-info">
            <div class="player-piece">♟</div>
            <div>
              <div class="player-name">Stockfish</div>
              <div class="player-sub">Black</div>
            </div>
          </div>
          <div id="blackClock" class="clock">10:00</div>
        </div>

      </div>

      <div class="card moves-card">

        <div class="card-title">
          <span>Moves</span>
          <span id="moveCount">0</span>
        </div>

        <div id="moves" class="moves">
          <div class="empty">Make your first move.</div>
        </div>

      </div>

      <div class="controls">
        <button id="newGame" class="primary">New Game</button>
        <button id="undo">Undo</button>
        <button id="flip">Flip Board</button>
        <button id="testEngine">Engine Test</button>
      </div>

      <div class="card engine-card">

        <div>
          Engine:
          <span class="engine-state" id="engineState">
            Loading…
          </span>
        </div>

        <div class="debug">
          <div>
            <b>State:</b>
            <span id="debugState">Starting</span>
          </div>

          <div>
            <b>Last command:</b>
            <span id="debugCommand">—</span>
          </div>

          <div>
            <b>Last output:</b>
            <span id="debugOutput">—</span>
          </div>
        </div>

      </div>

    </aside>

  </main>

</div>

<!-- Promotion dialog -->

<div id="promotion" class="promotion">
  <div class="promo-box">
    <div class="promo-title">Choose promotion</div>

    <div class="promo-buttons">
      <button data-piece="q">♕</button>
      <button data-piece="r">♖</button>
      <button data-piece="b">♗</button>
      <button data-piece="n">♘</button>
    </div>
  </div>
</div>

<!-- Game over -->

<div id="gameOver" class="overlay">
  <div class="gameover">
    <h2 id="gameOverTitle">Game Over</h2>
    <p id="gameOverText"></p>
    <button class="primary" id="gameOverNew">New Game</button>
  </div>
</div>


<script>
/* =========================================================
   NOVA CHESS
   Stockfish 18 ASM
   ========================================================= */

const ENGINE_FILE = "./stockfish-18-asm.js";

/* ---------- CHESS ---------- */

let game = new Chess();

let selectedSquare = null;
let legalTargets = [];
let flipped = false;

let pendingPromotion = null;

/* ---------- ENGINE ---------- */

let engine = null;
let engineReady = false;
let engineThinking = false;
let engineMoveTimer = null;

let engineLastCommand = "—";
let engineLastOutput = "—";

/* ---------- CLOCK ---------- */

let whiteTime = 600;
let blackTime = 600;

let clockInterval = null;
let clockRunning = false;

/* ---------- PIECES ---------- */

const PIECES = {
  wp:"♙",
  wr:"♖",
  wn:"♘",
  wb:"♗",
  wq:"♕",
  wk:"♔",

  bp:"♟",
  br:"♜",
  bn:"♞",
  bb:"♝",
  bq:"♛",
  bk:"♚"
};

const FILES = ["a","b","c","d","e","f","g","h"];


/* =========================================================
   ELEMENTS
   ========================================================= */

const boardEl = document.getElementById("board");
const movesEl = document.getElementById("moves");

const engineStatusEl = document.getElementById("engineStatus");
const engineStateEl = document.getElementById("engineState");
const statusDotEl = document.getElementById("statusDot");

const debugStateEl = document.getElementById("debugState");
const debugCommandEl = document.getElementById("debugCommand");
const debugOutputEl = document.getElementById("debugOutput");

const whiteClockEl = document.getElementById("whiteClock");
const blackClockEl = document.getElementById("blackClock");

const promotionEl = document.getElementById("promotion");
const gameOverEl = document.getElementById("gameOver");


/* =========================================================
   UI HELPERS
   ========================================================= */

function setEngineStatus(text,type="normal"){
  engineStatusEl.textContent = text;
  engineStateEl.textContent = text;

  statusDotEl.className = "dot";

  if(type === "ready"){
    statusDotEl.classList.add("ready");
  }

  if(type === "thinking"){
    statusDotEl.classList.add("thinking");
  }

  if(type === "error"){
    statusDotEl.classList.add("error");
  }

  debugStateEl.textContent = text;
}

function updateDebug(){
  debugCommandEl.textContent = engineLastCommand;
  debugOutputEl.textContent = engineLastOutput;
}

function sendEngine(command){
  if(!engine){
    return;
  }

  engineLastCommand = command;
  updateDebug();

  try{
    engine.postMessage(command);
  }catch(error){
    engineLastOutput = "SEND ERROR: " + error.message;
    updateDebug();
  }
}


/* =========================================================
   BOARD
   ========================================================= */

function renderBoard(){

  boardEl.innerHTML = "";

  const position = game.board();

  for(let visualRow = 0; visualRow < 8; visualRow++){

    const realRow = flipped ? 7 - visualRow : visualRow;

    for(let visualCol = 0; visualCol < 8; visualCol++){

      const realCol = flipped ? 7 - visualCol : visualCol;

      const file = FILES[realCol];
      const rank = 8 - realRow;
      const squareName = file + rank;

      const piece = position[realRow][realCol];

      const square = document.createElement("div");

      const isLight =
        (realRow + realCol) % 2 === 0;

      square.className =
        "square " +
        (isLight ? "light" : "dark");

      square.dataset.square = squareName;

      if(squareName === selectedSquare){
        square.classList.add("selected");
      }

      if(legalTargets.includes(squareName)){
        if(piece){
          square.classList.add("capture");
        }else{
          square.classList.add("legal");
        }
      }

      if(piece){

        const pieceEl = document.createElement("div");

        pieceEl.className =
          "piece " +
          (piece.color === "w"
            ? "white-piece"
            : "black-piece");

        pieceEl.textContent =
          PIECES[piece.color + piece.type];

        square.appendChild(pieceEl);
      }

      /* Coordinates */

      if(
        (!flipped && realCol === 0) ||
        (flipped && realCol === 7)
      ){
        const rankEl = document.createElement("span");

        rankEl.className = "coord rank";
        rankEl.textContent = rank;

        square.appendChild(rankEl);
      }

      if(
        (!flipped && realRow === 7) ||
        (flipped && realRow === 0)
      ){
        const fileEl = document.createElement("span");

        fileEl.className = "coord file";
        fileEl.textContent = file;

        square.appendChild(fileEl);
      }

      square.addEventListener("click",()=>{
        handleSquareClick(squareName);
      });

      boardEl.appendChild(square);
    }
  }
}


/* =========================================================
   PLAYER INPUT
   ========================================================= */

function handleSquareClick(square){

  if(engineThinking){
    return;
  }

  if(game.game_over()){
    return;
  }

  /* Player is White */

  if(game.turn() !== "w"){
    return;
  }

  const piece = game.get(square);

  /* Nothing selected yet */

  if(!selectedSquare){

    if(piece && piece.color === "w"){

      selectedSquare = square;

      legalTargets = game.moves({
        square:square,
        verbose:true
      }).map(move => move.to);

      renderBoard();
    }

    return;
  }


  /* Clicking another own piece */

  if(piece && piece.color === "w"){

    selectedSquare = square;

    legalTargets = game.moves({
      square:square,
      verbose:true
    }).map(move => move.to);

    renderBoard();

    return;
  }


  /* Try move */

  const possibleMoves = game.moves({
    square:selectedSquare,
    verbose:true
  });

  const matchingMoves =
    possibleMoves.filter(m => m.to === square);

  if(!matchingMoves.length){

    selectedSquare = null;
    legalTargets = [];

    renderBoard();

    return;
  }

  const chosen = matchingMoves[0];

  /* Promotion */

  if(chosen.flags.includes("p")){

    pendingPromotion = {
      from:selectedSquare,
      to:square
    };

    promotionEl.classList.add("show");

    return;
  }

  makePlayerMove(
    selectedSquare,
    square,
    null
  );
}


/* =========================================================
   MAKE PLAYER MOVE
   ========================================================= */

function makePlayerMove(from,to,promotion){

  const move = {
    from:from,
    to:to
  };

  if(promotion){
    move.promotion = promotion;
  }

  const result = game.move(move);

  if(!result){
    selectedSquare = null;
    legalTargets = [];
    renderBoard();
    return;
  }

  selectedSquare = null;
  legalTargets = [];

  renderBoard();
  renderMoves();

  const ended = checkGameEnd();

  if(!ended && game.turn() === "b"){

    startClock();

    requestEngineMove();
  }
}


/* =========================================================
   PROMOTION
   ========================================================= */

document.querySelectorAll("[data-piece]").forEach(button=>{

  button.addEventListener("click",()=>{

    if(!pendingPromotion){
      return;
    }

    const promotion =
      button.dataset.piece;

    const move = pendingPromotion;

    pendingPromotion = null;

    promotionEl.classList.remove("show");

    makePlayerMove(
      move.from,
      move.to,
      promotion
    );
  });

});


/* =========================================================
   MOVE LIST
   ========================================================= */

function renderMoves(){

  const history =
    game.history();

  document.getElementById("moveCount")
    .textContent = history.length;

  if(history.length === 0){

    movesEl.innerHTML =
      '<div class="empty">Make your first move.</div>';

    return;
  }

  movesEl.innerHTML = "";

  for(let i=0;i<history.length;i+=2){

    const row =
      document.createElement("div");

    row.className = "move-row";

    const number =
      document.createElement("div");

    number.className = "move-number";

    number.textContent =
      (i / 2 + 1) + ".";

    const white =
      document.createElement("div");

    white.className = "move";
    white.textContent = history[i] || "";

    const black =
      document.createElement("div");

    black.className = "move";
    black.textContent = history[i+1] || "";

    row.appendChild(number);
    row.appendChild(white);
    row.appendChild(black);

    movesEl.appendChild(row);
  }

  movesEl.scrollTop = movesEl.scrollHeight;
}


/* =========================================================
   ENGINE STARTUP
   ========================================================= */

function startEngine(){

  if(typeof Chess !== "function"){

    setEngineStatus(
      "Chess.js failed to load",
      "error"
    );

    return;
  }

  try{

    engine =
      new Worker(ENGINE_FILE);

  }catch(error){

    setEngineStatus(
      "ENGINE START ERROR",
      "error"
    );

    engineLastOutput =
      error.message;

    updateDebug();

    return;
  }


  engine.onmessage = function(event){

    const line =
      String(event.data || "").trim();

    if(!line){
      return;
    }

    engineLastOutput = line;

    updateDebug();

    handleEngineLine(line);
  };


  engine.onerror = function(error){

    engineThinking = false;

    clearTimeout(engineMoveTimer);

    setEngineStatus(
      "ENGINE ERROR",
      "error"
    );

    engineLastOutput =
      error.message ||
      "Worker failed";

    updateDebug();
  };


  /* Start UCI */

  setEngineStatus(
    "Starting Stockfish…"
  );

  sendEngine("uci");
}


/* =========================================================
   ENGINE COMMUNICATION
   ========================================================= */

function handleEngineLine(line){

  /* UCI handshake */

  if(line === "uciok"){

    sendEngine("isready");

    return;
  }


  if(line === "readyok"){

    engineReady = true;

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

    return;
  }


  /* Engine search information */

  if(line.startsWith("info")){

    if(engineThinking){

      setEngineStatus(
        "Stockfish thinking…",
        "thinking"
      );
    }

    return;
  }


  /* Engine finished */

  if(line.startsWith("bestmove")){

    clearTimeout(engineMoveTimer);

    engineThinking = false;

    const parts =
      line.split(/\s+/);

    const bestMove =
      parts[1];

    if(bestMove &&
       bestMove !== "(none)" &&
       bestMove !== "0000"){

      applyEngineMove(bestMove);

    }else{

      setEngineStatus(
        "No legal engine move",
        "error"
      );

      checkGameEnd();
    }

    return;
  }
}


/* =========================================================
   ENGINE MOVE REQUEST
   ========================================================= */

function requestEngineMove(){

  if(!engineReady){

    setEngineStatus(
      "Stockfish is not ready yet…"
    );

    /*
      This is important:
      once Stockfish becomes ready, the user can
      press Engine Test or make a new move.
    */

    return;
  }

  if(engineThinking){
    return;
  }

  if(game.game_over()){
    return;
  }

  if(game.turn() !== "b"){
    return;
  }


  engineThinking = true;

  setEngineStatus(
    "Stockfish thinking…",
    "thinking"
  );


  /*
    SEND THE CURRENT POSITION DIRECTLY.

    This is more reliable than rebuilding the
    complete move history.
  */

  const fen =
    game.fen();

  sendEngine("stop");

  sendEngine("ucinewgame");

  sendEngine(
    "position fen " + fen
  );

  /*
    Movetime is deliberately short so the
    Chromebook stays responsive.
  */

  sendEngine(
    "go movetime 900"
  );


  /*
    Watchdog.
    If the worker gets stuck, recover instead
    of leaving the game frozen forever.
  */

  clearTimeout(engineMoveTimer);

  engineMoveTimer =
    setTimeout(()=>{

      if(engineThinking){

        engineThinking = false;

        setEngineStatus(
          "Engine timed out",
          "error"
        );

        engineLastOutput =
          "No bestmove after 8 seconds";

        updateDebug();

        sendEngine("stop");
      }

    },8000);
}


/* =========================================================
   APPLY ENGINE MOVE
   ========================================================= */

function applyEngineMove(uci){

  if(!uci || uci.length < 4){
    return;
  }

  const from =
    uci.substring(0,2);

  const to =
    uci.substring(2,4);

  const promotion =
    uci.length >= 5
      ? uci.substring(4,5)
      : undefined;


  const move = {
    from:from,
    to:to
  };

  if(promotion){
    move.promotion = promotion;
  }


  const result =
    game.move(move);


  if(!result){

    setEngineStatus(
      "Engine returned invalid move",
      "error"
    );

    engineLastOutput =
      "INVALID MOVE: " + uci;

    updateDebug();

    return;
  }


  renderBoard();
  renderMoves();

  setEngineStatus(
    "Stockfish ready",
    "ready"
  );

  checkGameEnd();
}


/* =========================================================
   ENGINE TEST BUTTON
   ========================================================= */

document.getElementById("testEngine")
  .addEventListener("click",()=>{

    if(!engineReady){

      setEngineStatus(
        "Stockfish is still loading…",
        "error"
      );

      return;
    }

    /*
      This temporarily asks Stockfish to analyze
      the current board.

      If the debug panel changes to:
        position fen ...
        go movetime 900
      and then shows:
        bestmove ...
      the engine itself is working.
    */

    if(game.turn() === "b"){

      requestEngineMove();

      return;
    }

    /*
      If it is White's turn, create a pure
      starting-position engine test without
      changing the visible game.
    */

    sendEngine("stop");
    sendEngine("position startpos");
    sendEngine("go movetime 900");

    setEngineStatus(
      "Engine test running…",
      "thinking"
    );
  });


/* =========================================================
   GAME END
   ========================================================= */

function checkGameEnd(){

  if(!game.game_over()){
    return false;
  }

  stopClock();

  let title = "Game Over";
  let text = "";

  if(game.in_checkmate()){

    if(game.turn() === "w"){

      title = "Stockfish Wins";
      text = "Checkmate.";

    }else{

      title = "You Win!";
      text = "Stockfish has been checkmated.";
    }

  }else if(game.in_draw()){

    title = "Draw";
    text = "The game ended in a draw.";

  }else{

    title = "Game Over";
    text = "No more legal moves.";
  }

  document.getElementById("gameOverTitle")
    .textContent = title;

  document.getElementById("gameOverText")
    .textContent = text;

  gameOverEl.classList.add("show");

  return true;
}


/* =========================================================
   CLOCK
   ========================================================= */

function startClock(){

  if(clockRunning){
    return;
  }

  clockRunning = true;

  clockInterval =
    setInterval(()=>{

      if(game.game_over()){
        stopClock();
        return;
      }

      if(game.turn() === "w"){

        whiteTime--;

        if(whiteTime <= 0){
          whiteTime = 0;
          stopClock();
        }

      }else{

        blackTime--;

        if(blackTime <= 0){
          blackTime = 0;
          stopClock();
        }
      }

      updateClocks();

    },1000);
}


function stopClock(){

  clockRunning = false;

  clearInterval(clockInterval);

  clockInterval = null;
}


function formatTime(seconds){

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}


function updateClocks(){

  whiteClockEl.textContent =
    formatTime(whiteTime);

  blackClockEl.textContent =
    formatTime(blackTime);

  whiteClockEl.classList.toggle(
    "active",
    game.turn() === "w"
  );

  blackClockEl.classList.toggle(
    "active",
    game.turn() === "b"
  );
}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

  game = new Chess();

  selectedSquare = null;
  legalTargets = [];

  pendingPromotion = null;

  engineThinking = false;

  clearTimeout(engineMoveTimer);

  whiteTime = 600;
  blackTime = 600;

  stopClock();

  gameOverEl.classList.remove("show");
  promotionEl.classList.remove("show");

  if(engine){

    sendEngine("stop");
    sendEngine("ucinewgame");
    sendEngine("isready");
  }

  renderBoard();
  renderMoves();
  updateClocks();

  if(engineReady){

    setEngineStatus(
      "Stockfish ready",
      "ready"
    );

  }else{

    setEngineStatus(
      "Starting Stockfish…"
    );
  }
}


/* =========================================================
   UNDO
   ========================================================= */

function undoMove(){

  if(engineThinking){
    return;
  }

  const history =
    game.history();

  if(history.length === 0){
    return;
  }

  /*
    Remove Black's move first if it exists,
    then remove White's move.
  */

  if(game.turn() === "w"){

    game.undo();

    if(game.history().length > 0){
      game.undo();
    }

  }else{

    game.undo();
  }

  selectedSquare = null;
  legalTargets = [];

  renderBoard();
  renderMoves();

  if(engine){

    sendEngine("stop");
    sendEngine("isready");
  }
}


/* =========================================================
   FLIP BOARD
   ========================================================= */

document.getElementById("flip")
  .addEventListener("click",()=>{

    flipped = !flipped;

    renderBoard();
  });


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById("newGame")
  .addEventListener("click",newGame);

document.getElementById("undo")
  .addEventListener("click",undoMove);

document.getElementById("gameOverNew")
  .addEventListener("click",newGame);


/* =========================================================
   START
   ========================================================= */

renderBoard();
renderMoves();
updateClocks();

startEngine();

</script>
