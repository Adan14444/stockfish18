<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nova Chess V3 — Game Modes</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root{
    --bg:#070a10;
    --panel:#101522;
    --panel2:#151c2b;
    --line:rgba(255,255,255,.08);
    --text:#f4f7ff;
    --muted:#8792a8;

    --light:#dce5ef;
    --dark:#61758d;

    --accent:#64b5ff;
    --accent2:#8068ff;

    --board:
        min(
            calc(100vh - 150px),
            calc(100vw - 525px),
            650px
        );
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(70,110,255,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(40,210,255,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================================================
   APP
   ========================================================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    height:58px;
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--line);

    background:rgba(7,10,16,.82);

    backdrop-filter:blur(18px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:19px;
    font-weight:800;
}

.logoIcon{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 0 25px rgba(90,150,255,.25);

    font-size:19px;
}

.enginePill{
    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 11px;

    border:1px solid var(--line);
    border-radius:999px;

    background:rgba(255,255,255,.035);

    font-size:11px;
    color:var(--muted);
}

.engineDot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#ff5967;
}

.enginePill.ready .engineDot{
    background:#4fe19a;
    box-shadow:0 0 10px rgba(79,225,154,.6);
}

.enginePill.thinking .engineDot{
    background:#55caff;
    box-shadow:0 0 12px rgba(85,202,255,.7);

    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{opacity:.35}
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        370px;

    gap:12px;

    padding:10px 14px 12px;

    overflow:hidden;
}

/* =========================================================
   BOARD AREA
   ========================================================= */

.boardArea{
    min-width:0;
    min-height:0;

    display:flex;
    justify-content:center;
    align-items:center;
}

.boardColumn{
    width:var(--board);

    max-width:100%;
}

.playerStrip{
    height:32px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:6px;
}

.playerName{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:12px;
    font-weight:700;
}

.playerPiece{
    font-size:17px;
}

.clock{
    min-width:65px;

    text-align:right;

    font-size:18px;
    font-weight:800;

    font-variant-numeric:tabular-nums;

    color:#858fa4;
}

.clock.active{
    color:#f5f8ff;

    text-shadow:
        0 0 15px rgba(100,190,255,.25);
}

/* =========================================================
   BOARD
   ========================================================= */

.boardShell{
    width:100%;

    aspect-ratio:1;

    padding:4px;

    border-radius:13px;

    background:#0c111b;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 18px 50px rgba(0,0,0,.45);
}

#board{
    width:100%;
    height:100%;

    display:grid;
    grid-template-columns:repeat(8,1fr);

    overflow:hidden;

    border-radius:9px;

    user-select:none;
}

.square{
    position:relative;

    border:0;
    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    aspect-ratio:1;

    cursor:pointer;
}

.square.light{
    background:var(--light);
}

.square.dark{
    background:var(--dark);
}

.square.last{
    box-shadow:
        inset 0 0 0 999px
        rgba(255,220,70,.23);
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px
        rgba(70,210,255,.9);
}

.square.check{
    box-shadow:
        inset 0 0 0 999px
        rgba(255,60,70,.43);
}

.piece{
    position:relative;

    z-index:3;

    font-family:
        "DejaVu Sans",
        "Arial Unicode MS",
        sans-serif;

    font-size:
        clamp(
            28px,
            calc(var(--board) / 11),
            65px
        );

    line-height:1;

    pointer-events:none;

    transform:translateY(-2px);

    text-shadow:
        0 2px 2px rgba(0,0,0,.35),
        0 5px 8px rgba(0,0,0,.18);
}

.whitePiece{
    color:#fff;
}

.blackPiece{
    color:#11151d;

    text-shadow:
        0 2px 1px rgba(255,255,255,.18),
        0 5px 8px rgba(0,0,0,.4);
}

.moveDot{
    position:absolute;

    width:19%;
    height:19%;

    border-radius:50%;

    background:rgba(15,30,45,.35);

    z-index:2;
}

.capture{
    position:absolute;

    inset:8%;

    border:4px solid rgba(20,35,48,.3);

    border-radius:50%;

    z-index:2;
}

.coord{
    position:absolute;

    z-index:5;

    font-size:9px;
    font-weight:800;

    opacity:.7;

    pointer-events:none;
}

.fileCoord{
    right:4px;
    bottom:2px;
}

.rankCoord{
    left:4px;
    top:2px;
}

.light .coord{
    color:#596779;
}

.dark .coord{
    color:#edf2f8;
}

/* =========================================================
   BOTTOM PLAYER STRIP
   ========================================================= */

.bottomPlayer{
    height:32px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:6px;
}

.you{
    font-size:12px;
    font-weight:700;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    min-height:0;

    display:flex;
    flex-direction:column;

    gap:9px;

    overflow:hidden;
}

.card{
    background:
        linear-gradient(
            180deg,
            rgba(19,25,39,.94),
            rgba(13,18,29,.94)
        );

    border:1px solid var(--line);

    border-radius:13px;

    overflow:hidden;
}

.cardHeader{
    padding:9px 12px 7px;

    font-size:10px;
    font-weight:800;

    text-transform:uppercase;

    letter-spacing:1px;

    color:#8792a8;

    border-bottom:1px solid rgba(255,255,255,.045);
}

.cardBody{
    padding:9px 11px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;
}

button,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.btn{
    min-height:34px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:8px;

    background:#171e2d;

    color:#edf2ff;

    font-size:11px;

    transition:.12s;
}

.btn:hover{
    background:#202a3e;
}

.btn:active{
    transform:scale(.98);
}

.btn.primary{
    border:0;

    background:
        linear-gradient(
            135deg,
            #5d72ff,
            #31bce5
        );

    font-weight:800;
}

select{
    width:100%;

    min-height:34px;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.08);

    background:#171e2d;

    color:#edf2ff;

    padding:0 8px;

    font-size:11px;
}

.full{
    grid-column:1/-1;
}

/* =========================================================
   STATUS
   ========================================================= */

.status{
    padding:8px 9px;

    border-radius:8px;

    background:#0a0f18;

    border:1px solid rgba(255,255,255,.06);

    font-size:11px;

    color:#aeb9cc;
}

.status.good{
    color:#78e8ae;
}

.status.bad{
    color:#ff818b;
}

/* =========================================================
   EVAL
   ========================================================= */

.evalRow{
    display:flex;
    justify-content:space-between;

    margin-top:7px;

    color:#7e8ba2;

    font-size:10px;
}

.evalBar{
    height:8px;

    margin-top:6px;

    overflow:hidden;

    border-radius:999px;

    background:#090d14;
}

.evalFill{
    width:50%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #68768d,
            #edf1f7
        );

    transition:width .3s;
}

/* =========================================================
   MOVES
   ========================================================= */

.moves{
    height:150px;

    overflow:auto;

    border-radius:8px;

    background:#090e16;

    padding:4px;
}

.moveRow{
    display:grid;

    grid-template-columns:
        32px
        1fr
        1fr;

    min-height:24px;

    align-items:center;

    padding:2px 5px;

    border-radius:5px;

    font-size:11px;
}

.moveRow:nth-child(even){
    background:rgba(255,255,255,.025);
}

.moveNumber{
    color:#68748a;
}

.current{
    font-weight:800;
    color:#fff;
}

/* =========================================================
   DEBUG
   ========================================================= */

.debug{
    font-family:monospace;

    font-size:9px;

    line-height:1.45;

    color:#7f8ba2;

    overflow-wrap:anywhere;
}

.debugLine{
    margin-bottom:4px;
}

.debugLine strong{
    color:#cbd5e8;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.68);

    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(350px,100%);

    padding:18px;

    border-radius:15px;

    background:#121927;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.modalTitle{
    font-size:19px;
    font-weight:800;

    margin-bottom:6px;
}

.modalText{
    font-size:12px;

    color:#929db2;

    margin-bottom:14px;
}

.promotionButtons{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:7px;
}

.promotionButtons button{
    height:58px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.08);

    background:#192134;

    color:white;

    font-size:32px;
}

/* =========================================================
   SHORT CHROMEBOOK
   ========================================================= */

@media(max-height:720px) and (min-width:821px){

    :root{
        --board:
            min(
                calc(100vh - 125px),
                calc(100vw - 500px),
                560px
            );
    }

    .topbar{
        height:50px;
        min-height:50px;
    }

    .main{
        padding:7px 10px 8px;
    }

    .cardHeader{
        padding:7px 10px 5px;
    }

    .cardBody{
        padding:7px 9px;
    }

    .moves{
        height:115px;
    }
}

/* =========================================================
   SMALL WIDTH
   ========================================================= */

@media(max-width:820px){

    html,body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100vh;
        overflow:visible;
    }

    .main{
        display:flex;
        flex-direction:column;
        overflow:visible;
    }

    .boardColumn{
        width:min(
            94vw,
            calc(100vh - 150px)
        );
    }

    .sidebar{
        overflow:visible;
    }

    .moves{
        height:140px;
    }
}

    --panel2:#0b2d36;

body{

body::before{

    inset:0;

.topbar{

}

.logoIcon{

.enginePill{

}

.main{

.card{

.cardHeader{

.status{

}

}

.debug{
    font-size:10px;
    line-height:1.6;
}

.boardShell{
    padding:6px;
    border-radius:18px;
    background:linear-gradient(145deg,#0b3842,#061c23);
    box-shadow:

}


/* =========================================================
   NOVA V3 AQUA+ — DECORATIVE BACKGROUND + QUICK TOOLS
   ========================================================= */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 18% 23%, transparent 0 58px, rgba(86,244,255,.08) 59px 60px, transparent 61px 100%),
        radial-gradient(circle at 82% 72%, transparent 0 105px, rgba(86,244,255,.055) 106px 107px, transparent 108px 100%),
        linear-gradient(125deg, transparent 0 43%, rgba(76,231,240,.035) 43.2% 43.8%, transparent 44% 100%);
}

/* soft floating geometric aqua designs */
.app::before,
.app::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:-1;
    filter:blur(.2px);
}

.app::before{
    width:330px;
    height:330px;
    left:-105px;
    bottom:-90px;
    border:1px solid rgba(86,244,255,.10);
    border-radius:34% 66% 53% 47% / 55% 38% 62% 45%;
    transform:rotate(18deg);
    box-shadow:
        55px -30px 0 -1px rgba(0,0,0,0),
        55px -30px 0 0 rgba(86,244,255,.05),
        115px -70px 0 -1px rgba(0,0,0,0),
        115px -70px 0 0 rgba(86,244,255,.035);
}

.app::after{
    width:260px;
    height:260px;
    right:-70px;
    top:95px;
    border:1px solid rgba(86,244,255,.08);
    transform:rotate(35deg);
    border-radius:38px;
    box-shadow:
        -38px 48px 0 -1px rgba(0,0,0,0),
        -38px 48px 0 0 rgba(86,244,255,.045),
        -76px 96px 0 -1px rgba(0,0,0,0),
        -76px 96px 0 0 rgba(86,244,255,.028);
}

.v3ToolGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.v3PositionBox{
    margin-top:11px;
    padding:10px 11px;
    border:1px solid rgba(100,239,249,.10);
    border-radius:11px;
    background:rgba(2,22,28,.48);
}

.v3PositionTitle{
    margin-bottom:7px;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.1px;
    text-transform:uppercase;
    color:#7ddbe3;
}

.v3PositionRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:3px 0;
    font-size:10px;
    color:#80aeb5;
}

.v3PositionRow strong{
    color:#eaffff;
    font-size:10px;
}

.v3HintBox{
    margin-top:10px;
    min-height:38px;
    padding:9px 10px;
    display:flex;
    align-items:center;
    border-radius:10px;
    border:1px solid rgba(92,241,255,.10);
    background:linear-gradient(135deg,rgba(11,55,64,.72),rgba(5,34,41,.72));
    color:#9fdce2;
    font-size:10px;
    line-height:1.4;
}

body.focusMode .topbar,
body.focusMode .sidebar{
    display:none;
}

body.focusMode .main{
    grid-template-columns:1fr;
}

body.focusMode .boardColumn{
    width:min(calc(100vh - 40px), 820px);
}

@media(max-height:760px) and (min-width:901px){
    .v3ToolsCard .cardBody{
        padding-top:9px;
        padding-bottom:9px;
    }
    .v3PositionBox{
        margin-top:8px;
        padding:7px 9px;
    }
    .v3HintBox{
        margin-top:8px;
        min-height:31px;
        padding:6px 8px;
    }
}


/* =========================================================
   NOVA V3 — SPACIOUS AQUA EDITION
   ========================================================= */
:root{ --sidebar-width:430px; }

body{

<script>

/* =========================================================
   ENGINE
   ========================================================= */

const ENGINE_FILE =
    "./stockfish-18-asm.js";

let engine = null;

let engineReady = false;
let engineThinking = false;
let engineStarting = false;
let engineTest = false;

/* =========================================================
   CHESS
   ========================================================= */

let game = new Chess();

let selected = null;

let legalMoves = [];

let lastMove = null;

let flipped = false;

/* =========================================================
   GAME MODE
   ========================================================= */

let gameMode = "computer";
let chosenSide = "w";
let playerColor = "w";
let engineColor = "b";
let clocksEnabled = true;


/* =========================================================
   CLOCK
   ========================================================= */

let whiteSeconds = 300;
let blackSeconds = 300;

let gameStarted = false;
let gameEnded = false;

let clockTimer = null;
let lastClockTime = 0;

/* =========================================================
   PROMOTION
   ========================================================= */

let pendingPromotion = null;

/* =========================================================
   PIECES
   ========================================================= */

const PIECES = {

    wp:"♙",
    wn:"♘",
    wb:"♗",
    wr:"♖",
    wq:"♕",
    wk:"♔",

    bp:"♟",
    bn:"♞",
    bb:"♝",
    br:"♜",
    bq:"♛",
    bk:"♚"

};

/* =========================================================
   ELEMENTS
   ========================================================= */

const board =
    document.getElementById("board");

const statusEl =
    document.getElementById("status");

const enginePill =
    document.getElementById("enginePill");

const engineText =
    document.getElementById("engineText");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const movesEl =
    document.getElementById("moves");

const evalText =
    document.getElementById("evalText");

const evalFill =
    document.getElementById("evalFill");

const promotionModal =
    document.getElementById("promotionModal");

const gameOverModal =
    document.getElementById("gameOverModal");

const gameOverTitle =
    document.getElementById("gameOverTitle");

const gameOverText =
    document.getElementById("gameOverText");

/* =========================================================
   ENGINE UI
   ========================================================= */

function setStatus(text,type=""){

    statusEl.textContent = text;
    engineText.textContent = text;

    enginePill.className =
        "enginePill " + type;
}

function command(text){
    console.log("[Stockfish command]", text);
}

function output(text){
    console.log("[Stockfish output]", text);
}

/* =========================================================
   START ENGINE
   ========================================================= */

function startEngine(){

    if(engineStarting) return;

    engineStarting = true;
    engineReady = false;

    setStatus("Loading Stockfish…");

    try{

        engine =
            new Worker(ENGINE_FILE);

    }catch(error){

        engineStarting = false;

        setStatus(
            "ENGINE ERROR",
            "error"
        );

        output(
            error.message ||
            String(error)
        );

        return;
    }

    engine.onmessage =
        function(event){

            const line =
                String(
                    event.data || ""
                ).trim();

            if(!line) return;

            output(line);

            handleEngineLine(line);
        };

    engine.onerror =
        function(){

            engineReady = false;
            engineStarting = false;
            engineThinking = false;

            setStatus(
                "ENGINE ERROR: worker failed",
                "error"
            );

            output(
                "Check that stockfish-18-asm.js is beside index.html."
            );
        };

    command("uci");

    try{

        engine.postMessage("uci");

    }catch(error){

        setStatus(
            "ENGINE ERROR",
            "error"
        );

        output(
            error.message ||
            String(error)
        );
    }
}

/* =========================================================
   ENGINE OUTPUT
   ========================================================= */

function handleEngineLine(line){

    if(line === "uciok"){

        setStatus(
            "Stockfish identified…"
        );

        command("isready");

        engine.postMessage(
            "isready"
        );

        return;
    }

    if(line === "readyok"){

        engineReady = true;
        engineStarting = false;

        setStatus(
            "Stockfish ready",
            "ready"
        );

        // If White already moved while Stockfish was loading,
        // immediately request Black's move now that the engine is ready.
        if(!gameEnded && !game.game_over() && game.turn() === "b" && !engineThinking){
            requestEngineMove();
        }

        return;
    }

    if(line.startsWith("info ")){

        parseInfo(line);

        return;
    }

    if(line.startsWith("bestmove")){

        handleBestMove(line);

        return;
    }
}

/* =========================================================
   ENGINE INFO
   ========================================================= */

function parseInfo(line){

    const scoreIndex =
        line.indexOf("score");

    if(scoreIndex === -1) return;

    const parts =
        line.split(/\s+/);

    const index =
        parts.indexOf("score");

    if(index === -1) return;

    const type =
        parts[index + 1];

    const value =
        parseInt(
            parts[index + 2],
            10
        );

    if(
        type !== "cp" ||
        Number.isNaN(value)
    ){
        return;
    }

    const pawns =
        value / 100;

    evalText.textContent =
        (
            pawns >= 0 ? "+" : ""
        ) +
        pawns.toFixed(2);

    /*
       Convert roughly from
       -5..+5 to 0..100%.
    */

    const percent =
        Math.max(
            5,
            Math.min(
                95,
                50 + pawns * 8
            )
        );

    evalFill.style.width =
        percent + "%";
}

/* =========================================================
   SEND
   ========================================================= */

function send(commandText){

    command(commandText);

    if(!engine) return;

    try{

        engine.postMessage(
            commandText
        );

    }catch(error){

        output(
            error.message ||
            String(error)
        );
    }
}

/* =========================================================
   UCI HISTORY
   ========================================================= */

function uciHistory(){

    return game
        .history({
            verbose:true
        })
        .map(
            move =>
                move.from +
                move.to +
                (
                    move.promotion ||
                    ""
                )
        )
        .join(" ");
}

/* =========================================================
   REQUEST MOVE
   ========================================================= */

function requestEngineMove(){

    if(!engineReady){

        setStatus(
            "Waiting for Stockfish…"
        );

        return;
    }

    if(engineThinking) return;

    if(gameEnded) return;

    if(game.game_over()) return;

    if(gameMode !== "computer") return;

    if(game.turn() !== engineColor) return;

    engineThinking = true;

    setStatus(
        "Nova is thinking…",
        "thinking"
    );

    /*
       IMPORTANT:
       Use the known-good
       startpos + moves protocol.
    */

    const history =
        uciHistory();

    console.log("[NOVA] Current FEN:", game.fen());
    console.log("[NOVA] UCI history:", history);
    console.log("[NOVA] Turn:", game.turn());

    send("stop");

    send("ucinewgame");

    let position =
        "position startpos";

    if(history){

        position +=
            " moves " +
            history;
    }

    send(position);

    const depth =
        parseInt(
            document.getElementById(
                "difficulty"
            ).value,
            10
        ) || 7;

    send(
        "go depth " +
        depth
    );
}

/* =========================================================
   BEST MOVE
   ========================================================= */

function handleBestMove(line){

    const parts =
        line.trim().split(/\s+/);

    const bestMove =
        parts[1];

    /*
       Engine test.
    */

    if(engineTest){

        engineTest = false;
        engineThinking = false;

        setStatus(
            bestMove &&
            bestMove !== "(none)"
                ? "Engine test passed"
                : "Engine returned no move",
            bestMove &&
            bestMove !== "(none)"
                ? "ready"
                : "error"
        );

        console.log("[Stockfish test]", bestMove || "none");

        return;
    }

    if(!engineThinking) return;

    engineThinking = false;

    if(
        !bestMove ||
        bestMove === "(none)"
    ){

        setStatus(
            "Stockfish returned no move",
            "error"
        );

        checkGameEnd();

        return;
    }

    console.log("[Stockfish bestmove]", bestMove);

    /*
       UCI:
       e7e5
       e7e8q
    */

    if(
        !/^[a-h][1-8][a-h][1-8][qrbn]?$/
        .test(bestMove)
    ){

        setStatus(
            "Invalid Stockfish move",
            "error"
        );

        return;
    }

    const from =
        bestMove.slice(0,2);

    const to =
        bestMove.slice(2,4);

    const promotion =
        bestMove.length === 5
            ? bestMove[4]
            : undefined;

    /*
       Validate against chess.js
       before changing the board.
    */

    const legal =
        game.moves({
            verbose:true
        }).find(
            move =>
                move.from === from &&
                move.to === to &&
                (
                    !move.promotion ||
                    move.promotion ===
                    promotion
                )
        );

    if(!legal){

        setStatus(
            "Stockfish move was illegal",
            "error"
        );

        output(
            "Rejected: " +
            bestMove +
            " | FEN: " +
            game.fen()
        );

        return;
    }

    const moveObject = {
        from:from,
        to:to
    };

    if(promotion){
        moveObject.promotion =
            promotion;
    }

    const move =
        game.move(moveObject);

    if(!move){

        setStatus(
            "Could not apply engine move",
            "error"
        );

        return;
    }

    lastMove = {
        from:from,
        to:to
    };

    selected = null;
    legalMoves = [];

    setStatus(
        "Your move",
        "ready"
    );

    render();

    checkGameEnd();
}

/* =========================================================
   ENGINE TEST
   ========================================================= */

function testEngine(){

    if(!engineReady){

        setStatus(
            "Stockfish is not ready"
        );

        return;
    }

    if(engineThinking){

        setStatus(
            "Nova is already thinking",
            "thinking"
        );

        return;
    }

    engineTest = true;
    engineThinking = true;

    setStatus(
        "Testing Stockfish…",
        "thinking"
    );

    send("stop");
    send("ucinewgame");
    send("position startpos");
    send("go depth 6");
}

/* =========================================================
   BOARD
   ========================================================= */

function renderBoard(){

    board.innerHTML = "";

    const files =
        ["a","b","c","d","e","f","g","h"];

    const ranks =
        ["8","7","6","5","4","3","2","1"];

    const displayFiles =
        flipped
            ? [...files].reverse()
            : files;

    const displayRanks =
        flipped
            ? [...ranks].reverse()
            : ranks;

    for(let row=0;row<8;row++){

        for(let col=0;col<8;col++){

            const file =
                displayFiles[col];

            const rank =
                displayRanks[row];

            const square =
                file + rank;

            const el =
                document.createElement(
                    "button"
                );

            el.className =
                "square " +
                (
                    (
                        files.indexOf(file) +
                        parseInt(rank,10)
                    ) % 2 === 0
                        ? "light"
                        : "dark"
                );

            /*
               Last move.
            */

            if(
                lastMove &&
                (
                    lastMove.from === square ||
                    lastMove.to === square
                )
            ){
                el.classList.add("last");
            }

            /*
               Selected.
            */

            if(selected === square){

                el.classList.add(
                    "selected"
                );
            }

            /*
               Check.
            */

            if(game.in_check()){

                const piece =
                    game.get(square);

                if(
                    piece &&
                    piece.type === "k" &&
                    piece.color === game.turn()
                ){

                    el.classList.add(
                        "check"
                    );
                }
            }

            /*
               Legal destination.
            */

            const legal =
                legalMoves.find(
                    move =>
                        move.to === square
                );

            if(legal){

                if(game.get(square)){

                    const capture =
                        document.createElement(
                            "div"
                        );

                    capture.className =
                        "capture";

                    el.appendChild(capture);

                }else{

                    const dot =
                        document.createElement(
                            "div"
                        );

                    dot.className =
                        "moveDot";

                    el.appendChild(dot);
                }
            }

            /*
               Piece.
            */

            const piece =
                game.get(square);

            if(piece){

                const pieceEl =
                    document.createElement(
                        "div"
                    );

                pieceEl.className =
                    "piece " +
                    (
                        piece.color === game.turn()
                            ? "whitePiece"
                            : "blackPiece"
                    );

                pieceEl.textContent =
                    PIECES[
                        piece.color +
                        piece.type
                    ];

                el.appendChild(
                    pieceEl
                );
            }

            /*
               Coordinates.
            */

            if(col === 0){

                const rankEl =
                    document.createElement(
                        "span"
                    );

                rankEl.className =
                    "coord rankCoord";

                rankEl.textContent =
                    rank;

                el.appendChild(
                    rankEl
                );
            }

            if(row === 7){

                const fileEl =
                    document.createElement(
                        "span"
                    );

                fileEl.className =
                    "coord fileCoord";

                fileEl.textContent =
                    file;

                el.appendChild(
                    fileEl
                );
            }

            el.addEventListener(
                "click",
                () =>
                    squareClicked(square)
            );

            board.appendChild(el);
        }
    }
}

/* =========================================================
   SQUARE CLICK
   ========================================================= */

function squareClicked(square){

    if(gameEnded) return;

    if(gameMode === "computer" && game.turn() !== playerColor) return;

    if(gameMode === "computer" && engineThinking) return;

    const piece =
        game.get(square);

    /*
       Already selected.
    */

    if(selected){

        /*
           Legal destination.
        */

        const legal =
            legalMoves.find(
                move =>
                    move.to === square
            );

        if(legal){

            attemptMove(
                selected,
                square
            );

            return;
        }

        /*
           Select another white piece.
        */

        if(
            piece &&
            piece.color === game.turn()
        ){

            selectSquare(square);

            return;
        }

        clearSelection();

        return;
    }

    /*
       Select white piece.
    */

    if(
        piece &&
        piece.color === "w"
    ){

        selectSquare(square);
    }
}

/* =========================================================
   SELECT
   ========================================================= */

function selectSquare(square){

    selected = square;

    legalMoves =
        game.moves({
            square:square,
            verbose:true
        });

    renderBoard();
}

/* =========================================================
   CLEAR
   ========================================================= */

function clearSelection(){

    selected = null;
    legalMoves = [];

    renderBoard();
}

/* =========================================================
   PLAYER MOVE
   ========================================================= */

function attemptMove(from,to){

    const piece =
        game.get(from);

    /*
       Promotion.
    */

    if(
        piece &&
        piece.type === "p" &&
        (
            (piece.color === "w" && to[1] === "8") ||
            (piece.color === "b" && to[1] === "1")
        )
    ){

        pendingPromotion = {
            from:from,
            to:to
        };

        promotionModal.classList.add(
            "show"
        );

        return;
    }

    makePlayerMove(
        from,
        to,
        "q"
    );
}

/* =========================================================
   MAKE PLAYER MOVE
   ========================================================= */

function makePlayerMove(
    from,
    to,
    promotion
){

    const move =
        game.move({
            from:from,
            to:to,
            promotion:promotion
        });

    if(!move){

        clearSelection();

        return;
    }

    lastMove = {
        from:from,
        to:to
    };

    selected = null;
    legalMoves = [];

    gameStarted = true;

    startClock();

    render();

    if(checkGameEnd()) return;

    /*
       In Vs Nova mode, ask the engine when
       the turn belongs to Nova. Local and
       Free Play modes simply continue.
    */

    if(
        gameMode === "computer" &&
        game.turn() === engineColor
    ){
        requestEngineMove();
    }
}

   PROMOTION BUTTONS
   ========================================================= */

document

        ".promotionButtons button"

        button.addEventListener(

                if(!pendingPromotion)

/* =========================================================
   MOVES
   ========================================================= */

function renderMoves(){

    const history =
        game.history();

    if(!history.length){

        movesEl.innerHTML =
            `
            <div style="
                padding:8px;
                color:#657188;
                font-size:10px;
            ">
                Make your first move.
            </div>
            `;

        return;
    }

    let html = "";

    for(
        let i=0;
        i<history.length;
        i+=2
    ){

        html +=
            `
            <div class="moveRow">

                <div class="moveNumber">
                    ${Math.floor(i/2)+1}.
                </div>

                <div class="${
                    i === history.length-1
                        ? "current"
                        : ""
                }">
                    ${history[i] || ""}
                </div>

                <div class="${
                    i+1 === history.length-1
                        ? "current"
                        : ""
                }">
                    ${history[i+1] || ""}
                </div>

            </div>
            `;
    }

    movesEl.innerHTML =
        html;

    movesEl.scrollTop =
        movesEl.scrollHeight;
}

/* =========================================================
   CLOCK
   ========================================================= */

function formatClock(seconds){

    seconds =
        Math.max(
            0,
            Math.ceil(seconds)
        );

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(secs).padStart(2,"0")
    );
}

function updateClocks(){

    if(!clocksEnabled){
        whiteClock.textContent = "∞";
        blackClock.textContent = "∞";
    }else{
        whiteClock.textContent =
            formatClock(
                whiteSeconds
            );

        blackClock.textContent =
            formatClock(
                blackSeconds
            );
    }

    whiteClock.classList.toggle(
        "active",
        game.turn() === "w" &&
        !gameEnded
    );

    }

    blackClock.classList.toggle(
        "active",
        game.turn() === "b" &&
        !gameEnded
    );
}

/*
   ONE clock interval.

   It never stops just because
   Stockfish is thinking.

   When game.turn() is Black,
   Black's clock decreases.
*/

function startClock(){

    if(clockTimer) return;

    lastClockTime =
        performance.now();

    clockTimer =
        setInterval(
            function(){

                if(
                    !gameStarted ||
                    gameEnded ||
                    !clocksEnabled
                ){
                    return;
                }

                const now =
                    performance.now();

                const elapsed =
                    (
                        now -
                        lastClockTime
                    ) / 1000;

                lastClockTime = now;

                if(game.turn() === "w"){

                    whiteSeconds =
                        Math.max(
                            0,
                            whiteSeconds -
                            elapsed
                        );

                }else{

                    blackSeconds =
                        Math.max(
                            0,
                            blackSeconds -
                            elapsed
                        );
                }

                updateClocks();

                if(
                    whiteSeconds <= 0
                ){

                    endGame(
                        "Time",
                        "Nova wins on time."
                    );

                }else if(
                    blackSeconds <= 0
                ){

                    endGame(
                        "Time",
                        "You win on time."
                    );
                }

            },
            100
        );
}

function stopClock(){

    if(clockTimer){

        clearInterval(
            clockTimer
        );

        clockTimer = null;
    }
}

/* =========================================================
   GAME END
   ========================================================= */

function checkGameEnd(){

    if(game.in_checkmate()){

        if(game.turn() === "w"){

            endGame(
                "Checkmate",
                "Nova wins by checkmate."
            );

        }else{

            endGame(
                "Checkmate",
                "You win by checkmate!"
            );
        }

        return true;
    }

    if(game.in_draw()){

        endGame(
            "Draw",
            "The game ends in a draw."
        );

        return true;
    }

    return false;
}

function endGame(title,text){

    gameEnded = true;
    engineThinking = false;

    stopClock();

    gameOverTitle.textContent =
        title;

    gameOverText.textContent =
        text;

    gameOverModal.classList.add(
        "show"
    );

    setStatus(
        text
    );

    updateClocks();
}

/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

    if(engine){

        try{
            engine.postMessage("stop");
        }catch(_){}
    }

    game = new Chess();

    selected = null;
    legalMoves = [];
    lastMove = null;

    pendingPromotion = null;

    engineThinking = false;
    engineTest = false;

    gameStarted = false;
    gameEnded = false;

    const timeValue =
        parseInt(
            document.getElementById("timeControl").value,
            10
        );

    clocksEnabled =
        timeValue > 0;

    whiteSeconds =
        clocksEnabled ? timeValue : 0;

    blackSeconds =
        clocksEnabled ? timeValue : 0;

    if(gameMode === "computer"){

        playerColor =
            chosenSide === "random"
                ? (Math.random() < .5 ? "w" : "b")
                : chosenSide;

        engineColor =
            playerColor === "w"
                ? "b"
                : "w";

        flipped =
            playerColor === "b";

    }else{

        playerColor = "w";
        engineColor = "b";
        flipped = false;
    }

    stopClock();

    promotionModal.classList.remove(
        "show"
    );

    gameOverModal.classList.remove(
        "show"
    );

    evalText.textContent =
        "0.00";

    evalFill.style.width =
        "50%";

    render();

    updateClocks();

    if(engineReady){

        send("stop");
        send("ucinewgame");
        send("isready");

        setStatus(
            "Resetting Stockfish…"
        );
    }

    if(
        gameMode === "computer" &&
        engineReady &&
        game.turn() === engineColor
    ){
        setTimeout(
            requestEngineMove,
            80
        );
    }else if(gameMode === "local"){
        setStatus("White to move","ready");
    }else if(gameMode === "analysis"){
        setStatus("Free Play","ready");
    }
}

/* =========================================================
   UNDO
   ========================================================= */

function undo(){

    if(engineThinking) return;

    const history =
        game.history();

    if(!history.length) return;

    /*
       Undo Nova's move
       and the player's move.
    */

    if(history.length >= 2){
        game.undo();
    }

    if(game.history().length){
        game.undo();
    }

    selected = null;
    legalMoves = [];

    const newHistory =
        game.history({
            verbose:true
        });

    if(newHistory.length){

        const move =
            newHistory[
                newHistory.length - 1
            ];

        lastMove = {
            from:move.from,
            to:move.to
        };

    }else{

        lastMove = null;
    }

    gameEnded = false;

    gameOverModal.classList.remove(
        "show"
    );

    render();

    if(
        gameStarted &&
        !clockTimer
    ){
        startClock();
    }
}

/* =========================================================
   FLIP
   ========================================================= */

function flip(){

    flipped = !flipped;

    renderBoard();
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

    renderBoard();
    renderMoves();
    updateClocks();
    updateV3Position();
    updateModeLabels();
}

/* =========================================================
   V3 QUICK TOOLS
   ========================================================= */

const v3Turn =
    document.getElementById("v3Turn");

const v3MoveNo =
    document.getElementById("v3MoveNo");

const v3Material =
    document.getElementById("v3Material");

const hintBox =
    document.getElementById("hintBox");

const MATERIAL_VALUES = {
    p:1,
    n:3,
    b:3,
    r:5,
    q:9,
    k:0
};

function updateV3Position(){

    if(v3Turn){
        v3Turn.textContent =
            game.turn() === "w"
                ? "White"
                : "Black";
    }

    if(v3MoveNo){
        v3MoveNo.textContent =
            Math.floor(
                game.history().length / 2
            ) + 1;
    }

    if(v3Material){

        let white = 0;
        let black = 0;

        for(let rank=1;rank<=8;rank++){

            for(
                const file of
                ["a","b","c","d","e","f","g","h"]
            ){

                const piece =
                    game.get(
                        file + rank
                    );

                if(!piece) continue;

                const value =
                    MATERIAL_VALUES[
                        piece.type
                    ] || 0;

                if(piece.color === "w"){
                    white += value;
                }else{
                    black += value;
                }
            }
        }

        const diff =
            white - black;

        if(diff === 0){
            v3Material.textContent =
                "Equal";
        }else if(diff > 0){
            v3Material.textContent =
                "White +" + diff;
        }else{
            v3Material.textContent =
                "Black +" + Math.abs(diff);
        }
    }
}

async function copyTextV3(text,label){

    try{

        await navigator.clipboard.writeText(
            text
        );

        hintBox.textContent =
            label + " copied.";

    }catch(error){

        hintBox.textContent =
            "Copy failed. Browser permission may be blocked.";
    }
}

    .getElementById("copyFenBtn")

                game.fen(),

            )

document
    .getElementById("copyPgnBtn")
    .addEventListener(
        "click",
        () =>
            copyTextV3(
                game.pgn(),
                "PGN"
            )
    );

document
    .getElementById("focusBtn")
    .addEventListener(
        "click",
        function(){

            document.body
                .classList
                .toggle("focusMode");

            this.textContent =
                document.body
                    .classList
                    .contains("focusMode")
                    ? "↩ Exit Focus"
                    : "⛶ Focus";
        }
    );

document
    .getElementById("hintBtn")
    .addEventListener(
        "click",
        function(){

            if(gameEnded){

                hintBox.textContent =
                    "The game is over.";

                return;
            }

            if(game.turn() !== "w"){

                hintBox.textContent =
                    "Wait for Nova to finish its move.";

                return;
            }

            const moves =
                game.moves({
                    verbose:true
                });

            if(!moves.length){

                hintBox.textContent =
                    "No legal moves.";

                return;
            }

            /*
               Lightweight local hint:
               prefer captures/checks, otherwise
               show a legal candidate move.
               This does not interrupt Stockfish.
            */

            const candidate =
                moves.find(
                    move =>
                        move.flags.includes("c")
                ) ||
                moves.find(
                    move =>
                        move.san.includes("+")
                ) ||
                moves[0];

            hintBox.textContent =
                "Try looking at " +
                candidate.san +
                " (" +
                candidate.from +
                " → " +
                candidate.to +
                ").";
        }
    );


/* =========================================================
   START
   ========================================================= */

render();

startEngine();
