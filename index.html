<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Stockfish Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    color: #f5f7ff;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 12% 8%,
            rgba(109,75,255,.25),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 18%,
            rgba(42,137,255,.15),
            transparent 27%
        ),
        radial-gradient(
            circle at 70% 90%,
            rgba(132,53,255,.12),
            transparent 30%
        ),
        #05070d;

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";

    position: fixed;

    inset: -30%;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(110,80,255,.08),
            transparent 24%
        ),
        radial-gradient(
            circle at 75% 55%,
            rgba(55,145,255,.06),
            transparent 25%
        );

    animation:
        atmosphere 14s ease-in-out infinite alternate;
}

@keyframes atmosphere {

    from {
        transform:
            translate(-2%, -1%)
            scale(1);
    }

    to {
        transform:
            translate(3%, 2%)
            scale(1.08);
    }
}


/* =========================================================
   APP
========================================================= */

.app {

    width:
        min(
            1480px,
            calc(100% - 36px)
        );

    margin: auto;

    padding:
        18px
        0
        35px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 15px 0 17px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            rgba(20,23,37,.88),
            rgba(9,12,21,.84)
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.32),
        inset 0 1px rgba(255,255,255,.07);

    backdrop-filter:
        blur(22px);

    position: relative;

    z-index: 2;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo {

    width: 45px;
    height: 45px;

    display: grid;

    place-items: center;

    border-radius: 14px;

    font-family:
        Georgia,
        serif;

    font-size: 28px;

    background:
        linear-gradient(
            145deg,
            #8e76ff,
            #5bc8ff
        );

    box-shadow:
        0 0 35px
        rgba(117,92,255,.35),

        inset 0 1px
        rgba(255,255,255,.45);

    text-shadow:
        0 2px 5px rgba(0,0,0,.25);
}

.title {

    font-size: 16px;

    font-weight: 850;

    letter-spacing: -.2px;
}

.subtitle {

    margin-top: 3px;

    color: #7e879b;

    font-size: 10px;
}

.header-actions {

    display: flex;

    align-items: center;

    gap: 9px;
}

.icon-button {

    width: 38px;
    height: 38px;

    display: grid;

    place-items: center;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.035);

    color: #aeb6c7;

    cursor: pointer;

    transition:
        .15s ease;
}

.icon-button:hover {

    background:
        rgba(255,255,255,.08);

    color: white;

    transform:
        translateY(-1px);
}

.engine {

    display: flex;

    align-items: center;

    gap: 8px;

    height: 38px;

    padding:
        0 13px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.035);

    color: #aeb6c7;

    font-size: 10px;

    font-weight: 800;
}

.engine-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #54efaa;

    box-shadow:
        0 0 12px
        rgba(84,239,170,.9);
}

.engine.thinking .engine-dot {

    animation:
        enginePulse
        .55s
        infinite
        alternate;
}

@keyframes enginePulse {

    to {
        transform: scale(1.6);
        opacity: .45;
    }
}

.new-game-top {

    border: 0;

    height: 38px;

    padding:
        0 15px;

    border-radius: 12px;

    color: white;

    font-size: 10px;

    font-weight: 850;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #735cf5,
            #4f9cff
        );

    box-shadow:
        0 8px 25px
        rgba(91,91,255,.22);

    transition:
        .15s ease;
}

.new-game-top:hover {

    transform:
        translateY(-1px);

    box-shadow:
        0 12px 32px
        rgba(91,91,255,.32);
}


/* =========================================================
   MAIN
========================================================= */

.main {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        365px;

    gap: 24px;

    margin-top: 22px;

    align-items: start;
}


/* =========================================================
   BOARD
========================================================= */

.board-zone {

    display: flex;

    justify-content: center;

    min-width: 0;
}

.board-frame {

    /*
       Large board.
    */

    width:
        min(
            82vh,
            68vw,
            790px
        );

    aspect-ratio: 1;

    padding: 10px;

    border-radius: 27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:

        0 35px 100px
        rgba(0,0,0,.58),

        0 0 90px
        rgba(101,79,255,.10),

        inset 0 1px
        rgba(255,255,255,.16);

    position: relative;
}

.board-frame::before {

    content: "";

    position: absolute;

    inset: 2px;

    border-radius: 24px;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.06),
            transparent 25%,
            transparent 75%,
            rgba(80,130,255,.04)
        );
}

.board {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(8,1fr);

    grid-template-rows:
        repeat(8,1fr);

    overflow: hidden;

    border-radius: 18px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.4);

    position: relative;
}


/* =========================================================
   SQUARES
========================================================= */

.square {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    user-select: none;

    overflow: hidden;

    transition:
        filter .12s ease;
}

.square.light {

    background:
        linear-gradient(
            135deg,
            #e8edf5,
            #d7dee9
        );
}

.square.dark {

    background:
        linear-gradient(
            135deg,
            #62738d,
            #52627a
        );
}

.square:hover {

    filter:
        brightness(1.08);
}


/* =========================================================
   BOARD LIGHTING
========================================================= */

.square::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .20;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            transparent 40%
        );
}


/* =========================================================
   LAST MOVE
========================================================= */

.square.last {

    box-shadow:
        inset 0 0 0 999px
        rgba(133,106,255,.17);
}


/* =========================================================
   SELECTED
========================================================= */

.square.selected {

    box-shadow:
        inset 0 0 0 999px
        rgba(117,91,255,.33),

        inset 0 0 28px
        rgba(121,91,255,.38);
}


/* =========================================================
   CHECK
========================================================= */

.square.check {

    box-shadow:
        inset 0 0 0 999px
        rgba(255,45,65,.31),

        inset 0 0 35px
        rgba(255,40,65,.7);

    animation:
        checkPulse
        .55s
        infinite
        alternate;
}

@keyframes checkPulse {

    from {
        filter: brightness(1);
    }

    to {
        filter: brightness(1.18);
    }
}


/* =========================================================
   PIECES
========================================================= */

.piece {

    position: relative;

    z-index: 5;

    pointer-events: none;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    /*
       Pieces deliberately stay
       inside their squares.
    */

    font-size: 69%;

    line-height: 1;

    transition:
        transform .12s ease,
        filter .12s ease;
}

.square:hover .piece {

    transform:
        translateY(-2px)
        scale(1.025);
}


/* WHITE */

.white-piece {

    color: #ffffff;

    text-shadow:

        0 1px 0 #cbd3df,

        0 3px 4px
        rgba(0,0,0,.36),

        0 7px 13px
        rgba(0,0,0,.25);
}


/* BLACK */

.black-piece {

    color: #1d222b;

    text-shadow:

        0 1px 0 #778291,

        0 3px 4px
        rgba(0,0,0,.45),

        0 7px 13px
        rgba(0,0,0,.28);
}


/* =========================================================
   COORDINATES
========================================================= */

.coordinate {

    position: absolute;

    z-index: 10;

    pointer-events: none;

    font-size: 8px;

    font-weight: 900;

    opacity: .55;
}

.rank {

    top: 4px;
    left: 5px;
}

.file {

    right: 5px;
    bottom: 4px;
}

.square.light .coordinate {

    color: #536178;
}

.square.dark .coordinate {

    color: #e7edf6;
}


/* =========================================================
   LEGAL MOVE DOT
========================================================= */

.move-dot {

    position: absolute;

    z-index: 3;

    width: 17%;

    aspect-ratio: 1;

    border-radius: 50%;

    background:
        rgba(70,45,180,.47);

    box-shadow:
        0 0 10px
        rgba(111,80,255,.25);

    animation:
        dot .13s ease-out;
}

@keyframes dot {

    from {
        opacity: 0;
        transform: scale(.4);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.capture-ring {

    position: absolute;

    z-index: 3;

    width: 78%;
    height: 78%;

    border-radius: 50%;

    border:
        5px solid
        rgba(91,64,180,.35);

    box-shadow:
        0 0 12px
        rgba(99,70,255,.15);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.card {

    border:
        1px solid
        rgba(255,255,255,.085);

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(17,21,33,.91),
            rgba(9,12,20,.86)
        );

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.24),

        inset 0 1px
        rgba(255,255,255,.045);

    backdrop-filter:
        blur(18px);
}


/* =========================================================
   STATUS CARD
========================================================= */

.status-card {

    padding: 17px;
}

.small-label {

    color: #747e91;

    font-size: 9px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1.6px;
}

.status {

    margin-top: 6px;

    font-size: 20px;

    font-weight: 900;

    letter-spacing: -.5px;
}

.status.thinking {

    color: #9b88ff;
}

.status.check {

    color: #ff7180;
}


/* =========================================================
   EVALUATION
========================================================= */

.eval {

    margin-top: 16px;

    height: 9px;

    border-radius: 99px;

    overflow: hidden;

    background:
        #080b12;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.eval-fill {

    width: 50%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #cbd3df,
            #ffffff
        );

    transition:
        width .35s ease;
}

.eval-value {

    margin-top: 5px;

    text-align: right;

    color: #747e91;

    font-size: 10px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   CLOCKS
========================================================= */

.clocks {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;

    padding: 12px;
}

.clock {

    padding: 14px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.055);

    transition:
        .2s ease;
}

.clock.active {

    border-color:
        rgba(122,102,255,.55);

    background:
        linear-gradient(
            145deg,
            rgba(105,85,240,.13),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 0 25px
        rgba(102,82,255,.08);
}

.clock-label {

    color: #777f91;

    font-size: 8px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1.3px;
}

.clock-time {

    margin-top: 5px;

    font-size: 25px;

    font-weight: 900;

    letter-spacing: -.7px;

    font-variant-numeric:
        tabular-nums;
}

.clock.low .clock-time {

    color: #ff6575;
}


/* =========================================================
   MODES
========================================================= */

.mode-card {

    padding: 14px;
}

.mode-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 10px;
}

.mode-title {

    font-size: 12px;

    font-weight: 850;
}

.mode-current {

    color: #7d8799;

    font-size: 9px;
}

.modes {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 6px;
}

.mode {

    min-height: 46px;

    padding: 7px;

    text-align: left;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.055);

    background:
        rgba(255,255,255,.025);

    color: #cbd1dd;

    cursor: pointer;

    transition:
        .13s ease;
}

.mode:hover {

    background:
        rgba(255,255,255,.065);

    transform:
        translateY(-1px);
}

.mode.active {

    border-color:
        rgba(126,105,255,.68);

    background:
        linear-gradient(
            135deg,
            rgba(113,91,255,.18),
            rgba(70,130,255,.08)
        );

    box-shadow:
        0 0 22px
        rgba(105,82,255,.08);
}

.mode-name {

    display: block;

    color: #e7eaf2;

    font-size: 9px;

    font-weight: 900;
}

.mode-time {

    display: block;

    margin-top: 3px;

    color: #747e91;

    font-size: 8px;
}


/* =========================================================
   MOVES
========================================================= */

.moves-card {

    overflow: hidden;
}

.moves {

    height: 205px;

    padding: 8px;

    overflow-y: auto;
}

.moves::-webkit-scrollbar {

    width: 4px;
}

.moves::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.12);

    border-radius: 10px;
}

.empty {

    height: 100%;

    display: grid;

    place-items: center;

    color: #667084;

    font-size: 10px;
}

.move-row {

    display: grid;

    grid-template-columns:
        29px 1fr 1fr;

    gap: 4px;

    padding:
        8px 7px;

    border-radius: 8px;

    color: #dce1eb;

    font-size: 11px;

    animation:
        moveIn .16s ease-out;
}

.move-row.latest {

    background:
        rgba(115,92,255,.12);

    box-shadow:
        inset 2px 0
        rgba(126,106,255,.8);
}

.move-number {

    color: #697286;
}

.move-san {

    font-weight: 800;
}

@keyframes moveIn {

    from {
        opacity: 0;
        transform:
            translateY(5px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    padding: 13px;
}

select {

    width: 100%;

    height: 42px;

    padding:
        0 11px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        #111621;

    color: #dce1eb;

    outline: none;

    cursor: pointer;
}

.control-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 8px;
}

.button {

    height: 40px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.035);

    color: #dce1eb;

    font-size: 10px;

    font-weight: 850;

    cursor: pointer;

    transition:
        .14s ease;
}

.button:hover {

    background:
        rgba(255,255,255,.075);

    transform:
        translateY(-1px);
}

.button.primary {

    border: 0;

    color: white;

    background:
        linear-gradient(
            135deg,
            #725bf4,
            #4d91ff
        );

    box-shadow:
        0 8px 24px
        rgba(92,84,255,.2);
}

.engine-details {

    display: flex;

    justify-content: space-between;

    margin-top: 9px;

    color: #606b7e;

    font-size: 8px;
}


/* =========================================================
   PROMOTION / GAME OVER
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(2,4,9,.76);

    backdrop-filter:
        blur(10px);
}

.overlay.show {

    display: flex;
}

.modal {

    width:
        min(
            390px,
            90vw
        );

    padding: 25px;

    border-radius: 21px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        linear-gradient(
            145deg,
            #151a29,
            #0b0f18
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65);

    text-align: center;

    animation:
        modalIn .18s ease-out;
}

.modal-title {

    margin-bottom: 17px;

    font-size: 18px;

    font-weight: 900;
}

.promotion {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 8px;
}

.promotion button {

    height: 75px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 42px;

    cursor: pointer;

    transition:
        .14s ease;
}

.promotion button:hover {

    transform:
        translateY(-3px);

    background:
        rgba(112,92,255,.16);
}

.result {

    font-size: 29px;

    font-weight: 950;
}

.result-text {

    margin:
        7px 0
        19px;

    color: #818b9e;

    font-size: 11px;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform:
            scale(.94)
            translateY(8px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px) {

    .main {

        grid-template-columns:
            1fr;
    }

    .board-frame {

        width:
            min(
                88vw,
                760px
            );
    }

    .sidebar {

        width:
            min(
                88vw,
                760px
            );

        margin: auto;
    }
}


@media(max-width:650px) {

    .app {

        width: 97vw;

        padding-top: 8px;
    }

    .header {

        height: 60px;

        border-radius: 16px;
    }

    .subtitle,
    .icon-button {

        display: none;
    }

    .engine {

        height: 34px;
    }

    .new-game-top {

        height: 34px;

        padding:
            0 10px;
    }

    .board-frame {

        width: 95vw;

        padding: 7px;

        border-radius: 20px;
    }

    .board {

        border-radius: 14px;
    }

    .piece {

        font-size: 66%;
    }

    .modes {

        grid-template-columns:
            repeat(3,1fr);
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="brand">

        <div class="logo">
            ♞
        </div>

        <div>

            <div class="title">
                Stockfish Chess
            </div>

            <div class="subtitle">
                Premium browser chess
            </div>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="icon-button"
            title="Settings"
        >
            ⚙
        </button>

        <button
            class="icon-button"
            title="Help"
        >
            ?
        </button>


        <div
            class="engine"
            id="engine"
        >

            <span
                class="engine-dot"
            ></span>

            <span
                id="engineText"
            >
                Loading
            </span>

        </div>


        <button
            class="new-game-top"
            id="topNewGame"
        >
            + New Game
        </button>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


<!-- =======================================================
     BOARD
======================================================= -->

<section class="board-zone">

    <div class="board-frame">

        <div
            class="board"
            id="board"
        ></div>

    </div>

</section>



<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar">


<!-- STATUS -->

<section class="card status-card">

    <div class="small-label">
        Game Status
    </div>

    <div
        class="status"
        id="status"

<script>

/* =========================================================
   GAME
========================================================= */

const game = new Chess();


/* =========================================================
   PIECES
========================================================= */

const PIECES = {

    wp:"♙",
    wn:"♘",
    wb:"♗",
    wr:"♖",
    wq:"♕",
    wk:"♔",

    bp:"♟",
    bn:"♞",
    bb:"♝",
    br:"♜",
    bq:"♛",
    bk:"♚"

};


/* =========================================================
   ELEMENTS
========================================================= */

const board =
    document.getElementById("board");

const status =
    document.getElementById("status");

const moves =
    document.getElementById("moves");

const engineBox =
    document.getElementById("engine");

const engineText =
    document.getElementById("engineText");

const evalFill =
    document.getElementById("evalFill");

const evalValue =
    document.getElementById("evalValue");

const whiteClock =
    document.getElementById("whiteClock");

const blackClock =
    document.getElementById("blackClock");

const whiteBox =
    document.getElementById("whiteBox");

const blackBox =
    document.getElementById("blackBox");

const depth =
    document.getElementById("depth");

const turnText =
    document.getElementById("turn");

const difficulty =
    document.getElementById("difficulty");

const promotionOverlay =
    document.getElementById("promotionOverlay");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");


/* =========================================================
   STATE
========================================================= */

let selected = null;

let lastMove = null;

let engine = null;

let engineReady = false;

let thinking = false;

let finished = false;

let pendingPromotion = null;

let version = 0;

let engineVersion = 0;


/* =========================================================
   CLOCK
========================================================= */

let baseTime = 600;

let increment = 0;

let clocks = {

    w:600,

    b:600

};

let lastTick =
    performance.now();


/* =========================================================
   DRAW BOARD
========================================================= */

function drawBoard() {

    board.innerHTML = "";

    const position =
        game.board();


    for(let row=0; row<8; row++) {

        for(let col=0; col<8; col++) {

            const squareName =
                String.fromCharCode(
                    97 + col
                )
                +
                (8-row);


            const square =
                document.createElement("div");


            square.className =
                "square "
                +
                (
                    (row+col)%2===0
                    ? "light"
                    : "dark"
                );


            square.dataset.square =
                squareName;


            if(
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ) {

                square.classList.add(
                    "last"
                );

            }


            if(
                selected === squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            const piece =
                position[row][col];


            if(piece) {

                const pieceElement =
                    document.createElement("div");


                pieceElement.className =
                    "piece "
                    +
                    (
                        piece.color==="w"
                        ? "white-piece"
                        : "black-piece"
                    );


                pieceElement.textContent =
                    PIECES[
                        piece.color +
                        piece.type
                    ];


                square.appendChild(
                    pieceElement
                );

            }


            const rank =
                document.createElement("span");


            rank.className =
                "coordinate rank";


            rank.textContent =
                col===0
                ? 8-row
                : "";


            square.appendChild(
                rank
            );


            const file =
                document.createElement("span");


            file.className =
                "coordinate file";


            file.textContent =
                row===7
                ? String.fromCharCode(
                    97+col
                )
                : "";


            square.appendChild(
                file
            );


            square.onclick =
                () => clickSquare(
                    squareName
                );


            board.appendChild(
                square
            );

        }

    }


    if(selected) {

        showMoves(
            selected
        );

    }


    showCheck();

}


/* =========================================================
   LEGAL MOVES
========================================================= */

function showMoves(squareName) {

    const legal =
        game.moves({
            square:squareName,
            verbose:true
        });


    legal.forEach(
        move => {

            const target =
                board.querySelector(
                    `[data-square="${move.to}"]`
                );


            if(!target) return;


            if(move.captured) {

                const ring =
                    document.createElement("div");

                ring.className =
                    "capture-ring";

                target.appendChild(
                    ring
                );

            } else {

                const dot =
                    document.createElement("div");

                dot.className =
                    "move-dot";

                target.appendChild(
                    dot
                );

            }

        }
    );

}


/* =========================================================
   CHECK
========================================================= */

function showCheck() {

    if(!game.in_check()) {

        status.classList.remove(
            "check"
        );

        return;
    }


    status.classList.add(
        "check"
    );


    const side =
        game.turn();


    const position =
        game.board();


    for(let row=0; row<8; row++) {

        for(let col=0; col<8; col++) {

            const piece =
                position[row][col];


            if(
                piece &&
                piece.type==="k" &&
                piece.color===side
            ) {

                const squareName =
                    String.fromCharCode(
                        97+col
                    )
                    +
                    (8-row);


                const square =
                    board.querySelector(
                        `[data-square="${squareName}"]`
                    );


                if(square) {

                    square.classList.add(
                        "check"
                    );

                }

            }

        }

    }

}


/* =========================================================
   CLICK
========================================================= */

function clickSquare(squareName) {

    if(
        finished ||
        thinking ||
        !engineReady ||
        game.turn()!=="w"
    ) {

        return;
    }


    const piece =
        game.get(squareName);


    if(!selected) {

        if(
            piece &&
            piece.color==="w"
        ) {

            selected =
                squareName;

            drawBoard();

        }

        return;
    }


    if(
        piece &&
        piece.color==="w"
    ) {

        selected =
            squareName;

        drawBoard();

        return;
    }


    const legal =
        game.moves({
            square:selected,
            verbose:true
        });


    const move =
        legal.find(
            item =>
                item.to===squareName
        );


    if(!move) {

        selected = null;

        drawBoard();

        return;
    }


    if(move.promotion) {

        pendingPromotion = {

            from:selected,

            to:squareName

        };


        promotionOverlay.classList.add(
            "show"
        );

        return;
    }


    makeMove({

        from:selected,

        to:squareName

    });

}


/* =========================================================
   MAKE MOVE
========================================================= */

function makeMove(move) {

    const resultMove =
        game.move(move);


    if(!resultMove) {

        return;
    }


    clocks.w += increment;


    lastMove = {

        from:resultMove.from,

        to:resultMove.to

    };


    selected = null;

    version++;


    drawBoard();

    drawMoves();

    updateStatus();


    if(checkGameOver()) {

        return;
    }


    askEngine();

}


/* =========================================================
   PROMOTION
========================================================= */

document
.querySelectorAll(
    ".promotion button"
)
.forEach(
    button => {

        button.onclick =
            () => {

                if(!pendingPromotion) {

                    return;
                }


                const promotion =
                    button.dataset.piece;


                promotionOverlay.classList.remove(
                    "show"
                );


                makeMove({

                    from:
                        pendingPromotion.from,

                    to:
                        pendingPromotion.to,

                    promotion

                });


                pendingPromotion = null;

            };

    }
);


/* =========================================================
   MOVES
========================================================= */

function drawMoves() {

    moves.innerHTML = "";


    const history =
        game.history();


    if(!history.length) {

        const empty =
            document.createElement("div");


        empty.className =
            "empty";


        empty.textContent =
            "Make the first move";


        moves.appendChild(
            empty
        );


        return;
    }


    for(
        let i=0;
        i<history.length;
        i+=2
    ) {

        const row =
            document.createElement("div");


        row.className =
            "move-row";


        if(
            i >= history.length-2
        ) {

            row.classList.add(
                "latest"
            );

        }


        row.innerHTML = `

            <div class="move-number">
                ${i/2+1}
            </div>

            <div class="move-san">
                ${history[i] || ""}
            </div>

            <div class="move-san">
                ${history[i+1] || ""}
            </div>

        `;


        moves.appendChild(
            row
        );

    }


    moves.scrollTop =
        moves.scrollHeight;

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    turnText.textContent =
        game.turn()==="w"
        ? "White"
        : "Black";


    whiteBox.classList.toggle(
        "active",
        game.turn()==="w" &&
        !finished
    );


    blackBox.classList.toggle(
        "active",
        game.turn()==="b" &&
        !finished
    );


    status.classList.remove(
        "thinking"
    );


    if(finished) {

        return;
    }


    if(thinking) {

        status.textContent =
            "Stockfish is thinking…";

        status.classList.add(
            "thinking"
        );

    }
    else if(game.in_check()) {

        status.textContent =
            "Check!";

    }
    else if(game.turn()==="w") {

        status.textContent =
            "Your move";

    }
    else {

        status.textContent =
            "Stockfish's move";

    }

}


/* =========================================================
   ENGINE
========================================================= */

function startEngine() {

    try {

        engine =
            new Worker(
                "./stockfish-18-lite-single.js"
            );


        engine.onmessage =
            engineMessage;


        engine.onerror =
            () => {

                engineReady = false;

                engineText.textContent =
                    "Engine error";

                status.textContent =
                    "Stockfish failed";

            };


        engine.postMessage(
            "uci"
        );

    }
    catch(error) {

        engineText.textContent =
            "Engine unavailable";

    }

}


/* =========================================================
   ENGINE MESSAGE
========================================================= */

function engineMessage(event) {

    const line =
        String(event.data);


    if(line==="uciok") {

        engine.postMessage(
            "isready"
        );

        return;
    }


    if(line==="readyok") {

        engineReady = true;

        engineText.textContent =
            "Stockfish 18 · Ready";

        updateStatus();

        return;
    }


    if(
        line.startsWith("info")
    ) {

        parseEvaluation(
            line
        );


        const match =
            line.match(
                /\bdepth\s+(\d+)/
            );


        if(match) {

            depth.textContent =
                "Depth " +
                match[1];

        }

        return;
    }


    if(
        line.startsWith("bestmove")
    ) {

        if(!thinking) {

            return;
        }


        thinking = false;

        engineBox.classList.remove(
            "thinking"
        );


        engineText.textContent =
            "Stockfish 18 · Ready";


        if(
            engineVersion !== version
        ) {

            updateStatus();

            return;
        }


        const match =
            line.match(
                /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/
            );


        if(!match) {

            updateStatus();

            return;
        }


        const notation =
            match[1];


        const move = {

            from:
                notation.slice(0,2),

            to:
                notation.slice(2,4)

        };


        if(notation.length===5) {

            move.promotion =
                notation[4];

        }


        makeEngineMove(
            move
        );

    }

}


/* =========================================================
   ENGINE MOVE
========================================================= */

function makeEngineMove(move) {

    if(
        finished ||
        game.turn()!=="b"
    ) {

        return;
    }


    const resultMove =
        game.move(move);


    if(!resultMove) {

        updateStatus();

        return;
    }


    clocks.b += increment;


    lastMove = {

        from:
            resultMove.from,

        to:
            resultMove.to

    };


    version++;


    drawBoard();

    drawMoves();

    updateStatus();


    checkGameOver();

}


/* =========================================================
   ASK ENGINE
========================================================= */

function askEngine() {

    if(
        !engineReady ||
        finished ||
        game.turn()!=="b"
    ) {

        return;
    }


    thinking = true;

    engineVersion =
        version;


    engineBox.classList.add(
        "thinking"
    );


    engineText.textContent =
        "Stockfish thinking…";


    updateStatus();


    const d =
        parseInt(
            difficulty.value,
            10
        );


    try {

        engine.postMessage(
            "stop"
        );

        engine.postMessage(
            "position fen " +
            game.fen()
        );

        engine.postMessage(
            "go depth " + d
        );

    }
    catch(error) {

        thinking = false;

        updateStatus();

    }

}


/* =========================================================
   EVALUATION
========================================================= */

function parseEvaluation(line) {

    const mate =
        line.match(
            /score mate (-?\d+)/
        );


    if(mate) {

        const blackMate =
            parseInt(
                mate[1],
                10
            );


        const whiteMate =
            -blackMate;


        if(whiteMate > 0) {

            evalValue.textContent =
                "M" + whiteMate;

            evalFill.style.width =
                "96%";

        } else {

            evalValue.textContent =
                "-M" +
                Math.abs(whiteMate);

            evalFill.style.width =
                "4%";

        }


        return;
    }


    const cp =
        line.match(
            /score cp (-?\d+)/
        );


    if(!cp) {

        return;
    }


    /*
       Engine is evaluating from
       Black's perspective.

       Convert to White's perspective.
    */

    const score =
        -(
            parseInt(
                cp[1],
                10
            ) / 100
        );


    const limited =
        Math.max(
            -10,
            Math.min(
                10,
                score
            )
        );


    evalValue.textContent =
        (
            limited >= 0
            ? "+"
            : ""
        )
        +
        limited.toFixed(2);


    const percentage =
        50 +
        limited * 4.8;


    evalFill.style.width =
        Math.max(
            4,
            Math.min(
                96,
                percentage
            )
        )
        +
        "%";

}


/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver() {

    if(game.is_checkmate()) {

        finished = true;


        if(game.turn()==="w") {

            showResult(
                "Checkmate",
                "Stockfish wins."
            );

        } else {

            showResult(
                "Checkmate",
                "You defeated Stockfish!"
            );

        }


        return true;
    }


    if(game.is_stalemate()) {

        finished = true;

        showResult(
            "Stalemate",
            "The game is a draw."
        );

        return true;
    }


    if(game.is_threefold_repetition()) {

        finished = true;

        showResult(
            "Draw",
            "Threefold repetition."
        );

        return true;
    }


    if(game.is_insufficient_material()) {

        finished = true;

        showResult(
            "Draw",
            "Insufficient material."
        );

        return true;
    }


    if(game.is_draw()) {

        finished = true;

        showResult(
            "Draw",
            "The game ends in a draw."
        );

        return true;
    }


    return false;

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    title,
    text
) {

    if(engine) {

        try {

            engine.postMessage(
                "stop"
            );

        } catch(e) {}

    }


    thinking = false;

    engineBox.classList.remove(
        "thinking"
    );


    engineText.textContent =
        "Game finished";


    result.textContent =
        title;

    resultText.textContent =
        text;


    gameOver.classList.add(
        "show"
    );


    updateStatus();

}


/* =========================================================
   CLOCK
========================================================= */

function formatClock(seconds) {

    const total =
        Math.ceil(
            Math.max(
                0,
                seconds
            )
        );


    const minutes =
        Math.floor(
            total/60
        );


    const secs =
        total%60;


    return (
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(secs).padStart(2,"0")
    );

}


function updateClockDisplay() {

    whiteClock.textContent =
        formatClock(
            clocks.w
        );


    blackClock.textContent =
        formatClock(
            clocks.b
        );


    whiteBox.classList.toggle(
        "low",
        clocks.w <= 10
    );


    blackBox.classList.toggle(
        "low",
        clocks.b <= 10
    );

}


/* =========================================================
   CLOCK LOOP
========================================================= */

function clockLoop(now) {

    const delta =
        (
            now -
            lastTick
        ) / 1000;


    lastTick =
        now;


    if(
        engineReady &&
        !finished
    ) {

        const side =
            game.turn();


        clocks[side] =
            Math.max(
                0,
                clocks[side]-delta
            );


        updateClockDisplay();


        if(clocks[side] <= 0) {

            clocks[side] = 0;

            finished = true;


            if(engine) {

                try {

                    engine.postMessage(
                        "stop"
                    );

                } catch(e) {}

            }


            thinking = false;


            engineBox.classList.remove(
                "thinking"
            );


            if(side==="w") {

                showResult(
                    "Time Out",
                    "Stockfish wins on time."
                );

            } else {

                showResult(
                    "Time Out",
                    "You win on time!"
                );

            }

        }

    }


    requestAnimationFrame(
        clockLoop
    );

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    version++;


    if(engine) {

        try {

            engine.postMessage(
                "stop"
            );

            engine.postMessage(
                "ucinewgame"
            );

            engine.postMessage(
                "isready"
            );

        } catch(e) {}

    }


    game.reset();


    selected = null;

    lastMove = null;

    pendingPromotion = null;

    thinking = false;

    finished = false;


    clocks.w =
        baseTime;

    clocks.b =
        baseTime;


    lastTick =
        performance.now();


    promotionOverlay.classList.remove(
        "show"
    );

    gameOver.classList.remove(
        "show"
    );


    evalFill.style.width =
        "50%";

    evalValue.textContent =
        "+0.00";


    depth.textContent =
        "Depth 0";


    engineBox.classList.remove(
        "thinking"
    );


    engineText.textContent =
        engineReady
        ? "Stockfish 18 · Ready"
        : "Loading";


    drawBoard();

    drawMoves();

    updateClockDisplay();

    updateStatus();

}


/* =========================================================
   UNDO
========================================================= */

document
.getElementById("undo")
.onclick =
    function() {

        if(
            game.history().length===0
        ) {

            return;
        }


        if(engine) {

            try {

                engine.postMessage(
                    "stop"
                );

            } catch(e) {}

        }


        thinking = false;

        finished = false;

        version++;


        /*
           After Stockfish moves:
           undo both moves.

           After the player moves:
           undo one move.
        */

        if(game.turn()==="w") {

            game.undo();

            if(
                game.history().length
            ) {

                game.undo();

            }

        } else {

            game.undo();

        }


        selected = null;


        const history =
            game.history({
                verbose:true
            });


        if(history.length) {

            const last =
                history[
                    history.length-1
                ];


            lastMove = {

                from:last.from,

                to:last.to

            };

        } else {

            lastMove = null;

        }


        /*
           Reset clocks after undo.
           This makes time controls
           predictable.
        */

        clocks.w =
            baseTime;

        clocks.b =
            baseTime;


        lastTick =
            performance.now();


        gameOver.classList.remove(
            "show"
        );


        drawBoard();

        drawMoves();

        updateClockDisplay();

        updateStatus();

    };


/* =========================================================
   NEW GAME BUTTONS
========================================================= */

document
.getElementById("newGame")
.onclick =
    newGame;


document
.getElementById("topNewGame")
.onclick =
    newGame;


document
.getElementById("playAgain")
.onclick =
    newGame;


/* =========================================================
   TIME MODES
========================================================= */

document
.querySelectorAll(".mode")
.forEach(
    button => {

        button.onclick =
            function() {

                baseTime =
                    parseInt(
                        button.dataset.time,
                        10
                    );


                increment =
                    parseInt(
                        button.dataset.inc,
                        10
                    );


                document
                .querySelectorAll(
                    ".mode"
                )
                .forEach(
                    other =>
                        other.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                const name =
                    button
                    .querySelector(
                        ".mode-name"
                    )
                    .textContent;


                const time =
                    button
                    .querySelector(
                        ".mode-time"
                    )
                    .textContent;


                document
                .getElementById(
                    "modeCurrent"
                )
                .textContent =
                    name +
                    " · " +
                    time;


                newGame();

            };

    }
);


/* =========================================================
   DIFFICULTY
========================================================= */

difficulty.onchange =
    function() {

        if(thinking) {

            try {

                engine.postMessage(
                    "stop"
                );

            } catch(e) {}


            thinking = false;

            engineBox.classList.remove(
                "thinking"
            );


            engineText.textContent =
                "Stockfish 18 · Ready";


            updateStatus();

        }

    };


/* =========================================================
   START
========================================================= */

drawBoard();

drawMoves();

updateClockDisplay();

updateStatus();

startEngine();

requestAnimationFrame(
    clockLoop
);

</script>

</body>
</html>
